(()=>{var g={setup:{label:"Setup",color:"#5FA8A0"},rise:{label:"Rising Action",color:"#E9C88A"},climax:{label:"Confrontation",color:"#D2785A"},fall:{label:"Resolution",color:"#8E7CC3"}},D=[{id:"three-act",name:"Three-Act Structure",blurb:"The workhorse: setup, confrontation, resolution. Good default for almost any story.",beats:[{id:"status-quo",name:"Opening Image",pct:5,act:"setup",threeAct:1,guide:"The world before the story disturbs it. What's the ordinary, in one image or scene?",ex:"Quiet village morning"},{id:"inciting",name:"Inciting Incident",pct:7,act:"setup",threeAct:1,guide:"The event that makes the story start. What breaks the ordinary world open?",ex:"Dragon attacks village"},{id:"plot-point-1",name:"Reaction to Incident",pct:8,act:"setup",threeAct:1,guide:"The point of no return \u2014 the protagonist commits to the journey.",ex:"Hero grabs sword"},{id:"rising",name:"Getting Friends",pct:20,act:"rise",threeAct:2,guide:"Obstacles escalate, stakes climb, the protagonist learns the rules of the new world.",ex:"Gathers allies, trains"},{id:"midpoint",name:"Extent of the Evil",pct:8,act:"rise",threeAct:2,guide:"A false victory or false defeat that shifts the story's direction and raises the stakes.",ex:"Discovers evil's scale"},{id:"plot-point-2",name:"Almost Failure",pct:12,act:"climax",threeAct:2,guide:"Everything falls apart. The lowest point, right before the final push.",ex:"Ally betrays hero"},{id:"climax",name:"Final Fight",pct:15,act:"climax",threeAct:3,guide:"The final confrontation. The protagonist's central struggle is decided here.",ex:"Duels dragon alone"},{id:"resolution",name:"Resolution",pct:25,act:"fall",threeAct:3,guide:"The new normal. Loose threads tie off and the story's change is shown, not told.",ex:"Village rebuilds, thrives"}]},{id:"save-the-cat",name:"Save the Cat! (15 beats)",blurb:"Blake Snyder's screenwriting beat sheet \u2014 precise, percentage-mapped, plot-heavy.",beats:[{id:"opening-image",name:"Opening Image",pct:1,act:"setup",threeAct:1,guide:"A snapshot of the 'before' \u2014 tone, mood, the problem the protagonist doesn't see yet.",ex:"Quiet village morning"},{id:"theme-stated",name:"Theme Stated",pct:4,act:"setup",threeAct:1,guide:"Someone (usually not the hero) says the story's real argument out loud, in passing.",ex:"Courage over fear"},{id:"set-up",name:"Set-Up",pct:5,act:"setup",threeAct:1,guide:"Introduce the hero's flaws, world, and stakes \u2014 everything the story is about to upend.",ex:"Farmer fears dragons"},{id:"catalyst",name:"Catalyst",pct:1,act:"setup",threeAct:1,guide:"The telegram, the firing, the knock at the door \u2014 the moment life changes.",ex:"Dragon burns barn"},{id:"debate",name:"Debate",pct:9,act:"setup",threeAct:1,guide:"Should the hero go? The last chance to say no before the story truly begins.",ex:"Should I go?"},{id:"break-into-two",name:"Break Into Two",pct:2,act:"rise",threeAct:2,guide:"The hero chooses (or is forced) to leave the old world and enter the new one.",ex:"Leaves the farm"},{id:"b-story",name:"B Story",pct:4,act:"rise",threeAct:2,guide:"A new relationship enters, usually carrying the story's theme.",ex:"Meets fellow warrior"},{id:"fun-and-games",name:"Fun and Games",pct:19,act:"rise",threeAct:2,guide:"The 'promise of the premise' \u2014 the trailer moments, playing in the new world.",ex:"Trains, tracks, jokes"},{id:"midpoint",name:"Midpoint",pct:1,act:"rise",threeAct:2,guide:"A false victory or false defeat. Stakes rise from personal to life-and-death.",ex:"Finds dragon's lair"},{id:"bad-guys-close",name:"Bad Guys Close In",pct:11,act:"climax",threeAct:2,guide:"Internal doubts and external pressure both close in on the hero.",ex:"Elders lose hope"},{id:"all-is-lost",name:"All Is Lost",pct:1,act:"climax",threeAct:2,guide:"The opposite of the midpoint's win \u2014 often a 'whiff of death', literal or symbolic.",ex:"Warrior friend dies"},{id:"dark-night",name:"Dark Night of the Soul",pct:4,act:"climax",threeAct:2,guide:"The hero sits in the wreckage before finding the way forward.",ex:"Grieves, nearly quits"},{id:"break-into-three",name:"Break Into Three",pct:2,act:"fall",threeAct:3,guide:"The A and B stories combine to hand the hero the solution.",ex:"Remembers warrior's lesson"},{id:"finale",name:"Finale",pct:15,act:"fall",threeAct:3,guide:"The hero applies what they learned to defeat the antagonist and fix the world.",ex:"Defeats the dragon"},{id:"final-image",name:"Final Image",pct:1,act:"fall",threeAct:3,guide:"A mirror of the opening image, showing exactly how much has changed.",ex:"Village rebuilds, thrives"}]},{id:"hero-journey",name:"The Hero's Journey",blurb:"Campbell / Vogler's 12-stage monomyth \u2014 myth, fantasy and quest stories.",beats:[{id:"ordinary-world",name:"Ordinary World",pct:8,act:"setup",threeAct:1,guide:"The hero's normal life, and what's missing or unresolved in it.",ex:"Quiet village morning"},{id:"call",name:"Call to Adventure",pct:6,act:"setup",threeAct:1,guide:"A problem or challenge is presented \u2014 the story's invitation.",ex:"Dragon attacks village"},{id:"refusal",name:"Refusal of the Call",pct:5,act:"setup",threeAct:1,guide:"Fear or doubt makes the hero hesitate, reluctant to change.",ex:"Hero refuses, afraid"},{id:"mentor",name:"Meeting the Mentor",pct:6,act:"setup",threeAct:1,guide:"A guide offers wisdom, training, or an item that prepares the hero.",ex:"Old warrior teaches"},{id:"threshold",name:"Crossing the Threshold",pct:5,act:"rise",threeAct:1,guide:"The hero commits and leaves the ordinary world behind for good.",ex:"Leaves the village"},{id:"tests-allies",name:"Tests, Allies, Enemies",pct:14,act:"rise",threeAct:2,guide:"The new world is explored \u2014 friends, rivals and the rules are learned the hard way.",ex:"Makes allies, enemies"},{id:"approach",name:"Approach to the Inmost Cave",pct:8,act:"rise",threeAct:2,guide:"Preparation for the central ordeal; the plan is made and the stakes sharpen.",ex:"Plans the assault"},{id:"ordeal",name:"Ordeal",pct:10,act:"climax",threeAct:2,guide:"The hero's greatest fear or crisis \u2014 a life-or-death, all-or-nothing moment.",ex:"Faces the dragon"},{id:"reward",name:"Reward",pct:8,act:"climax",threeAct:2,guide:"Having survived, the hero seizes what they came for \u2014 but it comes at a cost.",ex:"Claims dragon's treasure"},{id:"road-back",name:"The Road Back",pct:8,act:"climax",threeAct:2,guide:"The hero commits to finishing the journey; the consequences of the ordeal chase them.",ex:"Danger follows home"},{id:"resurrection",name:"Resurrection",pct:12,act:"fall",threeAct:3,guide:"A final, larger test where everything learned is proven \u2014 a true climax.",ex:"Final desperate stand"},{id:"elixir",name:"Return with the Elixir",pct:10,act:"fall",threeAct:3,guide:"The hero returns changed, bringing something of value back to the ordinary world.",ex:"Brings peace home"}]},{id:"freytag",name:"Freytag's Pyramid",blurb:"The classic five-part dramatic arc \u2014 simple, stage-friendly, tragedy's native shape.",beats:[{id:"exposition",name:"Exposition",pct:15,act:"setup",threeAct:1,guide:"Establish characters, setting and the world's status quo.",ex:"Quiet village morning"},{id:"rising-action",name:"Rising Action",pct:30,act:"rise",threeAct:2,guide:"A series of complicating events builds tension toward the climax.",ex:"Dragon threat grows"},{id:"climax",name:"Climax",pct:15,act:"climax",threeAct:2,guide:"The turning point \u2014 the moment of highest tension, where fortune reverses.",ex:"Hero fights dragon"},{id:"falling-action",name:"Falling Action",pct:25,act:"climax",threeAct:3,guide:"Consequences of the climax play out; tension unwinds toward the ending.",ex:"Dragon's power fades"},{id:"denouement",name:"Denouement",pct:15,act:"fall",threeAct:3,guide:"Loose ends resolve and the story's new equilibrium is shown.",ex:"Peace returns finally"}]},{id:"seven-point",name:"Seven-Point Story Structure",blurb:"Dan Wells' structure, built backward from the ending \u2014 good for tight plotting.",beats:[{id:"hook",name:"Hook",pct:8,act:"setup",threeAct:1,guide:"The opposite of the resolution \u2014 establish where the character starts, in contrast to where they'll end.",ex:"Hero fears dragons"},{id:"plot-turn-1",name:"Plot Turn 1",pct:12,act:"setup",threeAct:1,guide:"An event introduces the main conflict and moves the character out of the hook state.",ex:"Dragon attacks village"},{id:"pinch-1",name:"Pinch Point 1",pct:15,act:"rise",threeAct:2,guide:"Pressure is applied \u2014 often the antagonist's power is shown, forcing the character to act.",ex:"Dragon burns fields"},{id:"midpoint",name:"Midpoint",pct:12,act:"rise",threeAct:2,guide:"The character moves from reaction to action \u2014 passive to proactive.",ex:"Hero chooses action"},{id:"pinch-2",name:"Pinch Point 2",pct:15,act:"climax",threeAct:2,guide:"More pressure, often a major loss, that removes the character's safety net entirely.",ex:"Mentor is killed"},{id:"plot-turn-2",name:"Plot Turn 2",pct:13,act:"climax",threeAct:3,guide:"The final piece the character needs to resolve the conflict is found.",ex:"Finds dragon's weakness"},{id:"resolution",name:"Resolution",pct:25,act:"fall",threeAct:3,guide:"The character, now changed, resolves the conflict \u2014 the mirror of the hook.",ex:"Hero defeats dragon"}]},{id:"kishotenketsu",name:"Kish\u014Dtenketsu",blurb:"A four-act East Asian narrative structure driven by contrast, not conflict.",beats:[{id:"ki",name:"Ki (Introduction)",pct:25,act:"setup",threeAct:1,guide:"Introduce the characters and situation, unhurried \u2014 no problem needs to appear yet.",ex:"Village bakes bread"},{id:"sho",name:"Sh\u014D (Development)",pct:30,act:"rise",threeAct:2,guide:"Develop what was introduced; deepen the reader's understanding of the situation.",ex:"Baker befriends traveler"},{id:"ten",name:"Ten (Twist)",pct:25,act:"climax",threeAct:3,guide:"An unexpected, often unrelated element recontextualises everything that came before.",ex:"Traveler is dragon"},{id:"ketsu",name:"Ketsu (Conclusion)",pct:20,act:"fall",threeAct:3,guide:"Reconcile the twist with the rest of the story into a single, resolved whole.",ex:"Village welcomes dragon"}]},{id:"fichtean",name:"Fichtean Curve",blurb:"No slow build \u2014 opens already in conflict, then a rising series of crises to the climax.",beats:[{id:"crisis-1",name:"Opening Crisis",pct:10,act:"setup",threeAct:1,guide:"Skip the calm-before \u2014 open already inside a conflict; the 'before' comes out sideways, later, if at all.",ex:"Dragon burns village"},{id:"crisis-2",name:"Crisis Two",pct:15,act:"rise",threeAct:1,guide:"A second crisis, arriving fast, reveals the shape of the larger problem.",ex:"Second attack strikes"},{id:"crisis-3",name:"Crisis Three",pct:18,act:"rise",threeAct:2,guide:"Each crisis raises the stakes higher than the last \u2014 no plateau, no breathing room.",ex:"Allies start dying"},{id:"crisis-4",name:"Crisis Four",pct:20,act:"climax",threeAct:2,guide:"The pressure peaks just short of the climax \u2014 the worst point before the final crisis.",ex:"Village nearly falls"},{id:"climax",name:"Climax",pct:20,act:"climax",threeAct:3,guide:"The largest crisis of all, where the central conflict is finally decided.",ex:"Hero faces dragon"},{id:"resolution",name:"Resolution",pct:17,act:"fall",threeAct:3,guide:"A brief denouement \u2014 the Fichtean curve spends almost no time here.",ex:"Peace, briefly restored"}]},{id:"story-circle",name:"Dan Harmon's Story Circle",blurb:"Campbell's monomyth compressed to 8 equal steps, built explicitly as a circle.",beats:[{id:"you",name:"You",pct:12,act:"setup",threeAct:1,guide:"A character in their zone of comfort.",ex:"Farmer tends fields"},{id:"need",name:"Need",pct:13,act:"setup",threeAct:1,guide:"They want something.",ex:"Wants safety, purpose"},{id:"go",name:"Go",pct:13,act:"rise",threeAct:1,guide:"They enter an unfamiliar situation.",ex:"Leaves the farm"},{id:"search",name:"Search",pct:12,act:"rise",threeAct:2,guide:"They adapt to it.",ex:"Learns to fight"},{id:"find",name:"Find",pct:12,act:"rise",threeAct:2,guide:"They get what they wanted.",ex:"Finds dragon's lair"},{id:"take",name:"Take",pct:12,act:"climax",threeAct:2,guide:"They pay a heavy price for it.",ex:"Loses a friend"},{id:"return",name:"Return",pct:13,act:"climax",threeAct:3,guide:"They return to the familiar situation.",ex:"Returns to village"},{id:"change",name:"Change",pct:13,act:"fall",threeAct:3,guide:"Now capable of change, having changed.",ex:"Villagers see change"}]},{id:"eight-sequence",name:"Eight-Sequence Structure",blurb:"Frank Daniel's film-school standard: eight roughly equal mini-movies, each with its own turn.",beats:[{id:"status-quo",name:"Status Quo & Inciting Incident",pct:12,act:"setup",threeAct:1,guide:"Establish the world, then break it.",ex:"Dragon attacks village"},{id:"predicament",name:"Predicament",pct:12,act:"setup",threeAct:1,guide:"Lock the protagonist into a goal they can't walk away from.",ex:"Vows to fight"},{id:"obstacle-1",name:"First Obstacle",pct:13,act:"rise",threeAct:1,guide:"The first real attempt runs into trouble.",ex:"First attack fails"},{id:"stakes-1",name:"Raising the Stakes",pct:13,act:"rise",threeAct:2,guide:"Complications mount on the way to the midpoint.",ex:"Village losses mount"},{id:"midpoint",name:"Midpoint Reversal",pct:12,act:"rise",threeAct:2,guide:"A turn that changes the direction of the plan.",ex:"Learns dragon's weakness"},{id:"stakes-2",name:"Raising the Stakes Further",pct:13,act:"climax",threeAct:2,guide:"Pressure builds again, worse than before.",ex:"Dragon hunts hero"},{id:"culmination",name:"Main Culmination",pct:12,act:"climax",threeAct:3,guide:"The crisis point just before the climax.",ex:"Final plan forms"},{id:"climax",name:"Climax & Resolution",pct:13,act:"fall",threeAct:3,guide:"The conflict is decided, and the new world is shown.",ex:"Dragon defeated finally"}]},{id:"weiland",name:"Weiland's Structure",blurb:"A novelist's refinement of the three-act paradigm, with 'pinch points' keeping the antagonist's threat visible throughout.",beats:[{id:"hook",name:"Hook",pct:3,act:"setup",threeAct:1,guide:"A small opening scene that shows the protagonist's normal world and a hint of their flaw.",ex:"Farmer avoids conflict"},{id:"inciting",name:"Inciting Event",pct:9,act:"setup",threeAct:1,guide:"The event that sets the story in motion, though the protagonist doesn't yet fully engage.",ex:"Dragon attacks village"},{id:"plot-point-1",name:"First Plot Point",pct:13,act:"setup",threeAct:1,guide:"The protagonist commits, crossing into the main conflict for good.",ex:"Hero grabs sword"},{id:"pinch-1",name:"First Pinch Point",pct:12,act:"rise",threeAct:2,guide:"A reminder of the antagonist's power \u2014 no direct confrontation yet, just a taste of the threat.",ex:"Dragon's shadow passes"},{id:"midpoint",name:"Midpoint",pct:13,act:"rise",threeAct:2,guide:"The protagonist moves from reacting to acting, often via a piece of new information.",ex:"Learns dragon's weakness"},{id:"pinch-2",name:"Second Pinch Point",pct:12,act:"climax",threeAct:2,guide:"Another reminder of the antagonist's power, now sharper \u2014 things are worse than the first pinch point.",ex:"Dragon burns fields"},{id:"plot-point-3",name:"Third Plot Point",pct:13,act:"climax",threeAct:3,guide:"A low point \u2014 often a false defeat \u2014 that forces the protagonist's final resolve.",ex:"Ally is lost"},{id:"climax",name:"Climax",pct:15,act:"climax",threeAct:3,guide:"The final confrontation, where the protagonist's arc and the plot's conflict resolve together.",ex:"Duels dragon alone"},{id:"resolution",name:"Resolution",pct:10,act:"fall",threeAct:3,guide:"The new normal, shown rather than explained.",ex:"Village rebuilds anew"}]},{id:"truby-22",name:"Truby's 22 Steps",blurb:"John Truby's granular structure, built around a moral argument the protagonist is forced to test.",beats:[{id:"self-rev-preview",name:"Self-Revelation, Need, Desire",pct:4,act:"setup",threeAct:1,guide:"A glimpse of the change to come \u2014 often not shown to the audience directly, but present as the story's underlying shape.",ex:"Hero fears failure"},{id:"ghost",name:"Ghost and Story World",pct:4,act:"setup",threeAct:1,guide:"The wound in the protagonist's past, and the ordinary world shaped around it.",ex:"Village fears dragons"},{id:"weakness",name:"Weakness and Need",pct:4,act:"setup",threeAct:1,guide:"The flaw the protagonist must overcome, and the deeper psychological need beneath their surface want.",ex:"Hero avoids conflict"},{id:"inciting",name:"Inciting Event",pct:6,act:"setup",threeAct:1,guide:"The event that starts the story's action.",ex:"Dragon attacks village"},{id:"desire",name:"Desire",pct:4,act:"setup",threeAct:1,guide:"The concrete goal the protagonist consciously pursues.",ex:"Vows to fight"},{id:"allies",name:"Ally or Allies",pct:4,act:"rise",threeAct:1,guide:"Characters who help the protagonist pursue their desire.",ex:"Gathers loyal friends"},{id:"opponent",name:"Opponent and/or Mystery",pct:4,act:"rise",threeAct:1,guide:"The person or force blocking the protagonist, or the puzzle they must solve.",ex:"Dragon's lair hidden"},{id:"fake-ally",name:"Fake-Ally Opponent",pct:4,act:"rise",threeAct:2,guide:"An apparent ally who is secretly working against the protagonist.",ex:"Trusted friend betrays"},{id:"first-rev",name:"First Revelation and Decision",pct:4,act:"rise",threeAct:2,guide:"New information forces the protagonist to change their desire or approach.",ex:"Learns the truth"},{id:"plan",name:"Plan",pct:6,act:"rise",threeAct:2,guide:"How the protagonist intends to get what they want.",ex:"Devises a strategy"},{id:"opp-plan",name:"Opponent's Plan and Main Counterattack",pct:4,act:"rise",threeAct:2,guide:"The opposition's own plan, and its first real counterattack.",ex:"Dragon strikes back"},{id:"drive",name:"Drive",pct:6,act:"climax",threeAct:2,guide:"A concentrated string of actions as the protagonist pursues the plan.",ex:"Pushes toward goal"},{id:"attack-ally",name:"Attack by Ally",pct:4,act:"climax",threeAct:2,guide:"Pressure or betrayal from within the protagonist's own camp.",ex:"Ally turns against"},{id:"apparent-defeat",name:"Apparent Defeat",pct:6,act:"climax",threeAct:2,guide:"The protagonist appears to have lost completely.",ex:"All seems lost"},{id:"second-rev",name:"Second Revelation and Decision",pct:4,act:"climax",threeAct:2,guide:"Another revelation drives an even more determined, sometimes obsessive, pursuit.",ex:"Renews desperate resolve"},{id:"audience-rev",name:"Audience Revelation",pct:4,act:"climax",threeAct:3,guide:"Information revealed to the audience that the characters don't yet know.",ex:"Reader learns truth"},{id:"third-rev",name:"Third Revelation and Decision",pct:4,act:"climax",threeAct:3,guide:"A final piece of information sets up the last decision before the climax.",ex:"Finds hidden weakness"},{id:"gate",name:"Gate, Gauntlet, Visit to Death",pct:6,act:"climax",threeAct:3,guide:"The last, hardest obstacles standing between the protagonist and the final battle.",ex:"Faces near-certain death"},{id:"battle",name:"Battle",pct:6,act:"climax",threeAct:3,guide:"The final confrontation between protagonist and opponent.",ex:"Duels dragon alone"},{id:"self-rev",name:"Self-Revelation",pct:4,act:"fall",threeAct:3,guide:"The protagonist finally understands their own weakness and need.",ex:"Sees his flaw"},{id:"moral",name:"Moral Decision",pct:4,act:"fall",threeAct:3,guide:"A final choice that proves the protagonist's change is real.",ex:"Chooses to forgive"},{id:"new-equilibrium",name:"New Equilibrium",pct:4,act:"fall",threeAct:3,guide:"The world settles into its new, changed state.",ex:"Village rebuilds, thrives"}]},{id:"pixar-spine",name:"Pixar Story Spine",blurb:"The short-pitch template behind most Pixar shorts \u2014 status quo through consequence to a new normal.",beats:[{id:"once-upon",name:"Once Upon a Time",pct:8,act:"setup",threeAct:1,guide:"Establish who the protagonist is and the world they live in.",ex:"Farmer tends fields"},{id:"every-day",name:"Every Day",pct:12,act:"setup",threeAct:1,guide:"Show their routine \u2014 what 'normal' looks like before the story disturbs it.",ex:"Same chores, daily"},{id:"until-one-day",name:"Until One Day",pct:10,act:"setup",threeAct:1,guide:"The event that breaks the routine and starts the story.",ex:"Dragon attacks village"},{id:"because-1",name:"Because of That",pct:20,act:"rise",threeAct:2,guide:"The first consequence of that event, and what the protagonist does about it.",ex:"Hero seeks help"},{id:"because-2",name:"Because of That",pct:20,act:"rise",threeAct:2,guide:"A second consequence, escalating further \u2014 the chain of cause and effect keeps building.",ex:"Gathers allies, trains"},{id:"until-finally",name:"Until Finally",pct:15,act:"climax",threeAct:3,guide:"The climax \u2014 the final action that resolves the chain of consequences.",ex:"Duels dragon alone"},{id:"ever-since",name:"Ever Since Then",pct:15,act:"fall",threeAct:3,guide:"The new normal, and how it differs from the routine at the start.",ex:"Village lives free"}]},{id:"virgins-promise",name:"The Virgin's Promise",blurb:"Kim Hudson's structure for stories of creative or personal awakening against social conformity \u2014 a counterpart to the Hero's Journey.",beats:[{id:"dependent-world",name:"Dependent World",pct:8,act:"setup",threeAct:1,guide:"The protagonist's world defines her value through duty and conformity \u2014 introduce that world and her place in it.",ex:"Bakery awaits inheritance"},{id:"price",name:"Price of Conformity",pct:7,act:"setup",threeAct:1,guide:"What she gives up, unconsciously, by staying safely inside the expected role.",ex:"Dreams quietly deferred"},{id:"opportunity",name:"Opportunity to Shine",pct:8,act:"setup",threeAct:1,guide:"A chance appears to show a talent or truth the dependent world doesn't value.",ex:"Sees painting contest"},{id:"dresses-part",name:"Dresses the Part",pct:6,act:"rise",threeAct:1,guide:"She takes on a disguise or role that lets her explore the opportunity without fully committing.",ex:"Borrows a name"},{id:"secret-world",name:"Secret World",pct:9,act:"rise",threeAct:2,guide:"A hidden space where she can practice and grow without her dependent world watching.",ex:"Paints before dawn"},{id:"no-longer-fits",name:"No Longer Fits Her World",pct:8,act:"rise",threeAct:2,guide:"The gap between her secret self and her dependent-world self grows too wide to ignore.",ex:"Bakery feels smaller"},{id:"caught-shining",name:"Caught Shining",pct:9,act:"rise",threeAct:2,guide:"Her secret talent is discovered \u2014 or she's stopped just before it can be seen.",ex:"Father finds paintings"},{id:"gives-up",name:"Gives Up Her Dream",pct:8,act:"climax",threeAct:2,guide:"Under pressure, she abandons the dream and returns fully to the dependent world.",ex:"Burns her canvases"},{id:"ally-helps",name:"Ally Helps Keep Dream Alive",pct:8,act:"climax",threeAct:2,guide:"Someone who believes in her keeps a door open, even after she's closed it herself.",ex:"Friend hides painting"},{id:"kingdom-chaos",name:"Kingdom in Chaos",pct:9,act:"climax",threeAct:3,guide:"The dependent world itself destabilizes, proving it was never as safe as it promised.",ex:"Bakery nearly fails"},{id:"chooses-journey",name:"Chooses Her Journey",pct:8,act:"climax",threeAct:3,guide:"She actively chooses her own path, rather than drifting into it.",ex:"Reclaims her craft"},{id:"rages-reveals",name:"Rages or Reveals",pct:7,act:"fall",threeAct:3,guide:"She confronts the dependent world openly, on her own terms.",ex:"Shows work publicly"},{id:"wonder",name:"Wonder",pct:5,act:"fall",threeAct:3,guide:"A new equilibrium \u2014 her gift and her world coexist, changed for the better.",ex:"Bakery sells art"}]},{id:"heroines-journey",name:"The Heroine's Journey",blurb:"Maureen Murdock's 10-stage arc away from and back toward the feminine \u2014 an inward counterpart to Campbell's outward quest.",beats:[{id:"separation",name:"Separation from the Feminine",pct:8,act:"setup",threeAct:1,guide:"The protagonist rejects traditionally feminine models \u2014 often modeled by her mother \u2014 as weak or limiting.",ex:"Leaves mother's house"},{id:"identification",name:"Identification with the Masculine",pct:10,act:"setup",threeAct:1,guide:"She adopts masculine-coded values (achievement, control) and finds mentors and allies who reward that.",ex:"Excels in law"},{id:"road-of-trials",name:"Road of Trials",pct:14,act:"setup",threeAct:1,guide:"She proves herself against a series of challenges, on the terms of the world she's adopted.",ex:"Wins tough cases"},{id:"boon",name:"Finding the Boon of Success",pct:10,act:"rise",threeAct:2,guide:"She achieves real, external success by those terms.",ex:"Made firm partner"},{id:"aridity",name:"Awakening to Spiritual Aridity",pct:8,act:"rise",threeAct:2,guide:"Success doesn't fill the hollow it was supposed to \u2014 something essential feels dead.",ex:"Feels strangely empty"},{id:"descent",name:"Initiation and Descent",pct:12,act:"rise",threeAct:2,guide:"She turns inward, often prompted by a crisis, toward parts of herself she'd suppressed.",ex:"Returns to hometown"},{id:"yearning",name:"Yearning to Reconnect",pct:10,act:"climax",threeAct:2,guide:"A pressing need to reclaim the feminine she once rejected.",ex:"Seeks out mother"},{id:"healing-split",name:"Healing the Mother/Daughter Split",pct:10,act:"climax",threeAct:3,guide:"Repairing the relationship \u2014 literal or symbolic \u2014 with the feminine model she once pushed away.",ex:"Mends old wound"},{id:"healing-masculine",name:"Healing the Wounded Masculine",pct:9,act:"fall",threeAct:3,guide:"The masculine side of herself is also healed \u2014 no longer armor, but a real strength.",ex:"Softens without weakness"},{id:"integration",name:"Integration",pct:9,act:"fall",threeAct:3,guide:"Both sides are held together \u2014 a whole self, not a choice between them.",ex:"Leads with wholeness"}]},{id:"todorov",name:"Todorov's Equilibrium Theory",blurb:"Tzvetan Todorov's five-stage model \u2014 the simplest shape there is: a state disrupted, then restored changed.",beats:[{id:"equilibrium",name:"Equilibrium",pct:20,act:"setup",threeAct:1,guide:"The story's starting state \u2014 stable, though not necessarily happy.",ex:"Village lives peacefully"},{id:"disruption",name:"Disruption",pct:15,act:"setup",threeAct:1,guide:"An event throws the equilibrium off balance.",ex:"Dragon attacks village"},{id:"recognition",name:"Recognition of Disruption",pct:20,act:"rise",threeAct:2,guide:"Characters recognise that something has gone wrong and must be addressed.",ex:"Village names threat"},{id:"repair",name:"Attempt to Repair",pct:30,act:"climax",threeAct:2,guide:"An effort \u2014 often extended, often difficult \u2014 to fix the disruption.",ex:"Hero hunts dragon"},{id:"new-equilibrium",name:"New Equilibrium",pct:15,act:"fall",threeAct:3,guide:"A new stable state, changed by the story but stable again.",ex:"Village rebuilds, thrives"}]},{id:"frame-narrative",name:"Frame Narrative",blurb:"A story bookended by another story \u2014 the frame opens and closes around an inner tale.",beats:[{id:"enter-frame",name:"Enter Frame",pct:8,act:"setup",threeAct:1,guide:"Introduce the outer story and its narrator or occasion for telling.",ex:"Traveler seeks shelter"},{id:"frame-setup",name:"Frame Sets Up Inner Story",pct:7,act:"setup",threeAct:1,guide:"The frame's own action creates a reason for the inner story to be told.",ex:"Elder offers tale"},{id:"inner-begins",name:"Inner Story Begins",pct:15,act:"rise",threeAct:1,guide:"The inner story opens, with its own characters and stakes.",ex:"Old story begins"},{id:"inner-develops",name:"Inner Story Develops",pct:40,act:"rise",threeAct:2,guide:"The inner story carries most of the narrative weight, and its own arc.",ex:"Dragon attacks village"},{id:"inner-resolves",name:"Inner Story Resolves",pct:15,act:"climax",threeAct:2,guide:"The inner story reaches its own resolution.",ex:"Dragon is defeated"},{id:"return-frame",name:"Return to Frame",pct:7,act:"climax",threeAct:3,guide:"The narrative returns to the outer story, changed by having told the inner one.",ex:"Elder finishes tale"},{id:"frame-closes",name:"Frame Closes",pct:8,act:"fall",threeAct:3,guide:"The outer story concludes, often recontextualising the inner tale's meaning.",ex:"Traveler leaves changed"}]},{id:"propp-31",name:"Propp's 31 Functions",blurb:"Vladimir Propp's morphology of the Russian folk tale \u2014 the most granular structure here, and the most folklore-specific.",beats:[{id:"absentation",name:"Absentation",pct:2,act:"setup",threeAct:1,guide:"A member of the family leaves the security of the home.",ex:"Father leaves home"},{id:"interdiction",name:"Interdiction",pct:2,act:"setup",threeAct:1,guide:"The hero is warned against some action.",ex:"Don't leave village"},{id:"violation",name:"Violation",pct:3,act:"setup",threeAct:1,guide:"The interdiction is violated, opening the door to misfortune.",ex:"Hero leaves anyway"},{id:"reconnaissance",name:"Reconnaissance",pct:2,act:"setup",threeAct:1,guide:"The villain makes an attempt to gather information.",ex:"Dragon scouts village"},{id:"delivery",name:"Delivery",pct:2,act:"setup",threeAct:1,guide:"The villain gains information about their victim.",ex:"Dragon finds prey"},{id:"trickery",name:"Trickery",pct:3,act:"setup",threeAct:1,guide:"The villain attempts to deceive the victim to take possession of them or their belongings.",ex:"Dragon lures hero"},{id:"complicity",name:"Complicity",pct:2,act:"setup",threeAct:1,guide:"The victim, unwittingly, helps the villain by taking the bait.",ex:"Hero takes bait"},{id:"villainy-lack",name:"Villainy / Lack",pct:5,act:"setup",threeAct:1,guide:"The villain causes harm to a family member, or something is found to be lacking.",ex:"Dragon steals treasure"},{id:"mediation",name:"Mediation",pct:3,act:"setup",threeAct:1,guide:"The misfortune or lack is made known; the hero is asked or sent to act.",ex:"Village calls hero"},{id:"counteraction",name:"Beginning Counteraction",pct:3,act:"rise",threeAct:2,guide:"The hero agrees to, or decides upon, counteraction.",ex:"Hero accepts quest"},{id:"departure",name:"Departure",pct:4,act:"rise",threeAct:2,guide:"The hero leaves home.",ex:"Hero leaves village"},{id:"donor-first",name:"First Function of the Donor",pct:4,act:"rise",threeAct:2,guide:"The hero is tested, interrogated or attacked, preparing the way for receiving a magical agent or helper.",ex:"Old woman tests"},{id:"hero-reaction",name:"Hero's Reaction",pct:3,act:"rise",threeAct:2,guide:"The hero responds to the actions of the donor.",ex:"Hero passes test"},{id:"magical-agent",name:"Receipt of a Magical Agent",pct:4,act:"rise",threeAct:2,guide:"The hero acquires the use of a magical agent.",ex:"Gains magic sword"},{id:"guidance",name:"Guidance",pct:3,act:"rise",threeAct:2,guide:"The hero is led to the object of the search.",ex:"Sword points onward"},{id:"struggle",name:"Struggle",pct:6,act:"rise",threeAct:2,guide:"The hero and villain do battle, directly or indirectly.",ex:"Battles the dragon"},{id:"branding",name:"Branding",pct:2,act:"rise",threeAct:2,guide:"The hero is marked \u2014 a wound, or the bestowal of a ring or scarf.",ex:"Scarred by fire"},{id:"victory",name:"Victory",pct:5,act:"rise",threeAct:2,guide:"The villain is defeated.",ex:"Dragon is defeated"},{id:"liquidation",name:"Liquidation",pct:4,act:"rise",threeAct:2,guide:"The initial misfortune or lack is resolved.",ex:"Treasure is recovered"},{id:"return",name:"Return",pct:3,act:"climax",threeAct:2,guide:"The hero sets off for home.",ex:"Hero heads home"},{id:"pursuit",name:"Pursuit",pct:3,act:"climax",threeAct:2,guide:"The hero is pursued.",ex:"Dragon's kin chase"},{id:"rescue",name:"Rescue",pct:3,act:"climax",threeAct:2,guide:"The hero is rescued from pursuit.",ex:"Ally saves hero"},{id:"unrecognized",name:"Unrecognized Arrival",pct:2,act:"climax",threeAct:3,guide:"The hero arrives home or elsewhere, unrecognized.",ex:"Returns in disguise"},{id:"unfounded",name:"Unfounded Claims",pct:2,act:"climax",threeAct:3,guide:"A false hero presents unfounded claims to the reward.",ex:"Imposter claims credit"},{id:"difficult-task",name:"Difficult Task",pct:4,act:"climax",threeAct:3,guide:"A difficult task is proposed to the hero.",ex:"Must prove himself"},{id:"solution",name:"Solution",pct:4,act:"climax",threeAct:3,guide:"The task is resolved.",ex:"Shows the scar"},{id:"propp-recognition",name:"Recognition",pct:3,act:"climax",threeAct:3,guide:"The hero is recognized, often by the mark from Branding.",ex:"Village recognizes hero"},{id:"exposure",name:"Exposure",pct:3,act:"climax",threeAct:3,guide:"The false hero or villain is exposed.",ex:"Imposter is exposed"},{id:"transfiguration",name:"Transfiguration",pct:2,act:"fall",threeAct:3,guide:"The hero is given a new appearance.",ex:"Hero looks radiant"},{id:"punishment",name:"Punishment",pct:3,act:"fall",threeAct:3,guide:"The villain, or the false hero, is punished.",ex:"Imposter is banished"},{id:"wedding",name:"Wedding",pct:6,act:"fall",threeAct:3,guide:"The hero marries and/or ascends the throne.",ex:"Hero weds, rules"}]}],z=e=>D.find(t=>t.id===e)||D[0];var M=[{id:"overcoming-monster",name:"Overcoming the Monster",taxonomy:"Booker's 7 Basic Plots",blurb:"A hero must destroy an evil, threatening force.",acts:{setup:"The monster's threat is established from a distance \u2014 its power, its victims, why it can't be ignored.",rise:"The hero prepares, gathers allies or weapons, and takes the fight to the monster's territory \u2014 early skirmishes go badly.",climax:"The direct, often near-fatal confrontation with the monster, where the hero's preparation is tested to its limit.",fall:"The monster is destroyed and its threat lifted \u2014 the world, and often the hero, is transformed by its defeat."}},{id:"rags-to-riches",name:"Rags to Riches",taxonomy:"Booker's 7 Basic Plots",blurb:"An overlooked or undervalued protagonist rises to true worth.",acts:{setup:"The hero starts poor, overlooked or undervalued \u2014 the story establishes exactly what they lack.",rise:"A rise in fortune begins, often followed by a false setback or a taste of the wrong kind of success.",climax:"A true test \u2014 often losing everything gained so far \u2014 that separates real worth from mere luck.",fall:"The hero earns a lasting, deserved success, now understanding what actually made them ready for it."}},{id:"the-quest",name:"The Quest",taxonomy:"Booker's 7 Basic Plots",blurb:"A hero and companions travel to reach a distant, vital goal.",acts:{setup:"A goal is named \u2014 an object, a place, a person \u2014 worth risking everything to reach.",rise:"A journey through a series of obstacles, each testing a different quality the hero needs to succeed.",climax:"The final, hardest obstacle guarding the goal, where all the previous trials pay off.",fall:"The goal is reached \u2014 though the story often reveals it changed the hero more than it changed their situation."}},{id:"voyage-and-return",name:"Voyage and Return",taxonomy:"Booker's 7 Basic Plots",blurb:"A hero is pulled into a strange world, and must escape it changed.",acts:{setup:"The hero is pulled or thrown into a strange world, unlike anything in their ordinary life.",rise:"They explore the strange world, initially delighted or curious, gradually sensing something is wrong.",climax:"The strange world turns dangerous, and the hero must escape it before it's too late.",fall:"The hero returns home, wiser for the journey, to a world that looks different now that they've changed."}},{id:"comedy",name:"Comedy",taxonomy:"Booker's 7 Basic Plots",blurb:"Confusion and misunderstanding are resolved into harmony.",acts:{setup:"Confusion, misunderstanding or a hidden truth separates people who belong together.",rise:"The confusion deepens \u2014 often through disguise, mistaken identity, or well-meant lies \u2014 before it can clear.",climax:"The truth threatens to come out at the worst possible moment, forcing a crisis.",fall:"The confusion is resolved, truths are revealed, and the story ends in reunion, marriage or restored order."}},{id:"tragedy",name:"Tragedy",taxonomy:"Booker's 7 Basic Plots",blurb:"A protagonist's own flaw drives them to their downfall.",acts:{setup:"The protagonist's central flaw or desire is introduced, often disguised as a strength.",rise:"That flaw drives a series of choices that seem reasonable at the time, each pulling them further from safety.",climax:"The flaw reaches its full, irreversible consequence \u2014 the point past which there's no return.",fall:"The protagonist's downfall plays out to its end, often taking down what and who they cared about with it."}},{id:"rebirth",name:"Rebirth",taxonomy:"Booker's 7 Basic Plots",blurb:"A protagonist trapped in a diminished life is redeemed.",acts:{setup:"The protagonist is trapped \u2014 by a curse, a habit, a belief, or another person's control \u2014 in a diminished life.",rise:"The trap tightens, or a chance at change appears and is refused, deepening the protagonist's isolation.",climax:"A moment \u2014 often involving someone else's love, courage or sacrifice \u2014 breaks the spell for good.",fall:"The protagonist is transformed, restored to a fuller life than the one the story began with."}},{id:"tobias-quest",name:"Quest",taxonomy:"Tobias' 20 Master Plots",blurb:"A goal or object worth any risk is pursued.",acts:{setup:"A goal or object worth any risk is named.",rise:"A journey through obstacles that test the hero's resolve.",climax:"The final barrier standing between the hero and the goal.",fall:"The goal is reached, and its true cost is understood."}},{id:"tobias-adventure",name:"Adventure",taxonomy:"Tobias' 20 Master Plots",blurb:"A hero is drawn from safety into an unfamiliar place.",acts:{setup:"The hero is drawn away from safety toward an unfamiliar place.",rise:"Danger and discovery alternate as the hero pushes further in.",climax:"The most dangerous point of the journey, survived by skill or luck.",fall:"The hero returns, marked by what they saw and did."}},{id:"tobias-pursuit",name:"Pursuit",taxonomy:"Tobias' 20 Master Plots",blurb:"A chase \u2014 hunter and hunted, roles sometimes unclear.",acts:{setup:"A chase begins \u2014 hunter and hunted, roles sometimes unclear.",rise:"Near-misses and close calls keep the gap from closing.",climax:"Hunter and hunted finally meet, face to face.",fall:"The chase ends, for better or worse, and doesn't resume."}},{id:"tobias-rescue",name:"Rescue",taxonomy:"Tobias' 20 Master Plots",blurb:"Someone taken, trapped, or lost is fought for.",acts:{setup:"Someone is taken, trapped, or lost.",rise:"The rescuer plans and moves toward them against resistance.",climax:"The rescue attempt itself, at its most dangerous.",fall:"The rescued and the rescuer are both changed by what it cost."}},{id:"tobias-escape",name:"Escape",taxonomy:"Tobias' 20 Master Plots",blurb:"A trap or confinement, physical or otherwise, is broken free of.",acts:{setup:"A trap, prison or confinement is established, physical or otherwise.",rise:"Attempts to break free fail, or nearly succeed, raising the stakes.",climax:"The escape attempt that finally works \u2014 or finally fails.",fall:"Freedom, and what it means now that it's real."}},{id:"tobias-revenge",name:"Revenge",taxonomy:"Tobias' 20 Master Plots",blurb:"An unforgivable wrong is pursued and answered.",acts:{setup:"A wrong is done that can't be forgiven or forgotten.",rise:"The wronged party plans and pursues retribution.",climax:"The confrontation with the one who caused the harm.",fall:"The revenge is taken \u2014 and its cost to the avenger is revealed."}},{id:"tobias-riddle",name:"The Riddle",taxonomy:"Tobias' 20 Master Plots",blurb:"A genuine puzzle, with real stakes for solving it.",acts:{setup:"A genuine puzzle is posed, with real stakes for solving it.",rise:"Clues mislead as often as they help.",climax:"The pieces come together \u2014 or the puzzle nearly defeats the solver.",fall:"The answer is revealed, and its implications land."}},{id:"tobias-rivalry",name:"Rivalry",taxonomy:"Tobias' 20 Master Plots",blurb:"Two roughly equal parties are set against each other.",acts:{setup:"Two roughly equal parties are set against each other.",rise:"Each gains and loses ground in turn.",climax:"A decisive contest that will settle the rivalry for good.",fall:"One rival wins \u2014 or both are changed by refusing to stop."}},{id:"tobias-underdog",name:"Underdog",taxonomy:"Tobias' 20 Master Plots",blurb:"A clearly outmatched party takes on a much stronger one.",acts:{setup:"A clearly outmatched party takes on a much stronger one.",rise:"Setbacks pile up, and victory looks less and less likely.",climax:"The decisive confrontation, against all odds.",fall:"The underdog's unlikely win \u2014 or a defeat that still means something."}},{id:"tobias-temptation",name:"Temptation",taxonomy:"Tobias' 20 Master Plots",blurb:"Something forbidden, but deeply desired, is offered.",acts:{setup:"Something forbidden or dangerous, but deeply desired, is offered.",rise:"Small compromises are made, easier to justify each time.",climax:"The point of no return, where the temptation is fully given in to.",fall:"The consequences of giving in are lived with."}},{id:"tobias-metamorphosis",name:"Metamorphosis",taxonomy:"Tobias' 20 Master Plots",blurb:"A character is transformed, often against their will.",acts:{setup:"A character is transformed \u2014 physically, often against their will.",rise:"Life under the new, unwanted form, and its isolation.",climax:"The transformed character reaches a breaking point.",fall:"Some resolution to the changed state \u2014 reversal, acceptance, or its opposite."}},{id:"tobias-transformation",name:"Transformation",taxonomy:"Tobias' 20 Master Plots",blurb:"A character is pushed into becoming someone different.",acts:{setup:"A character is shown clearly as they are before the story changes them.",rise:"A series of events pushes them toward a different way of being.",climax:"The moment the old self can no longer hold.",fall:"The new self is shown, contrasted against who they were."}},{id:"tobias-maturation",name:"Maturation",taxonomy:"Tobias' 20 Master Plots",blurb:"A young or naive protagonist faces the adult world.",acts:{setup:"A young or naive protagonist faces the adult world for the first time.",rise:"Lessons are learned the hard way, through real consequences.",climax:"A final test that requires acting as an adult, not a child.",fall:"The protagonist is shown, changed, no longer who they were at the start."}},{id:"tobias-love",name:"Love",taxonomy:"Tobias' 20 Master Plots",blurb:"Two people are drawn to each other, against some obstacle.",acts:{setup:"Two people are drawn to each other, against some obstacle.",rise:"The obstacle complicates and nearly separates them.",climax:"The relationship's decisive moment \u2014 together or apart, for good.",fall:"The outcome of the love story, earned rather than assumed."}},{id:"tobias-forbidden-love",name:"Forbidden Love",taxonomy:"Tobias' 20 Master Plots",blurb:"An attraction breaks a rule \u2014 social, moral, or otherwise.",acts:{setup:"An attraction that breaks a rule \u2014 social, moral, or otherwise.",rise:"The relationship is hidden, and the risk of discovery grows.",climax:"The forbidden love is exposed, or a choice must finally be made.",fall:"The cost of the love is paid, whatever the choice was."}},{id:"tobias-sacrifice",name:"Sacrifice",taxonomy:"Tobias' 20 Master Plots",blurb:"A character has something precious to give up.",acts:{setup:"A character has something precious to lose.",rise:"Circumstances make giving it up look more and more necessary.",climax:"The sacrifice is made, consciously and irreversibly.",fall:"What the sacrifice bought is shown, weighed against what it cost."}},{id:"tobias-discovery",name:"Discovery",taxonomy:"Tobias' 20 Master Plots",blurb:"A character's understanding of themselves or their world is incomplete.",acts:{setup:"A character's understanding of themselves or their world is incomplete.",rise:"Events chip away at old assumptions, one at a time.",climax:"A single revelation reframes everything that came before.",fall:"The character lives, differently, in light of what they now know."}},{id:"tobias-wretched-excess",name:"Wretched Excess",taxonomy:"Tobias' 20 Master Plots",blurb:"A desire is pursued past any reasonable limit.",acts:{setup:"A character pursues a desire past any reasonable limit.",rise:"More is never enough \u2014 the pursuit escalates.",climax:"The excess reaches a breaking point, for the character or those around them.",fall:"The reckoning \u2014 self-destruction, ruin, or a narrow escape from it."}},{id:"tobias-ascension",name:"Ascension",taxonomy:"Tobias' 20 Master Plots",blurb:"A character climbs from a low or ordinary position.",acts:{setup:"A character begins in a low or ordinary position.",rise:"A sustained climb, through ability, luck, or both.",climax:"The final test standing between the character and the top.",fall:"The character reaches the height they were climbing toward."}},{id:"tobias-descension",name:"Descension",taxonomy:"Tobias' 20 Master Plots",blurb:"A character falls from a high or fortunate position.",acts:{setup:"A character begins in a high or fortunate position.",rise:"A slow, often self-inflicted decline begins.",climax:"The point at which the fall becomes irreversible.",fall:"The character lands at the bottom of what they built, or lost."}},{id:"polti-supplication",name:"Supplication",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A powerful figure holds someone's fate in their hands.",acts:{setup:"A powerful figure holds someone's fate.",rise:"The weaker party pleads for mercy or help.",climax:"The powerful figure's decision hangs in the balance.",fall:"Mercy is granted \u2014 or refused, and the cost is paid."}},{id:"polti-deliverance",name:"Deliverance",taxonomy:"Polti's 36 Dramatic Situations",blurb:"Someone trapped or threatened is rescued.",acts:{setup:"Someone is trapped or threatened, seemingly beyond help.",rise:"A rescuer emerges and moves to intervene.",climax:"The deliverance is attempted at its most dangerous point.",fall:"The threatened party is freed \u2014 or the attempt fails."}},{id:"polti-crime-vengeance",name:"Crime Pursued by Vengeance",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A crime against someone dear is answered with vengeance.",acts:{setup:"A crime is committed against someone dear to the avenger.",rise:"The avenger tracks the culprit, closing the distance.",climax:"Avenger and culprit finally meet.",fall:"Vengeance is taken, and its price is paid."}},{id:"polti-vengeance-kindred",name:"Vengeance Taken for Kindred Upon Kindred",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A crime against family demands vengeance against family.",acts:{setup:"A crime against family demands vengeance against family.",rise:"The avenger closes in on someone who shares blood with the true offender.",climax:"The vengeance is about to fall on an innocent relative.",fall:"The vengeance lands \u2014 rightly or wrongly, on kin."}},{id:"polti-pursuit",name:"Pursuit",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A wrongdoer flees a threat to their life or freedom.",acts:{setup:"A wrongdoer flees a threat to their life or freedom.",rise:"Pursuers close the distance, evasion after evasion.",climax:"Pursued and pursuer are finally cornered together.",fall:"Capture, escape, or something else \u2014 the chase ends."}},{id:"polti-disaster",name:"Disaster",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A stable situation is threatened by an overwhelming force.",acts:{setup:"A stable situation is threatened by an overwhelming force.",rise:"The disaster unfolds, largely beyond anyone's control.",climax:"The worst of the disaster hits.",fall:"What's left is taken stock of, and rebuilding begins."}},{id:"pol -obtaining",name:"Obtaining",taxonomy:"Polti's 36 Dramatic Situations",blurb:"Something greatly desired is just out of reach.",acts:{setup:"Something greatly desired is just out of reach.",rise:"Attempts to obtain it meet resistance or competition.",climax:"The decisive attempt to take hold of it.",fall:"It's won, or lost, and what that costs becomes clear."}},{id:"polti-enmity-kinsmen",name:"Enmity of Kinsmen",taxonomy:"Polti's 36 Dramatic Situations",blurb:"Hatred grows between family members.",acts:{setup:"Hatred grows between family members.",rise:"Every interaction deepens the rift.",climax:"The enmity comes to a head, openly.",fall:"The family is broken, or an uneasy peace is found."}},{id:"polti-rivalry-kinsmen",name:"Rivalry of Kinsmen",taxonomy:"Polti's 36 Dramatic Situations",blurb:"Family members compete for the same prize.",acts:{setup:"Family members compete for the same prize.",rise:"The rivalry sharpens as the stakes rise.",climax:"A decisive contest between them.",fall:"One wins, at the cost of the family bond."}},{id:"polti-murderous-adultery",name:"Murderous Adultery",taxonomy:"Polti's 36 Dramatic Situations",blurb:"An affair conceals a plan to remove a spouse.",acts:{setup:"An affair conceals a plan to remove the betrayed spouse.",rise:"The plan against the spouse advances, hidden.",climax:"The murder is attempted.",fall:"The truth comes out, and judgment follows."}},{id:"polti-madness",name:"Madness",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A character's grip on reality begins to slip.",acts:{setup:"A character's grip on reality begins to slip.",rise:"Their unraveling affects everyone around them.",climax:"The madness reaches its most dangerous or revealing point.",fall:"Some clarity returns \u2014 or doesn't."}},{id:"polti-fatal-imprudence",name:"Fatal Imprudence",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A risk is taken without weighing its true cost.",acts:{setup:"A character takes a risk without weighing its true cost.",rise:"The consequences of that carelessness start to compound.",climax:"The imprudence catches up, all at once.",fall:"The price of the mistake is paid in full."}},{id:"polti-involuntary-crimes-love",name:"Involuntary Crimes of Love",taxonomy:"Polti's 36 Dramatic Situations",blurb:"Love leads a character into an act they didn't intend.",acts:{setup:"Love leads a character into an act they didn't intend.",rise:"They try, and fail, to undo or contain the harm.",climax:"The crime is exposed, or its consequences become unavoidable.",fall:"The character lives with what love made them do."}},{id:"polti-slaying-kinsman-unrecognized",name:"Slaying of a Kinsman Unrecognized",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A stranger is killed, their true identity unknown.",acts:{setup:"A stranger is encountered, their identity unknown.",rise:"Conflict builds between them, neither knowing the truth.",climax:"The stranger is killed.",fall:"Their true identity \u2014 a family member \u2014 is revealed, too late."}},{id:"polti-self-sacrifice-ideal",name:"Self-Sacrifice for an Ideal",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A cause or principle demands everything.",acts:{setup:"A cause or principle demands more than the character wants to give.",rise:"The cost of standing by the ideal keeps rising.",climax:"The sacrifice must be made, fully and finally.",fall:"What the sacrifice bought for the ideal is shown."}},{id:"polti-self-sacrifice-kindred",name:"Self-Sacrifice for Kindred",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A family member's survival depends on a sacrifice.",acts:{setup:"A family member's survival depends on someone else giving something up.",rise:"The cost of the coming sacrifice becomes clearer.",climax:"The sacrifice is made.",fall:"The family member lives on, changed by what was given for them."}},{id:"polti-all-sacrificed-passion",name:"All Sacrificed for Passion",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A consuming passion outweighs everything else.",acts:{setup:"A consuming passion outweighs everything else in a character's life.",rise:"Responsibilities, relationships and safety are set aside for it.",climax:"Everything is finally staked on the passion, all at once.",fall:"What's left once the passion has taken everything it can."}},{id:"polti-necessity-sacrificing-loved-ones",name:"Necessity of Sacrificing Loved Ones",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A character is forced to choose between loved ones.",acts:{setup:"A character is forced to choose between loved ones, or between duty and love.",rise:"Every option costs someone dear to them.",climax:"The choice can no longer be delayed.",fall:"The sacrifice is made, and its grief is lived with."}},{id:"polti-rivalry-superior-inferior",name:"Rivalry of Superior and Inferior",taxonomy:"Polti's 36 Dramatic Situations",blurb:"Two unequal parties are set in competition.",acts:{setup:"Two unequal parties are set in competition.",rise:"The weaker party finds ways to close the gap.",climax:"A contest that could go either way, against expectation.",fall:"The outcome upends \u2014 or confirms \u2014 the assumed hierarchy."}},{id:"polti-adultery",name:"Adultery",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A committed relationship is broken by an affair.",acts:{setup:"A marriage or committed relationship is broken by an affair.",rise:"The affair deepens, and discovery becomes more likely.",climax:"The affair is discovered, or a choice between partners must be made.",fall:"The relationships that survive are changed for good."}},{id:"polti-crimes-of-love",name:"Crimes of Love",taxonomy:"Polti's 36 Dramatic Situations",blurb:"Love drives a character toward something transgressive.",acts:{setup:"Love drives a character toward something transgressive.",rise:"The transgression compounds, harder to undo with each step.",climax:"The crime committed for love comes to a head.",fall:"Judgment, forgiveness, or ruin follows."}},{id:"polti-discovery-dishonor-loved-one",name:"Discovery of the Dishonor of a Loved One",taxonomy:"Polti's 36 Dramatic Situations",blurb:"Someone trusted turns out not to be who they seemed.",acts:{setup:"A character believes fully in someone they love.",rise:"Signs accumulate that this person isn't who they seem.",climax:"The dishonor is fully revealed.",fall:"The relationship, and the character's trust, must be rebuilt or ended."}},{id:"polti-obstacles-love",name:"Obstacles to Love",taxonomy:"Polti's 36 Dramatic Situations",blurb:"Two people who belong together are kept apart.",acts:{setup:"Two people who belong together are kept apart by circumstance.",rise:"Each attempt to close the distance meets a new obstacle.",climax:"The final, hardest obstacle stands between them.",fall:"They're united \u2014 or the obstacle proves too much."}},{id:"polti-enemy-loved",name:"An Enemy Loved",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A character falls for someone they should oppose.",acts:{setup:"A character falls for someone they should, by every rule, oppose.",rise:"Loyalty and feeling pull in opposite directions.",climax:"A choice must be made between the enemy and the character's own side.",fall:"The choice is lived with, whatever it cost."}},{id:"polti-ambition",name:"Ambition",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A character wants power, status or achievement badly.",acts:{setup:"A character wants power, status or achievement badly.",rise:"They climb toward it, compromising more with each step.",climax:"The final push for what they've been chasing.",fall:"They get it \u2014 and find out what it actually costs to hold."}},{id:"polti-conflict-with-god",name:"Conflict with a God",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A character defies a power far greater than themselves.",acts:{setup:"A character defies a power far greater than themselves.",rise:"The consequences of that defiance close in.",climax:"A direct confrontation with the greater power.",fall:"The character submits, is punished, or \u2014 rarely \u2014 prevails."}},{id:"polti-mistaken-jealousy",name:"Mistaken Jealousy",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A character wrongly believes they've been betrayed.",acts:{setup:"A character comes to believe, wrongly, that they've been betrayed.",rise:"The false belief drives them to act against the person they love.",climax:"The jealousy-driven act reaches its worst point.",fall:"The mistake is revealed \u2014 often too late to undo the harm."}},{id:"polti-erroneous-judgment",name:"Erroneous Judgment",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A character or authority is deceived into a false belief.",acts:{setup:"A character (or authority) is deceived into believing something false.",rise:"Decisions are made on the strength of that false belief.",climax:"The judgment is acted on, with real consequences.",fall:"The truth surfaces, and the wrongly judged party's fate is decided."}},{id:"polti-remorse",name:"Remorse",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A character has done something they can't undo.",acts:{setup:"A character has done something they can't undo.",rise:"The weight of it grows harder to carry or hide.",climax:"The remorse demands to be faced, openly.",fall:"Some form of atonement, forgiveness, or ruin follows."}},{id:"polti-recovery-lost-one",name:"Recovery of a Lost One",taxonomy:"Polti's 36 Dramatic Situations",blurb:"Someone precious, long lost, might be found after all.",acts:{setup:"Someone precious has been lost \u2014 to distance, presumed death, or estrangement.",rise:"A thread of hope that they might be found after all.",climax:"The moment of true recognition, if it comes.",fall:"Reunion \u2014 or confirmation that they're truly gone."}},{id:"polti-loss-loved-ones",name:"Loss of Loved Ones",taxonomy:"Polti's 36 Dramatic Situations",blurb:"A character's world includes people they can't imagine losing.",acts:{setup:"A character's world includes people they can't imagine losing.",rise:"Circumstances threaten one or more of them.",climax:"The loss occurs.",fall:"The character goes on, changed by what's gone."}},{id:"vonnegut-man-in-hole",name:"Man in a Hole",taxonomy:"Vonnegut's Story Shapes",blurb:"Fortune falls into trouble, then climbs back out higher than it started.",acts:{setup:"Things start out fine \u2014 an ordinary, stable position.",rise:"Fortune drops sharply into trouble, worse and worse.",climax:"The low point \u2014 deepest in the hole, hardest to see a way out.",fall:"A climb back out, ending better off than the story began."}},{id:"vonnegut-boy-meets-girl",name:"Boy Meets Girl",taxonomy:"Vonnegut's Story Shapes",blurb:"A wonderful thing is nearly lost, then won for good.",acts:{setup:"An ordinary person spots something wonderful, just out of reach.",rise:"Obstacles and complications keep the goal at arm's length.",climax:"The goal seems lost for good.",fall:"It's won after all \u2014 fortune ends high, higher than it started."}},{id:"vonnegut-cinderella",name:"Cinderella",taxonomy:"Vonnegut's Story Shapes",blurb:"A lucky rise, a sudden collapse, then a rise higher still.",acts:{setup:"A low starting position, with a sudden lucky break.",rise:"Fortune climbs, then suddenly collapses back down.",climax:"The low point returns, seemingly permanent this time.",fall:"An even higher rise than before \u2014 fortune ends at its peak."}},{id:"vonnegut-bad-to-worse",name:"From Bad to Worse",taxonomy:"Vonnegut's Story Shapes",blurb:"An unremarkable start declines steadily, with no recovery.",acts:{setup:"An unremarkable, even comfortable starting position.",rise:"An unexplained, irreversible turn for the worse.",climax:"Fortune keeps declining, with no rescue in sight.",fall:"The decline continues to its end \u2014 no recovery, no reprieve."}},{id:"vonnegut-which-way-up",name:"Which Way Is Up?",taxonomy:"Vonnegut's Story Shapes",blurb:"Whether fortune is rising or falling stays genuinely unclear.",acts:{setup:"Fortune's direction is genuinely u  disrupted order, and closes once a new one holds.",acts:{setup:"The story opens with an order disrupted.",rise:"The disruption spreads, and things get worse before they get better.",climax:"The turning point where the disruption starts to be brought under control.",fall:"The story ends once a new order is established."}}],E=e=>M.find(t=>t.id===e)||null,$=()=>{let e=[];for(let t of M){let a=e.find(i=>i.taxonomy===t.taxonomy);a||(a={taxonomy:t.taxonomy,items:[]},e.push(a)),a.items.push(t)}return e};var U=[{id:"star-wars-hero-journey",title:"Star Wars: A New Hope",creator:"George Lucas, 1977",appliesToType:"structure",appliesToId:"hero-journey",beats:{"ordinary-world":"Luke Skywalker lives a dull life as a moisture farmer on Tatooine, dreaming of something more.",call:"R2-D2 carries Princess Leia's hidden message asking for Obi-Wan Kenobi's help.",refusal:"Luke tells Obi-Wan he can't leave \u2014 his uncle needs him on the farm.",mentor:"Obi-Wan gives Luke his father's lightsaber and begins teaching him about the Force.",threshold:"Luke finds his aunt and uncle killed and commits to leaving Tatooine for good.","tests-allies":"Luke meets Han Solo and Chewbacca in Mos Eisley and hires the Millennium Falcon.",approach:"The crew is captured by the Death Star's tractor beam and plans a rescue.",ordeal:"Luke and friends rescue Leia and narrowly escape the trash compactor.",reward:"They escape the Death Star with Leia and the stolen plans \u2014 but Obi-Wan is struck down by Vader.","road-back":"The Millennium Falcon is pursued back to the Rebel base, secretly tracked by the Empire.",resurrection:"Luke joins the assault on the Death Star, using the Force instead of his targeting computer.",elixir:"Luke destroys the Death Star and is honored as a hero of the Rebellion."}},{id:"die-hard-three-act",title:"Die Hard",creator:"screenplay by Jeb Stuart & Steven E. de Souza, 1988",appliesToType:"structure",appliesToId:"three-act",beats:{"status-quo":"John McClane arrives in LA for C :root{ --bg:#120E1C; --panel:#1B1530; --panel2:#241C3D; --ink:#EDE7DA; --dim:#8B8398;
  --gold:#E9C88A; --ember:#D2785A; --border:rgba(237,231,218,0.10); }
*{box-sizing:border-box}
.boot{color:var(--dim);font-family:system-ui;padding:40px;text-align:center}
.app{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;padding:18px 20px 40px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.brand{font-family:'Fraunces',serif;font-weight:650;font-size:20px;color:var(--gold);white-space:nowrap}
.title-input{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:9px 12px;font-family:'Fraunces',serif;font-size:16px}
.struct-select{background:var(--panel);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:13px}
.blurb{color:var(--dim);font-size:13px;margin:2px 0 18px}
button{font-family:inherit;cursor:pointer}
.ghost-btn{background:transparent;border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px}
.ghost-btn:hover{border-color:var(--gold);color:var(--gold)}
.primary-btn{background:var(--gold);border:none;color:#241606;font-weight:600;border-radius:8px;padding:9px 14px;font-size:13px}
.primary-btn:hover{filter:brightness(1.08)}
.icon-btn{background:transparent;border:none;color:var(--dim);font-size:14px;padding:4px 6px;border-radius:6px}
.icon-btn:hover{color:var(--ember)}
.layout{display:grid;grid-template-columns:minmax(320px,460px) 1fr;gap:24px;align-items:start}
@media (max-width: 860px){ .layout{grid-template-columns:1fr} }
.wheel-col{display:flex;flex-direction:column;align-items:center;gap:12px}
.wheel{width:100%;max-width:420px}
.act-ring{fill:var(--gold);opacity:.14;stroke:var(--gold);stroke-width:.5;stroke-opacity:.4}
.act-ring-label{font-family:'Archivo',sans-serif;font-size:11px;font-weight:600;fill:var(--gold);opacity:.75;
  letter-spacing:.04em;text-transform:uppercase;pointer-events:none}
.slice{cursor:pointer;transition:opacity .15s}
.slice:hover path{opacity:1}
.slice.is-sel path{filter:drop-shadow(0 0 6px rgba(233,200,138,.55))}
.slice-num{font-family:'Archivo',sans-serif;font-size:13px;font-weight:700;fill:#120E1C;pointer-events:none}
.dot{fill:#120E1C;stroke:var(--ink);stroke-width:1;pointer-events:none}
.hub{fill:var(--panel);stroke:var(--border);stroke-width:1}
.hub-title{font-family:'Fraunces',serif;font-size:16px;fill:var(--ink);pointer-events:none}
.hub-sub{font-size:11px;fill:var(--dim);pointer-events:none}
.beat-list{list-style:none;margin:0;padding:0;width:100%;max-width:420px;display:flex;flex-direction:column;gap:2px}
.beat-list li{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13px}
.beat-list li:hover{background:var(--panel)}
.beat-list li.is-sel{background:var(--panel2)}
.beat-swatch{width:8px;height:8px;border-radius:50%;flex:none}
.beat-num{color:var(--dim);width:18px;flex:none;font-size:12px}
.beat-name{flex:1}
.beat-ex{color:var(--dim);font-size:11px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.beat-flag{color:var(--dim);font-size:11px}
.beat-flag.on{color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:4px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.legend-item i{width:9px;height:9px;border-radius:3px;display:inline-block}
.plot-type-picker{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.04em;width:100%;max-width:420px;margin-top:4px}
.plot-type-hint{text-transform:none;letter-spacing:normal;font-size:11px;opacity:.7}
.plot-type-picker select{background:var(--panel);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;text-transform:none;letter-spacing:normal}
.plot-type-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin:4px 0 18px;
  padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:12px}
.plot-type-top-picker{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.04em}
.plot-type-top-picker select{background:var(--bg);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;text-transform:none;
  letter-spacing:normal;min-width:220px}
.plot-type-top-blurb{flex:1;min-width:200px;font-size:13px;color:var(--dim);margin:0}
.plot-type-top-blurb span{color:var(--gold);text-transform:uppercase;font-size:10px;letter-spacing:.05em}
.plot-type-top-blurb em{font-style:italic;display:block;margin-top:2px;color:var(--ink)}
.act-table-wrap{width:100%;overflow-x:auto;margin-top:24px}
.act-table{width:100%;border-collapse:collapse;font-size:13px}
.act-table th{text-align:left;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;
  font-weight:600;padding:0 14px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.act-table td{vertical-align:top;padding:14px;border-bottom:1px solid var(--border);line-height:1.5}
.act-table tr:last-child td{border-bottom:none}
.act-table-act{white-space:nowrap;font-weight:600;color:var(--gold)}
.act-table-act .act-breakdown-swatch{display:inline-block;vertical-align:middle;margin:0 8px 2px 0}
.plot-type-panel{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:14px 16px}
.plot-type-taxonomy{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.plot-type-blurb{color:var(--gold);font-size:13px;font-style:italic;margin:0 0 12px}
.plot-type-note{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;
  font-size:12px;color:var(--dim);line-height:1.5;margin:0 0 12px}
.plot-type-note span{font-weight:600}
.plot-type-note-tax{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--dim);opacity:.7;font-weight:400!important;margin-bottom:2px}
.example-note{background:var(--bg);border:1px solid var(--ember);border-left-width:3px;border-radius:8px;
  padding:10px 12px;font-size:12px;color:var(--dim);line-height:1.5;margin:0 0 12px}
.example-note-tag{color:var(--ember);font-weight:600}
.example-line{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5}
.example-line span{color:var(--ember);font-weight:600}
.side-col{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;min-height:420px}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:10px}
.tabs button{background:transparent;border:none;color:var(--dim);font-size:13px;padding:6px 10px;border-radius:7px}
.tabs button.is-sel{background:var(--panel2);color:var(--gold)}
.beat-editor h3{font-family:'Fraunces',serif;margin:0 0 6px;font-size:20px;color:var(--gold)}
.guide{color:var(--dim);font-size:13px;margin:0 0 6px;line-height:1.5}
.beat-ex-line{color:var(--gold);font-size:12px;margin:0 0 12px;opacity:.85}
.beat-ex-line em{font-style:italic}
.beat-editor textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  color:var(--ink);padding:12px;font-size:14px;line-height:1.6;font-family:'Fraunces',serif;resize:vertical}
.wc{color:var(--dim);font-size:11px;margin-top:6px;text-align:right}
.characters{display:flex;flex-direction:column;gap:8px}
.char-row{display:grid;grid-template-columns:1fr 120px 2fr auto;gap:8px}
.char-row input,.char-row select{background:var(--bg);border:1px solid var(--border);color:var(--ink);
  border-radius:7px;padding:8px 10px;font-size:13px}
.empty{color:var(--dim);font-size:13px}
.notes-panel{display:flex;flex-direction:column;gap:6px}
.notes-panel label{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.notes-panel input,.notes-panel textarea{background:var(--bg);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:10px 12px;font-size:14px;font-family:'Fraunces',serif}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:560px;max-height:80vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal-head h3{font-family:'Fraunces',serif;margin:0;color:var(--gold)}
.story-list{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:6px}
.story-list li{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px}
.story-list li.is-sel{background:var(--panel2)}
.story-list input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--ink);border-radius:6px;padding:6px 8px;font-size:13px}
.story-struct{color:var(--dim);font-size:11px;white-space:nowrap}
.struct-pick{display:flex;flex-direction:column;gap:8px}
.struct-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px}
.struct-opt span{color:var(--dim);font-size:12px}
.compare-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.compare-picker{display:flex;flex-direction:column;gap:6px}
.compare-picker-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.compare-kind-toggle{display:flex;gap:4px}
.compare-kind-toggle button{background:transparent;border:1px solid var(--border);color:var(--dim);font-size:11px;padding:4px 9px;border-radius:6px}
.compare-kind-toggle button.is-sel{background:var(--panel2);color:var(--gold);border-color:var(--gold)}
.compare-picker select{background:var(--panel);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;text-transform:none;letter-spacing:normal;min-width:200px}
.compare-body{display:flex;flex-direction:column;align-items:center;gap:24px}
.compare-wheel{width:100%;max-width:560px}
.ribbon{opacity:.28}
.compare-legends{display:grid;grid-template-columns:1fr 1fr;gap:24px;width:100%;max-width:900px}
@media (max-width: 700px){ .compare-legends{grid-template-columns:1fr} }
.act-breakdown h4{font-family:'Fraunces',serif;color:var(--gold);margin:0 0 10px;font-size:16px}
.act-breakdown-row{display:flex;gap:10px;margin-bottom:10px}
.act-breakdown-swatch{width:10px;height:10px;border-radius:3px;flex:none;margin-top:4px}
.act-breakdown-label{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.act-breakdown-beats{font-size:13px;line-height:1.5}
`;ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Ae));})();

</script>

if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(() => {});
