eed:"The team and town need to believe a small school can compete at all, while Dale needs redemption after a scandal ended his previous coaching career.",go:"Dale institutes strict, fundamentals-first training that alienates the town's fans and even costs him some of his players early on.",search:"The team struggles to adapt to Dale's disciplined system, and Dale works to bring troubled alcoholic assistant coach Shooter back into the fold.",find:"The team, at last unified under Dale's system, starts winning against bigger, more talented schools, gaining belief in themselves and their coach.",take:"Under mounting town pressure and doubt, Hickory keeps advancing through the state tournament brackets, the stakes and scrutiny rising with every win.",return:"Hickory arrives at the state championship game against a much larger, heavily favored school, the whole town now behind them.",change:"Using Dale's exact fundamentals and a play measured to their gym back home, tiny Hickory wins the state championship, the town's disbelief turned to pride."}},{id:"doctor-faustus-tobias-temptation-2",title:"Doctor Faustus",creator:"Christopher Marlowe, c. 1592",appliesToType:"plotType",appliesToId:"tobias-temptation",bestStructureId:"todorov",beats:{setup:"The brilliant but restless scholar Faustus, dissatisfied with the limits of human knowledge, turns to forbidden magic.",rise:"He bargains his soul to the demon Mephistopheles for twenty-four years of unlimited power, wavering between repentance and pride throughout.",climax:"As the pact's deadline nears, Faustus makes desperate, failed attempts to repent and escape his bargain.",fall:"At the appointed hour, devils drag Faustus to hell, the temptation's bargain finally and irreversibly paid."},sections:{equilibrium:"Faustus, a brilliant scholar in Wittenberg, has mastered every conventional field of study and finds himself bored and unsatisfied with human knowledge's limits.",disruption:"Faustus turns to necromancy and summons the demon Mephistopheles, striking a pact to trade his soul for twenty-four years of unlimited knowledge and power.",recognition:"Good and Evil Angels appear repeatedly to Faustus, and he wavers, aware at times of the horror of what he's bargained away, yet unable to fully repent.",repair:"Faustus attempts, at several points, to repent and break the pact, but pride, doubt, and Mephistopheles's interventions repeatedly pull him back from turning to God.","new-equilibrium":"When the twenty-four years expire, devils drag Faustus to hell despite his final, desperate pleas for mercy, the temptation's true cost finally collected."}},{id:"paradise-lost-tobias-temptation-3",title:"Paradise Lost",creator:"John Milton, 1667",appliesToType:"plotType",appliesToId:"tobias-temptation",bestStructureId:"todorov",beats:{setup:"Adam and Eve live in untroubled paradise, forbidden only the fruit of a single tree.",rise:"Satan tempts Eve into eating the fruit, and Adam, unwilling to lose her, chooses to eat it too.",climax:"Ashamed before God, the couple tries to hide their transgression before being confronted and judged.",fall:"Expelled from Eden into a harsher world, Adam and Eve leave together, carrying both loss and a distant hope of redemption."},sections:{equilibrium:"Adam and Eve live in perfect harmony in the Garden of Eden, given every pleasure except the fruit of one forbidden tree.",disruption:"Satan, disguised as a serpent, tempts Eve with the promise that eating the fruit will make her wise like God, and she eats it.",recognition:"Eve brings the fruit to Adam, who, recognizing what she's done, chooses to eat as well rather than be separated from her, fully aware of the consequence.",repair:"Adam and Eve, ashamed and afraid before God, attempt to hide their transgression, but are confronted and made to face judgment for breaking the one command given them.","new-equilibrium":"Cast out of Eden into a harder mortal world, Adam and Eve leave hand in hand, their innocence lost but a promise of eventual redemption ahead of them."}},{id:"metamorphosis-fly-2",title:"The Fly",creator:"dir. David Cronenberg, 1986",appliesToType:"plotType",appliesToId:"tobias-metamorphosis",bestStructureId:"todorov",beats:{setup:"Seth Brundle is a brilliant, socially awkward inventor who has built a working teleportation device and begins falling for journalist Veronica Quaife.",rise:"A drunken, jealous mistake sends Seth through the pod with a fly, and he begins noticing unsettling physical changes\u2014enhanced strength, altered appetite, peeling skin\u2014that accelerate.",climax:`As "Brundlefly" replaces the man entirely, Seth's desperate attempts to reverse the process or fuse with Veronica and her unborn child culminate in a monstrous final fusion with the telepod.`,fall:"Veronica is left to end her transformed lover's suffering, closing the story on the horror of what science and jealousy unleashed."},sections:{equilibrium:"Seth Brundle, a brilliant but reclusive scientist, has just perfected his teleportation pods and is beginning a hesitant romance with journalist Veronica Quaife.",disruption:"Drunk and jealous after misreading Veronica's intentions, Seth teleports himself alone \u2014 unaware a housefly has slipped into the pod with him, and the computer splices their genetics together.",recognition:"Seth notices small changes at first \u2014 new strength, coarse hairs, a taste for sugar \u2014 before his own deteriorating body and Veronica's alarm force him to admit something has gone catastrophically wrong.",repair:'He researches feverishly in his lab, trying to reverse or at least understand the fusion, even attempting to force Veronica into a pod with him and their unborn child to "purify" the process.',"new-equilibrium":"The transformation completes past any repair; the creature that was Seth, fused grotesquely with the telepod's metal, is destroyed, leaving Veronica alone with the consequences of what happened to him."}},{id:"metamorphosis-jekyll-hyde-3",title:"Strange Case of Dr Jekyll and Mr Hyde",creator:"Robert Louis Stevenson, 1886",appliesToType:"plotType",appliesToId:"tobias-metamorphosis",bestStructureId:"todorov",beats:{setup:"Respected physician Henry Jekyll secretly resents the constraints of Victorian propriety and begins experimenting with a drug meant to isolate his baser instincts.",rise:"The potion lets him become Edward Hyde, a younger, remorseless figure who commits escalating cruelties while Jekyll's friends grow alarmed by the connection between the two men.",climax:"Hyde's murder of Sir Danvers Carew and the transformations turning involuntary force Jekyll into a losing race to synthesize the rare salts that let him remain himself.",fall:"With the ingredients exhausted and Hyde ascendant, Jekyll poisons himself, leaving a confession letter that finally reveals the truth to Utterson and Lanyon."},sections:{equilibrium:"Dr. Henry Jekyll is a respected London physician living a proper, restrained double life, troubled by urges he keeps carefully hidden.",disruption:"Jekyll formulates and drinks a chemical potion that separates his moral nature, unleashing Edward Hyde \u2014 a smaller, remorseless embodiment of his repressed impulses.",recognition:"As Hyde commits increasingly violent acts, culminating in the murder of Sir Danvers Carew, Jekyll's friends Utterson and Lanyon realize something monstrous connects the mild doctor to the hunted killer.",repair:"Jekyll tries to renounce Hyde and live only as himself, but finds the transformations now happen involuntarily, forcing him into a desperate, failing search for the original chemical salts to control the change.","new-equilibrium":"Unable to secure the ingredients or resist the change any longer, Jekyll takes his own life as Hyde, leaving a written confession that finally restores order by revealing the truth."}},{id:"transformation-groundhog-day-2",title:"Groundhog Day",creator:"dir. Harold Ramis, 1993",appliesToType:"plotType",appliesToId:"tobias-transformation",bestStructureId:"story-circle",beats:{setup:"Phil Connors is a cynical, self-absorbed TV weatherman who treats everyone around him, including producer Rita, with contempt, and resents his assignment covering Punxsutawney's Groundhog Day festival.",rise:"A blizzard traps him overnight, and he wakes to find February 2nd repeating endlessly, cycling first through despair, then reckless hedonism and manipulation as he exploits the loop for his own amusement.",climax:"Realizing indulgence brings no satisfaction, he spends years of repeated days learning piano and ice sculpture and genuinely helping the townspeople, finally becoming patient and generous rather than controlling.",fall:"Waking to find it is truly tomorrow, Phil is a fundamentally kinder man, and Rita falls for the person he has become."},sections:{you:"Phil Connors is a cynical, self-absorbed TV weatherman who treats everyone around him, including producer Rita, with contempt.",need:"Sent to cover the Groundhog Day festival in Punxsutawney, he needs to escape both the assignment and, unknowingly, his own selfishness.",go:"A blizzard strands him overnight, and he wakes to find February 2nd repeating endlessly, trapping him in the small town.",search:"He cycles through despair, hedonism, and manipulation, using his knowledge of the day to indulge every whim and even seduce Rita, without ever winning her.",find:"Realizing indulgence brings no satisfaction, he begins using the repeating day to learn piano, ice sculpture, and to genuinely help the townspeople.",take:"The cost is years of lonely repetition and repeated failure \u2014 including many futile suicide attempts \u2014 before he accepts he cannot control or escape the loop by force.",return:"Having become patient, generous, and emotionally present, he spends what is finally his last repeated day simply doing good in the town he once despised.",change:"Waking to find it is truly tomorrow, Phil is a fundamentally kinder man, and Rita falls for the person he has become."}},{id:"transformation-christmas-carol-3",title:"A Christmas Carol",creator:"Charles Dickens, 1843",appliesToType:"plotType",appliesToId:"tobias-transformation",bestStructureId:"story-circle",beats:{setup:"Ebenezer Scrooge is a miserly, isolated London moneylender who despises Christmas and treats his clerk Bob Cratchit with contempt, until the ghost of his late partner Jacob Marley warns him he must change.",rise:"Guided by three spirits, Scrooge is forced to revisit his lonely childhood and lost love, then witness the Cratchits' fragile joy despite their poverty, adapting painfully to what he sees.",climax:"The Ghost of Christmas Yet to Come confronts him with his own unmourned death and Tiny Tim's likely one, the harsh price of continuing unchanged.",fall:'Scrooge wakes transformed on Christmas morning and showers his household and the Cratchits with generosity, becoming a man who, as Dickens writes, "knew how to keep Christmas well."'},sections:{you:"Ebenezer Scrooge is a miserly, isolated London moneylender who despises Christmas and treats his clerk Bob Cratchit with contempt.",need:"The ghost of his late partner Jacob Marley warns him that he needs to change his ways before death traps him in chains of his own making.",go:"Scrooge is drawn out of his ordinary bitterness into a supernatural journey guided by three spirits, beginning with the Ghost of Christmas Past.",search:"He is forced to revisit his lonely childhood, his lost love Belle, and the warmth he abandoned in pursuit of wealth.",find:"The Ghost of Christmas Present shows him the genuine joy of the Cratchit family despite their poverty, including the fragile, beloved Tiny Tim.",take:"The Ghost of Christmas Yet to Come confronts him with his own unmourned death and Tiny Tim's likely one, the harsh price of continuing unchanged.",return:"Scrooge wakes in his own bed on Christmas morning, returned to his ordinary world but desperate to act differently within it.",change:'He showers his household and the Cratchits with generosity, becoming, as Dickens writes, a man who "knew how to keep Christmas well."'}},{id:"maturation-stand-by-me-2",title:"Stand By Me",creator:"dir. Rob Reiner, 1986",appliesToType:"plotType",appliesToId:"tobias-maturation",bestStructureId:"seven-point",beats:{setup:"Twelve-year-old Gordie Lachance and his friends spend an ordinary summer in small-town Oregon, overshadowed by Gordie's grief for his dead older brother, before setting off to find a dead body in the woods.",rise:"Along the railway tracks and through a junkyard they face real danger, and around the campfire Gordie opens up about his brother's death, shifting the trip toward genuine self-examination.",climax:"Older, armed teenagers arrive to claim the body for themselves, and Gordie faces their leader Ace Merrill down with a stolen pistol, finding a courage he didn't know he had.",fall:"The boys let the authorities anonymously find the body, and Gordie returns home changed, later becoming a writer who understands how that friendship and summer shaped him."},sections:{hook:"Twelve-year-old Gordie Lachance and his friends spend an ordinary summer in small-town Oregon, overshadowed by Gordie's grief for his dead older brother and his family's indifference.","plot-turn-1":"The boys learn of a dead body lying in the woods outside town and set off on a two-day hike to find it, hoping for a taste of local fame.","pinch-1":"Along the railway tracks and through the junkyard, they face real danger \u2014 a train nearly kills two of them, and a junkyard owner's dog and gun threaten them \u2014 showing how unprotected they truly are.",midpoint:"Around the campfire, Gordie opens up about his brother's death and his father's favoritism, shifting the trip from adventure-seeking to genuine self-examination.","pinch-2":"Older, armed teenage rival Ace Merrill and his gang arrive to claim the body for themselves, stripping the boys of any easy triumph.","plot-turn-2":"Gordie faces Ace down with a stolen pistol, finding a courage and resolve he didn't know he had, and the older boys back down.",resolution:"The boys let the authorities anonymously find the body, and Gordie returns home changed, later becoming a writer who understands that this friendship, and that summer, shaped who he became."}},{id:"maturation-portrait-artist-3",title:"A Portrait of the Artist as a Young Man",creator:"James Joyce, 1916",appliesToType:"plotType",appliesToId:"tobias-maturation",bestStructureId:"seven-point",beats:{setup:"Young Stephen Dedalus grows up in a devoutly Catholic, politically fractured Irish family, until unjust punishment at boarding school cracks his unquestioning trust in authority.",rise:"Guilt over adolescent sin and a terrifying hellfire sermon plunge him into religious terror, then brief fervent piety, before the cloistered vision of priesthood begins to feel like an oppressive trap.",climax:"An epiphany on a beach, watching a wading girl, reveals to him his true vocation as an artist, giving him the missing piece to resolve his inner conflict.",fall:'Stephen leaves Ireland and its religious and national claims behind, resolving to "forge in the smithy of my soul the uncreated conscience of my race."'},sections:{hook:"Young Stephen Dedalus grows up in a devoutly Catholic, politically fractured Irish family, absorbing sensations and rules he doesn't yet understand.","plot-turn-1":"Sent to Clongowes Wood boarding school, he is unjustly punished, an injustice that cracks his unquestioning trust in authority and sets his inner rebellion in motion.","pinch-1":"Guilt over adolescent sexual sin and a terrifying hellfire sermon plunge him into religious terror, showing the crushing power the Church holds over his conscience.",midpoint:"Overwhelmed by guilt, Stephen confesses and briefly commits to fervent piety, even considering the priesthood, moving him from passive drifting toward active moral choice.","pinch-2":"Confronted with the reality of a cloistered religious life, he feels its narrowness close in on him, an oppressive vision of self-denial he cannot accept.","plot-turn-2":"An epiphany on a beach, watching a wading girl, reveals to him his true vocation as an artist, giving him the missing piece to resolve his conflict.",resolution:'Stephen leaves Ireland and its religious and national claims behind, resolving to "forge in the smithy of my soul the uncreated conscience of my race."'}},{id:"love-when-harry-met-sally-2",title:"When Harry Met Sally...",creator:"dir. Rob Reiner, 1989",appliesToType:"plotType",appliesToId:"tobias-love",bestStructureId:"eight-sequence",beats:{setup:"Harry Burns and Sally Albright share a prickly car ride from Chicago to New York, disagreeing over whether men and women can ever just be friends, then years later reconnect as friends in New York.",rise:"Their friendship deepens through years of phone calls and dinners while both date other people, until a single night together after Harry's divorce turns into sex, shattering their safe boundary.",climax:"The encounter creates estrangement, and each realizes through their friends Marie and Jess how much the other actually means to them.",fall:"Harry races to a New Year's Eve party to tell Sally he loves her, listing every particular thing about her, and they finally commit to each other for good."},sections:{"status-quo":"Harry Burns and Sally Albright share a prickly car ride from Chicago to New York, disagreeing over whether men and women can ever just be friends.",predicament:"Years later, both single again in New York, they reconnect and form an unlikely friendship, locking them into each other's lives despite their mutual wariness.","obstacle-1":"Their friendship deepens through years of phone calls and dinners, but Harry's cynicism about love and Sally's guardedness keep either from admitting attraction.","stakes-1":"Both date other people \u2014 Sally with Joe, Harry eventually remarrying then divorcing \u2014 and lean on each other through heartbreaks, deepening intimacy while denying romance.",midpoint:`A single night together after Harry's divorce turns into sex, shattering the safe boundary of "just friends" and throwing their relationship into crisis.`,"stakes-2":"The encounter creates awkwardness and then estrangement; Harry pursues briefly then panics, and the friendship they built seems to be collapsing entirely.",culmination:"Separated and miserable, each realizes through their friends Marie and Jess how much the other actually means to them.",climax:"Harry races to a New Year's Eve party to tell Sally he loves her, listing every particular thing about her, and they finally commit to each other for good."}},{id:"love-jane-eyre-3",title:"Jane Eyre",creator:"Charlotte Bront\xEB, 1847",appliesToType:"plotType",appliesToId:"tobias-love",bestStructureId:"eight-sequence",beats:{setup:"Orphaned Jane Eyre survives an abusive childhood before taking a position as governess at Thornfield Hall, where she is drawn into a fraught intimacy with her employer, Mr. Rochester.",rise:"Strange incidents hint at a secret Rochester is hiding, and after nearly losing her to a rival he proposes marriage, seemingly resolving their tension until a hidden falsehood is revealed at the altar.",climax:"It's revealed Rochester is already married to his insane wife, locked away in the attic, shattering Jane's trust and forcing her to flee Thornfield alone and penniless before a mysterious call draws her back.",fall:"She returns to find Thornfield burned and Rochester blinded and maimed rescuing his first wife; freed of the earlier deception, they marry as equals at last."},sections:{"status-quo":"Orphaned Jane Eyre survives an abusive childhood and harsh schooling before taking a position as governess at Thornfield Hall.",predicament:"She is drawn into a fraught, unequal intimacy with her employer, the brooding Mr. Rochester, that neither can easily walk away from given her dependent position.","obstacle-1":"Strange incidents at Thornfield \u2014 a fire, a mysterious attack \u2014 hint at a secret Rochester is hiding, even as their mutual attraction grows undeniable.","stakes-1":"Rochester nearly drives Jane away by courting the wealthy Blanche Ingram to test her feelings, forcing Jane to confront how much she has come to love him.",midpoint:"Rochester proposes marriage and Jane accepts, seemingly resolving the story's central tension \u2014 but the happiness is built on a hidden falsehood.","stakes-2":"At the altar, it's revealed Rochester is already married to his insane wife Bertha, locked away in the attic, shattering Jane's trust and forcing her to flee Thornfield alone and penniless.",culmination:"Jane endures near-starvation and finds refuge with the Rivers family, resisting a loveless marriage proposal from St. John Rivers while a mysterious call from Rochester draws her back.",climax:"She returns to find Thornfield burned and Rochester blinded and maimed rescuing Bertha; freed of the earlier deception, they marry as equals at last."}},{id:"forbidden-love-anna-karenina-2",title:"Anna Karenina",creator:"Leo Tolstoy, 1877",appliesToType:"plotType",appliesToId:"tobias-forbidden-love",bestStructureId:"freytag",beats:{setup:"Anna Karenina is a respected wife and mother in St. Petersburg high society, married to the cold, dutiful official Karenin.",rise:"She falls passionately for the dashing Count Vronsky, and their affair becomes an open scandal; she leaves her husband and son to live with him, trading her social standing for her forbidden love.",climax:"Ostracized by society, increasingly jealous and isolated, Anna watches her relationship with Vronsky curdle under the pressure of her disgrace and his fading patience.",fall:"In despair, believing herself abandoned and unforgivable, Anna throws herself under a train, and the novel closes on Vronsky's grief and the ongoing life of the society that condemned her."},sections:{exposition:"Anna Karenina is a respected wife and mother in St. Petersburg high society, married to the cold, dutiful official Karenin.","rising-action":"She falls passionately for the dashing Count Vronsky, and their affair, though initially concealed, gradually becomes an open scandal that society cannot forgive.",climax:"Anna leaves her husband and son to live openly with Vronsky, a defiant choice that trades her social standing and her child for her forbidden love.","falling-action":"Ostracized by society, increasingly jealous and isolated, Anna watches her relationship with Vronsky curdle under the pressure of her disgrace and his fading patience.",denouement:"In despair, believing herself abandoned and unforgivable, Anna throws herself under a train, and the novel closes on Vronsky's grief and the ongoing life of the society that condemned her."}},{id:"forbidden-love-brokeback-mountain-3",title:"Brokeback Mountain",creator:"dir. Ang Lee, 2005",appliesToType:"plotType",appliesToId:"tobias-forbidden-love",bestStructureId:"freytag",beats:{setup:"Ranch hands Ennis Del Mar and Jack Twist take a summer job herding sheep on Brokeback Mountain in 1963 Wyoming, where an unexpected intimacy develops between them.",rise:"Both know the relationship is dangerous and unspeakable, and they part into separate marriages, only to reunite for periodic secret trips that strain and eventually destroy both marriages.",climax:"Ennis's fear of the violence he witnessed against gay men as a child keeps him from ever fully committing to Jack, and their meetings grow increasingly fraught with longing and frustration.",fall:"Jack is killed in an incident Ennis suspects was a hate crime; alone, Ennis keeps Jack's shirt in his closet, a quiet, permanent monument to a love he could never openly claim."},sections:{exposition:"Ranch hands Ennis Del Mar and Jack Twist take a summer job herding sheep on Brokeback Mountain in 1963 Wyoming.","rising-action":"An unexpected intimacy develops between them, one both know is dangerous and unspeakable in their world, and they part at summer's end into separate marriages.",climax:'Years later they reunite for periodic "fishing trips" that let them continue the relationship in secret, even as it strains and eventually destroys both their marriages.',"falling-action":"Ennis's fear of the violence he witnessed against gay men as a child keeps him from ever fully committing to Jack, and their meetings grow increasingly fraught with longing and frustration.",denouement:"Jack is killed in an incident Ennis suspects was a hate crime; alone, Ennis keeps Jack's shirt in his closet, a quiet, permanent monument to a love he could never openly claim."}},{id:"sacrifice-casablanca-2",title:"Casablanca",creator:"dir. Michael Curtiz, 1942",appliesToType:"plotType",appliesToId:"tobias-sacrifice",bestStructureId:"weiland",beats:{setup:'Rick Blaine runs a cafe in Vichy-controlled Casablanca, a cynical American who insists he "sticks his neck out for nobody," until Ilsa Lund, the woman who broke his heart in Paris, walks in with her husband, resistance leader Victor Laszlo.',rise:"Rick learns he possesses letters of transit that could save them, and as Nazi Major Strasser tightens the net around Laszlo, Ilsa reveals why she abandoned Rick in Paris \u2014 she believed Laszlo was already dead.",climax:"Appearing to plan on keeping the letters for himself and Ilsa, Rick instead gives them to Laszlo at the airport, shoots Strasser to let the couple escape, and sends away the only woman he has ever loved.",fall:"Watching their plane disappear into the fog, Rick walks off with police captain Renault to join the Free French resistance, his sacrifice completing his transformation from cynic to hero."},sections:{hook:'Rick Blaine runs a cafe in Vichy-controlled Casablanca, a cynical American expatriate who insists he "sticks his neck out for nobody."',inciting:"Ilsa Lund, the woman who broke his heart in Paris, walks into his cafe with her husband, Victor Laszlo, a hunted resistance leader.","plot-point-1":"Rick learns he possesses letters of transit that could get Ilsa and Laszlo to safety, forcing him to confront his buried feelings and obligations.","pinch-1":"Nazi Major Strasser's presence in the cafe, and his open determination to capture Laszlo, reminds Rick and everyone how much real danger surrounds any decision he makes.",midpoint:"Ilsa confronts Rick and reveals why she abandoned him in Paris \u2014 she was already married to Laszlo, believed dead \u2014 reframing his understanding of their past.","pinch-2":"Strasser tightens the net around Laszlo, making clear that time and options are running out for everyone trapped in Casablanca.","plot-point-3":"Rick appears to agree to sell the letters for himself and Ilsa, seemingly choosing his own happiness, before revealing at the airport that he has decided otherwise.",climax:"Rick gives the letters of transit to Laszlo and Ilsa, shoots Strasser to let them escape, and sends away the only woman he has ever loved for the sake of the larger cause.",resolution:"Watching their plane disappear into the fog, Rick walks off with police captain Renault to join the Free French resistance, his sacrifice completing his transformation from cynic to hero."}},{id:"sacrifice-gran-torino-3",title:"Gran Torino",creator:"dir. Clint Eastwood, 2008",appliesToType:"plotType",appliesToId:"tobias-sacrifice",bestStructureId:"weiland",beats:{setup:"Walt Kowalski, a bitter, racist Korean War veteran, isolates himself after his wife's death until he catches his young Hmong neighbor Thao attempting to steal his prized Gran Torino as a gang initiation.",rise:"Walt reluctantly takes Thao under his wing, teaching him work and self-respect, and begins actively defending the family after the local gang retaliates for Thao's failed theft.",climax:"The gang escalates brutally, shooting up the family's house and assaulting Thao's sister Sue, showing Walt that his interventions have only endangered the people he cares about.",fall:"Realizing further violence would only trap Thao in a cycle of retaliation and prison, Walt goes alone and unarmed to confront the gang publicly, provoking them into shooting him dead in front of witnesses, sacrificing his life to get them arrested and free the family."},sections:{hook:"Walt Kowalski, a bitter, racist Korean War veteran, isolates himself in his changing Michigan neighborhood after his wife's death.",inciting:"Walt catches his young Hmong neighbor Thao attempting to steal his prized Gran Torino as a gang initiation, drawing him unwillingly into the family's life.","plot-point-1":"After protecting Thao's sister Sue and getting to know the family, Walt reluctantly takes Thao under his wing, teaching him work and self-respect.","pinch-1":"The local gang retaliates against Thao's family for his failed theft, a reminder of the violent world Walt is now entangled in.",midpoint:"Walt begins actively defending the family and confronting the gang directly, moving from bystander to protector.","pinch-2":"The gang escalates brutally \u2014 shooting up the family's house and beating and raping Sue \u2014 showing Walt that his interventions have only endangered the people he cares about.","plot-point-3":"Walt realizes that further violence from him would only trap Thao in a cycle of retaliation and prison, forcing him toward a different, harder solution.",climax:"Walt goes alone and unarmed to confront the gang publicly, provoking them into shooting him dead in front of witnesses, sacrificing his life to get them arrested and free Thao's family from their threat.",resolution:"Thao inherits the Gran Torino and drives it along the lakeshore, carrying forward the decency and freedom Walt's death purchased for him."}},{id:"discovery-fight-club-2",title:"Fight Club",creator:"dir. David Fincher, 1999",appliesToType:"plotType",appliesToId:"tobias-discovery",bestStructureId:"kishotenketsu",beats:{setup:"An unnamed, insomniac narrator lives a numb, consumerist office life until he meets the charismatic, anarchic Tyler Durden.",rise:`Together they found an underground fight club that grows into "Project Mayhem," a sprawling anti-consumerist movement, deepening the narrator's involvement in Tyler's world.`,climax:"The narrator discovers that Tyler Durden does not exist as a separate person \u2014 Tyler is a dissociated part of his own mind, and he has been the one committing all of Tyler's acts.",fall:"Racing to stop Project Mayhem's culminating bombing campaign, the narrator confronts and symbolically kills his Tyler persona, choosing to face his fractured identity honestly alongside Marla as the buildings fall."},sections:{ki:"An unnamed, insomniac narrator lives a numb, consumerist office life, finding brief relief only in support groups for illnesses he doesn't have.",sho:'He meets the charismatic, anarchic Tyler Durden, and together they found an underground fight club that grows into "Project Mayhem," a sprawling anti-consumerist movement.',ten:"The narrator discovers that Tyler Durden does not exist as a separate person \u2014 Tyler is a dissociated part of his own mind, and he has been the one committing all of Tyler's acts.",ketsu:"Racing to stop Project Mayhem's culminating bombing campaign, the narrator confronts and symbolically kills his Tyler persona, choosing to face his fractured identity honestly alongside Marla as the buildings fall."}},{id:"discovery-sixth-sense-3",title:"The Sixth Sense",creator:"dir. M. Night Shyamalan, 1999",appliesToType:"plotType",appliesToId:"tobias-discovery",bestStructureId:"kishotenketsu",beats:{setup:"Child psychologist Malcolm Crowe takes on a troubled young patient, Cole Sear, hoping to redeem an earlier failure with a different patient.",rise:"Cole reveals his terrifying secret to Malcolm \u2014 he sees dead people who don't know they're dead \u2014 and Malcolm helps him learn to communicate with and help these spirits.",climax:"Malcolm realizes, alongside the audience, that he himself has been dead since being shot by his former patient at the film's start, and has been a ghost throughout the entire story.",fall:"Understanding this, Malcolm is finally able to let go of his unfinished business, say goodbye to his unaware wife, and move on, while Cole is left able to live more openly with his gift."},sections:{ki:"Child psychologist Malcolm Crowe takes on a troubled young patient, Cole Sear, hoping to redeem an earlier failure with a different patient.",sho:"Cole reveals his terrifying secret to Malcolm \u2014 he sees dead people who don't know they're dead \u2014 and Malcolm helps him learn to communicate with and help these spirits.",ten:"Malcolm realizes, alongside the audience, that he himself has been dead since being shot by his former patient at the film's start, and has been a ghost throughout the entire story.",ketsu:"Understanding this, Malcolm is finally able to let go of his unfinished business, say goodbye to his unaware wife, and move on, while Cole is left able to live more openly with his gift."}},{id:"wretched-excess-scarface-2",title:"Scarface",creator:"dir. Brian De Palma, 1983",appliesToType:"plotType",appliesToId:"tobias-wretched-excess",bestStructureId:"freytag",beats:{setup:"Tony Montana arrives in Miami as a poor Cuban refugee with nothing but ambition and a willingness to do whatever it takes to rise.",rise:"Through ruthless violence he climbs the cocaine trade, amassing wealth, a mansion, a wife, and ever-greater excess in drugs, guns, and paranoia.",climax:"At the height of his power, buried in cocaine and increasingly unstable, Tony alienates his few remaining allies and family, including killing his best friend Manny over his sister.",fall:'A massive cartel hit squad storms his estate, and Tony, high and defiant to the last, is gunned down and falls into his own fountain beneath the sign "The World Is Yours."'},sections:{exposition:"Tony Montana arrives in Miami as a poor Cuban refugee with nothing but ambition and a willingness to do whatever it takes to rise.","rising-action":"Through ruthless violence he climbs the cocaine trade, amassing wealth, a mansion, a wife, and ever-greater excess in drugs, guns, and paranoia.",climax:"At the height of his power, buried in cocaine and increasingly unstable, Tony alienates his few remaining allies and family, including killing his best friend Manny over his sister.","falling-action":"Isolated, paranoid, and consumed by his own excess, Tony holes up in his mansion as his enemies and the DEA close in.",denouement:'A massive cartel hit squad storms his estate, and Tony, high and defiant to the last, is gunned down and falls into his own fountain beneath the sign "The World Is Yours."'}},{id:"wretched-excess-wolf-of-wall-street-3",title:"The Wolf of Wall Street",creator:"dir. Martin Scorsese, 2013",appliesToType:"plotType",appliesToId:"tobias-wretched-excess",bestStructureId:"freytag",beats:{setup:"Jordan Belfort starts as an eager young stockbroker on Wall Street before the 1987 crash costs him his first job.",rise:'He builds his own firm, Stratton Oakmont, using aggressive "pump and dump" tactics to make himself and his employees fantastically, illegally rich.',climax:"Belfort's life becomes a nonstop orgy of drugs, sex, and spending \u2014 yachts, mansions, a helicopter he crashes while high \u2014 even as the FBI closes in on his fraud.",fall:"Belfort is convicted and serves reduced prison time by informing on colleagues, emerging afterward to reinvent himself as a motivational speaker selling the very charisma that built his excess."},sections:{exposition:"Jordan Belfort starts as an eager young stockbroker on Wall Street before the 1987 crash costs him his first job.","rising-action":'He builds his own firm, Stratton Oakmont, using aggressive "pump and dump" tactics to make himself and his employees fantastically, illegally rich.',climax:"Belfort's life becomes a nonstop orgy of drugs, sex, and spending \u2014 yachts, mansions, a helicopter he crashes while high \u2014 even as the FBI closes in on his fraud.","falling-action":"His marriage collapses, his drug use nearly kills him and his daughter in a car accident, and mounting federal pressure forces him to wear a wire against his own partner.",denouement:"Belfort is convicted and serves reduced prison time by informing on colleagues, emerging afterward to reinvent himself as a motivational speaker selling the very charisma that built his excess."}},{id:"ascension-rocky-2",title:"Rocky",creator:"dir. John G. Avildsen, 1976",appliesToType:"plotType",appliesToId:"tobias-ascension",bestStructureId:"pixar-spine",beats:{setup:"Rocky Balboa is a small-time Philadelphia boxer scraping by as a debt collector, his once-promising talent going nowhere, until heavyweight champion Apollo Creed offers an unknown local fighter a title shot.",rise:"Stunned by the opportunity, Rocky commits to serious training under his gruff manager Mickey, and as his body and confidence sharpen, so does his relationship with Adrian.",climax:"In the ring against Creed, battered but unbroken, Rocky goes the distance for all fifteen rounds, something no one believed possible.",fall:"Though he loses the decision, Rocky has proven his worth to himself and the world, calling out for Adrian amid the chaos, forever changed from the nobody he was."},sections:{"once-upon":"Rocky Balboa is a small-time Philadelphia boxer scraping by as a debt collector, his once-promising talent going nowhere.","every-day":"He trains half-heartedly in a run-down gym, romances the shy pet-shop clerk Adrian, and accepts that his boxing dreams have likely passed him by.","until-one-day":"Heavyweight champion Apollo Creed, seeking a publicity stunt, offers an unknown local fighter a title shot, and Rocky is chosen.","because-1":"Stunned by the opportunity, Rocky commits to serious training under his gruff manager Mickey, running the streets of Philadelphia and rebuilding his discipline.","because-2":"As his body and confidence sharpen, so does his relationship with Adrian, giving him something beyond the fight to prove himself for.","until-finally":"In the ring against Creed, battered but unbroken, Rocky goes the distance for all fifteen rounds, something no one believed possible.","ever-since":"Though he loses the decision, Rocky has proven his worth to himself and the world, calling out for Adrian amid the chaos, forever changed from the nobody he was."}},{id:"ascension-slumdog-millionaire-3",title:"Slumdog Millionaire",creator:"dir. Danny Boyle, 2008",appliesToType:"plotType",appliesToId:"tobias-ascension",bestStructureId:"pixar-spine",beats:{setup:`Jamal Malik is a poor orphan from the Mumbai slums, shaped by loss, his brother Salim, and his enduring love for a girl named Latika, until he appears on India's "Who Wants to Be a Millionaire?" and improbably starts answering every question correctly.`,rise:"Suspected of cheating and tortured by police, he explains through flashback how each brutal or tender moment of his slum childhood taught him the answer to each question, while his search for Latika deepens.",climax:"Cleared of suspicion, Jamal returns to the show and answers the final question correctly, winning the full twenty million rupees.",fall:"Reunited at last with Latika at a train station, Jamal's rise from slum orphan to millionaire is completed by the love he never stopped pursuing."},sections:{"once-upon":"Jamal Malik is a poor orphan from the Mumbai slums, shaped by loss, his brother Salim, and his enduring love for a girl named Latika.","every-day":"He survives by scraping together whatever work and schemes he can, while Salim grows increasingly ruthless and Latika drifts in and out of his life.","until-one-day":`As a young man, Jamal appears on India's "Who Wants to Be a Millionaire?" and improbably begins answering every question correctly.`,"because-1":"Suspected of cheating, he is arrested and tortured by police, and explains through flashback how each brutal or tender moment of his slum childhood happened to teach him the answer to each question.","because-2":"Interwoven with the game, his search for Latika through Mumbai's underworld deepens, entangling him further with his brother's criminal path.","until-finally":"Cleared of suspicion, Jamal returns to the show and answers the final question correctly, winning the full twenty million rupees.","ever-since":"Reunited at last with Latika at a train station, Jamal's rise from slum orphan to millionaire is completed by the love he never stopped pursuing."}},{id:"descension-macbeth-2",title:"Macbeth",creator:"William Shakespeare, c. 1606",appliesToType:"plotType",appliesToId:"tobias-descension",bestStructureId:"fichtean",beats:{setup:"Fresh from battlefield triumph, Macbeth is confronted immediately by three witches' prophecy that he will become king, planting ambition in an already unstable mind.",rise:"Spurred by his wife, Macbeth murders King Duncan to seize the throne, then orders the murder of his friend Banquo and Macduff's entire family to secure his position.",climax:`Haunted by guilt and hallucination, with Lady Macbeth dead by suicide, Macbeth is killed in single combat by Macduff, who fulfills the witches' riddle by having been "from his mother's womb untimely ripped."`,fall:"Malcolm, Duncan's rightful heir, is restored to the throne, and order returns to Scotland with the tyrant's brief, bloody reign ended."},sections:{"crisis-1":"Fresh from battlefield triumph, Macbeth is confronted immediately by three witches' prophecy that he will become king, planting ambition in an already unstable mind.","crisis-2":"Spurred by his wife, Macbeth murders King Duncan in his own castle to seize the throne, a crime he can never take back.","crisis-3":"To secure his position, Macbeth orders the murder of his friend Banquo and the slaughter of Macduff's entire family, escalating from single crime to compulsive tyranny.","crisis-4":"Haunted by guilt and hallucination, and with Lady Macbeth descending into madness and suicide, Macbeth becomes increasingly isolated and unstable as his enemies gather against him.",climax:`Macduff, revealed to have been "from his mother's womb untimely ripped" and thus able to fulfill the witches' riddle, kills Macbeth in single combat.`,resolution:"Malcolm, Duncan's rightful heir, is restored to the throne, and order returns to Scotland with the tyrant's brief, bloody reign ended."}},{id:"descension-requiem-for-a-dream-3",title:"Requiem for a Dream",creator:"dir. Darren Aronofsky, 2000",appliesToType:"plotType",appliesToId:"tobias-descension",bestStructureId:"fichtean",beats:{setup:"Lonely widow Sara Goldfarb becomes fixated on appearing on a TV game show and starts taking diet pills, while her son Harry and his friends are already dealing drugs to fund their own habits.",rise:"Harry, his girlfriend Marion, and his friend Tyrone escalate their drug use and dealing chasing quick money, while Sara's amphetamine use intensifies into paranoid hallucinations and a heroin drought sends the trio into desperate searches for a fix.",climax:"In a rapid-fire montage, Harry has his gangrenous arm amputated, Tyrone endures brutal forced labor in jail, Marion completes a degrading sex act for drugs, and Sara is subjected to electroshock therapy.",fall:"Each survivor is left devastated and alone \u2014 Sara catatonic in a hospital bed, Harry maimed, Marion hollowed out, Tyrone imprisoned \u2014 the dream that drove them all reduced to ruin."},sections:{"crisis-1":"Sara Goldfarb, a lonely widow, becomes fixated on appearing on a TV game show and starts taking diet pills to fit into an old red dress; her son Harry and his friends are already dealing drugs to fund their own habits.","crisis-2":"Harry, his girlfriend Marion, and his friend Tyrone escalate their drug use and dealing as a path to quick money and a better life, while Sara's amphetamine use intensifies into paranoid hallucinations.","crisis-3":"A citywide drought of heroin sends the trio into desperate, dangerous searches for a fix, while Sara's addiction spirals into full psychosis, and she is involuntarily committed.","crisis-4":"Harry's infected arm from injecting worsens dangerously, Tyrone is arrested and abused in prison, and Marion sinks into humiliating sex work to pay for drugs \u2014 each character isolated in their own crisis.",climax:"In a rapid-fire montage, Harry has his gangrenous arm amputated, Tyrone endures brutal forced labor in jail, Marion completes a degrading sex act for drugs, and Sara is subjected to electroshock therapy.",resolution:"Each survivor is left devastated and alone \u2014 Sara catatonic in a hospital bed, Harry maimed, Marion hollowed out, Tyrone imprisoned \u2014 the dream that drove them all reduced to ruin."}},{id:"christmas-carol-vonnegut-man-in-hole",title:"A Christmas Carol",creator:"Charles Dickens, 1843",appliesToType:"plotType",appliesToId:"vonnegut-man-in-hole",bestStructureId:"todorov",beats:{setup:'Ebenezer Scrooge lives a cold, miserly life in London, hoarding wealth, dismissing charity, and treating Christmas as "humbug" \u2014 a stable but joyless existence.',rise:"The ghost of his dead partner Jacob Marley warns him that three spirits will visit, and the Ghosts of Christmas Past, Present, and Yet to Come force Scrooge to see what his greed has cost and where it leads.",climax:"Shown his own neglected grave and the indifference his death would bring, Scrooge begs the spirits for a chance to change and wakes on Christmas morning transformed.",fall:"Scrooge showers the Cratchit family with gifts, raises Bob Cratchit's wages, and becomes as good a friend, master, and man as the old city ever knew."},sections:{equilibrium:'Ebenezer Scrooge lives a cold, miserly life in London, hoarding wealth, dismissing charity collectors, and treating Christmas as "humbug" \u2014 a stable but joyless existence.',disruption:"The ghost of his dead business partner, Jacob Marley, appears in chains to warn Scrooge that three spirits will visit him that night to spare him from Marley's own fate.",recognition:"Guided by the Ghosts of Christmas Past, Present, and Yet to Come, Scrooge realizes his greed has cost him love and friendship and will lead to a lonely, unmourned death.",repair:"Horrified by the vision of his own neglected grave and the Cratchits mourning Tiny Tim, Scrooge begs the spirits for a chance to change, waking on Christmas morning determined to become generous and kind.","new-equilibrium":"Scrooge showers gifts on the Cratchit family, raises Bob Cratchit's wages, and becomes as good a friend, master, and man as the old city ever knew, keeping Christmas well for the rest of his life."}},{id:"finding-nemo-vonnegut-man-in-hole",title:"Finding Nemo",creator:"dir. Andrew Stanton, 2003",appliesToType:"plotType",appliesToId:"vonnegut-man-in-hole",bestStructureId:"todorov",beats:{setup:"Clownfish Marlin lives an anxious, overprotective life raising his only son Nemo alone on the reef, having lost his wife and hundreds of eggs to a barracuda years before.",rise:"Nemo defies his father's warnings and is captured by a diver, and Marlin must overcome his fear of the open ocean to search for him, teaming up with the forgetful but big-hearted Dory.",climax:"Marlin and Dory brave jellyfish swarms and sharks while Nemo organizes an escape from the dentist's fish tank, each growing braver through the ordeal until father and son are reunited.",fall:"Marlin returns home having let go of his paralyzing fear, now trusting his son with the independence he once denied him."},sections:{equilibrium:"Clownfish Marlin lives an anxious, overprotective life raising his only son Nemo alone on the reef, having lost his wife and hundreds of eggs to a barracuda years before.",disruption:"Nemo, defying his father's warnings, swims out to open water to prove himself and is captured by a diver, taken away to a dentist's office fish tank in Sydney.",recognition:"Marlin realizes he must overcome his crippling fear of the ocean and search it himself to find his son, teaming up with the forgetful but big-hearted Dory.",repair:"Marlin and Dory brave jellyfish swarms, sharks, and the vast open sea, while Nemo organizes an escape plan with the tank's other fish, and father and son each grow braver through the ordeal.","new-equilibrium":"Marlin and Nemo are reunited, and Marlin returns home having let go of his paralyzing fear, now trusting his son with the independence he once denied him."}},{id:"pride-and-prejudice-vonnegut-boy-meets-girl",title:"Pride and Prejudice",creator:"Jane Austen, 1813",appliesToType:"plotType",appliesToId:"vonnegut-boy-meets-girl",bestStructureId:"story-circle",beats:{setup:"Elizabeth Bennet lives contentedly within her family's lively household at Longbourn, wanting a husband she can respect even as her family needs its daughters to marry well.",rise:"The wealthy Mr. Bingley and proud Mr. Darcy arrive nearby, and Elizabeth adapts to a new world of grand balls and class friction, wrestling with wounded pride and Wickham's slanders before finally recognizing her own prejudice was wrong.",climax:"Elizabeth's sister Lydia elopes scandalously with Wickham, threatening to ruin the family's reputation, until Darcy secretly intervenes and Elizabeth returns home chastened and changed.",fall:"Having overcome her pride and prejudice alike, Elizabeth accepts Darcy's second proposal, winning for good the wonderful thing nearly lost to misunderstanding."},sections:{you:"Elizabeth Bennet lives contentedly within her family's modest but lively household at Longbourn, quick-witted and comfortable in her social circle despite pressure to marry well.",need:"With five unmarried daughters and an entailed estate, the Bennet family needs its daughters to marry, and Elizabeth wants a husband she can genuinely respect, not merely one who is convenient.",go:"The wealthy Mr. Bingley and his proud friend Mr. Darcy arrive in the neighborhood, drawing Elizabeth into a new world of grand balls, class friction, and unfamiliar high society.",search:"Elizabeth navigates misunderstandings, wounded pride, and Mr. Wickham's slanders against Darcy, adapting her judgments as she encounters this unfamiliar social terrain.",find:"After receiving Darcy's revealing letter and visiting his grand estate of Pemberley, Elizabeth finally sees his true, generous character and recognizes her own prejudice was wrong.",take:"The heavy price comes when Elizabeth's flighty sister Lydia elopes scandalously with Wickham, threatening to ruin the entire family's reputation and any hope of good marriages.",return:"Darcy secretly intervenes to resolve the Lydia scandal, and Elizabeth returns to her ordinary family life at Longbourn, chastened and changed by all she has learned.",change:"Having overcome her pride and prejudice alike, Elizabeth accepts Darcy's second proposal, and the wonderful thing nearly lost to misunderstanding is won for good in marriage."}},{id:"notting-hill-vonnegut-boy-meets-girl",title:"Notting Hill",creator:"dir. Roger Michell, 1999",appliesToType:"plotType",appliesToId:"vonnegut-boy-meets-girl",bestStructureId:"story-circle",beats:{setup:"William Thacker runs a quiet travel bookshop in Notting Hill, wanting more connection than his humdrum routine, when world-famous actress Anna Scott wanders in and an unlikely friendship begins.",rise:"William adapts to the surreal disruptions of dating a global celebrity \u2014 tabloids, a disastrous paparazzi dinner, and Anna's fame intruding on ordinary life \u2014 and the two find real connection beneath their mismatched worlds.",climax:"A leaked scandal and Anna's fear drive her to ask William to pretend they're not involved, and he returns to his ordinary bookshop life believing he has lost her for good.",fall:"Anna unexpectedly returns to Notting Hill, and William accepts her declaration of love, winning for good the wonderful thing that was nearly lost."},sections:{you:"William Thacker runs a quiet, unglamorous travel bookshop in Notting Hill, comfortable in his small routine of ordinary friends and a failed marriage behind him.",need:"William wants connection and a life bigger than his humdrum routine, though he would never admit to wanting something as improbable as romance with a film star.",go:"World-famous actress Anna Scott wanders into his bookshop, and an accidental spill of orange juice leads to an unlikely, unfamiliar friendship crossing wildly different worlds.",search:"William adapts to the surreal disruptions of dating a global celebrity \u2014 tabloid scandals, a disastrous dinner with paparazzi, and Anna's fame constantly intruding on ordinary life.",find:"Despite the chaos, William and Anna fall genuinely in love, finding real connection beneath the mismatched worlds of fame and anonymity.",take:"The price is steep: a leaked scandal, Anna's own fear and self-protection, and William's wounded pride after she asks him to pretend they're not involved, driving them apart.",return:"William returns to his ordinary bookshop life, believing he has lost her for good, until Anna unexpectedly returns to Notting Hill to find him.",change:"Having learned to risk vulnerability despite the odds, William accepts Anna's declaration of love, and the two build a life together \u2014 the wonderful thing nearly lost is won for good."}},{id:"puss-in-boots-vonnegut-cinderella",title:"Puss in Boots",creator:"Charles Perrault, 1697",appliesToType:"plotType",appliesToId:"vonnegut-cinderella",bestStructureId:"propp-31",beats:{setup:"A miller's youngest son inherits only a cat, seemingly the worst of three inheritances, but the cat asks for boots and a sack and promises to make his master's fortune.",rise:'Puss tricks the King with gifts in the name of the invented "Marquis of Carabas," stages a fake robbery to dress his master in royal clothes, and races ahead to claim the surrounding land by intimidating the peasants.',climax:"Puss confronts the ogre who truly owns the castle and land, tricks him into transforming into a mouse, and devours him, seizing the estate for his master in a single decisive stroke.",fall:`The King arrives to find his "Marquis" master of a real castle and true lands, marries him to the princess, and the once-penniless miller's son lives on as a great lord.`},sections:{absentation:"A miller dies, leaving his youngest son nothing but a cat as an inheritance, and the son leaves the family mill with only that cat to his name.",interdiction:"Puss warns his despairing new master not to give up hope, and to trust him completely no matter how strange his requests seem.",violation:"Skeptical, the son nearly refuses to buy Puss the boots and sack he asks for, but relents and lets the cat proceed against his own better judgment.",reconnaissance:"Puss scouts the countryside and learns the King's fondness for game birds and his habit of riding along the river with his daughter.",delivery:"Through careful watching, Puss learns exactly when and where the royal carriage will pass, information he will use to stage his plan.",trickery:"Puss catches rabbits and partridges in his sack using bran as bait, then presents them to the King as gifts from his invented master, the Marquis of Carabas.",complicity:"Flattered by the mysterious Marquis's generosity, the King unknowingly accepts gift after gift, drawn into Puss's scheme.","villainy-lack":"The truth beneath it all is a genuine lack: the miller's son has no land, title, or fortune of his own, only a cat's wild invention standing between him and exposure.",mediation:"Learning the King will ride the riverside road with his daughter, Puss resolves to introduce his master to them in person.",counteraction:"The miller's son agrees to follow Puss's plan, however implausible, and bathe in the river exactly where instructed.",departure:"He leaves the mill for the riverbank and undresses to swim, just as the royal carriage approaches in the distance.","donor-first":`Puss hides his master's clothes among the rocks and then cries out urgently to the passing King that thieves have robbed the bathing "Marquis of Carabas."`,"hero-reaction":"The miller's son plays his part convincingly, appearing genuinely distressed at the supposed theft of his fine clothes.","magical-agent":"Taken in by the ruse, the King has fine garments from the royal wardrobe brought for the young man, transforming his appearance instantly into that of a nobleman.",guidance:"Puss races ahead of the royal carriage, ordering the peasants working the fields to tell the King that all this land belongs to the Marquis of Carabas.",struggle:"Puss enters the castle of the land's true owner, a powerful ogre, and challenges his famed shape-shifting powers to a contest.",branding:"Goaded into showing off, the ogre transforms into a lion and then, fatally, into a mouse \u2014 the vain display that marks his undoing.",victory:"Puss pounces on the ogre in his mouse form and devours him, seizing the castle and its lands for his master by a single stroke of cunning.",liquidation:"With the ogre destroyed, the estate now belongs to no one in particular, clearing the way for the disguised miller's son to claim it outright.",return:`The King's carriage arrives at the castle gates just as Puss finishes securing it, welcoming the "Marquis" home to his new domain.`,pursuit:"No one pursues the young man; instead the only danger left is that the King might somehow guess the truth of his humble origins.",rescue:"Puss's quick thinking rescues the deception at every turn, ensuring the King's suspicions never take root.",unrecognized:"Dressed in royal clothes and standing before a real castle, the miller's son goes entirely unrecognized as the penniless boy he was that same morning.",unfounded:"The young man himself sustains the tale's central unfounded claim throughout \u2014 that he is, and always has been, the Marquis of Carabas.","difficult-task":"Delighted by the apparent match, the King proposes his daughter's hand in marriage to the Marquis, an offer the young man must accept despite owning nothing when the day began.",solution:"The castle and lands he has just won by Puss's cunning give him real wealth to match the King's expectations, resolving what would otherwise be an impossible promise.","propp-recognition":"The King needs no secret mark to recognize the young man's worth \u2014 the castle, treasure, and lands before his own eyes are proof enough.",exposure:"No villain remains to expose; the ogre is already destroyed, and the miller's son's earlier poverty is quietly left forgotten now that his new fortune is entirely real.",transfiguration:"The once-penniless miller's son is transfigured for good into the true Marquis of Carabas, indistinguishable now from any lord born to the title.",punishment:"The only punishment in the tale falls on the ogre, whose vanity and cruelty are answered by his own foolish transformation into prey.",wedding:"The miller's son marries the princess and lives out his days as a great lord, while Puss, his fortune made, hunts mice only for sport from then on."}},{id:"rumpelstiltskin-vonnegut-cinderella",title:"Rumpelstiltskin",creator:"Brothers Grimm, 1812",appliesToType:"plotType",appliesToId:"vonnegut-cinderella",bestStructureId:"propp-31",beats:{setup:"A poor miller boasts to the King that his daughter can spin straw into gold, and the King locks her in a straw-filled room overnight, threatening death if she fails.",rise:"A mysterious little man appears and spins the straw into gold each night in exchange for her necklace, then her ring, and finally her promise to give him her first child once she becomes queen.",climax:`After giving birth as queen, she must guess the little man's true name within three days to keep her child, and a messenger overhears him gleefully singing "Rumpelstiltskin" by his forest fire.`,fall:"She reveals she knows his name, breaking his power over her; in a rage he destroys himself, and she keeps her crown and her child, secure at last."},sections:{absentation:"A poor miller, wanting to impress the King, leaves the truth behind and boasts that his daughter can spin straw into gold.",interdiction:"The King warns the miller's daughter that she must spin an entire room of straw into gold by morning or be put to death.",violation:"The impossible boast is exposed the moment she is shut alone in the straw-filled room with no way to fulfill it, breaking the miller's careless promise against reality.",reconnaissance:"A strange little man appears in the locked room and asks the weeping girl what she will give him if he helps her.",delivery:"Through her desperate answers he learns exactly what she has to offer \u2014 first a necklace, then a ring, and eventually nothing left but a future promise.",trickery:"He offers, night after night, to spin the straw into gold in exchange for whatever small trinket she carries.",complicity:"Desperate to survive, she agrees to each bargain in turn, not yet grasping what the final bargain will one day cost her.","villainy-lack":"On the third night, having nothing left to trade, she promises him her first child once she becomes queen, a debt she cannot yet imagine having to pay.",mediation:"A year after her marriage to the King, now a mother, she is confronted when the little man returns to collect the child he was promised.",counteraction:"Horrified, the new Queen resolves to find some way to keep her child rather than surrender him.",departure:"The little man agrees to spare the child only if she can name him correctly within three days, and she sends messengers out across the kingdom to discover it.","donor-first":"One messenger, scouting deep in the forest, comes upon a remote cottage and a strange little man dancing unseen around his fire.","hero-reaction":"The messenger watches and listens carefully, then hurries back to report exactly what he overheard.","magical-agent":"The overheard chant \u2014 the little man singing his own secret name as he dances \u2014 becomes the one weapon that can save her child.",guidance:"Armed with the name, the Queen is guided straight into her final confrontation with total confidence.",struggle:"On the third day, the little man returns to the castle, certain and gleeful that his name can never be guessed.",branding:"His own habit of shouting his name aloud while dancing alone in the woods becomes the very mark that gives him away.",victory:'When the Queen calmly asks, "Is your name, perhaps, Rumpelstiltskin?", his triumph collapses instantly and his power over her is broken.',liquidation:"The debt is void the moment his name is spoken \u2014 the threat to her child is lifted entirely.",return:"Her victory happens within the walls of her own court; there is no journey home to make, only her family made whole again.",pursuit:"Enraged at being outwitted, Rumpelstiltskin does not chase after her but turns his fury entirely on himself.",rescue:"No one needs to rescue the Queen; she has already saved her own child through her own patience and wit.",unrecognized:"So certain was he that his name was unguessable, Rumpelstiltskin never once recognized how easily his own habits would betray him.",unfounded:"In his fury he makes one last unfounded claim, insisting she could only have learned his name with the devil's own help.","difficult-task":"The entire naming ordeal was itself the difficult task laid before her: discover an impossible secret within three days or lose her child forever.",solution:"Her messenger's chance discovery in the forest delivers the solution just in time, on the very last night allowed.","propp-recognition":"Recognition arrives the instant she speaks his true name aloud and watches the shock cross his face.",exposure:"Rumpelstiltskin stands exposed not as a beggar or a king, but as a creature whose entire power depended on staying nameless.",transfiguration:"No transformation of the Queen is needed; her triumph is a change in fortune, not in appearance, and she remains exactly who she already was.",punishment:"In his rage at being named, Rumpelstiltskin stamps his foot into the ground with such force that he tears himself apart, destroyed by his own fury.",wedding:"Already queen from her first night of spinning gold, she now keeps both her crown and her child, her place in the kingdom finally secure."}},{id:"macbeth-vonnegut-bad-to-worse",title:"Macbeth",creator:"William Shakespeare, c. 1606",appliesToType:"plotType",appliesToId:"vonnegut-bad-to-worse",bestStructureId:"fichtean",beats:{setup:"Macbeth and Banquo encounter three witches on a battlefield's edge who prophesy Macbeth will be Thane of Cawdor and King, planting fatal ambition immediately.",rise:"Spurred by Lady Macbeth, Macbeth murders King Duncan to seize the throne, then arranges the murder of his friend Banquo, whose ghost haunts him at a public banquet.",climax:`Macbeth orders the slaughter of Macduff's wife and children, and Macduff \u2014 revealed to have been "from his mother's womb untimely ripped" \u2014 kills Macbeth in single combat, fulfilling the witches' prophecy.`,fall:"Malcolm is crowned King of Scotland, and Macbeth's severed head is displayed as order is restored with barely a pause for reflection on the carnage."},sections:{"crisis-1":"Already inside conflict, Macbeth and Banquo encounter three witches on the edge of the battlefield, who prophesy Macbeth will be Thane of Cawdor and King, planting a fatal ambition immediately.","crisis-2":"Spurred on by Lady Macbeth, Macbeth murders King Duncan in his own castle to seize the throne, a crisis with no going back.","crisis-3":"To secure his crown, Macbeth arranges the murder of his friend Banquo, whose ghost then haunts him at a public banquet, driving him toward paranoid isolation.","crisis-4":"Macbeth orders the slaughter of Macduff's wife and children, a crisis of pure, gratuitous violence that costs him all remaining moral standing and rallies noble opposition against him.",climax:`Macduff, revealed to have been "from his mother's womb untimely ripped" and thus able to fulfill the witches' seemingly impossible prophecy, kills Macbeth in single combat.`,resolution:"Malcolm is crowned King of Scotland; Macbeth's severed head is displayed, and order is restored with barely a pause for reflection on the carnage."}},{id:"requiem-for-a-dream-vonnegut-bad-to-worse",title:"Requiem for a Dream",creator:"dir. Darren Aronofsky, 2000",appliesToType:"plotType",appliesToId:"vonnegut-bad-to-worse",bestStructureId:"fichtean",beats:{setup:"The story opens already deep in dysfunction \u2014 Harry pawns his mother Sara's television for drug money while Sara grows obsessed with a diet-pill scheme to fit into a red dress for a TV appearance.",rise:"Harry, his girlfriend Marion, and his friend Tyrone start dealing heroin to fund their own addiction, while a citywide drought pushes them into desperate deals and Sara's diet pills spiral into insomnia and hallucinations.",climax:"In a rapid-fire montage, Harry's infected arm is amputated, Tyrone is beaten in prison, Marion sells herself at a degrading sex show for drugs, and Sara is given electroconvulsive therapy against her will.",fall:"All four end the story utterly broken and alone, curled in fetal positions, with no recovery following, only the bleak new reality their addictions have carved out."},sections:{"crisis-1":"The story opens already deep in dysfunction \u2014 Harry pawns his mother Sara's television for drug money while Sara herself grows obsessed with a diet-pill scheme to fit into a red dress for a TV appearance.","crisis-2":"Harry, his girlfriend Marion, and his friend Tyrone start dealing heroin to fund their own addiction, while Sara's amphetamine-like diet pills spiral into insomnia and hallucinations.","crisis-3":"A citywide drug drought pushes Harry and Tyrone into increasingly desperate, dangerous deals, Marion is coerced into humiliating acts to get drugs, and Sara's mental state disintegrates further.","crisis-4":"Harry's arm becomes severely infected from injecting, Tyrone is arrested, and Sara is forcibly taken to a psychiatric hospital, each character reaching a near-final low simultaneously.",climax:"In a rapid-fire montage, Harry's arm is amputated, Tyrone is beaten in prison, Marion sells herself at a degrading sex show for drugs, and Sara is given electroconvulsive therapy against her will.",resolution:"All four end the story utterly broken and alone, curled in fetal positions \u2014 no recovery follows, only the bleak new reality their addictions have carved out."}},{id:"waiting-for-godot-vonnegut-which-way-up",title:"Waiting for Godot",creator:"Samuel Beckett, 1953",appliesToType:"plotType",appliesToId:"vonnegut-which-way-up",bestStructureId:"freytag",beats:{setup:"Two tramps, Vladimir and Estragon, wait by a barren tree on a country road for a man named Godot who never explicitly defines what he offers them.",rise:"Pozzo and his servant Lucky arrive, staging strange, cruel performances and philosophical monologues that briefly break the monotony before departing, leaving Vladimir and Estragon unsure whether the visit meant anything.",climax:"A boy arrives to announce that Godot will not come today, but surely tomorrow \u2014 a moment poised exactly between hope and despair that could reverse either way.",fall:"Vladimir and Estragon consider suicide half-heartedly, abandon the idea for lack of a rope, and the next day repeats almost identically, leaving their fortune exactly as unresolved as it began."},sections:{exposition:"Two tramps, Vladimir and Estragon, wait by a barren tree on a country road for a man named Godot who never explicitly defines what he offers them.","rising-action":"Pozzo and his servant Lucky arrive, staging strange, cruel performances and philosophical monologues that briefly break the monotony before departing, leaving Vladimir and Estragon uncertain whether the visit meant anything at all.",climax:"A boy arrives to announce that Godot will not come today, but surely tomorrow \u2014 a moment poised exactly between hope and despair that could reverse either way.","falling-action":"Vladimir and Estragon consider suicide by hanging from the tree, half-heartedly, then abandon the idea for lack of a proper rope, unsure whether this is relief or further defeat.",denouement:"The next day repeats almost identically \u2014 Pozzo and Lucky return changed, the boy again promises Godot tomorrow, and Vladimir and Estragon agree to leave, yet do not move, leaving their fortune exactly as unresolved as it began."}},{id:"the-trial-vonnegut-which-way-up",title:"The Trial",creator:"Franz Kafka, 1925",appliesToType:"plotType",appliesToId:"vonnegut-which-way-up",bestStructureId:"freytag",beats:{setup:"On his thirtieth birthday, bank clerk Josef K. is unexpectedly arrested in his own bedroom by two agents who never state what crime he has committed, yet he remains free to go about his normal life.",rise:"K. navigates a baffling, labyrinthine legal system \u2014 a disorienting first hearing, an incompetent lawyer, court officials in the unlikeliest places \u2014 never learning whether he is making progress or sinking deeper into danger.",climax:'K. dismisses his lawyer and confronts a prison chaplain who tells him the enigmatic parable "Before the Law," a moment that could read as clarity or as final, total confusion.',fall:'His case drifts without verdict, and on the eve of his thirty-first birthday two men lead him to a quarry and kill him "like a dog," an ending so abrupt that even his own reaction is bewilderment rather than clear despair.'},sections:{exposition:"On his thirtieth birthday, bank clerk Josef K. is unexpectedly arrested in his own bedroom by two agents who never state what crime he has committed, yet he remains free to go about his normal life.","rising-action":"K. navigates a baffling, labyrinthine legal system \u2014 attending a disorienting first hearing, consulting an incompetent lawyer, and encountering court officials in the unlikeliest places \u2014 never learning whether he is making progress or sinking deeper into danger.",climax:'K. dismisses his lawyer and takes his defense into his own hands, confronting a prison chaplain who tells him the enigmatic parable "Before the Law," a moment that could read as clarity or as final, total confusion.',"falling-action":"K.'s case seems to drift without verdict or acquittal, and he continues his daily life uncertain whether he has been forgotten by the court or is being watched every moment.",denouement:'On the eve of his thirty-first birthday, two men arrive and lead K. to a quarry, where he is killed "like a dog" \u2014 an ending so abrupt after so much ambiguity that even his own reaction is bewilderment rather than clear despair or relief.'}},{id:"enuma-elish-vonnegut-creation-story",title:"Enuma Elish",creator:"Babylonian creation epic, c. 18th\u201312th century BCE",appliesToType:"plotType",appliesToId:"vonnegut-creation-story",bestStructureId:"pixar-spine",beats:{setup:"In the beginning there is only Apsu and Tiamat, fresh and salt water mingling together, and the younger gods emerge from their union and grow rowdy within the primordial calm.",rise:"Apsu plots to destroy the noisy younger gods but is killed first by Ea, and the grieving Tiamat raises a monstrous army and champion, Qingu, to avenge him, terrifying the younger gods into granting Marduk supreme authority to defeat her.",climax:"Marduk battles Tiamat directly, catching her in a net, driving winds into her body, and splitting her corpse in two to form the heavens above and the earth below.",fall:"From Tiamat's remains Marduk fashions the sky, stars, and seasons, and from the blood of the slain Qingu he creates humankind to serve the gods, establishing the ordered cosmos that follows ever after."},sections:{"once-upon":"In the beginning, before earth or sky existed, there was only Apsu (fresh water) and Tiamat (salt water) mingling together, and the gods emerged from their union.","every-day":"The younger gods live and multiply within the mingled waters, growing rowdy, until their noise disturbs the primordial calm.","until-one-day":"Apsu, unable to bear the tumult, resolves with his vizier to destroy the younger gods, but the god Ea discovers the plot first and kills Apsu, seizing his powers.","because-1":"In fury and grief over Apsu's death, Tiamat creates an army of monstrous creatures and raises Qingu as her champion to avenge him, throwing the cosmos into open war between generations of gods.","because-2":"The younger gods, terrified of Tiamat's monstrous host, turn to Ea's son Marduk for salvation, granting him supreme authority among the gods on the condition that he defeat her.","until-finally":"Marduk battles Tiamat directly, catching her in a net, driving winds into her body, and splitting her corpse in two to form the heavens above and the earth below.","ever-since":"From Tiamat's remains Marduk fashions the sky, stars, and seasons, and from the blood of the slain Qingu he creates humankind to serve the gods, establishing the ordered cosmos that follows ever after."}},{id:"norse-creation-myth-vonnegut-creation-story",title:"The Norse Creation Myth",creator:"Prose Edda, Snorri Sturluson, c. 1220",appliesToType:"plotType",appliesToId:"vonnegut-creation-story",bestStructureId:"pixar-spine",beats:{setup:"In the beginning there is only Ginnungagap, a vast void between fiery Muspelheim and icy Niflheim, until heat and frost finally meet and melting ice takes the form of the giant Ymir and the cosmic cow Audhumla.",rise:"Audhumla's licking uncovers the god Buri, whose descendants Odin and his brothers kill the giant Ymir, drowning nearly the entire race of frost giants in his blood.",climax:"Odin and his brothers haul Ymir's corpse into the void and construct the entire physical world from it \u2014 his flesh becomes the earth, his blood the seas, his bones the mountains, and his skull the dome of the sky.",fall:"The gods place Ymir's skull overhead, fling embers from Muspelheim into it to form the sun, moon, and stars, and the ordered world of Midgard and the other Nine Realms remains ever since."},sections:{"once-upon":"In the beginning there is only Ginnungagap, a vast, yawning void between the fiery realm of Muspelheim and the icy realm of Niflheim.","every-day":"For ages, nothing changes \u2014 fire and ice sit at opposite ends of the void, neither touching, while the emptiness between them simply persists.","until-one-day":"Heat from Muspelheim finally meets the frost of Niflheim in the middle of the void, and the melting ice drips into the form of the primeval giant Ymir and the cosmic cow Audhumla.","because-1":"Audhumla licks the salty ice blocks to feed herself, uncovering the god Buri, whose descendants \u2014 including Odin and his brothers \u2014 become the first gods, setting divine and giant bloodlines against each other from the start.","because-2":"Odin and his brothers kill the giant Ymir, and so much blood pours from his body that it drowns nearly the entire race of frost giants, escalating the primordial conflict into a near-total remaking of the world.","until-finally":"Odin and his brothers haul Ymir's corpse into the void and construct the entire physical world from it \u2014 his flesh becomes the earth, his blood the seas, his bones the mountains, and his skull the dome of the sky.","ever-since":"The gods place Ymir's skull overhead held up by four dwarves, fling embers from Muspelheim into it to form the sun, moon, and stars, and the ordered world of Midgard and the other Nine Realms remains ever since."}},{id:"mice-milieu-alice-wonderland",title:"Alice's Adventures in Wonderland",creator:"Lewis Carroll, 1865",appliesToType:"plotType",appliesToId:"mice-milieu",bestStructureId:"hero-journey",beats:{setup:"Alice, bored on a riverbank, follows a hurrying White Rabbit down a hole and tumbles into a strange underground world, growing and shrinking as she tries to find her way through a hall of locked doors.",rise:"She wanders Wonderland meeting the Mouse, the Caterpillar, the Duchess, the Cheshire Cat, and the Mad Hatter's endless tea party, slowly learning to navigate a place that runs on nonsense logic rather than her own.",climax:"Alice is drawn into the Queen of Hearts' court, culminating in a chaotic trial where the tyrannical Queen keeps demanding executions and Alice, grown to full size, finally refuses to be cowed.",fall:"The card soldiers rise up and swarm her; Alice wakes on the riverbank, brushes them away as falling leaves, and tells her sister about her curious dream before returning to ordinary life."},sections:{"ordinary-world":"Alice sits bored on a riverbank with her sister on a warm afternoon, restless with nothing to do since the book her sister is reading has no pictures or conversations in it.",call:"A White Rabbit runs past, checking a pocket watch and muttering that he is late, and Alice's curiosity is pricked enough that she gets up to follow him.",refusal:"She pauses at the edge of the rabbit hole, wondering how in the world she will ever get out again, before her curiosity overrides the hesitation and she goes in anyway.",mentor:`The Caterpillar, perched on his mushroom, questions her bluntly \u2014 "Who are YOU?" \u2014 and gives her the practical means to control Wonderland's chaos by showing her that each side of his mushroom changes her size.`,threshold:"Alice falls down the long rabbit hole and lands in the hall of doors, fully inside Wonderland now, unable to simply climb back up the way she came.","tests-allies":"She meets the Mouse and the Dodo's Caucus-race, the Duchess and her pepper-mad kitchen, the grinning Cheshire Cat, and the Mad Hatter's endless tea party, learning Wonderland's rules through repeated, baffling trial and error.",approach:"Guided loosely by the Cheshire Cat's
