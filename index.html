threshold:"She sets out along the yellow brick road, the story now bound to Oz until she finds a way to leave it.","tests-allies":"She travels deeper into Oz, gathering companions along the way and testing the strange rules, cities, and dangers of the road.",approach:"She nears the Emerald City, the promised place where the Wizard is said to hold the answer she's come for.",ordeal:"Sent into the Wicked Witch of the West's territory, the most dangerous stretch of Oz, she must survive a direct confrontation with the Witch.",reward:"The Witch is defeated, and Dorothy claims proof of the ordeal \u2014 the Witch's broomstick \u2014 to bring back to the Wizard.","road-back":"Returning to the Emerald City expecting to be sent home, she instead finds the Wizard exposed as a fraud, a man behind a curtain with no real magic to give her.",resurrection:"A final test arrives when the Wizard's balloon leaves without her, forcing one last true answer for how she can actually get home.",elixir:"Dorothy returns to Kansas changed, having learned that there's no place like home."}},{id:"da-vinci-code-mice-idea",title:"The Da Vinci Code",creator:"Dan Brown, 2003",appliesToType:"plotType",appliesToId:"mice-idea",bestStructureId:"todorov",beats:{setup:"The story opens on a murder that poses a single burning question: what secret was the victim protecting?",rise:"Langdon and Sophie chase clue after clue, each answer opening a deeper question.",climax:"The final clue is within reach, at the point of greatest uncertainty about what it will reveal.",fall:"The question is answered, and the story ends there, its central mystery resolved."},characters:[{category:"protagonist",name:"Robert Langdon",values:{setup:0,rise:0,climax:1,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Sophie Neveu",values:{setup:0,rise:1,climax:0,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"their pursuers",values:{setup:2,rise:1,climax:-1,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"Leigh Teabing",values:{setup:0,rise:2,climax:-1,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}}],sections:{equilibrium:"Robert Langdon is lecturing on symbols in Paris, his expertise purely academic and his life undisturbed.",disruption:"A murdered curator's coded message poses a single burning question \u2014 what secret was he protecting? \u2014 and pulls Langdon into a mystery he didn't choose.",recognition:"Langdon and Sophie recognize they must answer the question themselves, chasing clue after clue through the Louvre and beyond as each answer opens a deeper one, pointing toward a secret society and a truth hidden for centuries.",repair:"With the stakes of the idea now enormous and pursuers closing in, they push toward the final clue at the point of greatest uncertainty about what it will reveal.","new-equilibrium":"The last piece falls into place and the central question is answered, settling the story into its resolved mystery."}},{id:"christmas-carol-mice-character",title:"A Christmas Carol",creator:"Charles Dickens, 1843",appliesToType:"plotType",appliesToId:"mice-character",bestStructureId:"story-circle",beats:{setup:"The story opens on Scrooge, thoroughly satisfied with the miser he's become.",rise:"The ghosts force him to try on other ways of seeing himself, against his fierce resistance.",climax:"Confronted with his own unmourned death, Scrooge must decide, urgently, who he's going to be.",fall:"The story ends once his transformation is complete and settled, a changed man for good."},characters:[{category:"protagonist",name:"Ebenezer Scrooge",values:{setup:-3,rise:-1,climax:-3,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"mentor",name:"Marley's Ghost",values:{setup:-3,rise:-3,climax:-3,fall:-3},interacts:{setup:!0,rise:!1,climax:!1,fall:!1}},{category:"other",name:"the Cratchits",values:{setup:-1,rise:-1,climax:-2,fall:2},interacts:{setup:!1,rise:!0,climax:!1,fall:!0}},{category:"mentor",name:"the Three Spirits",values:{setup:0,rise:2,climax:3,fall:1},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"ally",name:"Fred",values:{setup:1,rise:0,climax:-1,fall:3},interacts:{setup:!0,rise:!1,climax:!1,fall:!0}}],sections:{you:"Scrooge sits comfortably in his own hardened isolation, thoroughly satisfied with the miser he's become.",need:"Marley's ghost warns that three spirits will visit to challenge that satisfaction \u2014 an urgent need to change is placed before Scrooge whether he wants it or not.",go:"The first spirit takes him out of his own bedroom and into the unfamiliar territory of his own forgotten past.",search:"Across the ghosts' visits he is forced to try on other ways of seeing himself, adapting against his fierce resistance to what he's shown.",find:"He begins to feel the real cost of the man he's chosen to become, especially in what it has meant for the Cratchit family.",take:"Confronted with his own unmourned death, he pays the heavy price of seeing exactly what his life amounts to if nothing changes.",return:"He begs for a chance to prove the future isn't fixed, and wakes back in his own bed, returned to the familiar world he left.",change:"His transformation holds and settles \u2014 a changed man for good."}},{id:"titanic-mice-event",title:"Titanic",creator:"dir. James Cameron, 1997",appliesToType:"plotType",appliesToId:"mice-event",bestStructureId:"fichtean",beats:{setup:"The story opens with the ship's grand order \u2014 first class and steerage alike \u2014 about to be disrupted.",rise:"The collision spreads chaos through the ship, worsening deck by deck as it sinks.",climax:"The turning point comes as the ship breaks apart, order fully collapsed into a fight for survival.",fall:"The story ends once a new order holds \u2014 the rescue, the survivors, the world reckoning with what happened."},characters:[{category:"protagonist",name:"Jack Dawson",values:{setup:0,rise:-1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Rose DeWitt Bukater",values:{setup:0,rise:-1,climax:-2,fall:1},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the ship's officers",values:{setup:1,rise:1,climax:-2,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"Cal Hockley",values:{setup:3,rise:1,climax:-1,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}}],sections:{"crisis-1":"The Titanic strikes an iceberg without warning, an event that instantly threatens the ship's celebrated unsinkable reputation and the grand order onboard.","crisis-2":"The damage becomes clear as the sea floods the lower decks, and the crew commits to a full evacuation.","crisis-3":"The chaos spreads and worsens deck by deck as the ship continues to sink, panic building among the passengers.","crisis-4":"Class divisions harden the disaster further as lifeboat access splits sharply along social lines, leaving those in steerage with the least chance of escape.",climax:"The ship's structure fails and it breaks apart as the last boats pull away, order fully collapsed into a desperate fight for survival in the water.",resolution:"A new order holds as rescue arrives, survivors are pulled from the water, and the wider world reckons with what happened."}},{id:"beowulf-overcoming-monster-2",title:"Beowulf",creator:"Anonymous, Old English epic, c. 8th\u201311th century",appliesToType:"plotType",appliesToId:"overcoming-monster",bestStructureId:"fichtean",beats:{setup:"Grendel's ongoing decade-long massacre at Heorot, and Beowulf's arrival to help King Hrothgar.",rise:"The escalating fights \u2014 Grendel's defeat, and then facing his vengeful mother in her underwater lair.",climax:"Beowulf slays Grendel's mother with an ancient giant's sword and returns home victorious.",fall:"Years later, King Beowulf faces one final monster, a dragon, and dies defeating it, leaving his people to an uncertain future."},sections:{"crisis-1":"Grendel has been terrorizing Heorot hall for twelve years, killing Danish warriors nightly; Beowulf arrives already amid this ongoing horror, with no calm before it.","crisis-2":"That night in Heorot, Beowulf grapples Grendel bare-handed and tears off his arm; Grendel flees mortally wounded to die in his lair.","crisis-3":"Grendel's mother comes to Heorot to avenge her son, killing Hrothgar's counselor \xC6schere; Beowulf must dive into her lake-lair to face a second, more dangerous monster.","crisis-4":"In the underwater cave, Beowulf's sword Hrunting fails him against Grendel's mother, and he is nearly killed before spotting a giant's sword hanging on the wall.",climax:"Beowulf beheads Grendel's mother with the giant sword and also decapitates Grendel's corpse, returning triumphant to a hero's welcome and eventually the throne of the Geats.",resolution:"Decades later, as an old king, Beowulf fights a treasure-hoarding dragon that has begun burning his land; he kills it with the young thane Wiglaf's help but is fatally wounded, and the poem closes with his funeral and his people's fear for the future."}},{id:"alien-overcoming-monster-3",title:"Alien",creator:"dir. Ridley Scott, 1979",appliesToType:"plotType",appliesToId:"overcoming-monster",bestStructureId:"fichtean",beats:{setup:"The Nostromo crew answers a distress signal and Kane is attacked by a facehugger aboard a derelict alien ship.",rise:"A xenomorph bursts from Kane's body and begins hunting the crew through the ship, while the android Ash is revealed to be protecting the creature over the humans.",climax:"Ripley, the last crew member left, rigs the ship to explode and confronts the alien one final time in the escape shuttle.",fall:"Ripley blows the creature into space and drifts home in hypersleep, the sole survivor."},sections:{"crisis-1":"The crew of the mining ship Nostromo is woken early by a mysterious signal from a derelict alien ship; Kane is attacked by a facehugger that clamps onto his face, already thrusting them into danger before any calm setup.","crisis-2":"The facehugger detaches and dies, seeming safe, then a newborn xenomorph violently bursts from Kane's chest during dinner, killing him and revealing the true threat now loose on the ship.","crisis-3":"The creature grows rapidly and picks off crew members one by one \u2014 Brett is snatched, then Dallas is killed hunting it through the ship's ducts \u2014 as the survivors realize they are being systematically hunted.","crisis-4":"Ripley discovers that Ash, the science officer, is an android under secret orders to bring the alien back at any cost, even sacrificing the crew; they destroy Ash, but Parker and Lambert are then killed, leaving Ripley and the cat as the only survivors.",climax:"Ripley sets the Nostromo to self-destruct and flees in the shuttle, only to discover the alien has stowed away with her; she blasts it into the airlock and out into space using the shuttle's engines.",resolution:"Ripley records her log, alone with the cat Jones, and settles into hypersleep for the drift home, the immediate threat finally over."}},{id:"wizard-of-oz-voyage-return-2",title:"The Wonderful Wizard of Oz",creator:"L. Frank Baum, 1900",appliesToType:"plotType",appliesToId:"voyage-and-return",bestStructureId:"todorov",beats:{setup:"Dorothy's unhappy life in Kansas is upended when a cyclone carries her house to the magical land of Oz.",rise:"She follows the yellow brick road with new friends, seeking the Wizard's help to get home.",climax:"Dorothy and her companions defeat the Wicked Witch of the West and expose the Wizard as a fraud.",fall:"Using the power she had all along, Dorothy returns home to Kansas, changed by all she has learned."},sections:{equilibrium:"Dorothy lives an ordinary, dissatisfied life on a Kansas farm with her aunt and uncle, wishing to escape somewhere over the rainbow.",disruption:"A cyclone sweeps her house away and drops it in the magical land of Oz, killing the Wicked Witch of the East and stranding Dorothy far from home.",recognition:"Dorothy realizes she must find a way back to Kansas, and Glinda tells her the Wizard of Oz in the Emerald City might be able to help.",repair:"She travels the yellow brick road with the Scarecrow, Tin Man, and Lion, defeats the Wicked Witch of the West, and discovers the Wizard is a fraud but learns she had the power to go home all along.","new-equilibrium":"Dorothy clicks the ruby slippers together and wakes back in Kansas, safe in her own bed, having learned to appreciate home and the friends who mirrored her journey."}},{id:"spirited-away-voyage-return-3",title:"Spirited Away",creator:"dir. Hayao Miyazaki, 2001",appliesToType:"plotType",appliesToId:"voyage-and-return",bestStructureId:"todorov",beats:{setup:"Chihiro's family stumbles into an abandoned amusement park that is really a gateway to the spirit world.",rise:"After her parents are turned into pigs, Chihiro takes a job at Yubaba's bathhouse to survive and search for a way to save them.",climax:"Chihiro passes Yubaba's final test, breaks the witch's hold over Haku, and secures her parents' freedom.",fall:"Chihiro leads her restored parents back through the tunnel into the ordinary world, transformed by her ordeal."},sections:{equilibrium:"Chihiro is a sullen ten-year-old moving to a new town with her parents, uneasy about the change but living an ordinary life.",disruption:"Her family takes a wrong turn into an abandoned amusement park that turns out to be a gateway to the spirit world, and her parents are transformed into pigs after eating enchanted food.",recognition:"Chihiro realizes she is trapped in the spirit world and must find a way to save her parents and herself, guided by the boy Haku to seek work at Yubaba's bathhouse.",repair:"She takes a name-stripped job at the bathhouse, befriends spirits, helps a polluted river spirit, faces the witch Yubaba and her twin sister Zeniba, and works to free Haku from Yubaba's control.","new-equilibrium":"Having passed Yubaba's final test and restored Haku's memory, Chihiro leads her now-human parents back through the tunnel to the ordinary world, no longer the same fearful child."}},{id:"oedipus-rex-tragedy-2",title:"Oedipus Rex",creator:"Sophocles, c. 429 BC",appliesToType:"plotType",appliesToId:"tragedy",bestStructureId:"freytag",beats:{setup:"King Oedipus of Thebes vows to find and punish whoever murdered the previous king in order to lift a plague on the city.",rise:"His investigation, driven by pride and refusal to stop, leads him closer and closer to a truth everyone else fears.",climax:"Oedipus learns he is himself the killer of his father and husband of his own mother, exactly as prophecy foretold.",fall:"Jocasta kills herself, Oedipus blinds himself in horror, and he goes into exile, undone entirely by his own flaws."},sections:{exposition:"Thebes suffers a plague, and King Oedipus, who years earlier solved the Sphinx's riddle and became king by marrying the widowed Queen Jocasta, vows to find and punish whoever killed the previous king, Laius.","rising-action":"The blind prophet Tiresias hints that Oedipus himself is the killer; Oedipus, enraged and suspicious of conspiracy, pursues the truth through Jocasta and a series of messengers and witnesses despite mounting warnings to stop.",climax:"A shepherd confirms the truth: Oedipus is the son of Laius and Jocasta, abandoned as an infant to avoid a prophecy, and unknowingly killed his father and married his mother.","falling-action":"Jocasta hangs herself in horror upon learning the truth, and Oedipus, finding her body, gouges out his own eyes with her brooch pins.",denouement:"Blind and broken, Oedipus surrenders the throne to Creon and begs to be exiled from Thebes, his family and kingdom shattered by his own relentless pursuit of the truth."}},{id:"great-gatsby-tragedy-3",title:"The Great Gatsby",creator:"F. Scott Fitzgerald, 1925",appliesToType:"plotType",appliesToId:"tragedy",bestStructureId:"freytag",beats:{setup:"Gatsby's mysterious wealth and lavish parties are revealed to be built entirely around winning back Daisy, his lost love.",rise:"Gatsby rekindles his affair with the now-married Daisy, chasing an idealized past he cannot actually recreate.",climax:"Confronted by Tom, Daisy cannot say she never loved him, and Gatsby's dream of reclaiming her shatters.",fall:"A fatal car accident implicates Gatsby, and he is murdered in revenge, his funeral attended by almost no one who claimed to love him."},sections:{exposition:"Nick Carraway moves next door to the mysterious, fabulously wealthy Jay Gatsby on Long Island, and learns Gatsby has built his entire lavish life around winning back his lost love, Daisy Buchanan, who is now married to the brutish Tom.","rising-action":"Gatsby engineers a reunion with Daisy through Nick, rekindles their affair, and grows increasingly obsessed with recreating their past together, even as Tom grows suspicious and Daisy remains torn between the two men.",climax:"In a confrontation at the Plaza Hotel, Gatsby demands Daisy say she never loved Tom; she cannot, and the illusion Gatsby has built his life around collapses in front of everyone.","falling-action":"Driving home devastated, Daisy strikes and kills Tom's mistress Myrtle with Gatsby's car; Tom lets Myrtle's husband believe Gatsby was driving and was her lover.",denouement:"Myrtle's husband shoots Gatsby dead in his pool in revenge, and almost no one attends his funeral; Nick, disillusioned with the wealthy and their carelessness, leaves New York for good."}},{id:"billy-elliot-rags-to-riches-2",title:"Billy Elliot",creator:"dir. Stephen Daldry, 2000",appliesToType:"plotType",appliesToId:"rags-to-riches",bestStructureId:"virgins-promise",beats:{setup:"In a mining town during the 1984 strike, young Billy is expected to box like his father and brother, but stumbles into a ballet class and discovers a hidden talent.",rise:"He secretly trains in ballet, hiding it from his family until his father discovers him dancing and forbids it.",climax:"As the strike collapses around them, Billy's father is moved by his passion and sacrifices to get him a shot at the Royal Ballet School.",fall:"Billy is accepted, and years later dances as a professional ballet lead with his proud family watching."},sections:{"dependent-world":"Billy, an 11-year-old boy in a County Durham mining town during the 1984-85 miners' strike, is expected to box like his father and brother and toughen up amid the strike's hardship.",price:"Conforming to his rough, grief-stricken family's expectations means suppressing any interest that isn't manly or useful to the struggling household, including any real joy at all.",opportunity:"When his boxing class ends early one day, Billy wanders into a girls' ballet class sharing the same hall and is immediately captivated, unexpectedly good at the steps.","dresses-part":"He starts secretly attending ballet class instead of boxing, putting on borrowed shoes and going through motions his family would forbid if they knew.","secret-world":"Billy practices privately with his teacher Mrs. Wilkinson after hours and alone in odd corners of the house and streets, discovering real talent and joy in dance away from his family's eyes.","no-longer-fits":"The gap between the boy who's supposed to box and the boy who dances becomes impossible to hide, and Billy starts skipping boxing entirely.","caught-shining":"His father catches him dancing in the gym one night and is horrified; the secret is out and the family erupts in conflict over what Billy should be allowed to become.","gives-up":"Under pressure and shame, Billy quits ballet lessons and appears to accept he must give up the dream to keep peace in the family.","ally-helps":"Mrs. Wilkinson refuses to let the talent go to waste, privately coaching Billy for a Royal Ballet School audition even after he's officially quit.","kingdom-chaos":"The strike collapses into violence and eventual defeat, gutting the town's identity and finances just as Billy's father must decide whether to break the strike himself to pay for his son's audition trip.","chooses-journey":"Moved by watching Billy dance with raw passion, his father and brother choose to support him, and the family scrapes together the money for London.","rages-reveals":"At the Royal Ballet School audition, a panel asks Billy how it feels when he dances, and he answers honestly and passionately, revealing who he really is without shame.",wonder:"Years later, an adult Billy takes the stage as a lead dancer in a professional ballet, his father and brother watching proudly from the audience \u2014 his gift now fully part of his world."}},{id:"jane-eyre-rags-to-riches-3",title:"Jane Eyre",creator:"Charlotte Bront\xEB, 1847",appliesToType:"plotType",appliesToId:"rags-to-riches",bestStructureId:"virgins-promise",beats:{setup:"Orphaned Jane Eyre grows up undervalued and poor, until she takes a governess post at Thornfield Hall.",rise:"A deep bond forms with her employer Rochester, but on the eve of their wedding she discovers his hidden, mad first wife and flees.",climax:"After Thornfield burns down and Rochester is left blinded, Jane comes into her own inheritance and independence.",fall:"She returns to Rochester and marries him as his equal, rising from orphaned poverty to a hard-won, genuine happiness."},sections:{"dependent-world":"Orphaned Jane grows up unloved at Gateshead and then at the harsh Lowood school, valued only for obedience and humility in a world that constantly tells her she is plain and lesser.",price:"To survive in these dependent worlds, Jane must suppress her passionate, opinionated nature and accept a lowly place, or risk punishment and rejection.",opportunity:"Jane takes a position as governess at Thornfield Hall, where her sharp mind and quiet strength catch the attention of her brooding employer, Mr. Rochester.","dresses-part":"Jane maintains her plain, proper governess role at Thornfield even as an unusual, equal-footed intimacy grows between her and Rochester through their conversations.","secret-world":"Their late-night talks become a private space where Jane can be witty, honest and fully herself, unlike anywhere else she has ever been allowed to exist.","no-longer-fits":"Jane's feelings for Rochester and her sense of her own worth grow too large for her subordinate role as governess to contain.","caught-shining":"Rochester proposes marriage, revealing he sees Jane as his equal and has fallen for exactly who she is \u2014 her true self finally seen and valued.","gives-up":"At the altar, Jane discovers Rochester is already secretly married to his mad first wife, Bertha, hidden in the attic; devastated, she flees Thornfield and gives up any hope of the life she wanted.","ally-helps":"Taken in and nursed by the Rivers family after collapsing on their doorstep, Jane finds new footing and, through St. John Rivers, discovers an unexpected inheritance that gives her independence.","kingdom-chaos":"Thornfield Hall burns to the ground, set alight by Bertha, who dies in the fire; Rochester is blinded and maimed trying to save her, and his old world of secrets is destroyed.","chooses-journey":"Now financially independent and no longer bound by dependency, Jane refuses St. John's cold proposal of a loveless missionary marriage and chooses to return to Rochester on her own terms.","rages-reveals":"Jane returns to the ruined Rochester and reveals her enduring love for him as an equal, no longer a poor dependent governess but a woman choosing freely.",wonder:"Jane marries Rochester, now on equal footing with her own inheritance and independence, and both find a genuine, mutual happiness neither could have had before."}},{id:"odyssey-the-quest-2",title:"The Odyssey",creator:"Homer, c. 8th century BC",appliesToType:"plotType",appliesToId:"the-quest",bestStructureId:"hero-journey",beats:{setup:"After ten years fighting at Troy, Odysseus is held captive by Calypso while his home in Ithaca is overrun by suitors.",rise:"Finally freed, he sails home through monsters, witches, and the underworld, losing his crew along the way.",climax:"Disguised as a beggar, Odysseus strings his old bow and slaughters the suitors who have plagued his household.",fall:"Reunited with his wife Penelope and his father, Odysseus restores order to Ithaca, forever changed by his long ordeal."},sections:{"ordinary-world":"Odysseus has been away from Ithaca for ten years fighting the Trojan War, while his home is overrun by suitors pressuring his wife Penelope and his son Telemachus struggles to assert himself.",call:"The gods, moved by Athena's pleading, decide it is time for Odysseus to be allowed to finally sail home from Calypso's island, where he has been held captive for seven years.",refusal:"Odysseus initially has no means of leaving Calypso's island, and even before that, some of his earlier choices \u2014 lingering with the Lotus-Eaters, boasting to the Cyclops \u2014 show a reluctance or inability to head straight home.",mentor:"Athena repeatedly guides and protects Odysseus throughout his journey, and Circe and the ghost of Tiresias give him crucial knowledge and warnings for what lies ahead.",threshold:"Odysseus builds a raft and sets sail from Calypso's island, fully committing to the dangerous voyage home across the sea.","tests-allies":"He and his crew face the Lotus-Eaters, the Cyclops Polyphemus, Aeolus's winds, the cannibal Laestrygonians, and the witch Circe, losing men and ships at each turn.",approach:"Odysseus travels to the underworld to consult the prophet Tiresias, learning what he must do and avoid to make it home safely.",ordeal:"He must sail past the deadly Sirens, then navigate between the monster Scylla and the whirlpool Charybdis, losing more men in the passage.",reward:"Odysseus survives the sea monsters and eventually reaches the island of the Phaeacians, who agree to give him safe passage home to Ithaca at last.","road-back":"The Phaeacians' ship delivers Odysseus, sleeping, onto the shores of Ithaca, but he must disguise himself as a beggar since his home is now controlled by dangerous suitors.",resurrection:"In disguise, Odysseus strings his old bow \u2014 a feat none of the suitors can manage \u2014 reveals himself, and slaughters all the suitors who have been consuming his household for years.",elixir:"Reunited with Penelope and his father Laertes, Odysseus restores order to Ithaca, bringing home the hard-won wisdom and endurance of his twenty-year ordeal."}},{id:"star-wars-the-quest-3",title:"Star Wars: A New Hope",creator:"dir. George Lucas, 1977",appliesToType:"plotType",appliesToId:"the-quest",bestStructureId:"hero-journey",beats:{setup:"Luke Skywalker, a restless farm boy on Tatooine, discovers a plea for help hidden in a droid and meets the old Jedi Obi-Wan Kenobi.",rise:"After his family is killed, Luke joins Han Solo and Leia to escape the Empire's Death Star, though Obi-Wan sacrifices himself along the way.",climax:"In a desperate trench run, Luke trusts the Force over technology and fires the shot that destroys the Death Star.",fall:"Luke returns a hero to the Rebel base, decorated for saving the Rebellion and having taken his first real steps as a Jedi."},sections:{"ordinary-world":"Luke Skywalker lives a mundane life as a moisture farmer on the desert planet Tatooine, restless and yearning for something beyond his aunt and uncle's farm.",call:"Luke discovers a hidden message from Princess Leia in the droid R2-D2, pleading for help from Obi-Wan Kenobi against the evil Galactic Empire.",refusal:"Luke initially refuses Obi-Wan's invitation to join him and learn the ways of the Force, insisting he must stay and help with the farm.",mentor:"Obi-Wan Kenobi takes Luke under his wing, gives him his father's lightsaber, and begins teaching him about the Force.",threshold:"After Imperial stormtroopers kill his aunt and uncle, Luke has nothing left tying him to Tatooine and commits fully to leaving with Obi-Wan aboard the Millennium Falcon.","tests-allies":"Luke allies with smuggler Han Solo and Chewbacca, is captured aboard the Death Star, and works with Leia and Han to escape through blaster fights and swinging across chasms.",approach:"The group plans their escape from the Death Star and prepares to deliver the stolen plans to the Rebel Alliance, while Obi-Wan moves to disable the tractor beam.",ordeal:"Obi-Wan sacrifices himself in a lightsaber duel against his former apprentice Darth Vader so the others can escape the Death Star.",reward:"Luke and his allies escape with the Death Star's technical plans, which reveal a critical weakness in the battle station.","road-back":"The Rebels race back to their base with the plans as the Empire's Death Star moves to destroy the Rebel base outright, forcing an immediate desperate counterattack.",resurrection:"In the trench run on the Death Star, Luke shuts off his targeting computer and, guided by Obi-Wan's voice and the Force, fires the shot that destroys the battle station moments before it can fire.",elixir:"Luke returns to the Rebel base a hero, decorated alongside Han and Chewbacca, having proven himself a Jedi in the making and given the Rebellion a fighting chance."}},{id:"twelfth-night-comedy-2",title:"Twelfth Night",creator:"William Shakespeare, c. 1601",appliesToType:"plotType",appliesToId:"comedy",bestStructureId:"kishotenketsu",beats:{setup:"Shipwrecked and separated from her twin brother Sebastian, Viola disguises herself as a young man and enters Duke Orsino's service.",rise:"Sent to woo Countess Olivia for Orsino, Viola finds Olivia falling for her disguise while she herself loves Orsino in secret.",climax:"Viola's twin brother Sebastian arrives alive, and Olivia mistakes him for Cesario, marrying him on the spot.",fall:"The twins are reunited, identities are revealed, and the tangled love triangle resolves into happy marriages for all."},sections:{ki:"Twins Viola and Sebastian are separated in a shipwreck off the coast of Illyria; believing her brother drowned, Viola disguises herself as a young man named Cesario and takes service with Duke Orsino.",sho:"Orsino sends Cesario to woo the grieving Countess Olivia on his behalf, but Olivia falls in love with Cesario instead, while Viola herself has secretly fallen for Orsino, creating a tangled triangle of unspoken love.",ten:"Sebastian, alive after all, arrives in Illyria and is mistaken for Cesario by Olivia, who promptly marries him; the identical twins' unexpected reunion recontextualizes all the confusion that came before.",ketsu:"The twins are reunited and their true identities revealed; Olivia is happily married to Sebastian, and Orsino, realizing Viola's love and identity, proposes to her, resolving all the romantic confusion into a set of happy marriages."}},{id:"importance-of-being-earnest-comedy-3",title:"The Importance of Being Earnest",creator:"Oscar Wilde, 1895",appliesToType:"plotType",appliesToId:"comedy",bestStructureId:"kishotenketsu",beats:{setup:"Jack and Algernon each maintain invented double identities to escape their social obligations, both eventually posing as a man named Ernest.",rise:"Jack's fianc\xE9e Gwendolen and Algernon's intended Cecily both believe they're engaged to the same man named Ernest, creating an absurd rivalry.",climax:"A revelation about a handbag and a misplaced infant reveals Jack's true, unexpected parentage.",fall:"It turns out Jack really was named Ernest all along, and both couples are joyfully united without further obstacle."},sections:{ki:"Jack Worthing lives a double life, using the invented identity 'Ernest' in the city while posing as guardian and respectable 'Jack' in the country, and Algernon Moncrieff has invented a fictional invalid friend 'Bunbury' to escape social obligations.",sho:"Jack proposes to Gwendolen as 'Ernest,' while Algernon, intrigued, travels to the country pretending to be 'Ernest' himself in order to meet and woo Jack's young ward, Cecily \u2014 both women, unaware, are each convinced they are engaged to a man named Ernest.",ten:"Gwendolen and Cecily meet and discover they are both engaged to 'Ernest Worthing,' creating an absurd standoff, until Jack's background is investigated and Miss Prism reveals she once misplaced an infant Jack in a handbag at a railway station decades earlier \u2014 recontextualizing his entire origin.",ketsu:"The handbag proves Jack is actually Algernon's older brother and was, in fact, christened Ernest after all, meaning both men have been telling the truth without knowing it; the mix-ups dissolve and both couples are happily united."}},{id:"groundhog-day-rebirth-2",title:"Groundhog Day",creator:"dir. Harold Ramis, 1993",appliesToType:"plotType",appliesToId:"rebirth",bestStructureId:"story-circle",beats:{setup:"Cynical weatherman Phil Connors is trapped by a blizzard in Punxsutawney and finds himself reliving Groundhog Day in an endless time loop.",rise:"He first exploits the loop selfishly, then spirals into despair, before finally using the endless time to genuinely improve himself and help others.",climax:"His authentic transformation into a caring, generous person finally wins the genuine love of his producer Rita.",fall:"The time loop breaks, and Phil wakes a changed man, choosing to build a real life rather than escape the town he once despised."},sections:{you:"Phil Connors is a cynical, self-centered weatherman who treats everyone around him with contempt, arriving in Punxsutawney to begrudgingly cover the Groundhog Day festival he despises.",need:"Though he doesn't recognize it, Phil needs to learn to genuinely care about other people instead of using them for his own amusement or advancement.",go:"A blizzard traps Phil in the small town, and he wakes up the next morning to discover it is Groundhog Day again \u2014 and again, and again, trapped in an endless time loop.",search:"At first Phil exploits the loop for hedonism and manipulation, gathering information to seduce his producer Rita, later spiraling into despair and repeated suicide attempts when nothing works.",find:"Having exhausted selfishness and despair, Phil begins using his infinite time to actually better himself \u2014 learning piano, ice sculpture, and French poetry, and genuinely helping the townspeople he once mocked.",take:"Doing good deeds and becoming a better man costs Phil the comfort of his old cynicism entirely; he must fully surrender his self-centered identity, with no guarantee it will ever end.",return:"Phil's transformed kindness and honesty finally win Rita's genuine love, and the couple spends what should be another looped day together, deeply present in the town he once despised.",change:"Waking up the next morning to find the loop finally broken, Phil is a fundamentally changed man \u2014 warm, generous, and in love \u2014 choosing to build a real life in the town rather than escape it."}},{id:"wonderful-life-rebirth-3",title:"It's a Wonderful Life",creator:"dir. Frank Capra, 1946",appliesToType:"plotType",appliesToId:"rebirth",bestStructureId:"story-circle",beats:{setup:"Despairing after a financial crisis threatens ruin and arrest, George Bailey wishes he had never been born.",rise:"A guardian angel shows him a nightmare vision of Bedford Falls as it would be without him, sunk into greed and misery.",climax:"George realizes how much his life has mattered and desperately begs to have it back.",fall:"Restored to his life, George is saved by the whole town rallying around him, reborn with a full appreciation of what he has."},sections:{you:"George Bailey has spent his whole life in Bedford Falls sacrificing his own dreams of travel and adventure to keep his family's building and loan afloat and help his neighbors.",need:"Crushed by a financial crisis caused by his absent-minded uncle losing money to the greedy banker Mr. Potter, George feels his life has been a worthless failure and wishes he had never been born.",go:"In despair on a bridge on Christmas Eve, George is about to jump into the icy river when his guardian angel Clarence intervenes and grants George's wish, showing him a world where he never existed.",search:"George explores this altered Bedford Falls, now a grim town called Pottersville, searching for the people he knows, trying to understand this strange, worse reality.",find:"George discovers that without him, his brother died young, his wife became a lonely spinster, and the whole town fell into ruin under Potter's greed \u2014 proof that his life had immense value all along.",take:"Overwhelmed with the horror of this vision, George desperately begs to have his real life back, willing to accept all its hardships and debts rather than never having existed.",return:"George is restored to his real life and runs joyously home through the snowy streets of Bedford Falls, embracing his family and the imperfect but real life he had wanted to escape.",change:"The whole town rallies to cover the missing money, and George realizes, now truly reborn, that he is 'the richest man in town' for the friends and love his sacrifices earned him."}},{id:"merchant-of-venice-polti-supplication",title:"The Merchant of Venice",creator:"William Shakespeare, c. 1596\u201398",appliesToType:"plotType",appliesToId:"polti-supplication",bestStructureId:"todorov",beats:{setup:"Antonio, a wealthy Venetian merchant, borrows money from the moneylender Shylock to help his friend Bassanio woo Portia, sealing the loan with a bond of a pound of his own flesh as forfeit.",rise:"When Antonio's ships are reported lost at sea, Shylock \u2014 embittered by years of contempt and his daughter's recent elopement \u2014 insists on collecting the flesh, and the court recognizes it is bound by law to honor his contract.",climax:"Disguised as a young lawyer, Portia enters the court and begs Shylock for mercy before turning the bond's exact wording against him, trapping him in the letter of his own law.",fall:"Shylock is ruined and forced to convert, Antonio is spared, and his ships turn out to have safely returned, settling Venice into a new order where mercy and cleverness have replaced the cold contract."},sections:{equilibrium:"Antonio, a wealthy Venetian merchant, is comfortable and generous, his fortune tied up in ships at sea; he borrows money from the moneylender Shylock to help his friend Bassanio woo Portia, sealing the loan with a bond of a pound of his own flesh as forfeit.",disruption:"Antonio's ships are reported lost at sea, leaving him unable to repay the debt, and Shylock \u2014 embittered by years of Christian contempt and the recent loss of his daughter \u2014 insists on collecting the literal pound of flesh, placing Antonio's life entirely in his hands.",recognition:"The court of Venice convenes and recognizes that the law itself binds the Duke to honor Shylock's contract; Bassanio and his friends realize pleading for mercy is the only recourse, since no legal technicality yet excuses the debt.",repair:`Disguised as a young lawyer, Portia enters the court and formally begs Shylock to consider "the quality of mercy" before turning the bond's own wording against him \u2014 he may take flesh but not one drop of blood, and not an ounce more or less than exactly specified \u2014 trapping him in the letter of his own law.`,"new-equilibrium":"Shylock is ruined and forced to convert, Antonio is spared and his ships turn out to have safely returned, and the play settles into a new order where mercy and cleverness have replaced the earlier cold contract."}},{id:"twelve-angry-men-polti-supplication",title:"12 Angry Men",creator:"dir. Sidney Lumet, 1957",appliesToType:"plotType",appliesToId:"polti-supplication",bestStructureId:"todorov",beats:{setup:"Twelve jurors file into a sweltering New York jury room to decide the fate of a teenage boy accused of murdering his father; eleven are ready to vote guilty and go home.",rise:"Juror 8 casts the lone not-guilty vote and, as the others re-examine the evidence, the jurors come to recognize how much of their certainty rested on prejudice and unexamined assumptions.",climax:"One by one, jurors change their votes as Juror 8 painstakingly demonstrates reasonable doubt, forcing the holdouts, especially the vengeful Juror 3, to confront their own biases.",fall:"The jury reaches a unanimous not-guilty verdict, the boy's fate is released from their hands, and the twelve men walk back out into the city changed by having genuinely weighed a life in the balance."},sections:{equilibrium:"Twelve jurors file into a sweltering New York jury room to decide the fate of a teenage boy accused of murdering his father; eleven are ready to vote guilty and go home.",disruption:"Juror 8 casts the lone not-guilty vote, refusing to send the boy to the electric chair without at least an hour's discussion, throwing the room's assumed consensus into open conflict.",recognition:"As the jurors re-examine the knife, the eyewitnesses, and the alibi, they come to recognize how much of their 'certainty' was built on prejudice, haste, and unexamined assumptions \u2014 the boy's life has been resting on careless judgment.",repair:"One by one, jurors change their votes as Juror 8 painstakingly demonstrates reasonable doubt, forcing the holdouts, especially the vengeful Juror 3, to confront their own biases before they can let go of a guilty verdict.","new-equilibrium":"The jury reaches a unanimous not-guilty verdict, the boy's fate is released from their hands, and the twelve men walk back out into the city changed by having genuinely weighed a life in the balance."}},{id:"finding-nemo-polti-deliverance",title:"Finding Nemo",creator:"dir. Andrew Stanton, 2003",appliesToType:"plotType",appliesToId:"polti-deliverance",bestStructureId:"hero-journey",beats:{setup:"Marlin, an anxious clownfish who lost his wife and all but one of his eggs long ago, raises his son Nemo alone until Nemo is captured by a diver and taken to be sold as an aquarium fish in Sydney.",rise:"Marlin leaves the safety of the reef with Dory, a forgetful but big-hearted blue tang, braving sharks, jellyfish, and a whale's throat as they cross the ocean toward Sydney.",climax:"Marlin finally locates Nemo just as he is about to be given away and word arrives that Marlin has died \u2014 but Nemo escapes the tank himself and father and son are reunited in the vast ocean.",fall:"Marlin returns home a changed father, no longer suffocatingly overprotective, having learned that love means trust, not just fear."},sections:{"ordinary-world":"Marlin, an anxious clownfish who lost his wife and all but one of his eggs to a barracuda, raises his son Nemo alone on the reef, overprotective to a fault.",call:"On his first day of school, Nemo defiantly swims out to touch a boat and is captured by a diver, who takes him away to be sold as an aquarium fish in Sydney.",refusal:"Marlin, paralyzed by fear and grief, initially can barely bring himself to leave the reef and chase the boat, certain he will fail and lose everything again.",mentor:"He meets Dory, a good-hearted but forgetful blue tang, who insists on helping him and, despite her limitations, keeps pushing him to keep swimming.",threshold:"Marlin leaves the safety of the reef for the open ocean, committing to a journey across unknown and dangerous waters he has spent his whole life avoiding.","tests-allies":"He and Dory survive sharks trying to reform their diets, a field of stinging jellyfish, and a school of moonfish, gradually learning to trust others and take risks.",approach:"Guided by directions from other sea creatures, Marlin and Dory approach Sydney Harbour, closing in on the dentist's office where Nemo is held in a fish tank.",ordeal:"Marlin is swallowed by a whale along with Dory, facing what seems like certain death in its throat before the whale releases them near Sydney.",reward:"Marlin finally reaches Sydney and, through a pelican named Nigel, learns Nemo's exact location \u2014 but arrives just as Nemo is about to be given away, and word comes that Marlin himself has died en route.","road-back":"Believing his father dead, Nemo escapes the fish tank and washes into the harbor, while a devastated Marlin starts to give up, until Dory reminds him to keep going.",resurrection:"Father and son are reunited in the vast ocean by sheer determination, only to face one final crisis together when Dory is caught in a fishing net, requiring Nemo to lead the trapped fish in coordinated resistance to save her.",elixir:"Marlin returns home a changed father, no longer suffocatingly overprotective, letting Nemo go to school and take healthy risks, having learned that love means trust, not just fear."}},{id:"taken-polti-deliverance",title:"Taken",creator:"dir. Pierre Morel, 2008",appliesToType:"plotType",appliesToId:"polti-deliverance",bestStructureId:"hero-journey",beats:{setup:"Bryan Mills, a retired CIA operative, lives quietly trying to reconnect with his estranged daughter Kim, until she calls him from Paris as human traffickers break in and drag her away.",rise:"Bryan flies to Paris alone, using his old skills and contacts to interrogate and fight through a chain of traffickers and corrupt police, each contact bringing him closer to Kim.",climax:"Bryan traces Kim to a sheikh's yacht auction and storms it in a violent assault, finding her alive, drugged but rescued, moments from being lost for good.",fall:"Bryan gets Kim safely home to her mother, the ordeal having repaired what estrangement could not \u2014 proof, finally, of how far his love for her will go."},sections:{"ordinary-world":"Bryan Mills, a retired CIA operative, lives a quiet, lonely life trying to reconnect with his estranged teenage daughter Kim after years of missed birthdays.",call:"Kim calls Bryan in a panic from Paris as Albanian human traffickers break into the apartment where she and a friend are staying, and he hears her being dragged away over the phone.",refusal:"There is barely time for hesitation, but Bryan's ordinary life \u2014 his awkward relationship with his ex-wife and daughter \u2014 has kept him from being the kind of father who could simply act; now he must become that man in minutes.",mentor:"His own past training and his old intelligence contacts serve as his guide, giving him the skills and information a normal father would never have to track the kidnappers.",threshold:"Bryan flies to Paris alone, crossing fully into the criminal underworld of human trafficking, warning the trafficker over the phone that he will find and kill him.","tests-allies":"He interrogates and fights his way through a chain of traffickers, corrupt police, and an old French intelligence colleague, each contact bringing him one step closer to Kim.",approach:"Bryan traces Kim to a wealthy sheikh's yacht auction, where kidnapped girls are being sold, and prepares to infiltrate the sale before she disappears forever.",ordeal:"He storms the yacht in a violent, high-stakes assault, gunning down guards and the buyer to reach the room where Kim is being held, moments from being lost for good.",reward:"Bryan finds Kim alive, drugged but rescued, snatching her back from the very edge of trafficking's darkest outcome.","road-back":"He gets her medical care and safely out of France, the immediate danger passed but the trauma of the ordeal still raw for both of them.",resurrection:"On the way home, Bryan makes a final stop to confront the singer who orchestrated Kim's original invitation into danger, ensuring no lingering threat remains before she is truly safe.",elixir:"Bryan brings Kim home to her mother, and the ordeal has repaired what estrangement could not \u2014 he returns not just with his daughter, but with proof, finally, of how far his love for her will go."}},{id:"hamlet-polti-crime-vengeance",title:"Hamlet",creator:"William Shakespeare, c. 1600\u201301",appliesToType:"plotType",appliesToId:"polti-crime-vengeance",bestStructureId:"seven-point",beats:{setup:"Prince Hamlet sinks into melancholy grief at Elsinore until his father's ghost reveals that Claudius murdered him by poison to seize the throne and queen, charging Hamlet with revenge.",rise:"Watched by Claudius's spies, Hamlet stages a play to catch the king's guilty reaction, confirming the ghost's accusation and committing himself to real action.",climax:"After accidentally killing Polonius and narrowly escaping a death sentence in England, Hamlet returns to find Laertes's own vengeful fury against him converging on a final duel.",fall:"In the climactic duel, poisoned blade and poisoned cup kill Laertes, Gertrude, Claudius, and Hamlet himself, the crime finally answered in blood."},sections:{hook:"Prince Hamlet of Denmark is sunk in melancholy grief and inaction at Elsinore, mourning his father's sudden death and his mother's hasty remarriage to his uncle Claudius \u2014 the opposite of the decisive avenger he will become.","plot-turn-1":"The ghost of Hamlet's father appears and reveals that Claudius murdered him by poison to seize the throne and queen, charging Hamlet to avenge the crime.","pinch-1":"Claudius, sensing Hamlet's strange behavior and suspicious of his motives, sets spies \u2014 Rosencrantz, Guildenstern, and Polonius \u2014 to watch him, showing the reach of royal power arrayed against the prince.",midpoint:`Hamlet moves from passive brooding to active testing, staging "The Mousetrap" play to catch Claudius's guilty reaction, confirming the ghost's accusation and committing himself to real action.`,"pinch-2":"In the fallout, Hamlet accidentally kills Polonius, and Claudius, now fully alarmed, ships Hamlet off to England with secret orders for his execution, stripping away Hamlet's safety entirely.","plot-turn-2":"Hamlet escapes the death sentence at sea and returns to Denmark, arriving just as Ophelia's death and Laertes's own vengeful fury against him set the final confrontation in motion.",resolution:"In the climactic duel, poisoned blade and poisoned cup kill Laertes, Gertrude, Claudius, and Hamlet himself, the crime finally answered in a resolution that mirrors, in blood, the inaction of the play's opening."}},{id:"kill-bill-polti-crime-vengeance",title:"Kill Bill: Vol. 1",creator:"dir. Quentin Tarantino, 2003",appliesToType:"plotType",appliesToId:"polti-crime-vengeance",bestStructureId:"seven-point",beats:{setup:"The Bride wakes from a four-year coma after being shot and left for dead at her own wedding, and resolves to hunt down and kill everyone responsible for the massacre.",rise:"After a brutal near-fatal fight with her first target, Vernita Green, the Bride commissions a legendary sword from swordsmith Hattori Hanzo, becoming a fully armed, proactive hunter.",climax:"She cuts down O-Ren Ishii's army of Yakuza enforcers, the Crazy 88, single-handedly, earning the private duel she needs to close this chapter of her list.",fall:"The Bride defeats and beheads O-Ren Ishii in the falling snow of a Japanese garden, her vengeance list \u2014 and Bill himself \u2014 still waiting."},sections:{hook:"The Bride lies comatose in a hospital bed for four years, the exact opposite of the deadly assassin she once was, after being shot and left for dead at her own wedding rehearsal.","plot-turn-1":"She wakes from her coma, remembers the massacre carried out by her former boss Bill and his Deadly Viper Assassination Squad, and resolves to hunt down and kill every person responsible.","pinch-1":"Her first target, Vernita Green, nearly kills her in a brutal kitchen fight in front of Vernita's own daughter, showing how dangerous and personal each kill on her list will be.",midpoint:"The Bride travels to Okinawa and commissions a legendary sword from retired swordsmith Hattori Hanzo, shifting from a wounded survivor reacting to her attackers into a fully armed, proactive hunter.","pinch-2":"She confronts O-Ren Ishii's army of Yakuza enforcers, the Crazy 88, at the House of Blue Leaves, and is nearly overwhelmed by the sheer number of opponents sent against her.","plot-turn-2":"Having cut down the Crazy 88 single-handedly, she gains the private one-on-one duel with O-Ren she needs to finish this piece of her revenge list once and for all.",resolution:"The Bride defeats and beheads O-Ren Ishii in the falling snow of a Japanese garden, closing this chapter of vengeance while making clear her list \u2014 and Bill himself \u2014 still awaits."}},{id:"romeo-juliet-polti-vengeance-kindred",title:"Romeo and Juliet",creator:"William Shakespeare, c. 1594\u201396",appliesToType:"plotType",appliesToId:"polti-vengeance-kindred",bestStructureId:"save-the-cat",beats:{setup:"In Verona, an ancient feud between the Montague and Capulet households erupts in street brawls, until Romeo Montague and Juliet Capulet meet at a masked feast and fall instantly in love.",rise:"They marry in secret, but when Juliet's cousin Tybalt kills Romeo's friend Mercutio, Romeo kills Tybalt in return, turning the family feud into a personal, unforgivable act of kindred blood.",climax:"Banished and desperate, Juliet fakes her own death to avoid a forced second marriage, but the message never reaches Romeo, who kills himself beside her at the tomb.",fall:"Juliet wakes to find Romeo dead and kills herself too, and the grieving Montagues and Capulets finally reconcile over their children's bodies."},sections:{"opening-image":`In Verona's streets, servants of the Montague and Capulet households brawl on sight, showing a city split by an "ancient grudge" between two feuding families.`,"theme-stated":'The Prince of Verona warns both houses that "civil blood makes civil hands unclean," stating outright that this cycle of family violence must end or destroy them both.',"set-up":"Romeo Montague pines melodramatically over a girl who doesn't love him back, while Juliet Capulet's parents arrange her marriage to Paris, each unaware of the other's existence.",catalyst:"Romeo sneaks into a masked Capulet feast and meets Juliet, and the two fall instantly and mutually in love, unaware of the wall of family hatred already standing between them.",debate:`They wrestle, in the balcony scene, with whether love can possibly survive their families' names \u2014 "deny thy father and refuse thy name" \u2014 before deciding to marry in secret regardless.`,"break-into-two":"Friar Laurence agrees to marry them in secret, hoping the union might finally reconcile the two houses, and Romeo commits fully to Juliet over his family's feud.","b-story":"Romeo's friend Mercutio and Juliet's cousin Tybalt carry the feud's violent energy alongside the lovers' romance, embodying the family hatred the marriage is trying to escape.","fun-and-games":"Romeo and Juliet marry secretly and consummate their marriage, savoring a brief private happiness the feuding city around them knows nothing about.",midpoint:"Tybalt kills Mercutio in a street duel, and Romeo, in a fury of grief, kills Tybalt in return \u2014 turning the abstract family feud into a specific, personal, unforgivable act of kindred blood.","bad-guys-close":"Romeo is banished from Verona for the killing, while Juliet's father, ignorant of her marriage, moves up her wedding to Paris, closing off every safe path forward.","all-is-lost":"Juliet, desperate to avoid bigamy, takes a potion from Friar Laurence to fake her own death, but the message explaining the plan fails to reach the banished Romeo in time.","dark-night":"Romeo, believing Juliet truly dead, buys poison and travels to her tomb in utter despair, seeing no future left worth living for.","break-into-three":`At the Capulet tomb, Romeo encounters Paris and kills him too, then drinks the poison beside Juliet's "corpse," the vengeance and grief of both families converging in one crypt.`,finale:"Juliet wakes moments later to find Romeo dead beside her and stabs herself with his dagger rather than live without him, the double suicide finally exposing the feud's true cost.","final-image":"The grieving Montagues and Capulets meet at the tomb and finally reconcile over their children's bodies, ending the ancient vengeance the opening brawl began."}},{id:"oresteia-polti-vengeance-kindred",title:"The Oresteia",creator:"Aeschylus, 458 BCE",appliesToType:"plotType",appliesToId:"polti-vengeance-kindred",bestStructureId:"save-the-cat",beats:{setup:"Agamemnon returns home from Troy in triumph, but his wife Clytemnestra, still grieving their daughter Iphigenia whom he sacrificed years before, murders him in his bath with an axe.",rise:"Their son Orestes, commanded by Apollo to avenge his father, returns in disguise with his sister Electra and, despite his mother's pleas, kills both her and her lover Aegisthus.",climax:"The Furies, ancient goddesses of blood-guilt, appear and hound Orestes for matricide, driving him half-mad across the land until he clings to Apollo's altar at Delphi.",fall:"Athena establishes a formal court in Athens, casts the deciding vote to acquit Orestes, and the vengeful Furies transform into protective spirits, ending the family's cycle of blood vengeance."},sections:{"opening-image":"Agamemnon returns home to Argos in triumph after ten years leading the Greek army in the Trojan War, greeted with public honor by his wife Clytemnestra.","theme-stated":"The chorus recalls, with dread, that Agamemnon once sacrificed their own daughter Iphigenia to the gods for favorable winds to Troy \u2014 a family crime not yet answered.","set-up":"Clytemnestra has spent the decade nursing her grief and fury over Iphigenia's death, and has taken Agamemnon's cousin and rival Aegisthus as a lover and co-conspirator.",catalyst:"Clytemnestra welcomes Agamemnon home with false honor, laying purple tapestries for him to walk on, then murders him in his bath with an axe as vengeance for their daughter.",debate:"Their son Orestes, grown up in exile, wrestles with Apollo's command to avenge his father by killing his own mother \u2014 a duty that means committing the unthinkable crime of matricide.","break-into-two":"Orestes returns to Argos in disguise and commits to the act, reuniting with his sister Electra at their father's grave to plan the killing.","b-story":"Electra's long-nursed hatred of her mother and loyalty to her dead father's memory pushes Orestes forward, giving the vengeance its emotional fuel.","fun-and-games":"Orestes and his companion Pylades trick their way into the palace disguised as travelers bearing false news of Orestes's own death, savoring the deception before the killing blow.",midpoint:"Orestes kills Aegisthus first, and then, in the play's central horror, kills his own mother Clytemnestra despite her pleading \u2014 kindred vengeance answering kindred vengeance.","bad-guys-close":"The instant the murder is done, the Furies \u2014 ancient goddesses of blood-guilt \u2014 appear to Orestes, visible only to him, beginning to hound him for matricide.","all-is-lost":"Orestes flees Argos, driven half-mad, pursued relentlessly across the land by the Furies who will not let a matricide go unpunished, regardless of his motive.","dark-night":"He arrives at Apollo's temple at Delphi, exhausted and tormented, clinging to the god's altar as the only sanctuary from the pursuing Furies.","break-into-three":"Apollo sends Orestes to Athens, where the goddess Athena establishes a formal court \u2014 the Areopagus \u2014 to judge the case, rather than let the blood-feud continue unchecked.",finale:"The human jury votes evenly, and Athena casts the deciding vote to acquit Orestes, replacing the endless cycle of vengeance with the rule of law.","final-image":'The Furies, appeased by Athena, transform into the Eumenides ("kindly ones") and become protective spirits of Athens, and the ancient family curse is finally, formally ended.'}},{id:"north-by-northwest-polti-pursuit",title:"North by Northwest",creator:"dir. Alfred Hitchcock, 1959",appliesToType:"plotType",appliesToId:"polti-pursuit",bestStructureId:"fichtean",beats:{setup:"Advertising executive Roger Thornhill is mistaken for a spy and abducted at gunpoint, then framed for a diplomat's murder, making him a wanted man to police and foreign agents alike.",rise:"Fleeing across the country, Thornhill is nearly killed by a machine-gun-strafing crop-duster at an isolated crossroads, then discovers the woman he loves is a double agent he can no longer trust.",climax:"On the sheer stone face of Mount Rushmore, Thornhill fights the spies hand-to-hand to save Eve from falling to her death.",fall:"Thornhill and Eve escape together, and the film's closing image shows the two safely married, the pursuit finally, briskly over."},sections:{"crisis-1":'Advertising executive Roger Thornhill is mistaken for a spy named "George Kaplan" and abducted at gunpoint from a hotel bar by foreign agents, plunged straight into danger with no explanation.',"crisis-2":"After escaping his captors, Thornhill is framed for the very public murder of a UN diplomat, making him a wanted man in the eyes of the police as well as the spies.","crisis-3":"Fleeing across the country as both police and enemy agents hunt him, Thornhill is lured to an isolated Midwest crossroads and nearly killed by a machine-gun-strafing crop-duster plane.","crisis-4":"He tracks the conspiracy to an art auction and a Mount Rushmore visitor center, only to discover Eve Kendall, the woman he's fallen for, is a double agent whose loyalties he can no longer trust.",climax:"On the sheer stone face of Mount Rushmore itself, Thornhill fights the spies hand-to-hand to save Eve from falling to her death, the chase reaching its most literal cliff-edge.",resolution:"Thornhill and Eve escape together, and in the film's famous closing image the two are shown safely married, the pursuit finally, briskly over."}},{id:"no-country-polti-pursuit",title:"No Country for Old Men",creator:"Cormac McCarthy, 2005",appliesToType:"plotType",appliesToId:"polti-pursuit",bestStructureId:"fichtean",beats:{setup:"Llewelyn Moss takes two million dollars from the scene of a drug deal gone wrong, and the implacable hitman Anton Chigurh is dispatched to hunt him down and recover it.",rise:"Chigurh tracks Moss from motel to motel using a device hidden in the cash, their escalating shootouts leaving Moss wounded and increasingly desperate.",climax:"Off-page, in a motel ambushed by a rival cartel, Moss is killed before Chigurh even arrives, the pursuit resolved by the surrounding violence Moss's theft set loose.",fall:"Chigurh nonetheless tracks down and kills Moss's wife to complete his job's twisted logic, and the aging sheriff Ed Tom Bell retires, unable to comprehend a world where evil pursues so implacably."},sections:{"crisis-1":"Llewelyn Moss stumbles on the aftermath of a drug deal gone wrong in the Texas desert and takes a satchel with two million dollars, immediately making himself a target.","crisis-2":"Moss returns in the night with water for a dying man at the scene and is spotted, and the relentless hitman Anton Chigurh is dispatched to recover the money, beginning the chase.","crisis-3":"Chigurh tracks Moss from motel to motel using a tracking device hidden in the cash, and their confrontations escalate into shootouts that leave Moss wounded and increasingly desperate.","crisis-4":"Moss sends his wife away for safety and tries to negotiate from a position of exhaustion, but Chigurh's calm, unstoppable pursuit closes in regardless of any deal offered.",climax:"Off-page, in a motel ambushed by a rival Mexican cartel, Moss is killed before Chigurh even arrives, the pursuit resolved not by a final duel but by the surrounding violence Moss's theft set loose.",resolution:"Chigurh nonetheless tracks down and kills Moss's wife to complete his job's twisted logic, and the aging sheriff Ed Tom Bell retires, unable to comprehend a world where evil pursues so implacably."}},{id:"jaws-polti-disaster",title:"Jaws",creator:"dir. Steven Spielberg, 1975",appliesToType:"plotType",appliesToId:"polti-disaster",bestStructureId:"freytag",beats:{setup:"The resort town of Amity Island hums with ordinary summer life until a great white shark begins killing swimmers, and officials afraid of scaring off tourists overrule the warnings of police chief Brody.",rise:"As attacks escalate and panic spreads, Brody, scientist Hooper, and shark hunter Quint go out to sea and are hunted in turn by the shark, which destroys their boat and kills Quint.",climax:"Alone and out of options, Brody rigs a scuba tank to explode in the shark's mouth by shooting it as it attacks, finally destroying the creature.",fall:"Brody and Hooper swim back to shore together, the immediate threat gone and Amity able to return, warily, to something like its former ordinary summer life."},sections:{exposition:"The small resort town of Amity Island depends on its summer tourist season, its beaches and boardwalk humming with ordinary seaside life as Fourth of July approaches.","rising-action":"A great white shark begins killing swimmers, and as police chief Brody's warnings are overruled by officials afraid of scaring off tourists, the attacks escalate and panic spreads through the town.",climax:"Brody, the scientist Hooper, and the shark hunter Quint go out to sea on the Orca and are hunted in turn by the shark, which destroys their boat and kills Quint in the film's most harrowing sequence.","falling-action":"Alone and out of options, Brody rigs a scuba tank to explode in the shark's mouth by shooting it as it attacks, finally destroying the creature that has terrorized the island.",denouement:"Brody and Hooper swim back to shore together, the immediate threat gone and Amity able to return, warily, to something like its former ordinary summer life."}},{id:"contagion-polti-disaster",title:"Contagion",creator:"dir. Steven Soderbergh, 2011",appliesToType:"plotType",appliesToId:"polti-disaster",bestStructureId:"freytag",beats:{setup:"Beth Emhoff returns from a Hong Kong business trip feeling unwell, an ordinary domestic scene that gives no hint of the global pandemic about to begin.",rise:"The virus she unknowingly carries spreads explosively worldwide, overwhelming hospitals and governments as the CDC and WHO race to identify it amid panic and social breakdown.",climax:"With the death toll climbing into the millions and society fraying, a vaccine is finally developed and mass inoculation becomes the only hope.",fall:"The vaccine is distributed by lottery and the pandemic slows, with the film's final scene revealing the very ordinary chain of events \u2014 a disturbed bat habitat \u2014 that caused it."},sections:{exposition:"Beth Emhoff returns from a Hong Kong business trip feeling unwell, an ordinary domestic scene in Minneapolis that gives no hint of the global catastrophe about to begin.","rising-action":"The virus she unknowingly carries spreads explosively worldwide, overwhelming hospitals and governments, while the CDC and WHO race to identify it as panic, misinformation, and social breakdown accelerate.",climax:"With the death toll climbing into the millions and society fraying \u2014 looting, quarantines, a black market for the antiviral drug \u2014 a vaccine is finally developed and mass inoculation becomes the only hope.","falling-action":"The vaccine is distributed through a lottery system based on birthdate, and the pandemic's spread begins, gradually, to slow as immunity builds across the population.",denouement:"In the film's final scene, shown out of chronological order, the origin of the outbreak is revealed \u2014 a bulldozer disturbing a bat's habitat \u2014 closing the story on the very ordinary chain of events that caused an extraordinary disaster."}},{id:"tess-polti-cruelty-misfortune",title:"Tess of the d'Urbervilles",creator:"Thomas Hardy, 1891",appliesToType:"plotType",appliesToId:"polti-cruelty-misfortune",bestStructureId:"kishotenketsu",beats:{setup:"Tess Durbeyfield, a poor but good-hearted country girl, is sent by her family to claim kinship with the wealthy d'Urbervilles in hopes of improving their fortunes.",rise:"The predatory Alec d'Urberville seduces and rapes her, leaving her pregnant and shamed; her baby dies, and she later falls in love with Angel Clare while working as a dairymaid.",climax:"On their wedding night, Tess confesses her past to Angel, who recoils in horror and abandons her despite having confessed an affair of his own.",fall:"Abandoned and pursued again by Alec, Tess murders him in despair, briefly reunites with Angel, and is arrested and executed, her life shown as an unbroken chain of undeserved punishment."},sections:{ki:"Tess Durbeyfield, a poor but good-hearted country girl, is sent by her family to claim kinship with the wealthy d'Urberville family in hopes of improving their fortunes.",sho:"At the d'Urbervilles', the predatory Alec seduces and rapes her, leaving her pregnant and shamed; her baby dies in infancy, and she struggles afterward to rebuild a quiet, honest life as a dairymaid, where she falls in love with Angel Clare.",ten:"On their wedding night, Tess confesses her past to Angel, expecting understanding since he has confessed a past affair of his own \u2014 but he recoils in horror and abandons her, an unexpected cruelty that recontextualizes every kindness Tess believed the world owed decent people.",ketsu:"Abandoned, impoverished, and pursued again by Alec, Tess ultimately murders him in despair; she and Angel share a brief reunion before she is arrested and executed, her whole life shown to have been an unbroken chain of punishments for misfortunes never truly her fault."}},{id:"candide-polti-cruelty-misfortune",title:"Candide",creator:"Voltaire, 1759",appliesToType:"plotType",appliesToId:"polti-cruelty-misfortune",bestStructureId:"kishotenketsu",beats:{setup:'Candide lives an innocent, sheltered life in a Westphalian castle, taught by his tutor Pangloss that this is "the best of all possible worlds."',rise:"Expelled for kissing the baron's daughter Cun\xE9gonde, Candide is conscripted, flogged, and wanders through war, briefly reuniting with her before misfortune scatters them again.",climax:"A relentless, absurd cascade of catastrophes \u2014 earthquake, Inquisition, shipwreck, slavery, robbery \u2014 strikes Candide and everyone around him with no regard for merit or virtue.",fall:'Having lost his fortune and illusions repeatedly, Candide settles on a small farm and concludes only that "we must cultivate our garden," abandoning grand philosophy for modest, practical endurance.'},sections:{ki:'Candide lives an innocent, sheltered life in the castle of a Westphalian baron, taught by his tutor Pangloss that this is "the best of all possible worlds."',sho:"Expelled from the castle for kissing the baron's daughter Cun\xE9gonde, Candide is conscripted into an army, flogged, and wanders through war, only to reunite briefly with Cun\xE9gonde before misfortune scatters them again.",ten:"A relentless, almost absurd cascade of catastrophes \u2014 the Lisbon earthquake, the Inquisition, shipwreck, slavery, robbery \u2014 strikes Candide and everyone around him with no regard for merit or virtue, undercutting Pangloss's optimism at every turn.",ketsu:'Having lost his fortune and illusions repeatedly, Candide finally settles on a small farm with his remaining companions and concludes only that "we must cultivate our garden" \u2014 abandoning grand philosophy for the modest, practical work of enduring a cruel and arbitrary world.'}},{id:"hunger-games-polti-revolt",title:"The Hunger Games",creator:"Suzanne Collins, 2008",appliesToType:"plotType",appliesToId:"polti-revolt",bestStructureId:"story-circle",beats:{setup:"Katniss Everdeen lives under the Capitol's absolute rule in impoverished District 12 and volunteers for the deadly Hunger Games to save her sister Prim.",rise:"Taken to the Capitol and thrown into the arena, she adapts fast, using her skill with a bow to survive against the other tributes and the Gamemakers' traps.",climax:"She and fellow tribute Peeta defy the Capitol's rules by threatening a double suicide with poison berries, forcing the Gamemakers to let them both win.",fall:"Katniss returns home as victor to a district under tighter scrutiny, transformed from a passive tribute into the reluctant spark of a coming rebellion."},sections:{you:"Katniss Everdeen lives in the impoverished District 12, hunting illegally to feed her family under the distant, absolute rule of the Capitol.",need:"When her little sister Prim is chosen for the deadly Hunger Games, Katniss needs to protect her \u2014 she volunteers to take Prim's place in the arena.",go:"Katniss is taken to the Capitol, paraded and trained for the Games, entering a glittering, alien world built entirely on the oppressed districts' suffering.",search:"In the arena itself, she adapts fast, learning to use the terrain, alliances, and her own skill with a bow to survive against the other tributes and the Gamemakers' traps.",find:"She and fellow District 12 tribute Peeta defy the Capitol's rules by threatening a double suicide with poison berries, forcing the Gamemakers to let them both live and win.",take:"Her act of defiance marks her as a symbol of resistance, and she pays for it by becoming the Capitol's target, her family and District 12 now in far greater danger than before.",return:"Katniss returns home to District 12 as its victor, but the district itself is a changed, tenser place under closer Capitol scrutiny because of what she did in the arena.",change:"Having discovered she can defy the Capitol and survive, Katniss returns not as a passive tribute but as the reluctant spark of a rebellion that will eventually spread across all the districts."}},{id:"spartacus-polti-revolt",title:"Spartacus",creator:"dir. Stanley Kubrick, 1960",appliesToType:"plotType",appliesToId:"polti-revolt",bestStructureId:"story-circle",beats:{setup:"Spartacus, a Thracian slave trained as a gladiator, leads a bloody revolt when slaves are forced to fight each other for the entertainment of visiting Roman nobility.",rise:"The escaped slaves band together into a growing army, winning real victories against Roman legions and finding, briefly, a free community and a route out of Italy.",climax:`Betrayed by pirates bribed not to provide the promised ships, the slave army is trapped and crushed by Crassus's legions, and the survivors shout "I'm Spartacus!" to shield him from Roman identification.`,fall:"Spartacus is crucified along the Appian Way, but the revolt has changed how Rome must treat the enslaved, and his wife escapes with their newborn son to carry his memory forward."},sections:{you:"Spartacus is a Thracian slave laboring in a Roman mine, stripped of freedom and treated as less than human.",need:"Bought to train as a gladiator, he needs, above all, to survive the brutal school at Capua \u2014 and comes to need freedom itself, for himself and the other slaves around him.",go:"When gladiators are forced to fight each other for the entertainment of visiting Roman nobility, Spartacus and the others revolt, killing their guards and fleeing the school into open rebellion.",search:"The escaped slaves band together, growing into a full army as they search the Italian countryside for a way out of Rome's reach, absorbing more escaped slaves as they go.",find:"Spartacus's army wins real victories against Roman legions sent to crush it, and the slaves find, briefly, a functioning free community and a route toward ships that could carry them out of Italy.",take:"Betrayed by pirates who were bribed not to provide the promised ships, the slave army is trapped and crushed by the full might of Crassus's legions in a final, devastating battle.",return:`The survivors are captured, and rather than let Rome identify and single out Spartacus for special torture, the men "return" to a collective identity, each shouting "I'm Spartacus!" to shield him.`,change:"Spartacus is crucified along the Appian Way, but the revolt has permanently changed how Rome must treat the enslaved as a source of danger, and his wife Varinia escapes with their newborn son to carry his memory, and the idea of freedom, forward."}},{id:"oceans-eleven-polti-daring-enterprise",title:"Ocean's Eleven",creator:"dir. Steven Soderbergh, 2001",appliesToType:"plotType",appliesToId:"polti-daring-enterprise",bestStructureId:"eight-sequence",beats:{setup:"Danny Ocean assembles a team to rob three Las Vegas casino vaults simultaneously, a plan complicated by the fact that the owner, Terry Benedict, is dating Danny's ex-wife.",rise:"The crew builds an elaborate infiltration \u2014 fake SWAT teams, a fabricated power outage \u2014 and must improvise a fake robbery on the fly when Benedict's security nearly catches them.",climax:"In the vault, the team races the casino's power restoration and Benedict's approaching security to get the cash out undetected.",fall:"The eleven pull off the heist and expose Benedict's relationship troubles, leaving Vegas behind having pulled off the impossible."},sections:{"status-quo":"Danny Ocean is released from prison and immediately starts assembling a team for an audacious plan: robbing three Las Vegas casino vaults simultaneously on fight night.",predicament:"The vaults belong to Terry Benedict, a ruthless casino owner who also happens to be dating Danny's ex-wife Tess, locking Danny into a heist he can't walk away from on either the money or the personal stakes.","obstacle-1":"The team discovers the vault sits behind a state-of-the-art security system and beneath the casino floor itself, requiring far more elaborate infiltration than a simple break-in.","stakes-1":"As they build their elaborate plan \u2014 fake SWAT teams, a fabricated power outage, an earthquake-simulating device \u2014 the crew's complex moving parts multiply the ways the entire scheme could unravel.",midpoint:"Benedict's head of security grows suspicious and nearly catches the con on the vault's live camera feed, forcing the crew to improvise a fake robbery to mask their real one just as it's underway.","stakes-2":"With Benedict now personally hunting the crew and Danny's rekindled feelings for Tess complicating his focus, the personal and criminal stakes converge dangerously.",culmination:"In the vault itself, everything hinges on split-second timing as the team races the casino's power restoration and Benedict's approaching security to get the cash out undetected.",climax:"The eleven pull off the heist and, in the film's final twist, take the additional revenge of exposing Benedict's relationship troubles, leaving Vegas \u2014 and Tess \u2014 behind having pulled off the impossible."}},{id:"great-escape-polti-daring-enterprise",title:"The Great Escape",creator:"dir. John Sturges, 1963",appliesToType:"plotType",appliesToId:"polti-daring-enterprise",bestStructureId:"eight-sequence",beats:{setup:"Allied POWs transferred to a supposedly escape-proof German camp respond by committing to an enormously audacious plan: digging three tunnels to get 250 men out at once.",rise:'The prisoners forge documents and dig for months despite the constant risk of discovery, until tunnel "Tom" is found just as it nears completion, forcing all hope onto tunnel "Harry."',climax:"On the night of the breakout, only 76 of the planned 250 men escape before the alarm is raised, scattering across occupied Europe as Germany mounts a massive manhunt.",fall:"Most escapees are recaptured and fifty are executed on Hitler's order, while a handful, including Hilts, either reach freedom or return to the camp having proven the scale of what they dared."},sections:{"status-quo":"Allied POWs are transferred to a new, supposedly escape-proof German camp designed specifically to contain the most persistent escape artists in one place.",predicament:'Rather than being deterred, the prisoners, led by Roger Bartlett ("Big X"), commit to an enormously audacious plan: digging three tunnels to ge
