protected in her own home.",interdiction:"An invitation arrives to a royal ball, and her stepmother and stepsisters forbid her from going.",violation:"Cinderella still means to find a way to attend despite the forbidding, refusing to simply give up her hope of going.",reconnaissance:"Her stepmother watches her wistful hopes for the ball, sizing up exactly what it would take to keep her home.",delivery:"Seeing how badly Cinderella wants to go, the stepmother learns precisely what to withhold to keep control over her.",trickery:"The stepfamily piles on impossible chores and empty promises, dangling the ball as a reward Cinderella can never actually earn.",complicity:"Worn down and out of options, Cinderella accepts their terms and resigns herself to staying behind in tears.","villainy-lack":"The real harm lands: with no dress, no coach, and no permission, she is left with nothing but the ashes of her hope of attending.",mediation:"Her fairy godmother appears, having sensed her despair, and resolves to act on her behalf.",counteraction:"Cinderella agrees to her godmother's help, deciding after all to try for the ball.",departure:"Transformed and gowned, she departs the house in a coach conjured from a pumpkin, bound for the palace.","donor-first":"The fairy godmother tests what's on hand \u2014 a pumpkin, mice, a lizard \u2014 weighing what she can transform for the girl in front of her.","hero-reaction":"Cinderella marvels at the transformation and accepts her godmother's one condition: she must return before the stroke of midnight.","magical-agent":"She receives her enchanted gown, glass slippers, and a coach and footmen conjured from the pumpkin and mice.",guidance:"The coach carries her straight to the palace, where the ball \u2014 and the Prince \u2014 are waiting.",struggle:"At the ball she draws the Prince's full attention all night, quietly outshining the very stepsisters who hoped to claim it.",branding:"She flees at the stroke of midnight, leaving behind a single glass slipper as the mark by which she'll later be known.",victory:"She has already won the night that mattered most: the Prince was drawn to her, not to anyone her stepfamily put forward.",liquidation:"The lack that defined her \u2014 invisible, unworthy, overlooked \u2014 is undone the moment she is truly seen and wanted for herself.",return:"As the spell breaks, Cinderella dashes from the palace and hurries home before midnight fully arrives.",pursuit:"The Prince's men give chase down the palace steps, trying to catch the girl who vanished so suddenly.",rescue:"She slips away in the confusion as the coach and gown revert to pumpkin and rags just in time.",unrecognized:"Cinderella returns to the house unnoticed, mistaken again for nothing more than the household's overworked servant.",unfounded:"Her stepsisters each insist the mysterious girl from the ball was practically theirs, certain the Prince's attention belongs to one of them.","difficult-task":"The Prince declares that every maiden in the kingdom must try on the glass slipper left behind, until its true owner is found.",solution:"The search reaches Cinderella's house, where her stepsisters try and fail to force their feet into the slipper.","propp-recognition":"Cinderella is finally allowed to try the slipper herself, and it fits her perfectly.",exposure:"Her stepfamily's claims collapse in that instant, exposed as false in front of the Prince's search party.",transfiguration:"Seen at last as the girl from the ball rather than the servant she was made to seem, Cinderella is restored to her true standing.",punishment:"Her stepmother and stepsisters lose whatever power they once held over her the moment the slipper fits.",wedding:"Cinderella marries the Prince, her worth finally recognized beyond the circumstances that tried to hide it."}},{id:"of-mice-and-men-vonnegut-bad-to-worse",title:"Of Mice and Men",creator:"John Steinbeck, 1937",appliesToType:"plotType",appliesToId:"vonnegut-bad-to-worse",bestSt m a worse death, and the dream of the farm dies with him."}},{id:"hamlet-vonnegut-which-way-up",title:"Hamlet",creator:"William Shakespeare, c. 1600",appliesToType:"plotType",appliesToId:"vonnegut-which-way-up",bestStructureId:"freytag",beats:{setup:"Hamlet is charged with avenging his father's murder, a task that seems clearly righteous.",rise:"His delays, feigned madness, and moral hesitation make it unclear whether his path is heroic or self-destructive.",climax:"By the final act, nearly everyone around him is dead or doomed, the 'rightness' of his cause deeply muddied.",fall:"Hamlet dies having gotten his revenge, but whether the ending is a triumph or a tragedy is left genuinely ambiguous."},characters:[{category:"protagonist",name:"Hamlet",values:{setup:-1,rise:-1,climax:-2,fall:0},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Claudius",values:{setup:2,rise:1,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Ophelia",values:{setup:0,rise:-1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}},{category:"other",name:"Polonius",values:{setup:1,rise:1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"mentor",name:"his father's ghost",values:{setup:0,rise:1,climax:1,fall:0},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}},{category:"other",name:"Gertrude",values:{setup:1,rise:0,climax:-1,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!0}}],sections:{exposition:"Hamlet mourns his father's death and recoils from his mother's swift remarriage to his uncle Claudius.","rising-action":"His father's ghost reveals that Claudius murdered him and charges Hamlet with revenge; Hamlet accepts the task but stalls, feigning madness, until he finally secures proof of Claudius's guilt yet still can't bring himself to act.",climax:"His hesitation curdles into catastrophe \u2014 Polonius is killed and Ophelia is driven to madness and death, muddying whatever rightness his cause once had.","falling-action":"By the final act nearly everyone around him is dead or doomed, the consequences of his delay spreading past anyone's control.",denouement:"Hamlet dies having finally gotten his revenge, leaving it genuinely ambiguous whether the ending is triumph or tragedy."}},{id:"genesis-vonnegut-creation-story",title:"The Book of Genesis",creator:"Hebrew Bible",appliesToType:"plotType",appliesToId:"vonnegut-creation-story",bestStructureId:"pixar-spine",beats:{setup:"In the beginning, there is nothing \u2014 formless void and darkness.",rise:"Over six days, light, land, sea, plants, stars, and animals are brought into being in sequence.",climax:"Humanity is created last, formed in the divine image, and placed in the Garden of Eden.",fall:"Creation is complete and declared very good, the ascent from nothing to everything finished in a single arc."},characters:[{category:"protagonist",name:"God",values:{setup:0,rise:2,climax:3,fall:3},interacts:{setup:!1,rise:!1,climax:!0,fall:!0}},{category:"other",name:"Humanity",values:{setup:0,rise:0,climax:3,fall:3},interacts:{setup:!1,rise:!1,climax:!0,fall:!0}}],sections:{"once-upon":"In the beginning, there is nothing \u2014 formless void and darkness over the deep.","every-day":"Formless and empty, the deep sits in unbroken darkness, with no light, no separation, and nothing yet living \u2014 this is the only state there has ever been.","until-one-day":"God speaks, and light appears, the first act separating something from nothing.","because-1":"Because light and dark are now divided, sky and sea can be divided too, and dry land emerges from the waters.","because-2":"Because the land is dry, plants take root; then stars and seasons are set; then creatures of sea and sky and land are brought into being, each stage building visibly on the last.","until-finally":"Humanity is created last of all, formed in the divine image and given dominion over everything before it, and placed in the Garden of Eden.","ever-since":"Creation is complete and declared very good, the ascent from nothing to everything finished in a single arc."}},{id:"wizard-of-oz-mice-milieu",title:"The Wizard of Oz",creator:"dir. Victor Fleming, 1939",appliesToType:"plotType",appliesToId:"mice-milieu",bestStructureId:"hero-journey",beats:{setup:"The story opens as Dorothy is swept from Kansas into the wholly unfamiliar land of Oz.",rise:"She travels the yellow brick road, encountering the strange rules and dangers of this new world.",climax:"Oz itself reaches its turning point as the Wicked Witch is defeated and the Wizard exposed as a fraud.",fall:"The story closes as Dorothy leaves Oz behind and returns to Kansas."},characters:[{category:"protagonist",name:"Dorothy",values:{setup:0,rise:-1,climax:1,fall:3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the Wicked Witch of the West",values:{setup:0,rise:1,climax:-3,fall:-3},interacts:{setup:!1,rise:!1,climax:!0,fall:!1}},{category:"other",name:"the Wizard",values:{setup:0,rise:1,climax:-2,fall:0},interacts:{setup:!1,rise:!0,climax:!1,fall:!0}},{category:"ally",name:"the Scarecrow",values:{setup:0,rise:1,climax:-1,fall:2},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"the Tin Man",values:{setup:0,rise:1,climax:-2,fall:2},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"the Lion",values:{setup:-1,rise:0,climax:-2,fall:3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}}],sections:{"ordinary-world":"Dorothy lives an ordinary life on a Kansas farm, restless within its familiar limits.",call:"A tornado tears her out of that world and drops her into the wholly unfamiliar land of Oz.",refusal:"Bewildered and frightened by Oz's strangeness, Dorothy's only wish at first is to get back home to Kansas rather than explore this new world.",mentor:"Glinda points her toward the Emerald City, setting her on the yellow brick road to seek the Wizard, who might be able to send her home.",threshold:"She sets out along the yellow brick road, the story now bound to Oz until she finds a way to leave it.","tests-allies":"She travels deeper into Oz, gathering companions along the way and testing the strange rules, cities, and dangers of the road.",approach:"She nears the Emerald City, the promised place where the Wizard is said to hold the answer she's come for.",ordeal:"Sent into the Wicked Witch of the West's territory, the most dangerous stretch of Oz, she must survive a direct confrontation with the Witch.",reward:"The Witch is defeated, and Dorothy claims proof of the ordeal \u2014 the Witch's broomstick \u2014 to bring back to the Wizard.","road-back":"Returning to the Emerald City expecting to be sent home, she instead finds the Wizard exposed as a fraud, a man behind a curtain with no real magic to give her.",resurrection:"A final test arrives when the Wizard's balloon leaves without her, forcing one last true answer for how she can actually get home.",elixir:"Dorothy returns to Kansas changed, having learned that there's no place like home."}},{id:"da-vinci-code-mice-idea",title:"The Da Vinci Code",creator:"Dan Brown, 2003",appliesToType:"plotType",appliesToId:"mice-idea",bestStructureId:"todorov",beats:{setup:"The story opens on a murder that poses a single burning question: what secret was the victim protecting?",rise:"Langdon and Sophie chase clue after clue, each answer opening a deeper question.",climax:"The final clue is within reach, at the point of greatest uncertainty about what it will reveal.",fall:"The question is answered, and the story ends there, its central mystery resolved."},characters:[{category:"protagonist",name:"Robert Langdon",values:{setup:0,rise:0,climax:1,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Sophie Neveu",values:{setup:0,rise:1,climax:0,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"their pursuers",values:{setup:2,rise:1,climax:-1,fall:-3}, :root{ --bg:#120E1C; --panel:#1B1530; --panel2:#241C3D; --ink:#EDE7DA; --dim:#8B8398;
  --gold:#E9C88A; --ember:#D2785A; --border:rgba(237,231,218,0.10); }
*{box-sizing:border-box}
.boot{color:var(--dim);font-family:system-ui;padding:40px;text-align:center}
.app{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;padding:18px 20px 40px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.brand{font-family:'Fraunces',serif;font-weight:650;font-size:20px;color:var(--gold);white-space:nowrap}
.app-version{font-family:'Archivo',sans-serif;font-weight:400;font-size:11px;color:var(--dim);vertical-align:middle}
.title-input{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:9px 12px;font-family:'Fraunces',serif;font-size:16px}
.struct-select{background:var(--panel);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:13px}
.blurb{color:var(--dim);font-size:13px;margin:2px 0 18px}
button{font-family:inherit;cursor:pointer}
.ghost-btn{background:transparent;border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px}
.ghost-btn:hover{border-color:var(--gold);color:var(--gold)}
.primary-btn{background:var(--gold);border:none;color:#241606;font-weight:600;border-radius:8px;padding:9px 14px;font-size:13px}
.primary-btn:hover{filter:brightness(1.08)}
.icon-btn{background:transparent;border:none;color:var(--dim);font-size:14px;padding:4px 6px;border-radius:6px}
.icon-btn:hover{color:var(--ember)}
.layout{display:flex;justify-content:center}
@media (max-width: 480px){ .tl-label{width:44px;font-size:9px} .tl-clip-label{font-size:10px} }
.timeline{width:100%;max-width:960px;margin:0 auto 24px;display:flex;flex-direction:column;gap:2px}
.tl-summary{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.tl-summary-title{font-family:'Fraunces',serif;font-size:16px;color:var(--ink)}
.tl-summary-sub{font-size:11px;color:var(--dim)}
.tl-track{display:flex;align-items:stretch;gap:8px}
.tl-track-thin{height:14px}
.tl-track-thin .tl-lane{height:14px}
.tl-label{width:64px;flex:none;font-size:10px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.04em;display:flex;align-items:center}
.tl-lane{position:relative;flex:1;height:38px;background:var(--panel);border-radius:6px;overflow:hidden;
  border:1px solid var(--border)}
.tl-clip{position:absolute;top:0;bottom:0;cursor:pointer;transition:opacity .15s,filter .15s;
  display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--bg);overflow:hidden}
.tl-clip:hover{opacity:1!important}
.tl-clip.is-sel{filter:drop-shadow(0 0 6px rgba(233,200,138,.65));z-index:1}
.tl-clip-label{font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;color:#120E1C;pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 3px}
.tl-lane-written{background:transparent;border:none}
.tl-clip-filled{opacity:.9}
.tl-clip-empty{background:transparent;border:1px solid var(--border);border-radius:3px}
.tl-lane-acts .tl-clip{background:var(--panel2);border:1px solid var(--border);cursor:default}
.tl-lane-acts .tl-clip-label{color:var(--gold)}
.arcline-empty{color:var(--dim);font-size:12px;margin:0}
.char-lanes-track{align-items:flex-start;margin-top:14px}
.char-lanes-col{flex:1;display:flex;flex-direction:column;min-width:0}
.char-lanes{position:relative;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--border);border-radius:6px;overflow:hidden}
.char-lane{display:flex;flex-direction:column;border-bottom:1px solid var(--border);
  transition:opacity .15s}
.char-lane:last-child{border-bottom:none}
.char-lane.is-off{opacity:.32}
.char-lane-label{display:flex;align-items:center;gap:6px;width:100%;padding:4px 10px 0;
  background:transparent;border:none;color:var(--ink);font-size:11px;
  text-align:left;cursor:pointer;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-lane-label:hover{color:var(--gold)}
.char-lane-label i{width:8px;height:8px;border-radius:3px;flex:none}
.char-lane-label-cat{color:var(--dim);text-transform:uppercase;letter-spacing:.03em;font-size:10px}
.char-lane-chart{flex:none;height:40px;position:relative;min-width:0}
.char-lane-chart svg{width:100%;height:100%;display:block}
.char-lane-band{opacity:.1}
.char-lane-midline{stroke:var(--border);stroke-width:1.5}
.char-lane-path{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.char-lane-path-dashed{stroke-dasharray:6 5;opacity:.6}
.char-lane-point{stroke:var(--panel);stroke-width:1.5}
.char-lanes-connectors{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.char-lane-connector,.char-lane-connector-tick{vector-effect:non-scaling-stroke}
.char-lane-connector{stroke:var(--ember);stroke-width:2;stroke-dasharray:5 4;opacity:.85}
.char-lane-connector-tick{stroke-width:3}
.char-lane-interactions{display:flex;flex-direction:column;gap:2px;margin:6px 0 0;font-size:12px;color:var(--dim)}
.char-lane-interaction-note b{color:var(--ember);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin:4px 0 20px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.legend-item i{width:9px;height:9px;border-radius:3px;display:inline-block}
.legend-swatch-dashed{border:1.5px dashed rgba(0,0,0,.45);box-sizing:border-box}
.plot-type-hint{text-transform:none;letter-spacing:normal;font-size:11px;opacity:.7}
.plot-type-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin:4px 0 18px;
  padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:12px}
.plot-type-top-picker{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.04em}
.plot-type-top-picker select{background:var(--bg);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;text-transform:none;
  letter-spacing:normal;min-width:220px}
.plot-type-top-blurb{flex:1;min-width:200px;font-size:13px;color:var(--dim);margin:0}
.plot-type-top-blurb span{color:var(--gold);text-transform:uppercase;font-size:10px;letter-spacing:.05em}
.plot-type-top-blurb em{font-style:italic;display:block;margin-top:2px;color:var(--ink)}
.act-table-wrap{width:100%;overflow-x:auto;margin-top:24px}
.act-table{width:100%;min-width:760px;border-collapse:collapse;font-size:13px}
.act-table th{text-align:left;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;
  font-weight:600;padding:0 14px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.act-table td{vertical-align:top;padding:14px;border-bottom:1px solid var(--border);line-height:1.5}
.act-table tr:last-child td{border-bottom:none}
.act-table-act{min-width:170px}
.act-table-act-heading{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--gold);
  white-space:nowrap;margin-bottom:8px}
.act-table-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.act-table-list li{display:flex;gap:8px}
.act-table-list .act-breakdown-swatch{margin-top:5px}
.act-table-beat-name{font-weight:600;color:var(--ember);display:block;margin-bottom:2px}
.act-table-unwritten{font-style:italic;opacity:.6}
.act-table-interaction-line{display:block;font-size:12px;font-style:italic;margin-top:3px}
.plot-type-note{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;
  font-size:12px;color:var(--dim);line-height:1.5;margin:0 0 12px}
.plot-type-note span{font-weight:600}
.plot-type-note-tax{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--dim);opacity:.7;font-weight:400!important;margin-bottom:2px}
.example-note{background:var(--bg);border:1px solid var(--ember);border-left-width:3px;border-radius:8px;
  padding:10px 12px;font-size:12px;color:var(--dim);line-height:1.5;margin:0 0 12px}
.example-note-tag{color:var(--ember);font-weight:600}
.example-line{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5}
.example-line span{color:var(--ember);font-weight:600}
.beat-interaction-lines{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.beat-interaction-line{margin:0;font-size:13px;font-style:italic;line-height:1.5}
.side-col{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;
  min-height:420px;width:100%;max-width:720px}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:10px}
.tabs button{background:transparent;border:none;color:var(--dim);font-size:13px;padding:6px 10px;border-radius:7px}
.tabs button.is-sel{background:var(--panel2);color:var(--gold)}
.beat-subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.beat-subtabs button{background:var(--bg);border:1px solid var(--border);color:var(--dim);font-size:12px;
  padding:6px 10px;border-radius:7px;white-space:nowrap}
.beat-subtabs button.is-sel{background:var(--panel2);color:var(--gold);border-color:var(--gold)}
.beat-editor h3{font-family:'Fraunces',serif;margin:0 0 6px;font-size:20px;color:var(--gold)}
.guide{color:var(--dim);font-size:13px;margin:0 0 6px;line-height:1.5}
.idea-gen{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px}
.idea-gen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.idea-gen-grid label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.04em}
.idea-gen-grid select{background:var(--panel);border:1px solid var(--border);color:var(--ink);
  border-radius:7px;padding:8px 9px;font-size:13px;font-family:inherit}
.idea-gen-chars{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.idea-gen-char-card{display:flex;flex-direction:column;gap:6px;background:var(--panel);
  border:1px solid var(--border);border-radius:8px;padding:10px}
.idea-gen-char-row1{display:flex;gap:8px}
.idea-gen-char-row1 input{flex:1;min-width:0}
.idea-gen-char-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.idea-gen-char-card input,.idea-gen-char-card select,.idea-gen-char-card textarea{
  background:var(--bg);border:1px solid var(--border);color:var(--ink);border-radius:7px;
  padding:8px 9px;font-size:13px;font-family:inherit;width:100%;box-sizing:border-box;resize:vertical}
.idea-gen-add{margin-top:8px}
.idea-gen-preview{font-family:'Fraunces',serif;font-style:italic;color:var(--ink);font-size:15px;
  line-height:1.5;margin:14px 0 10px}
.idea-gen-actions{display:flex;gap:8px;flex-wrap:wrap}
.idea-gen-actions .primary-btn:disabled{opacity:.4}
.beat-ex-line{color:var(--gold);font-size:12px;margin:0 0 12px;opacity:.85}
.beat-ex-line em{font-style:italic}
.beat-editor textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  color:var(--ink);padding:12px;font-size:14px;line-height:1.6;font-family:'Fraunces',serif;resize:vertical}
.wc{color:var(--dim);font-size:11px;margin-top:6px;text-align:right}
.character-flow{display:flex;flex-direction:column;gap:10px}
.char-flow-legend{display:flex;flex-wrap:wrap;gap:6px}
.char-flow-chip{display:flex;align-items:center;gap:6px;background:var(--panel);
  border:1px solid var(--border);color:var(--dim);border-radius:20px;padding:6px 12px;font-size:12px}
.char-flow-chip.is-active{color:var(--ink);border-color:var(--gold)}
.char-flow-swatch{width:9px;height:9px;border-radius:3px;flex:none}
.char-flow-cat{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.char-flow-active-info{display:flex;align-items:center;justify-content:space-between;gap:8px;
