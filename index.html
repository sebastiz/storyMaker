d:"sophies-choice-polti-necessity-sacrificing",title:"Sophie's Choice",creator:"William Styron, 1979",appliesToType:"plotType",appliesToId:"polti-necessity-sacrificing-loved-ones",beats:{setup:"Sophie, a concentration camp prisoner, arrives with her two children under a Nazi officer's control.",rise:"The officer forces her into an impossible situation with no acceptable outcome.",climax:"Sophie is forced to choose which of her two children will be sent to the gas chamber, and which will live.",fall:"She survives the war physically, but the choice she was forced to make haunts and ultimately destroys her."},sections:{"status-quo":"Sophie, a Polish mother, is arrested with her two young children during the war.",inciting:"They arrive together at a concentration camp, under the control of a Nazi officer.","plot-point-1":"The officer, amused by her fear, singles Sophie out on the selection platform.",rising:"He forces her into a conversation with no acceptable answer and no way to refuse.",midpoint:"He tells her she must choose which of her two children will be sent to the gas chamber.","plot-point-2":"Sophie is given seconds to decide, or both children will be taken.",climax:"She chooses, and a guard tears one child from her arms.",resolution:"She survives the war physically, but the choice she was forced to make haunts and ultimately destroys her."}},{id:"rocky-polti-rivalry-superior-inferior",title:"Rocky",creator:"dir. John G. Avildsen, 1976",appliesToType:"plotType",appliesToId:"polti-rivalry-superior-inferior",beats:{setup:"Rocky Balboa is a small-time club boxer given a shot at the reigning heavyweight champion, Apollo Creed.",rise:"Vastly outmatched on paper, Rocky trains obsessively to have any chance at all.",climax:"The two finally meet in the ring, Rocky's grit tested against Creed's superior skill.",fall:"Rocky loses the decision but goes the distance \u2014 the assumed hierarchy between them shaken, if not overturned."},sections:{"status-quo":"Rocky Balboa is a small-time club boxer, unranked and unnoticed outside his neighborhood.",inciting:"Heavyweight champion Apollo Creed picks him for a title shot, mostly as a publicity gimmick.","plot-point-1":"Rocky, vastly outmatched on paper, decides to take the fight seriously anyway.",rising:"He trains obsessively, trying to close a gap in skill that everyone assumes is unclosable.",midpoint:"The city and press treat the fight as a foregone conclusion, Creed's superiority taken for granted.","plot-point-2":"Fight night arrives, and Rocky endures far more punishment than any observer expected him to survive.",climax:"The two finally meet across the full fifteen rounds, Rocky's grit tested against Creed's superior skill.",resolution:"Rocky loses the decision but goes the distance \u2014 the assumed hierarchy between them shaken, if not overturned."}},{id:"anna-karenina-polti-adultery",title:"Anna Karenina",creator:"Leo Tolstoy, 1877",appliesToType:"plotType",appliesToId:"polti-adultery",beats:{setup:"Anna Karenina, married to a respectable but cold official, meets the dashing Count Vronsky.",rise:"Their affair becomes public, and Russian high society turns against Anna while Vronsky faces far less consequence.",climax:"Isolated, scandalized, and increasingly paranoid about losing Vronsky's love, Anna's situation grows desperate.",fall:"Unable to see a way out of her isolation, Anna takes her own life."},sections:{"status-quo":"Anna Karenina is married to a respectable, emotionally distant government official.",inciting:"She meets the dashing Count Vronsky at a train station, and the two are instantly drawn to each other.","plot-point-1":"Anna begins an affair with Vronsky, risking everything her position in society depends on.",rising:"The affair becomes public, and Russian high society turns against Anna while Vronsky faces far less consequence.",midpoint:"She's forced to choose between her son and her lover, losing access to the child she adores.","plot-point-2":"Isolated by scandal and increasingly paranoid about losing Vronsky's love, Anna's situation grows desperate.",climax:"A final quarrel with Vronsky convinces her she has nothing left to hold onto.",resolution:"Unable to see a way out of her isolation, Anna takes her own life."}},{id:"carmen-polti-crimes-of-love",title:"Carmen",creator:"Georges Bizet (opera), 1875",appliesToType:"plotType",appliesToId:"polti-crimes-of-love",beats:{setup:"Don Jos\xE9, a soldier, becomes infatuated with the free-spirited Carmen and abandons his post for her.",rise:"His obsession leads him to desert the army and turn to smuggling to stay near her.",climax:"Carmen loses interest in Jos\xE9 and turns her attention to a bullfighter, provoking Jos\xE9's jealous rage.",fall:"Jos\xE9 kills Carmen rather than let her go, a crime born entirely from a love he couldn't control."},sections:{"status-quo":"Don Jos\xE9 is a disciplined soldier stationed in Seville.",inciting:"He meets Carmen, a free-spirited factory worker, who deliberately draws his attention.","plot-point-1":"He lets her escape arrest, and is jailed himself for it \u2014 the first thing he sacrifices for her.",rising:"Released, Jos\xE9 abandons his post and his fianc\xE9e to be near Carmen, drifting into smuggling to stay close.",midpoint:"Carmen's affections begin to cool as Jos\xE9's jealous devotion grows more possessive.","plot-point-2":"She turns her attention openly to a celebrated bullfighter, provoking Jos\xE9's jealous rage.",climax:"Outside the bullring, Jos\xE9 begs her one last time to return to him, and she refuses.",resolution:"He kills Carmen rather than let her go, a crime born entirely from a love he couldn't control."}},{id:"othello-polti-discovery-dishonor",title:"Othello",creator:"William Shakespeare, c. 1603",appliesToType:"plotType",appliesToId:"polti-discovery-dishonor-loved-one",beats:{setup:"Othello, a respected general, marries Desdemona, whom he loves deeply and trusts completely.",rise:"His ensign Iago plants seeds of doubt, fabricating evidence that Desdemona has been unfaithful.",climax:"Othello becomes convinced of Desdemona's betrayal, his trust in her collapsing entirely.",fall:"Othello kills Desdemona, only to learn moments later that Iago's evidence was a complete fabrication."},sections:{"status-quo":"Othello, a respected general, marries Desdemona in secret, trusting her completely.",inciting:"His ensign Iago, resentful over a denied promotion, resolves to destroy their marriage.","plot-point-1":"Iago plants the first seeds of doubt, hinting that Desdemona has been unfaithful with Cassio.",rising:"He fabricates evidence \u2014 a misplaced handkerchief \u2014 to make the affair seem real.",midpoint:"Othello's trust begins visibly cracking, his jealousy growing faster than any actual proof.","plot-point-2":"Convinced entirely by Iago's lies, Othello resolves that Desdemona must die for her supposed dishonor.",climax:"He confronts and smothers her in their bed, refusing to believe her denials.",resolution:"Othello learns moments later that Iago's evidence was a complete fabrication, and kills himself in grief and horror."}},{id:"romeo-juliet-polti-obstacles-love",title:"Romeo and Juliet",creator:"William Shakespeare, c. 1595",appliesToType:"plotType",appliesToId:"polti-obstacles-love",beats:{setup:"Romeo and Juliet fall in love, only to learn their families are bitter, sworn enemies.",rise:"They marry in secret, but the feud keeps finding new ways to force them apart.",climax:"Romeo's exile after a fatal duel puts the final, seemingly insurmountable obstacle between them.",fall:"A plan to reunite them fails to reach Romeo in time, and the obstacle proves fatal to them both."},sections:{"status-quo":"The Montagues and Capulets have fought a bitter, generations-old feud across Verona.",inciting:"Romeo and Juliet fall for each other at a party, unaware \u2014 then all too aware \u2014 of whose families they belong to.","plot-point-1":"They marry in secret the next day, hoping to bridge the feud rather than be stopped by it.",rising:"The feud keeps finding new ways to threaten them, each obstacle worse than the last.",midpoint:"A street brawl turns fatal when Tybalt kills Romeo's friend Mercutio in front of him.","plot-point-2":"Romeo kills Tybalt in retaliation and is banished from Verona, the marriage's secrecy now nearly impossible to sustain.",climax:"A desperate plan to fake Juliet's death and reunite the couple in secret goes wrong at the worst possible moment.",resolution:"The message meant to warn Romeo never reaches him, and the obstacle proves fatal to them both."}},{id:"romeo-juliet-polti-enemy-loved",title:"Romeo and Juliet",creator:"William Shakespeare, c. 1595",appliesToType:"plotType",appliesToId:"polti-enemy-loved",beats:{setup:"Juliet discovers at the ball that the boy she's fallen for, Romeo, is a Montague \u2014 her family's sworn enemy.",rise:"She chooses him anyway, secretly marrying him despite everything her family stands against.",climax:"Romeo's killing of her cousin Tybalt forces Juliet to choose openly between her family's hatred and her love.",fall:"She stays loyal to Romeo to the end, her love for the 'enemy' outlasting even her own life."},sections:{"status-quo":"Juliet is a Capulet, expected to marry well within her family's standing.",inciting:"At a party, she falls for a masked stranger, only to learn afterward that he's Romeo \u2014 a Montague.","plot-point-1":"Rather than reject him, Juliet chooses him anyway, agreeing to marry him in secret the next day.",rising:"She hides the marriage from her family even as their hatred of the Montagues continues undimmed.",midpoint:"Her cousin Tybalt, enraged at Romeo's presence at the party, vows violence against him.","plot-point-2":"Romeo kills Tybalt in the street, forcing Juliet to choose openly between her family's grief and her love for his killer.",climax:"Her parents, unaware of her marriage, try to force her into wedding another man entirely.",resolution:"She stays loyal to Romeo to the end, her love for the \u201Cenemy\u201D outlasting even her own life."}},{id:"macbeth-polti-ambition",title:"Macbeth",creator:"William Shakespeare, c. 1606",appliesToType:"plotType",appliesToId:"polti-ambition",beats:{setup:"Macbeth, a loyal general, is told by three witches that he is destined to become king.",rise:"Ambition, fed by his wife, pushes him to murder King Duncan and seize the throne.",climax:"He murders more and more to protect his stolen crown, his ambition consuming everyone around him.",fall:"His ambition finally collapses under rebellion, and he is killed by the men he wronged to get there."},sections:{"status-quo":"Macbeth is a loyal general, celebrated for his courage on the battlefield.",inciting:"Three witches greet him with a prophecy that he is destined to become king.","plot-point-1":"Fed by his wife's ambition as much as his own, Macbeth murders King Duncan in his sleep.",rising:"He seizes the throne, but guilt and suspicion immediately begin to close in around him.",midpoint:"He has his friend Banquo murdered, convinced the crown now demands more blood to hold, not less.","plot-point-2":"Increasingly paranoid, he orders the slaughter of Macduff's entire family to eliminate any threat.",climax:"Rebellion reaches his gates, and Macduff kills him in single combat, exempt from an old prophecy.",resolution:"His ambition finally collapses under rebellion, and he is killed by the men he wronged to get there."}},{id:"prometheus-polti-conflict-with-god",title:"Prometheus (Greek myth)",creator:"traditional myth",appliesToType:"plotType",appliesToId:"polti-conflict-with-god",beats:{setup:"Prometheus, a Titan, sees humanity struggling in cold darkness without fire.",rise:"Defying Zeus's explicit will, he steals fire from the gods and gives it to humankind.",climax:"Zeus punishes Prometheus by chaining him to a rock, where an eagle eats his regenerating liver each day.",fall:"Prometheus endures his eternal punishment, humanity's gift of fire an irreversible act of defiance against the gods."},sections:{"status-quo":"Prometheus, a Titan, watches humanity struggle in cold darkness, without fire or craft.",inciting:"Zeus forbids the gods from giving mortals fire, wanting them kept weak and dependent.","plot-point-1":"Prometheus defies him anyway, stealing fire from Olympus to give to humankind.",rising:"With fire, humanity begins to flourish \u2014 tools, warmth, civilization spreading across the earth.",midpoint:"Zeus discovers the theft and resolves to punish Prometheus in a way that will never truly end.","plot-point-2":"Prometheus is chained to a remote rock, unable to free himself from Zeus's judgment.",climax:"An eagle arrives each day to eat his regenerating liver, only for it to grow back overnight.",resolution:"Prometheus endures his eternal punishment, humanity's gift of fire an irreversible act of defiance against the gods."}},{id:"othello-polti-mistaken-jealousy",title:"Othello",creator:"William Shakespeare, c. 1603",appliesToType:"plotType",appliesToId:"polti-mistaken-jealousy",beats:{setup:"Othello trusts his wife Desdemona completely as their marriage begins.",rise:"Iago manufactures false evidence \u2014 a misplaced handkerchief \u2014 to convince Othello of an affair that never happened.",climax:"Othello's jealousy, entirely built on lies, drives him to violence against the wife he loves.",fall:"Only after killing Desdemona does Othello learn the truth, and take his own life in grief and horror."},sections:{"status-quo":"Othello and Desdemona begin their marriage in complete mutual trust.",inciting:"Iago, resentful over a denied promotion, begins quietly working to destroy that trust.","plot-point-1":"He manufactures the first piece of false evidence \u2014 a handkerchief planted in Cassio's room.",rising:"Othello's suspicion grows despite having no real proof beyond Iago's careful suggestions.",midpoint:"Iago stages a conversation for Othello to half-overhear, letting him fill in the worst conclusions himself.","plot-point-2":"Othello's jealousy, entirely built on lies, hardens into a resolve to kill the wife he loves.",climax:"He smothers Desdemona in their bed despite her desperate denials.",resolution:"Only after killing her does Othello learn the truth, and takes his own life in grief and horror."}},{id:"crucible-polti-erroneous-judgment",title:"The Crucible",creator:"Arthur Miller, 1953",appliesToType:"plotType",appliesToId:"polti-erroneous-judgment",beats:{setup:"A group of girls in Salem, caught dancing in the woods, accuse others of witchcraft to protect themselves.",rise:"The town's courts, eager to believe the accusations, condemn more and more innocent people based on false testimony.",climax:"John Proctor, trying to expose the girls' lies, is himself accused and arrested.",fall:"Proctor is executed rather than falsely confess, a victim of a judgment built entirely on deception."},sections:{"status-quo":"A group of girls in Salem is caught dancing in the woods, a serious offense in the strict Puritan town.",inciting:"To avoid punishment, the girls claim they were compelled by witchcraft, and begin naming names.","plot-point-1":"The town's courts, eager to believe them, open formal proceedings against the accused.",rising:"More and more people are condemned on nothing but the girls' testimony and confessions extracted under pressure.",midpoint:"John Proctor, aware the girls are lying, struggles with how to expose them without revealing his own affair.","plot-point-2":"He finally accuses the girls publicly, only to be accused himself in the resulting chaos.",climax:"Proctor is offered his life if he'll falsely confess to witchcraft himself.",resolution:"He refuses and is executed rather than lie, a victim of a judgment built entirely on deception."}},{id:"crime-punishment-polti-remorse",title:"Crime and Punishment",creator:"Fyodor Dostoevsky, 1866",appliesToType:"plotType",appliesToId:"polti-remorse",beats:{setup:"Raskolnikov, a poor former student, murders a pawnbroker, convincing himself he's above ordinary morality.",rise:"Guilt and paranoia consume him even as the police fail to connect him to the crime.",climax:"His remorse grows unbearable, driving him toward confession despite having nearly gotten away with it.",fall:"Raskolnikov confesses and accepts his punishment, finding a path toward redemption through suffering."},sections:{"status-quo":"Raskolnikov, a poor former student, lives in isolation, nursing a theory that some people are above ordinary morality.",inciting:"He murders an elderly pawnbroker to test that theory, and kills her sister when she stumbles on the scene.","plot-point-1":"He escapes undetected, convinced the crime proves he belongs among history's great men.",rising:"Guilt and paranoia consume him instead, even as the police fail to connect him to the crime.",midpoint:"A police investigator begins circling him psychologically, certain of his guilt but lacking proof.","plot-point-2":"His remorse grows unbearable, driving him toward confession despite having nearly gotten away with it.",climax:"He confesses to Sonya, the one person who's shown him unconditional compassion, and then to the police.",resolution:"Raskolnikov accepts his punishment, finding a path toward redemption through the suffering he once thought he was above."}},{id:"odyssey-polti-recovery-lost-one",title:"The Odyssey",creator:"Homer, c. 8th century BCE",appliesToType:"plotType",appliesToId:"polti-recovery-lost-one",beats:{setup:"Odysseus has been gone from home for twenty years, presumed dead by most who knew him.",rise:"His wife Penelope fends off suitors while his son Telemachus searches for news of his father.",climax:"Odysseus finally reaches Ithaca in disguise, testing who around him has stayed loyal.",fall:"He reveals himself to Penelope and Telemachus, reunited with the family he never stopped trying to reach."},sections:{"status-quo":"Odysseus has been gone from home for twenty years, presumed dead by most who knew him.",inciting:"The gods finally grant him permission to leave Calypso's island and resume his journey home.","plot-point-1":"He sets out on a raft, determined to reach Ithaca whatever obstacles the sea still holds.",rising:"His wife Penelope fends off aggressive suitors at home while his son Telemachus searches abroad for news of him.",midpoint:"Odysseus reaches Ithaca at last, disguised as a beggar to avoid the suitors who'd kill him on sight.","plot-point-2":"He tests who among his household has stayed loyal, revealing himself first only to his son.",climax:"He strings his old bow and slaughters the suitors who've occupied his home for years.",resolution:"He reveals himself fully to Penelope and Telemachus, reunited with the family he never stopped trying to reach."}},{id:"bambi-polti-loss-loved-ones",title:"Bambi",creator:"Disney, dir. David Hand, 1942",appliesToType:"plotType",appliesToId:"polti-loss-loved-ones",beats:{setup:"Bambi, a young deer, grows up under his mother's protection in the forest.",rise:"Hunters begin appearing in the forest, and the animals live under constant threat.",climax:"Bambi's mother is killed by a hunter while fleeing with him across a meadow.",fall:"Bambi grows up without her, eventually becoming a father himself, carrying her loss into his own life."},sections:{"status-quo":"Bambi, a young deer, grows up under his mother's watchful protection in the forest.",inciting:"Hunters begin appearing in the forest, and the animals start living under constant, quiet threat.","plot-point-1":"Bambi's mother teaches him to freeze and flee at the first sign of danger.",rising:"The forest grows more dangerous each season, and Bambi learns to navigate its fear.",midpoint:"A hunt drives the animals into open panic, scattering the herd across the meadow.","plot-point-2":"Bambi's mother is shot fleeing with him across that same meadow.",climax:"Bambi searches for her afterward, only to be told by his father that she won't be coming back.",resolution:"Bambi grows up without her, eventually becoming a father himself, carrying her loss into his own life."}},{id:"wizard-of-oz-vonnegut-man-in-hole",title:"The Wizard of Oz",creator:"dir. Victor Fleming, 1939",appliesToType:"plotType",appliesToId:"vonnegut-man-in-hole",beats:{setup:"Dorothy lives an ordinary life on a Kansas farm.",rise:"A tornado sweeps her into the strange, dangerous land of Oz, far from home and everyone she knows.",climax:"She and her friends face the Wicked Witch at her most dangerous, deep into unfamiliar territory.",fall:"Dorothy defeats the witch, gets her wish granted, and returns home valuing it more than she ever did before."},sections:{"status-quo":"Dorothy lives an ordinary, restless life on a Kansas farm.",inciting:"A tornado sweeps her and her house into the strange, unfamiliar land of Oz.","plot-point-1":"A falling house kills the Wicked Witch of the East, and Dorothy is sent down the yellow brick road to find a way home.",rising:"She gathers companions \u2014 a Scarecrow, Tin Man, and Lion \u2014 each searching for something they believe they lack.",midpoint:"They reach the Emerald City, only to be sent on a dangerous errand before the Wizard will help them.","plot-point-2":"The Wicked Witch of the West captures Dorothy, holding her deep in unfamiliar, hostile territory.",climax:"Dorothy melts the witch with a bucket of water, ending the immediate danger to her friends.",resolution:"She defeats the witch, gets her wish granted, and returns home valuing it more than she ever did before."}},{id:"when-harry-met-sally-vonnegut-boy-meets-girl",title:"When Harry Met Sally...",creator:"dir. Rob Reiner, 1989",appliesToType:"plotType",appliesToId:"vonnegut-boy-meets-girl",beats:{setup:"Harry and Sally meet and instantly clash over whether men and women can ever just be friends.",rise:"Over years of crossing paths, their friendship deepens even as romantic complications keep them apart.",climax:"A moment of vulnerability threatens to end their friendship entirely just as feelings become undeniable.",fall:"They finally admit they're in love and end up together, closer than they'd have been without the wait."},sections:{"status-quo":"Harry and Sally share a long car ride from Chicago to New York as strangers.",inciting:"They clash the entire drive over whether men and women can ever really just be friends.","plot-point-1":"They part on bad terms, certain they'll never cross paths again.",rising:"Chance keeps reuniting them over the years, and an unlikely friendship slowly takes root.",midpoint:"That friendship deepens further after they each go through painful breakups and lean on each other.","plot-point-2":"A night of vulnerability leads them to sleep together, and the friendship nearly collapses under the weight of it.",climax:"Sally, hurt and confused, pushes Harry away just as his own feelings finally become undeniable to him.",resolution:"He races to tell her he loves her, and they end up together, closer than they'd have been without the wait."}},{id:"cinderella-vonnegut-cinderella",title:"Cinderella",creator:"traditional folk tale",appliesToType:"plotType",appliesToId:"vonnegut-cinderella",beats:{setup:"Cinderella is overworked and mistreated by her stepmother and stepsisters, denied any life of her own.",rise:"With her fairy godmother's help, she attends the royal ball and catches the Prince's attention \u2014 then flees at midnight, losing a glass slipper.",climax:"The Prince's search for the slipper's owner puts Cinderella's fate in the hands of a single, decisive test.",fall:"The slipper fits; Cinderella marries the Prince, her worth finally recognized beyond her circumstances."},sections:{"status-quo":"Cinderella lives as an unpaid servant in her own home, worked to exhaustion by her stepmother and stepsisters.",inciting:"An invitation arrives to a royal ball, and her stepfamily forbids her from going.","plot-point-1":"Her fairy godmother transforms her rags into a gown and sends her to the ball in a pumpkin coach.",rising:"She dances with the Prince all night, the two of them drawn to each other before anyone learns who she is.",midpoint:"The clock strikes midnight, breaking the spell, and Cinderella flees, losing a glass slipper on the stairs.","plot-point-2":"The Prince's search for the slipper's owner reaches her stepfamily's house, where her stepsisters try and fail to force their feet into it.",climax:"Cinderella is finally allowed to try the slipper herself, and it fits perfectly.",resolution:"She marries the Prince, her worth recognized at last beyond the circumstances that tried to hide it."}},{id:"of-mice-and-men-vonnegut-bad-to-worse",title:"Of Mice and Men",creator:"John Steinbeck, 1937",appliesToType:"plotType",appliesToId:"vonnegut-bad-to-worse",beats:{setup:"George and Lennie, migrant workers, dream of one day owning a small farm of their own.",rise:"Lennie's immense strength and limited understanding keep causing accidental trouble wherever they go.",climax:"Lennie accidentally kills a woman, and a mob forms to hunt him down.",fall:"George is forced to kill Lennie himself to spare him a worse death, and the dream of the farm dies with him."},sections:{"status-quo":"George and Lennie, migrant workers, arrive at a new ranch hoping to save enough for a small farm of their own.",inciting:"Lennie's immense strength and limited understanding immediately start causing small, worrying incidents.","plot-point-1":"He accidentally kills his puppy through careless affection, foreshadowing worse to come.",rising:"Curley's wife, lonely and reckless, keeps seeking Lennie out despite the danger everyone senses in it.",midpoint:"She lets Lennie stroke her hair in the barn, flattered by his gentleness.","plot-point-2":"Lennie panics when she struggles to pull away, and accidentally breaks her neck trying to quiet her.",climax:"A mob forms to hunt him down, and George finds Lennie first, hiding by the river they'd once dreamed by.",resolution:"George is forced to kill Lennie himself to spare him a worse death, and the dream of the farm dies with him."}},{id:"hamlet-vonnegut-which-way-up",title:"Hamlet",creator:"William Shakespeare, c. 1600",appliesToType:"plotType",appliesToId:"vonnegut-which-way-up",beats:{setup:"Hamlet is charged with avenging his father's murder, a task that seems clearly righteous.",rise:"His delays, feigned madness, and moral hesitation make it unclear whether his path is heroic or self-destructive.",climax:"By the final act, nearly everyone around him is dead or doomed, the 'rightness' of his cause deeply muddied.",fall:"Hamlet dies having gotten his revenge, but whether the ending is a triumph or a tragedy is left genuinely ambiguous."},sections:{"status-quo":"Hamlet mourns his father's death and his mother's swift remarriage to his uncle.",inciting:"His father's ghost reveals Claudius murdered him, charging Hamlet with revenge.","plot-point-1":"Hamlet accepts the task but immediately begins hesitating, feigning madness instead of acting.",rising:"His delays and moral uncertainty make it genuinely unclear whether his path is heroic or self-destructive.",midpoint:"He gets his proof of Claudius's guilt but still can't bring himself to act decisively.","plot-point-2":"His hesitation causes collateral damage \u2014 Polonius dead, Ophelia driven to madness and death.",climax:"By the final act, nearly everyone around him is dead or doomed, the \u201Crightness\u201D of his cause deeply muddied.",resolution:"Hamlet dies having gotten his revenge, but whether the ending is a triumph or a tragedy is left genuinely ambiguous."}},{id:"genesis-vonnegut-creation-story",title:"The Book of Genesis",creator:"Hebrew Bible",appliesToType:"plotType",appliesToId:"vonnegut-creation-story",beats:{setup:"In the beginning, there is nothing \u2014 formless void and darkness.",rise:"Over six days, light, land, sea, plants, stars, and animals are brought into being in sequence.",climax:"Humanity is created last, formed in the divine image, and placed in the Garden of Eden.",fall:"Creation is complete and declared very good, the ascent from nothing to everything finished in a single arc."},sections:{"status-quo":"In the beginning, there is nothing \u2014 formless void and darkness over the deep.",inciting:"God speaks, and light appears, the first act separating something from nothing.","plot-point-1":"Sky and sea are divided, and dry land emerges from the waters.",rising:"Plants, then stars and seasons, then creatures of sea and sky are brought into being in sequence.",midpoint:"Land animals fill the earth, each ordered stage building visibly on the last.","plot-point-2":"Humanity is created last of all, formed in the divine image and given dominion over everything before it.",climax:"Humanity is placed in the Garden of Eden, the culmination of everything built across the six days.",resolution:"Creation is complete and declared very good, the ascent from nothing to everything finished in a single arc."}},{id:"wizard-of-oz-mice-milieu",title:"The Wizard of Oz",creator:"dir. Victor Fleming, 1939",appliesToType:"plotType",appliesToId:"mice-milieu",beats:{setup:"The story opens as Dorothy is swept from Kansas into the wholly unfamiliar land of Oz.",rise:"She travels the yellow brick road, encountering the strange rules and dangers of this new world.",climax:"Oz itself reaches its turning point as the Wicked Witch is defeated and the Wizard exposed as a fraud.",fall:"The story closes as Dorothy leaves Oz behind and returns to Kansas."},sections:{"status-quo":"Dorothy lives an ordinary life on a Kansas farm, restless within its familiar limits.",inciting:"A tornado sweeps her from Kansas into the wholly unfamiliar land of Oz.","plot-point-1":"She sets out along the yellow brick road, the story now bound to this new place until she leaves it.",rising:"She travels deeper into Oz, encountering its strange rules, cities, and dangers.",midpoint:"The Emerald City reveals itself to be far less grand than its reputation, run by a man behind a curtain.","plot-point-2":"The Wicked Witch of the West's territory becomes the most dangerous stretch of Oz she must cross.",climax:"Oz itself reaches its turning point as the Witch is defeated and the Wizard exposed as a fraud.",resolution:"The story closes as Dorothy leaves Oz behind and returns to Kansas."}},{id:"da-vinci-code-mice-idea",title:"The Da Vinci Code",creator:"Dan Brown, 2003",appliesToType:"plotType",appliesToId:"mice-idea",beats:{setup:"The story opens on a murder that poses a single burning question: what secret was the victim protecting?",rise:"Langdon and Sophie chase clue after clue, each answer opening a deeper question.",climax:"The final clue is within reach, at the point of greatest uncertainty about what it will reveal.",fall:"The question is answered, and the story ends there, its central mystery resolved."},sections:{"status-quo":"Robert Langdon is lecturing on symbols in Paris, his expertise purely academic so far.",inciting:"A murdered curator's coded message poses a single burning question: what secret was he protecting?","plot-point-1":"Langdon commits to answering it, drawn in as a suspect as much as an investigator.",rising:"He and Sophie chase clue after clue through the Louvre and beyond, each answer opening a deeper question.",midpoint:"The clues point toward a secret society and a truth hidden for centuries, raising the stakes of the idea itself.","plot-point-2":"Their pursuers close in just as the final clue comes within reach.",climax:"The last piece falls into place, at the point of greatest uncertainty about what it will reveal.",resolution:"The question is answered, and the story ends there, its central mystery resolved."}},{id:"christmas-carol-mice-character",title:"A Christmas Carol",creator:"Charles Dickens, 1843",appliesToType:"plotType",appliesToId:"mice-character",beats:{setup:"The story opens on Scrooge, thoroughly satisfied wi :root{ --bg:#120E1C; --panel:#1B1530; --panel2:#241C3D; --ink:#EDE7DA; --dim:#8B8398;
  --gold:#E9C88A; --ember:#D2785A; --border:rgba(237,231,218,0.10); }
*{box-sizing:border-box}
.boot{color:var(--dim);font-family:system-ui;padding:40px;text-align:center}
.app{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;padding:18px 20px 40px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.brand{font-family:'Fraunces',serif;font-weight:650;font-size:20px;color:var(--gold);white-space:nowrap}
.title-input{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:9px 12px;font-family:'Fraunces',serif;font-size:16px}
.struct-select{background:var(--panel);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:13px}
.blurb{color:var(--dim);font-size:13px;margin:2px 0 18px}
button{font-family:inherit;cursor:pointer}
.ghost-btn{background:transparent;border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px}
.ghost-btn:hover{border-color:var(--gold);color:var(--gold)}
.primary-btn{background:var(--gold);border:none;color:#241606;font-weight:600;border-radius:8px;padding:9px 14px;font-size:13px}
.primary-btn:hover{filter:brightness(1.08)}
.icon-btn{background:transparent;border:none;color:var(--dim);font-size:14px;padding:4px 6px;border-radius:6px}
.icon-btn:hover{color:var(--ember)}
.layout{display:flex;justify-content:center}
@media (max-width: 480px){ .tl-label{width:44px;font-size:9px} .tl-clip-label{font-size:10px} }
.timeline{width:100%;max-width:960px;margin:0 auto 24px;display:flex;flex-direction:column;gap:2px}
.tl-summary{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.tl-summary-title{font-family:'Fraunces',serif;font-size:16px;color:var(--ink)}
.tl-summary-sub{font-size:11px;color:var(--dim)}
.tl-track{display:flex;align-items:stretch;gap:8px}
.tl-track-thin{height:14px}
.tl-track-thin .tl-lane{height:14px}
.tl-label{width:64px;flex:none;font-size:10px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.04em;display:flex;align-items:center}
.tl-lane{position:relative;flex:1;height:38px;background:var(--panel);border-radius:6px;overflow:hidden;
  border:1px solid var(--border)}
.tl-clip{position:absolute;top:0;bottom:0;cursor:pointer;transition:opacity .15s,filter .15s;
  display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--bg);overflow:hidden}
.tl-clip:hover{opacity:1!important}
.tl-clip.is-sel{filter:drop-shadow(0 0 6px rgba(233,200,138,.65));z-index:1}
.tl-clip-label{font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;color:#120E1C;pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 3px}
.tl-lane-written{background:transparent;border:none}
.tl-clip-filled{opacity:.9}
.tl-clip-empty{background:transparent;border:1px solid var(--border);border-radius:3px}
.tl-lane-acts .tl-clip{background:var(--panel2);border:1px solid var(--border);cursor:default}
.tl-lane-acts .tl-clip-label{color:var(--gold)}
.tl-lane-arc .tl-clip{border-radius:3px}
.tl-track-arclines{height:140px}
.tl-track-arclines .tl-lane{height:140px}
.tl-lane-arclines{background:var(--panel)}
.arcline-svg{width:100%;height:100%;display:block}
.arcline-midline{stroke:var(--border);stroke-width:1.5}
.arcline-interaction{stroke:var(--ember);stroke-width:1.5;stroke-dasharray:6 5;opacity:.7}
.arcline-path{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.arcline-point{stroke:var(--panel);stroke-width:1.5}
.arcline-legend{margin-top:-8px}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:4px 0 20px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.legend-item i{width:9px;height:9px;border-radius:3px;display:inline-block}
.plot-type-hint{text-transform:none;letter-spacing:normal;font-size:11px;opacity:.7}
.plot-type-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin:4px 0 18px;
  padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:12px}
.plot-type-top-picker{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.04em}
.plot-type-top-picker select{background:var(--bg);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;text-transform:none;
  letter-spacing:normal;min-width:220px}
.plot-type-top-blurb{flex:1;min-width:200px;font-size:13px;color:var(--dim);margin:0}
.plot-type-top-blurb span{color:var(--gold);text-transform:uppercase;font-size:10px;letter-spacing:.05em}
.plot-type-top-blurb em{font-style:italic;display:block;margin-top:2px;color:var(--ink)}
.act-table-wrap{width:100%;overflow-x:auto;margin-top:24px}
.act-table{width:100%;min-width:760px;border-collapse:collapse;font-size:13px}
.act-table th{text-align:left;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;
  font-weight:600;padding:0 14px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.act-table td{vertical-align:top;padding:14px;border-bottom:1px solid var(--border);line-height:1.5}
.act-table tr:last-child td{border-bottom:none}
.act-table-act{white-space:nowrap;font-weight:600;color:var(--gold)}
.act-table-act .act-breakdown-swatch{display:inline-block;vertical-align:middle;margin:0 8px 2px 0}
.act-table-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.act-table-list li{display:flex;gap:8px}
.act-table-list .act-breakdown-swatch{margin-top:5px}
.act-table-beat-name{font-weight:600;color:var(--ember);display:block;margin-bottom:2px}
.plot-type-panel{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:14px 16px}
