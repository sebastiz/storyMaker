t 250 men out at once.',"obstacle-1":"The sandy soil, the need to hide tons of excavated dirt from guards, and the sheer scale of the tunneling operation threaten to collapse the plan before it even reaches the wire.","stakes-1":"The prisoners forge documents, sew civilian clothes, and build ventilation and rail systems for the tunnels, with the constant risk of discovery raising the cost of failure with every passing week.",midpoint:'Tunnel "Tom" is discovered by the guards just as it nears completion, forcing the prisoners to shift all their hopes onto the remaining tunnel, "Harry," and accept a smaller escape than originally planned.',"stakes-2":'On the night of the breakout, tunnel "Harry" comes up short of the tree line in the open, and only 76 of the planned 250 men manage to get out before the alarm is raised.',culmination:"The escapees scatter across occupied Europe by train, bicycle, and on foot, each pursuing his own desperate route toward neutral territory as German forces mobilize a massive manhunt.",climax:"Most of the escapees are recaptured, and fifty are executed on Hitler's direct order in reprisal, while a handful, including Hilts on his motorcycle, either reach freedom or return to the camp having proven the astonishing scale of what the prisoners dared attempt."}},{id:"kidnapped-polti-abduction-2",title:"Kidnapped",creator:"Robert Louis Stevenson, 1886",appliesToType:"plotType",appliesToId:"polti-abduction",bestStructureId:"weiland",beats:{setup:"Orphaned David Balfour travels to claim his inheritance from his miserly uncle Ebenezer, who instead has him kidnapped and sold aboard a slave ship bound for the Carolinas.",rise:"Imprisoned below decks, David allies with the rescued Jacobite fugitive Alan Breck Stewart after learning the crew means to murder him, and together they fight off the crew when the plot is exposed.",climax:"Shipwrecked on the coast and thrown into the Highlands, David witnesses a political murder and becomes a hunted fugitive alongside Alan, forced to survive a brutal trek across the wilderness.",fall:"David finally reaches Edinburgh, exposes Ebenezer's crime with a lawyer's help, and reclaims his rightful inheritance, having been hardened by everything he survived."},sections:{hook:"David Balfour, newly orphaned in provincial Scotland, sets out for the House of Shaws to claim the inheritance his late father never mentioned.",inciting:"His uncle Ebenezer, a miserly recluse, greets him with suspicion and tries to kill him by sending him up a dark, broken staircase in the tower.","plot-point-1":"Failing that, Ebenezer tricks David into going down to the harbor, where Captain Hoseason and his crew seize him and lock him below decks aboard the brig Covenant, bound to be sold into indentured servitude in the Carolinas.","pinch-1":"Confined in the ship's stinking hold, David glimpses the brutal, mercenary world Hoseason's crew practices, reinforcing that his captors intend real harm and answer to no law he can appeal to.",midpoint:"When the Covenant nearly runs down a small boat, the sole survivor pulled aboard is Alan Breck Stewart, a fugitive Jacobite; David learns of the crew's plot to murder Alan for his money belt and warns him, turning David from a passive prisoner into an active conspirator.","pinch-2":"David and Alan fight off the crew in the round-house in a bloody battle, but the ship later wrecks on the reefs near Mull, leaving David marooned, injured, and separated from Alan amid hostile, unfamiliar territory.","plot-point-3":'Making his way across the Highlands, David witnesses the assassination of Colin Campbell (the "Appin Murder") and is himself accused, forcing him and the outlawed Alan into a desperate flight together across the heather with soldiers hunting them.',climax:"After a grueling trek through the Highlands, near-starvation, and a bitter quarrel that nearly ends their friendship, David and Alan reach Edinburgh, where David enlists a lawyer to corner Ebenezer and force him to admit he paid Hoseason to have David kidnapped.",resolution:"With his uncle exposed and forced to settle a fair income on him, David steps into his rightful inheritance as a landed young man, his ordeal transforming him from a naive boy into someone who has survived the world's cruelty and treachery."}},{id:"prisoners-polti-abduction-3",title:"Prisoners",creator:"dir. Denis Villeneuve, 2013",appliesToType:"plotType",appliesToId:"polti-abduction",bestStructureId:"weiland",beats:{setup:"Two young girls vanish from a quiet Thanksgiving gathering after wandering near a suspicious RV, launching a frantic search.",rise:"When the disabled prime suspect Alex is released for lack of evidence, grieving father Keller Dover abducts and tortures him for answers while Detective Loki uncovers a pattern of past disappearances tied to a hidden maze symbol.",climax:"A raid reveals a buried victim and a shooting nearly kills Loki, who survives to learn that Alex's aunt Holly has been the true abductor, using her nephew as a shield.",fall:"Loki rescues one girl from Holly's hidden chamber, while Keller \u2014 having crossed his own moral line \u2014 is trapped in a pit on her property as the story ends on an unresolved note."},sections:{hook:"On Thanksgiving in a quiet Pennsylvania town, the Dover and Birch families gather for dinner while their two young daughters, Anna and Joy, go off to play.",inciting:"The girls vanish without a trace, last seen near a battered RV parked on the street, and a search turns up nothing but panic.","plot-point-1":"Detective Loki traces the RV to Alex Jones, a mentally disabled young man, but with no evidence tying him to the girls, the police are forced to release him \u2014 pushing devastated father Keller Dover to take matters into his own hands.","pinch-1":"Keller abducts Alex himself and locks him in an abandoned, boarded-up apartment building, escalating to brutal torture in his conviction that Alex knows where the girls are, even as Alex insists he doesn't.",midpoint:"Loki uncovers a string of unsolved child disappearances over the years connected to a mysterious maze symbol, shifting the investigation from a single crime to a hidden, long-running pattern that someone has been orchestrating.","pinch-2":"A raid on a suspect priest's house turns up a buried, decomposed body in the basement, confirming a serial predator has been active for years and raising the horrifying stakes of what may already have happened to the missing girls.","plot-point-3":"Loki is shot and left for dead by a woman he confronts, but survives and pieces together that Holly Jones \u2014 Alex's grieving, God-hating aunt \u2014 has been the real abductor all along, using Alex as an unwitting decoy.",climax:"Loki tracks Holly to her home and discovers Joy alive in a hidden underground chamber; meanwhile Keller, still holding Alex captive, is lured to Holly's property and falls into a pit she has dug and drugs him to keep him trapped there.",resolution:"Joy is rescued and reunited with her family while the fate of the still-missing Anna is confirmed through discovery at Holly's house, and the film closes with Keller buried alive in the pit, his location unknown to anyone but a whistle that may or may not be heard."}},{id:"turn-of-the-screw-polti-enigma-2",title:"The Turn of the Screw",creator:"Henry James, 1898",appliesToType:"plotType",appliesToId:"polti-enigma",bestStructureId:"frame-narrative",beats:{setup:"At a Christmas Eve gathering, a guest named Douglas introduces a dead woman's manuscript recounting her time as a governess at a remote estate.",rise:"The manuscript's governess arrives at Bly to care for two orphaned children and grows convinced she is seeing the ghosts of two dead former servants.",climax:"Believing the ghosts intend to possess the children, the governess forces confrontations that send Flora away in breakdown and end with Miles dying in her arms during a final reckoning with the apparition.",fall:"The reading ends without resolving whether the ghosts were real or the governess delusional, leaving the frame's listeners \u2014 and the reader \u2014 suspended in the same ambiguity."},sections:{"enter-frame":"On Christmas Eve, guests at a country house trade ghost stories by the fire, and Douglas mentions a written account, sealed away for years, from a woman he once knew who governessed for his sister.","frame-setup":"Douglas explains the manuscript was written by the governess herself before her death and sends for it, promising the assembled group a tale unlike any told that night; days later, he begins to read it aloud.","inner-begins":"The manuscript's story begins as the young, inexperienced governess arrives at the country estate of Bly to care for two orphaned children, Miles and Flora, under strict instruction from their guardian uncle never to trouble him with problems.","inner-develops":"The governess grows increasingly convinced she is seeing the ghosts of the estate's former valet, Peter Quint, and the previous governess, Miss Jessel, and comes to believe the dead pair are reaching from beyond the grave to corrupt the two seemingly angelic children.","inner-resolves":"Determined to save the children, the governess forces a confrontation over the apparitions \u2014 Flora is sent away in apparent breakdown after a scene by the lake, and in a final, desperate reckoning with Miles over the ghost at the window, the boy dies in her arms.","return-frame":"The reading ends there, in Douglas's own voice at the fireside, the manuscript giving no further explanation of what, precisely, killed Miles or whether the ghosts were ever real.","frame-closes":"The Christmas Eve company is left to sit with the unresolved horror exactly as Douglas's listeners did decades before, the frame's fireside hush becoming the reader's own uncertainty about whether they've heard a ghost story or the record of a governess's delusion."}},{id:"woman-in-black-polti-enigma-3",title:"The Woman in Black",creator:"Susan Hill, 1983",appliesToType:"plotType",appliesToId:"polti-enigma",bestStructureId:"frame-narrative",beats:{setup:"Decades later, a request for a ghost story forces Arthur Kipps to finally write down a horror he's never spoken of.",rise:"As a young solicitor, Arthur travels to the remote Eel Marsh House and begins seeing a wasted woman in black while piecing together the tragic story behind her.",climax:"Arthur survives a night of escalating terror in the isolated house, believing he has finally escaped its ghost.",fall:"The ghost follows him to London and reappears months later, causing an accident that kills his wife and son, a devastation the older Kipps has only now been able to put into words."},sections:{"enter-frame":"Years later, at a cheerful family Christmas, Arthur Kipps's stepchildren beg for a ghost story, and the request strikes him with a dread the others can't understand.","frame-setup":"Unable to speak the memory aloud, Kipps retreats to his study, resolving to write down, once and for all, the true and terrible story of what happened to him as a young solicitor \u2014 the manuscript we then read.","inner-begins":"The written account begins with young Arthur traveling to the isolated coastal town of Crythin Gifford to settle the affairs of the recently deceased, reclusive Alice Drablow of Eel Marsh House, where he first glimpses a wasted, black-clad woman at the funeral.","inner-develops":"Alone at the marsh-locked house to sort Mrs. Drablow's papers, Arthur hears a pony trap crash and drown in the marsh fog, sees the woman in black again and again, and slowly pieces together, over the locals' evasive silence, the story of Jennet Humfrye, whose illegitimate son died in that same marsh and whose vengeful ghost is said to presage a child's death whenever she appears.","inner-resolves":"Arthur survives a night of escalating terror in the shuttered house \u2014 noises, apparitions, and the ghost child's cries \u2014 and flees, believing himself finally free of Eel Marsh House once he returns to London.","return-frame":"The manuscript's final pages reveal that the horror followed him home: months later, at a country fair, Jennet's ghost appears once more, and in the panic it causes, Arthur's wife and infant son are killed.","frame-closes":"Back in the present, old Kipps sets down his pen having finally confessed the whole truth on paper, the frame closing on a man who has spent decades unable to speak what he has now, at last, been able to write."}},{id:"maltese-falcon-polti-obtaining-2",title:"The Maltese Falcon",creator:"dir. John Huston, 1941",appliesToType:"plotType",appliesToId:"polti-obtaining",bestStructureId:"three-act",beats:{setup:"Detective Sam Spade's partner is murdered the night after a mysterious woman hires their agency, pulling Spade into a case he refuses to let the police handle for him.",rise:"Spade navigates a cast of increasingly dangerous rivals \u2014 all hunting a priceless jeweled falcon statuette \u2014 and learns from crime boss Gutman just how much the object is truly worth.",climax:"The falcon finally arrives via a dying ship captain, only to be revealed as a worthless fake once Gutman scrapes it clean, and in that unraveling, Spade realizes his partner's killer.",fall:"Despite his attraction to her, Spade turns Brigid over to the police for Archer's murder, ending the film with neither the woman nor the treasure in hand, only his own integrity intact."},sections:{"status-quo":"Sam Spade and his partner Miles Archer run a modest, cynical private detective office in San Francisco, taking clients as they come.",inciting:"A mysterious woman calling herself Miss Wonderly hires the firm to trail a man named Thursby \u2014 and that same night, both Archer and Thursby turn up murdered.","plot-point-1":"Suspected by police and stonewalled by his supposed client \u2014 really the duplicitous Brigid O'Shaughnessy \u2014 Spade commits to unraveling the truth himself, refusing to hand the case to anyone else.",rising:"Spade is drawn into a circle of increasingly strange characters \u2014 the perfumed Joel Cairo, the massive and genial Kasper Gutman, and Gutman's jumpy gunman Wilmer \u2014 all of them, like Brigid, hunting a priceless jeweled falcon statuette, and all willing to lie, bribe, or threaten Spade to get it.",midpoint:"Gutman finally tells Spade the falcon's full history \u2014 centuries of theft and disguise \u2014 revealing exactly how valuable and how contested the object is, and confirming that everyone in the room, Brigid included, would kill for it.","plot-point-2":"A ship captain named Jacobi staggers into Spade's office fatally wounded, delivering a newspaper-wrapped parcel before collapsing dead \u2014 the falcon has finally, physically, arrived.",climax:"When Gutman scrapes away the black enamel and finds only lead beneath, the falcon proves a fake, and in the wreckage of that discovery, Spade pieces together that Brigid, not any of the others, murdered Archer.",resolution:"Though he has feelings for Brigid, Spade turns her over to the police rather than let Archer's killer go free, choosing his code over the woman and the prize, both of which slip out of his hands in the same night."}},{id:"the-pearl-polti-obtaining-3",title:"The Pearl",creator:"John Steinbeck, 1947",appliesToType:"plotType",appliesToId:"polti-obtaining",bestStructureId:"three-act",beats:{setup:"A poor pearl diver, Kino, needs money to treat his infant son's scorpion sting after the town doctor refuses to help a family too poor to pay.",rise:"Kino finds an extraordinary pearl and, refusing the town's rigged lowball offers, resolves to sell it fairly in the capital, drawing thieves and violence toward his family.",climax:"Fleeing into the mountains, Kino's son is killed by a tracker's rifle shot, and Kino kills the men responsible in a final, costly act of vengeance.",fall:"Broken by the loss of his son, Kino returns to the village with Juana and throws the pearl back into the sea, ending up exactly where he started but with everything that mattered now gone."},sections:{"status-quo":"Kino, a poor pearl diver, lives simply with his wife Juana and infant son Coyotito in a brush hut by the Gulf, singing the ancient Song of the Family that marks his life as whole, if humble.",inciting:"A scorpion stings Coyotito, and the town doctor refuses to treat a baby whose family cannot pay, driving Kino out to dive for pearls in desperate hope of finding enough money to save his son.","plot-point-1":'Kino pulls from the sea an enormous, flawless pearl unlike any ever seen \u2014 "the pearl of the world" \u2014 and commits himself fully to the dream that it will buy Coyotito an education and free his family from poverty forever.',rising:"Word of the pearl spreads through the town, and the doctor, priest, and pearl buyers all begin circling Kino with false kindness and rigged offers, while Kino refuses to sell for the pittance he's offered and resolves to carry the pearl to the capital for a fair price.",midpoint:"Men attack Kino in the night to steal the pearl; he kills one in self-defense, and the family's hut is burned to the ground, forcing Kino to fully accept that the pearl has made him a hunted man rather than a rich one.","plot-point-2":"Fleeing into the mountains with trackers on their trail, Kino, Juana, and Coyotito hide in a cave, and when Kino creeps out in the dark to attack the trackers before they can find his family, a rifle shot rings out toward the sound of Coyotito's cry.",climax:"The shot kills Coyotito, and Kino, in a final fury, kills the trackers who took his son's life \u2014 winning the fight but losing everything the pearl was ever meant to buy.",resolution:"Kino and Juana walk back into town together, carrying their dead son, and Kino throws the great pearl back into the sea, ending exactly where he began, but stripped of the family that once made him whole."}},{id:"east-of-eden-polti-enmity-kinsmen-2",title:"East of Eden",creator:"John Steinbeck, 1952",appliesToType:"plotType",appliesToId:"polti-enmity-kinsmen",bestStructureId:"freytag",beats:{setup:"Adam Trask's childhood rivalry with his brother Charles for their father's love repeats a generation later between Adam's own twin sons, favored Aron and resentful Cal.",rise:"Desperate for his father's approval, Cal tries to win Adam's love with a gift of money, while keeping from Aron the truth that their supposedly dead mother is alive and running a brothel.",climax:"When Adam rejects Cal's gift in favor of praising Aron, a wounded Cal reveals their mother's secret to Aron, shattering his brother's illusions.",fall:"Aron enlists and dies in the war, the news causing Adam's stroke, and on his deathbed Adam finally forgives Cal, breaking the family's inherited cycle of enmity."},sections:{exposition:"In the Salinas Valley, Adam Trask grows up locked in rivalry with his half-brother Charles for their stern father's love and approval, a jealousy that echoes forward when Adam later raises his own twin sons, Cal and Aron, after his wife Cathy abandons them to run a brothel.","rising-action":`Cal grows up convinced he is the unloved, "bad" twin next to golden favorite Aron, and when he learns the truth about their mother, he keeps the secret from Aron while desperately trying to win his father Adam's approval, at one point earning a small fortune from a wartime bean crop as a gift meant to prove his worth.`,climax:"Adam rejects Cal's gift of money as tainted profiteering, in the same breath praising Aron's unrelated happy news, and the sting of that rejection drives Cal, in a moment of raw jealousy, to take Aron to see their mother alive and running a brothel \u2014 shattering Aron's idealized image of his family.","falling-action":"Devastated by the revelation, Aron enlists and is killed in the First World War, and the news of his death strikes Adam down with a paralyzing stroke, leaving Cal wracked with guilt for having set the tragedy in motion.",denouement:`At Adam's deathbed, the family servant Lee urges the dying father to release Cal from the burden of his brother's sins, and Adam, with his last strength, offers Cal the Hebrew word "timshel" \u2014 thou mayest \u2014 breaking, at last, the generational cycle of brothers destroyed by their fathers' and their own enmity.`}},{id:"richard-iii-polti-enmity-kinsmen-3",title:"Richard III",creator:"William Shakespeare, c. 1593",appliesToType:"plotType",appliesToId:"polti-enmity-kinsmen",bestStructureId:"freytag",beats:{setup:"Richard, Duke of Gloucester, sets out to seize the English throne by turning his own family against each other, beginning with his brother Clarence.",rise:"Richard has Clarence murdered and maneuvers into power as Lord Protector over his young nephews after King Edward's death.",climax:"Richard declares his nephews illegitimate, takes the crown, and has the boys murdered in the Tower, the ultimate betrayal of his own bloodline.",fall:"Increasingly isolated and haunted by the ghosts of the kin he's destroyed, Richard is defeated and killed at Bosworth Field, ending his reign of familial destruction."},sections:{exposition:"Richard, Duke of Gloucester, opens the play declaring his intent to prove a villain and seize the English throne, beginning by turning his brother King Edward IV against their other brother, Clarence.","rising-action":"Richard has Clarence murdered in the Tower, marries the widow Anne after having killed her husband and father-in-law, and upon Edward's death maneuvers himself into position as Lord Protector over his own young nephews, the princes in line for the throne.",climax:"Richard has his nephews declared illegitimate, seizes the crown for himself, and then orders the murder of the two young princes in the Tower \u2014 the culminating act of a man destroying his own family, generation by generation, for power.","falling-action":"Having discarded or eliminated nearly everyone tied to him by blood or marriage \u2014 Anne dies conveniently, his former ally Buckingham is executed after finally balking \u2014 Richard finds himself isolated, and the ghosts of his family's dead visit him in nightmares on the eve of battle, cursing him to despair.",denouement:"Richmond's invading army defeats Richard at Bosworth Field, where Richard is killed crying for a horse, and the throne passes to Richmond, who promises to unite the warring houses and end the bloodshed Richard's enmity toward his own kin had wrought."}},{id:"lion-in-winter-polti-rivalry-kinsmen-2",title:"The Lion in Winter",creator:"James Goldman, 1966 (dir. Anthony Harvey, 1968)",appliesToType:"plotType",appliesToId:"polti-rivalry-kinsmen",bestStructureId:"fichtean",beats:{setup:"King Henry II gathers his estranged wife Eleanor and their three sons at Christmas court to settle the succession, and the family is already at open war before the visit begins.",rise:"Henry and Eleanor back rival sons for the throne while the overlooked middle son schemes for himself, and a revealed secret gives every family member new leverage against the others.",climax:"Cornered by rival plots, including schemes to kill him, Henry locks his sons in a cellar and considers having them executed, but cannot bring himself to do it.",fall:"The succession is left unresolved as the family parts for another year, having fully exposed \u2014 but not settled \u2014 their toxic rivalry."},sections:{"crisis-1":"The play opens already in the middle of the fight: King Henry II has released his imprisoned wife Eleanor of Aquitaine from confinement for Christmas court at Chinon, where the succession to his throne is to be decided among their three sons, and old wounds are raw before a word of courtesy is exchanged.","crisis-2":"Henry openly favors his youngest son John as heir while Eleanor champions Richard, and the middle son Geoffrey, overlooked by both parents, begins scheming to turn every rivalry to his own advantage.","crisis-3":"Alliances shift hour to hour as the visiting young King Philip of France reveals Richard's past love affair with him, a secret each family member tries to weaponize against the others for leverage over territory and the crown.","crisis-4":"Desperate and cornered, several of the sons scheme to have each other \u2014 and even their father \u2014 killed, and Henry, enraged past reason, locks all three sons in the castle's wine cellar, seriously considering having them executed to end the threat once and for all.",climax:"Standing over his imprisoned sons with a sword, Henry finds he cannot bring himself to kill his own children, and the family's plots collapse into exhausted, bitter recognition that none of them will ever fully defeat or forgive the others.",resolution:"Henry names no clear heir and the succession remains unresolved as Eleanor is sent back to prison and the family disperses for another year, parting with black, weary humor \u2014 bound to reconvene and tear at each other again the next Christmas."}},{id:"jacob-esau-polti-rivalry-kinsmen-3",title:"Jacob and Esau",creator:"Book of Genesis, Hebrew Bible",appliesToType:"plotType",appliesToId:"polti-rivalry-kinsmen",bestStructureId:"fichtean",beats:{setup:"Twin brothers Jacob and Esau are rivals from birth, and Esau sells his birthright to Jacob for a bowl of stew in a moment of hunger.",rise:"Jacob, aided by their mother, disguises himself to steal Esau's blessing from their dying father, prompting Esau to vow revenge and forcing Jacob into decades of exile.",climax:"Fearing his brother's vengeance on his return, Jacob sends gifts ahead and wrestles with a divine figure the night before their reunion.",fall:"Esau unexpectedly embraces and forgives Jacob, and the brothers part peacefully, their long rivalry resolved without violence."},sections:{"crisis-1":"The story opens with the rivalry already inscribed even before birth \u2014 Jacob and Esau struggle in Rebekah's womb, and their competing destinies begin the moment Esau, the elder twin, is born moments before Jacob, who emerges gripping his brother's heel.","crisis-2":"The rivalry sharpens when a famished Esau sells his birthright \u2014 his inheritance as firstborn \u2014 to Jacob for a simple bowl of stew, a moment of weakness Jacob is quick to exploit.","crisis-3":"With their mother Rebekah's help, Jacob disguises himself in animal skins to impersonate the hairy Esau before their blind, dying father Isaac, stealing the paternal blessing meant for the firstborn and leaving Esau doubly robbed.","crisis-4":"Esau vows to kill Jacob once their father dies, forcing Jacob to flee to his uncle Laban's distant household, where he lives in exile for twenty years, the brothers' rivalry unresolved and festering across the miles.",climax:"Returning home at last and terrified of Esau's vengeance, Jacob sends lavish gifts ahead to appease his brother and spends a night alone wrestling with a mysterious divine figure, emerging transformed and renamed Israel just before the brothers finally meet face to face.",resolution:"Against every expectation, Esau runs to Jacob, embraces him, and weeps, forgiving him completely; the brothers part peacefully, each returning to his own life, the decades-old rivalry dissolved rather than avenged."}},{id:"postman-always-rings-twice-polti-murderous-adultery-2",title:"The Postman Always Rings Twice",creator:"James M. Cain, 1934",appliesToType:"plotType",appliesToId:"polti-murderous-adultery",bestStructureId:"weiland",beats:{setup:"Drifter Frank Chambers takes a job at a roadside diner and begins a reckless affair with the young wife of the older owner, Nick.",rise:"Frank and Cora plot to kill Nick for the business and insurance money, botching a first attempt before succeeding with a staged car crash on their second try.",climax:"Suspected by the district attorney and pitted against each other, Frank and Cora narrowly escape conviction through their lawyer's legal maneuvering and marry, only for guilt and suspicion to poison their relationship.",fall:"Cora dies in a genuine car accident while pregnant, and Frank is convicted and sentenced to death for her murder \u2014 a crime he didn't commit, in ironic payment for the one he did."},sections:{hook:"Frank Chambers, a drifter with nothing to his name, wanders into a roadside diner run by amiable, older Nick Papadakis, taking a job there mostly because he can't take his eyes off Nick's young wife, Cora.",inciting:"Frank and Cora fall into a fierce, reckless affair almost immediately, and Cora \u2014 trapped in a marriage she resents and craving a way out \u2014 starts talking about how much better life would be without Nick.","plot-point-1":"The two commit fully to a plan to murder Nick, staging his death to look like an accident so they can claim the diner and the insurance money and be together without hiding.","pinch-1":"Their first attempt \u2014 electrocuting Nick in the bath \u2014 collapses in chaos and near-discovery when a police officer happens by, a stark reminder of how easily their scheme could unravel and land them both in prison.",midpoint:"Undeterred, Frank and Cora move from a botched, panicked first try to a colder, more deliberate second plan, getting Nick drunk and taking him out on a dark road, shifting from anxious conspirators to committed killers.","pinch-2":"They bludgeon Nick with a wrench and push the car off a cliff to fake a crash, but the plan goes wrong enough that both Frank and Cora are hospitalized with real injuries, and the district attorney immediately suspects murder.","plot-point-3":"The DA turns Frank and Cora against each other in interrogation, nearly destroying them, until their opportunistic lawyer Katz plays the competing insurance companies against the prosecution and maneuvers Cora into pleading to a lesser charge with only a suspended sentence.",climax:"Having gotten away with Nick's murder and married each other, Frank and Cora find their relationship curdling under mutual suspicion, blackmail threats from an accomplice, and the guilt neither can voice, until \u2014 pregnant and reconciled with Frank \u2014 Cora dies for real when their car crashes on a night drive.",resolution:"Frank is charged with Cora's death, a killing he didn't commit, and is convicted and sentenced to die for it \u2014 an ironic reckoning for the murder of Nick that he and Cora actually got away with."}},{id:"therese-raquin-polti-murderous-adultery-3",title:"Th\xE9r\xE8se Raquin",creator:"\xC9mile Zola, 1867",appliesToType:"plotType",appliesToId:"polti-murderous-adultery",bestStructureId:"weiland",beats:{setup:"Th\xE9r\xE8se, trapped in a loveless marriage to her sickly cousin Camille, begins a passionate affair with his friend Laurent.",rise:"The lovers murder Camille by drowning him during a boating trip and, after a respectable mourning period, marry each other.",climax:"Haunted by guilt and the imagined presence of their victim, the couple grows to loathe each other, and the paralyzed Madame Raquin secretly learns the truth of her son's murder.",fall:"Unable to live with their guilt or each other, Th\xE9r\xE8se and Laurent take poison together at the dinner table, dying in front of the silent, helpless witness who now knows everything."},sections:{hook:"Th\xE9r\xE8se Raquin lives a stifled, joyless life above her aunt's small Paris shop, married off young to her sickly, self-absorbed cousin Camille in a match that was never truly her choice.",inciting:"Camille's old friend Laurent begins visiting regularly, and he and Th\xE9r\xE8se fall into a consuming, secretive affair conducted right under the unsuspecting family's roof.","plot-point-1":"Trapped by a marriage she never wanted and desperate to be with Laurent openly, Th\xE9r\xE8se agrees to his plan: they will murder Camille and make it look like an accident.","pinch-1":"During a boating outing, Laurent drowns Camille and lets the current carry him away, and the sheer effort of appearing calm and grief-stricken afterward, in front of Madame Raquin, shows the lovers just how exposed their secret leaves them.",midpoint:"After a period of respectable mourning, Th\xE9r\xE8se and Laurent marry with Madame Raquin's oblivious blessing, and what should feel like triumph instead marks a turning point, as the couple begins to actively feel the marriage curdling rather than settling.","pinch-2":"Camille's drowned, decaying presence begins to haunt both of them \u2014 Laurent sees his face in his own portrait of him, and both lovers, wracked by guilt and mutual accusation, find they can no longer bear to touch or even look at each other.","plot-point-3":"Their guilt curdles into open loathing and violent quarrels, each one privately plotting to kill the other to escape the marriage, a horror made worse when Madame Raquin, now paralyzed by a stroke, overhears them confess the murder to each other and is left unable to speak or move to accuse them.",climax:"Trapped in a house with a silent, all-knowing witness they cannot silence, and unable to live with each other or with what they've done, Th\xE9r\xE8se and Laurent's mutual hatred reaches its breaking point.",resolution:"Rather than kill one another, the couple takes poison together at the dinner table and dies in front of Madame Raquin, who watches in helpless, silent vindication as the two people who murdered her son destroy themselves."}},{id:"tell-tale-heart-polti-madness-2",title:"The Tell-Tale Heart",creator:"Edgar Allan Poe, 1843",appliesToType:"plotType",appliesToId:"polti-madness",bestStructureId:"kishotenketsu",beats:{setup:`An unnamed narrator insists he isn't mad, only that his senses are unusually acute, and explains his dread of an old man's pale "vulture eye."`,rise:"Over eight nights he creeps in to watch the old man sleep, patiently waiting for the right moment to act, treating his careful method as proof of his sanity.",climax:"On the eighth night he smothers the old man, dismembers the body, and hides it beneath the floorboards.",fall:"When police investigate a reported scream, the narrator's calm unravels as he becomes convinced he hears the victim's heart still beating beneath the floor, and he confesses."},sections:{ki:`An unnamed narrator insists, in an agitated, overly precise voice, that he is not mad \u2014 merely that his senses have become unnaturally sharp \u2014 and explains that he loved the old man he lived with, except for one thing: the old man's pale, filmy "vulture eye," which fills him with dread.`,sho:"For eight straight nights, the narrator creeps silently into the old man's room at midnight to watch him sleep, meticulous and patient, waiting for the one moment the hated eye is open so he can act, calmly building his case that his careful method proves his sanity, not his madness.",ten:"On the eighth night, the old man wakes and sits up in terror sensing a presence in the dark; the narrator waits in silence until, hearing the man's heart pounding faster and louder, he suddenly smothers him, dismembers the body, and hides the pieces beneath the floorboards \u2014 an eruption of violence that recontextualizes all the narrator's calm, deliberate build-up as the method of a genuinely disordered mind.",ketsu:"When police arrive to investigate a neighbor's report of a scream, the narrator confidently invites them in and chats calmly over the very floorboards hiding the body, but as he talks he becomes convinced he can hear the old man's heart still beating beneath the floor, growing louder and louder until, unable to bear it, he confesses and tears up the boards himself."}},{id:"diary-of-a-madman-polti-madness-3",title:"Diary of a Madman",creator:"Nikolai Gogol, 1835",appliesToType:"plotType",appliesToId:"polti-madness",bestStructureId:"kishotenketsu",beats:{setup:"Poprishchin, a low-ranking clerk, records his hopeless infatuation with his director's daughter Sophie in his diary.",rise:"His entries grow increasingly delusional as he becomes convinced he can understand dogs' letters, revealing Sophie's engagement to a rival and fueling his resentment.",climax:"Fixated on a news story about Spain's vacant throne, Poprishchin becomes convinced he is the missing King of Spain himself.",fall:"He is committed to an asylum, which he mistakes for the Spanish court even as he is brutalized there, his diary ending in a desperate, broken cry for his mother."},sections:{ki:"Poprishchin, a lowly government clerk in St. Petersburg, records in his diary his quiet, hopeless infatuation with Sophie, the daughter of the department director, a woman entirely above his humble station in life.",sho:"His diary entries grow stranger as he becomes convinced he can understand the conversation of two dogs, imagining he has intercepted letters between them that reveal Sophie is being courted by a Kammerjunker, and his jealousy and resentment toward the world of rank and privilege deepen with every entry.",ten:`Obsessed with a newspaper story about the vacant throne of Spain, Poprishchin's diary entries suddenly reveal a total break from reality: he becomes convinced that he himself is Ferdinand VIII, the missing King of Spain, and his dates dissolve into nonsense like "Year 2000, April 43rd."`,ketsu:"Believing he has arrived in his royal kingdom, Poprishchin is instead seized and taken to an insane asylum, which in his mind he interprets as the ceremonial rites of Spanish court life even as he is beaten, doused in cold water, and has his head shaved \u2014 his diary's final entry collapsing from delusions of grandeur into a child's desperate cry for his mother."}},{id:"jurassic-park-polti-fatal-imprudence-2",title:"Jurassic Park",creator:"dir. Steven Spielberg, 1993",appliesToType:"plotType",appliesToId:"polti-fatal-imprudence",bestStructureId:"seven-point",beats:{setup:"John Hammond invites experts to certify his dinosaur theme park as safe after an incident, though mathematician Ian Malcolm warns the entire premise underestimates the risk of controlling life itself.",rise:"A disgruntled employee sabotages the park's security to steal embryos during a storm, cutting power to every containment fence on the island.",climax:"A Tyrannosaurus rex and a pack of coordinating velociraptors break loose, hunting the stranded visitors, including Hammond's own grandchildren, through the park.",fall:"The survivors narrowly escape the island, the park's dream of controlling nature revealed as a catastrophic underestimation of its true cost."},sections:{hook:"John Hammond proudly shows off his private island, Isla Nublar, where his company InGen has used ancient DNA to bring dinosaurs back to life for a soon-to-open theme park.","plot-turn-1":"After an incident with a raptor kills a worker, Hammond's investors demand outside experts \u2014 paleontologists Alan Grant and Ellie Sattler, along with mathematician Ian Malcolm \u2014 visit the park to certify it as safe before it opens to the public.","pinch-1":`Touring the park, Malcolm warns that the entire premise \u2014 controlling and containing life itself \u2014 is a level of risk Hammond hasn't truly reckoned with, insisting that "life finds a way" no matter how carefully the systems are engineered.`,midpoint:"A disgruntled employee, Dennis Nedry, sabotages the park's security systems to steal dinosaur embryos for a rival company, and during the cover of a tropical storm, every containment fence on the island loses power at once.","pinch-2":"With the fences down, a Tyrannosaurus rex breaks loose and attacks the tour vehicles, killing Nedry and stranding Hammond's grandchildren in the park as night falls and the dinosaurs begin hunting freely.","plot-turn-2":"Grant leads the children through the park on foot back toward safety while the surviving adults discover that the park's velociraptors \u2014 the most intelligent and dangerous of the cloned animals \u2014 have also escaped and are actively coordinating to hunt the humans inside the visitor center.",resolution:"The survivors narrowly escape the raptors and flee the island entirely, the park's grand vision reduced to wreckage \u2014 a stark demonstration that Hammond's dream was built on a risk no one, least of all Hammond himself, had actually weighed."}},{id:"monkeys-paw-polti-fatal-imprudence-3",title:"The Monkey's Paw",creator:"W. W. Jacobs, 1902",appliesToType:"plotType",appliesToId:"polti-fatal-imprudence",bestStructureId:"seven-point",beats:{setup:"The White family is warned that a mysterious monkey's paw grants three wishes at a terrible cost, but Mr. White wishes for money anyway.",rise:"The wish is granted the next day in the cruelest form possible: their son Herbert dies at work, and the money is his death compensation.",climax:"Grief-stricken, Mrs. White insists her husband use the second wish to bring Herbert back, and something begins knocking at their door in the night.",fall:"As his wife rushes to answer the door, Mr. White uses the last wish to make whatever is outside vanish, leaving them with nothing but an empty street."},sections:{hook:"On a cozy, ordinary evening, the White family entertains their old friend Sergeant-Major Morris, who has just returned from India with tales of adventure \u2014 and a small, withered monkey's paw he carries as a curious souvenir.","plot-turn-1":"Morris reveals the paw is enchanted to grant its holder three wishes, but warns them urgently against ever using it, admitting he himself wishes he'd never taken it, and tries to throw it into the fire before Mr. White impulsively snatches it back to keep.","pinch-1":"Ignoring the warning, Mr. White jokingly wishes for two hundred pounds to pay off the mortgage on the house, and nothing visibly happens \u2014 a false sense that the curse might be nonsense after all.",midpoint:"The next day, a company representative arrives at the door with grim news: their son Herbert has died in a horrific accident at the factory where he works, and the two hundred pounds being offered is compensation for his death, the wish granted in the cruelest possible form.","pinch-2":"Ten days into their grief, Mrs. White, half-mad with longing, insists that her husband use the second wish to bring Herbert back to life, and despite his own dread, Mr. White reluctantly speaks the wish aloud into the dark house.","plot-turn-2":"Sometime later, a slow, heavy knocking begins at the front door, growing more insistent, and as Mrs. White rushes to unbolt it in desperate hope, Mr. White \u2014 remembering that Herbert's mangled body was unidentifiable in death \u2014 searches frantically for the paw.",resolution:"Just as Mrs. White finally throws the door open, Mr. White uses the third and final wish, and she finds only an empty, silent street outside \u2014 the imprudence of the first wish undone, but at the cost of everything the second one promised."}},{id:"tristan-iseult-polti-involuntary-crimes-love-2",title:"Tristan and Iseult",creator:"Gottfried von Strassburg, c. 1210 (medieval legend)",appliesToType:"plotType",appliesToId:"polti-involuntary-crimes-love",bestStructureId:"todorov",beats:{setup:"Tristan is sent to escort the Irish princess Iseult to Cornwall to marry his uncle, King Mark.",rise:"The two accidentally drink a love potion meant for Iseult's wedding night and fall into an involuntary, uncontrollable love that binds them even as Iseult marries Mark as planned.",climax:"The lovers carry on a secret affair for years, repeatedly caught, exiled, and reunited, torn between their loyalty to Mark and the passion neither can escape.",fall:"Dying of a wound in exile, Tristan sends for Iseult to heal him, but a jealous lie about a ship's sail leads him to die in despair moments before she arrives, and she dies of grief beside him."},sections:{equilibrium:"In the court of King Mark of Cornwall, the king's loyal nephew Tristan is sent across the sea to escort the Irish princess Iseult back to Cornwall to become Mark's queen, a mission of duty and honor.",disruption:"Aboard the ship, Tristan and Iseult unknowingly drink a magic love potion meant for Iseult and Mark's wedding night, and the potion binds them in an overwhelming, involuntary love neither of them chose nor can resist.",recognition:"Both Tristan and Iseult recognize immediately what has happened to them and the impossible position it creates \u2014 Iseult must still marry Mark as planned, while she and Tristan are now bound by a passion stronger than either their loyalty to the king or their own will.",repair:"Iseult marries Mark, secretly having her maid Brangien take her place in the marriage bed to hide the loss of her innocence, while she and Tristan continue a hidden, tormented affair, repeatedly caught and separated, exiled and forgiven, unable to either fully renounce Mark or fully escape each other.","new-equilibrium":"Eventually estranged and dying of a wound in a foreign land, Tristan sends for Iseult to heal him, arranging a white sail to signal her arrival \u2014 but a jealous lie about the sail's color leads him to die in despair moments before she reaches his side, and Iseult, finding him dead, dies of grief beside him, the potion's involuntary passion finally resolved only in death."}},{id:"phedre-polti-involuntary-crimes-love-3",title:"Ph\xE8dre",creator:"Jean Racine, 1677",appliesToType:"plotType",appliesToId:"polti-involuntary-crimes-love",bestStructureId:"todorov",beats:{setup:"Ph\xE8dre, wife of King Theseus, secretly suffers from a shameful, cursed love for her stepson Hippolytus.",rise:"Believing Theseus dead, she confesses her love to Hippolytus, who rejects her in horror, and when Theseus unexpectedly returns alive, her nurse falsely accuses Hippolytus of assault to protect Ph\xE8dre.",climax:"Enraged, Theseus curses his son and calls on the god Neptune to kill him, and Hippolytus is destroyed by a sea monster.",fall:"Wracked with guilt over the innocent death her involuntary love caused, Ph\xE8dre confesses the truth to Theseus and kills herself with poison."},sections:{equilibrium:"In the royal house of Athens, Ph\xE8dre lives as the outwardly dutiful wife of King Theseus, though she privately conceals a shameful passion for her stepson Hippolytus, a love she believes is a curse inflicted on her family by the goddess Venus.",disruption:"Word arrives that Theseus has died on his travels, and freed by grief and false hope from the last restraint holding her back, Ph\xE8dre confesses her forbidden love to Hippolytus through her nurse, Oenone \u2014 only for him to react with horror and reject her outright.",recognition:"Theseus suddenly returns alive, and in the panic to protect Ph\xE8dre's honor and hide the scandal, her nurse Oenone falsely accuses Hippolytus of trying to assault Ph\xE8dre, a lie Ph\xE8dre herself is too paralyzed with shame to immediately correct.",repair:"Enraged, Theseus curses his own son and calls on the god Neptune to destroy him; a sea monster rises from the shore and kills Hippolytus as he rides his chariot away, an innocent death caused entirely by the crime Ph\xE8dre's cursed, involuntary love set in motion.","new-equilibrium":"Consumed by guilt once she learns Hippolytus is dead, Ph\xE8dre finally confesses the whole truth to Theseus and then takes poison, dying before him and leaving the devastated king to grieve a son destroyed by a love his wife never chose to feel."}},{id:"sohrab-rustum-slaying-kinsman",title:"Sohrab and Rustum",creator:"Ferdowsi's Shahnameh, c. 1010; retold by Matthew Arnold, 1853",appliesToType:"plotType",appliesToId:"polti-slaying-kinsman-unrecognized",bestStructureId:"story-circle",beats:{setup:"Years earlier, Persia's greatest champion Rustum fathered a son, Sohrab, during a brief liaison in Samangan, then left before the boy was born and never returned to acknowledge him.",rise:"Grown into a mighty warrior hoping to find his legendary father, Sohrab leads a Tartar invasion of Persia and challenges its champion to single combat; Rustum, fighting incognito, accepts, and neither recognizes the other despite Sohrab's repeated questioning.",climax:"After a grueling duel, Rustum drives his dagger into Sohrab, and only as the young man dies does he reveal a token proving he is Rustum's own son.",fall:"Rustum, undone by grief, carries his son's body home, forever marked by having unknowingly killed the child he never had the chance to know."},sections:{you:"Rustum in his zone of comfort \u2014 Persia's greatest champion, feared and revered, distanced from any family life since his brief affair years ago in Samangan.",need:"He needs, unknowingly, to reconcile with the son he never acknowledged; more immediately the Persian army needs a champion to face the mysterious Tartar warrior threatening the realm.",go:"Rustum rides out incognito to the border to meet the young champion Sohrab in single combat, concealing his identity as the shah's own champion.",search:"Across two days of dueling, both warriors probe each other for weakness and identity \u2014 Sohrab repeatedly asks if his opponent is Rustum, but Rustum denies it, so neither recognizes their true relation.",find:"Rustum finally overpowers Sohrab, driving his dagger into the young man's side, believing he has won an ordinary victory.",take:"As Sohrab dies, he shows Rustum the armband his mother gave him \u2014 proof he is Rustum's own son \u2014 and Rustum pays the crushing price of realizing he has killed his child.",return:"Rustum carries his dead son from the battlefield back to camp and eventually home, a broken man returning not in triumph but grief.",change:"Once the invincible champion, Rustum is now transformed by irrecoverable loss, forever marked by having slain the son he never knew."}},{id:"cuchulainn-connla-slaying-kinsman",title:"C\xFA Chulainn and Connla",creator:"Irish mythology, Ulster Cycle (earliest written recensions c. 8th century)",appliesToType:"plotType",appliesToId:"polti-slaying-kinsman-unrecognized",bestStructureId:"story-circle",beats:{setup:"C\xFA Chulainn fathers a son, Connla, with the warrior-woman A\xEDfe in Scotland, leaving before the birth but binding the boy by oath never to reveal his name or refuse combat.",rise:"Years later, Connla lands in Ulster as an unnamed, unbeatable young warrior, and C\xFA Chulainn is sent to challenge him; bound by his own vow, Connla will not identify himself even under his father's questioning.",climax:"C\xFA Chulainn kills Connla with his deadliest weapon, the G\xE1e Bulg, and only as the boy dies does he recognize the ring he once left for A\xEDfe, revealing he has slain his own son.",fall:"C\xFA Chulainn carries Connla's body back to the grieving Ulster court, his triumph replaced by a sorrow that follows him the rest of his life."},sections:{you:"C\xFA Chulainn, Ulster's champion, at ease in his role guarding the coast and defending the province's honor.",need:"Word comes of an unknown warrior boy landing on the shore who refuses to name himself or turn back \u2014 Ulster's honor demands he be challenged.",go:"C\xFA Chulainn sets out to confront the boy himself rather than let a lesser warrior fail against him.",search:"Warrior after warrior is defeated by the boy, and C\xFA Chulainn presses him in combat, demanding his name, but bound by his own father's oath the boy refuses to answer.",find:"Cornered, C\xFA Chulainn resorts to his deadliest weapon, the barbed spear G\xE1e Bulg, and delivers a mortal blow.",take:"As the boy dies he finally reveals himself as Connla, son of C\xFA Chulainn and A\xEDfe, and shows the ring his father once left with his mother \u2014 the price of victory is the death of his own child.",return:"C\xFA Chulainn carries his son's body back to the Ulster court, his triumph turned to public mourning.",change:"The invincible hero is left permanently altered, grieving a son he barely had the chance to know, his glory forever shadowed by the killing."}},{id:"antigone-self-sacrifice-ideal",title:"Antigone",creator:"Sophocles, c. 441 BCE",appliesToType:"plotType",appliesToId:"polti-self-sacrifice-ideal",bestStructureId:"eight-sequence",beats:{setup:"After Thebes's civil war, new king Creon decrees that the traitor Polynices be left unburied, and his sister Antigone resolves to defy the edict out of duty to the gods and her family.",rise:"Antigone is caught performing burial rites and condemned to death by Creon despite pleas from his own son Haemon, her betrothed, and mounting warnings that the gods themselves oppose the sentence.",climax:"Creon relents too late \u2014 arriving at Antigone's tomb to find she has hanged herself, prompting Haemon to kill himself over her body in grief and rage.",fall:"Creon returns home to learn his wife has also taken her life cursing him, leaving the king utterly alone, ruined by his refusal to bend for as long as Antigone held to her own unbending ideal."},sections:{"status-quo":"Thebes settles after civil war; Creon takes the throne and immediately decrees Polynices's body must lie unburied and dishonored as a traitor.",predicament:"Antigone declares to her sister Ismene that she will bury Polynices herself, in defiance of the king's edict, locking herself into a fatal collision with the state.","obstacle-1":"Antigone performs token burial rites on the corpse; the guards discover the deed and, under threat, watch the site to catch the culprit.","stakes-1":"Antigone is caught returning to complete the rites and is brought before Creon, who condemns her to death despite her unshaken insistence that divine and family law outrank his decree.",midpoint:"Creon's son Haemon, Antigone's betrothed, confronts his father, warning that the city despises the sentence and that Creon's rigidity will destroy his own family \u2014 Creon refuses to yield.","stakes-2":"Creon has Antigone sealed alive in a rock tomb rather than executed outright, and the blind prophet Tiresias warns him the gods themselves condemn this cruelty.",culmination:"Shaken, Creon finally relents and rushes to free Antigone \u2014 too late, arriving to find she has hanged herself in the tomb.",climax:"Haemon, discovering Antigone dead, attacks his father in grief before killing himself over her body; Creon returns home to learn his wife Eurydice has also taken her own life, cursing him, leaving him alone with the ruin his rigidity, and Antigone's sacrifice for her ideal, has caused."}},{id:"braveheart-self-sacrifice-ideal",title:"Braveheart",creator:"dir. Mel Gibson, 1995",appliesToType:"plotType",appliesToId:"polti-self-sacrifice-ideal",bestStructureId:"eight-sequence",beats:{setup:"William Wallace, a Scottish commoner scarred by English oppression, wants only a quiet life until English soldiers murder his secret wife, driving him into open rebellion.",rise:"Wallace's early victories make him a symbol of Scottish independence, but the self-interested nobility repeatedly undermines the cause, culminating in a battlefield betrayal that devastates his army.",climax:'Betrayed again and captured, Wallace is offered mercy in exchange for submission but instead endures torture and execution without yielding, crying "Freedom!" to the last.',fall:"Wallace's martyrdom becomes the spark that finally unites the Scottish nobility under Robert the Bruce, who wins the independence Wallace died for."},sections:{"status-quo":"Scotland lives under brutal English rule under Edward Longshanks; young William Wallace, orphaned by that oppression, is sent away and later returns as a man wanting only a peaceful farming life.",predicament:"When English soldiers murder his secret wife Murron for resisting assault, Wallace retaliates by killing the local garrison, locking himself irrevocably into rebellion against the crown.","obstacle-1":"Wallace rallies neighboring clans into a makeshift army, but the nobles hesitate to commit fully, doubting a commoner can lead a real war against England.","stakes-1":"At the Battle of Stirling Bridge, Wallace's forces win a stunning victory against a much larger English army, and his fame as Scotland's patriot spreads.",midpoint:"Named Guardian of Scotland, Wallace pushes into England itself, but the Scottish nobility, more interested in their own titles than the cause, begin conspiring against unity under him.","stakes-2":"At the Battle of Falkirk, nobles led by Robert the Bruce's father secretly ally with the English, and their withdrawal dooms Wallace's army to slaughter.",culmination:"Betrayed again years later by a Scottish lord for English gold, Wallace is captured and dragged to London to be tried for treason.",climax:`Offered mercy if he'll beg the king's forgiveness, Wallace instead endures torture without yielding and is executed, crying "Freedom!" with his last breath \u2014 a sacrifice that finally sparks Robert the Bruce to unite Scotland and win its independence.`}},{id:"frozen-self-sacrifice-kindred",title:"Frozen",creator:"dir. Chris Buck & Jennifer Lee, 2013",appliesToType:"plotType",appliesToId:"polti-self-sacrifice-kindred",bestStructureId:"pixar-spine",beats:{setup:"Princess Anna and her sister Elsa, who secretly has ice powers, grow apart after a childhood accident, until Elsa's powers are exposed at her coronation and she flees, plunging the kingdom into eternal winter.",rise:`Anna sets out to bring Elsa home, but is accidentally struck by her sister's magic and begins slowly freezing, learning only "an act of true love" can save her.`,climax:"Betrayed by her fianc\xE9 Hans, who abandons her to die, Anna instead uses her last strength to throw herself between Elsa and a killing blow, freezing solid in her sister's place.",fall:"Anna's sacrifice thaws her own frozen heart and breaks the winter for good, and the sisters are truly reconciled."},sections:{"once-upon":"In the kingdom of Arendelle, young princesses Anna and Elsa are close sisters, and Elsa harbors secret, dangerous ice powers.","every-day":"After Elsa accidentally injures Anna with her powers as children, their parents shut the castle gates, isolate Elsa, and erase Anna's memory of the magic, leaving the sisters distant for years.","until-one-day":"At Elsa's coronation as queen, her powers are exposed in front of the whole court; panicked, she flees into the mountains, accidentally cursing the kingdom with endless winter.","because-1":"Anna sets off alone to find Elsa and bring her home to lift the winter, gathering allies \u2014 the iceman Kristoff, his reindeer Sven, and the snowman Olaf \u2014 along the way.","because-2":`When Anna finally reaches Elsa, an accidental blast of magic strikes Anna's heart; as she begins turning to ice, she learns only "an act of true love" can save her, and rushes back hoping her fianc\xE9 Hans can provide it.`,"until-finally":"Hans reveals he never loved her and leaves her to die, but as Anna is freezing solid she instead throws herself in front of his sword to shield Elsa from a killing blow, sacrificing herself completely for her sister.","ever-since":"Anna's self-sacrifice \u2014 true love for her sister rather than romantic love \u2014 thaws her frozen heart and saves her life, and Elsa, moved by it, finally masters her powers and restores summer, the sisters truly reconciled."}},{id:"lion-king-self-sacrifice-kindred",title:"The Lion King",creator:"dir. Roger Allers & Rob Minkoff, 1994",appliesToType:"plotType",appliesToId:"polti-self-sacrifice-kindred",bestStructureId:"pixar-spine",beats:{setup:"King Mufasa presents his son Simba as heir to the Pride Lands while his bitter brother Scar quietly schemes for the throne.",rise:"Scar lures Simba into a gorge and triggers a stampede; Mufasa saves his son by hurling him to safety, exposing himself to the herd in the process.",climax:"As Mufasa climbs to safety, Scar throws him back into the stampede to his death, then convinces the grieving Simba the death was his own fault.",fall:"Simba flees into exile, and only years later does Mufasa's sacrifice call him home to reclaim his birthright from Scar."},sections:{"once-upon":"In the Pride Lands, Mufasa rules as king, presenting his newborn son Simba to the animal kingdom as heir.","every-day":"Simba grows up curious and impulsive, mentored by his father, while his uncle Scar quietly resents his own exclusion from the throne.","until-one-day":"Scar tricks young Simba into a dangerous gorge and signals hyenas to trigger a wildebeest stampede, trapping Simba in the chaos.","because-1":"Mufasa races into the stampede and hurls Simba to safety on a ledge, saving his son's life at the cost of exposing himself to the herd below.","because-2":"As Mufasa claws his way up the gorge wall toward safety, Scar throws him back down into the stampede, killing him \u2014 and then convinces the grieving Simba that the death was his own fault.","until-finally":"Devastated and told he is to blame for his father's death, Simba flees the Pride Lands into exile, abandoning his birthright rather than face the truth or Scar.","ever-since":"Mufasa's sacrifice becomes the memory that eventually calls Simba back years later to reclaim his throne from Scar, proving the father's death for his son was not in vain."}},{id:"romeo-juliet-all-sacrificed-passion",title:"Romeo and Juliet",creator:"William Shakespeare, c. 1595",appliesToType:"plotType",appliesToId:"polti-all-sacrificed-passion",bestStructureId:"freytag",beats:{setup:"In feuding Verona, Romeo Montague and Juliet Capulet fall instantly in love and secretly marry despite their families' ancient hatred.",rise:"Romeo kills Juliet's cousin Tybalt and is banished, and Juliet, facing a forced marriage to Paris, fakes her death with a friar's potion.",climax:"The message explaining the plan fails to reach Romeo, who finds Juliet apparently dead and kills himself beside her; waking moments later, Juliet stabs herself with his dagger.",fall:"The lovers' deaths finally shock the Montagues and Capulets into ending their feud."},sections:{exposition:"In feuding Verona, the Montague and Capulet families are locked in ancient hatred; at a Capulet ball, Romeo and Juliet meet and fall instantly, overwhelmingly in love.","rising-action":"The two secretly marry the next day, but the feud escalates when Romeo kills Juliet's cousin Tybalt in a duel and is banished from Verona, even as Juliet's father arranges her marriage to Paris.",climax:"Desperate to avoid the forced marriage and reunite with Romeo, Juliet fakes her death with a friar's potion, but the message explaining the plan fails to reach the banished Romeo in time.","falling-action":"Believing Juliet truly dead, Romeo rushes to her tomb, kills himself with poison beside her, and Juliet wakes moments later to find him dead and stabs herself with his dagger.",denouement:"The double suicide finally shocks the Montagues and Capulets into reconciliation, ending their feud \u2014 the lovers' total sacrifice of everything for their passion is what peace is bought with."}},{id:"tristan-isolde-all-sacrificed-passion",title:"Tristan and Isolde",creator:"medieval legend; earliest surviving versions by Beroul & Thomas of Britain, c. 12th century",appliesToType:"plotType",appliesToId:"polti-all-sacrificed-passion",bestStructureId:"freytag",beats:{setup:"Escorting the Irish princess Isolde to marry his uncle King Mark, the knight Tristan accidentally shares a love potion with her that binds them in overwhelming passion.",rise:"Despite Isolde's marriage to Mark, the two carry on a reckless secret affair until it is discovered and Tristan is forced into exile.",climax:"Mortally wounded years later, Tristan sends for Isolde, the only one who can heal him, but his jealous wife falsely tells him her ship's sails signal failure.",fall:"Believing himself abandoned, Tristan dies of grief just as Isolde arrives, and she lies down beside him and dies as well."},sections:{exposition:"Tristan, the celebrated knight of Cornwall, is sent by his uncle King Mark to escort the Irish princess Isolde back to be Mark's bride.","rising-action":"Aboard the ship, Tristan and Isolde accidentally drink a love potion intended for Isolde and Mark's wedding night, and are seized by an unstoppable, all-consuming passion they cannot resist even though she is promised to the king.",climax:"Isolde marries Mark, but she and Tristan carry on a secret, increasingly reckless affair at court until they are discovered, forcing Tristan into exile and shattering any hope of a life together.","falling-action":"Years later, gravely wounded elsewhere, Tristan sends for the only one who can heal him, arranging for the ship bringing her to fly white sails for success, black for failure; his jealous wife lies and says the sails are black.",denouement:"Believing Isolde has failed him, Tristan dies of grief just as her ship arrives; finding him dead, Isolde lies down beside him and dies of a broken heart, the two having sacrificed marriage, loyalty, and finally life itself to a passion neither could master."}},{id:"binding-isaac-necessity-sacrificing",title:"The Binding of Isaac",creator:"Book of Genesis, traditionally compiled centuries BCE",appliesToType:"plotType",appliesToId:"polti-necessity-sacrificing-loved-ones",bestStructureId:"fichtean",beats:{setup:"God commands Abraham, without explanation, to sacrifice his beloved son Isaac as a test of faith.",rise:"Abraham travels three days to the appointed mountain with Isaac, evading his son's innocent questions about the missing sacrificial lamb.",climax:"Just as Abraham raises the knife over his bound son, an angel stays his hand and a ram appears to take Isaac's place.",fall:"Abraham's willingness to sacrifice even his son secures God's covenant and blessing for his descendants."},sections:{"crisis-1":"Without warning, God commands Abraham to take his beloved son Isaac to Mount Moriah and offer him there as a burnt sacrifice \u2014 a horrifying demand with no explanation given.","crisis-2":"Abraham obeys immediately, rising early, saddling his donkey, and setting out on a three-day journey toward the mountain with Isaac and two servants, telling no one the true purpose.","crisis-3":"As they climb the mountain alone, Isaac innocently asks his father where the lamb for the sacrifice is, forcing Abraham to answer without revealing that Isaac himself is meant to be that offering.","crisis-4":"Abraham builds the altar, arranges the wood, and binds his son Isaac upon it, raising the knife to kill him in obedience to the divine command.",climax:"At the last possible instant, an angel of the Lord calls out and stays Abraham's hand, and Abraham discovers a ram caught in a nearby thicket to sacrifice in Isaac's place.",resolution:`Abraham names the site "the Lord will provide," and having proven he would sacrifice even his beloved son, receives God's renewed covenant and blessing for his descendants.`}},{id:"iphigenia-aulis-necessity-sacrificing",title:"Iphigenia at Aulis",creator:"Euripides, c. 405 BCE",appliesToType:"plotType",appliesToId:"polti-necessity-sacrificing-loved-ones",bestStructureId:"fichtean",beats:{setup:"The Greek fleet is stranded at windless Aulis until a prophecy demands Agamemnon sacrifice his own daughter Iphigenia to Artemis.",rise:"Agamemnon lures Iphigenia to the camp under false pretenses of marriage, and the truth devastates her and her mother Clytemnestra as pleas for her life fail.",climax:"Facing certain death regardless, Iphigenia chooses to walk to the altar and accept the sacrifice willingly for Greece's cause.",fall:"The winds rise and the fleet sails for Troy, Agamemnon's command bought at the price of his own daughter's life."},sections:{"crisis-1":"The Greek fleet sits stranded at windless Aulis, and the seer Calchas declares Agamemnon must sacrifice his own daughter Iphigenia to Artemis before the winds will rise and Troy can be reached.","crisis-2":"Agamemnon, torn, sends for Iphigenia under the false pretext of marrying her to the hero Achilles, then immediately regrets the letter and tries and fails to recall it.","crisis-3":"Iphigenia and her mother Clytemnestra arrive joyfully expecting a wedding, only to learn the truth of why they've been summoned, plunging the camp into horror and pleading.","crisis-4":"Achilles, whose name was used without his consent, offers to defend Iphigenia by force against the army, but the assembled Greek soldiers, desperate to sail, demand the sacrifice go forward.",climax:"Facing inevitable death either way, Iphigenia chooses to accept her sacrifice willingly for the sake of Greece's cause, walking to the altar herself rather than being dragged to it.",resolution:"Iphigenia is sacrificed \u2014 in some tellings spirited away by Artemis at the final moment and replaced with a deer \u2014 the winds rise, and the fleet finally sails for Troy, Agamemnon's necessity as commander bought at the cost of his own daughter."}},{id:"david-goliath-rivalry-superior-inferior",title:"David and Goliath",creator:"Hebrew Bible, 1 Samuel 17",appliesToType:"plotType",appliesToId:"polti-rivalry-superior-inferior",bestStructureId:"story-circle",beats:{setup:"The Israelite army cowers before the giant champion Goliath's daily challenge until the young shepherd David, visiting the camp, volunteers to face him.",rise:"Rejecting Saul's armor for his familiar sling and stones, David confronts Goliath despite being mocked as hopelessly outmatched.",climax:"David fells the giant with a single stone before he can close the distance, then beheads him with his own sword.",fall:"The Philistine army routs, and the obscure shepherd becomes a national hero and future king, having proven the inferior can defeat the superior."},sections:{you:"David, a young shepherd boy, tends his father's sheep, occasionally visiting his brothers serving in Saul's army.",need:"He learns the entire Israelite army is paralyzed with fear before the giant champion Goliath's daily taunting challenge, and no one dares face him.",go:"David volunteers to fight Goliath himself, despite being untrained, unarmored, and mocked by his own brothers and even King Saul for the idea.",search:"David rejects Saul's offered armor and sword as unfamiliar, instead choosing his shepherd's sling and five smooth stones from a stream \u2014 tools he actually knows how to use.",find:"David strikes Goliath in the forehead with a single slung stone before the giant can even close the distance, dropping him instantly.",take:"David seizes Goliath's own sword and beheads him with it \u2014 a triumph, but one that instantly makes him a marked man, later hunted by a jealous Saul for the fame it brings him.",return:"David returns to the Israelite camp as the army routs the fleeing Philistines, and he is brought before Saul as the unlikely victor.",change:"The obscure shepherd boy is transformed overnight into a national hero and future king, having proven the small and unarmed can defeat the large and armored."}},{id:"legally-blonde-rivalry-superior-inferior",title:"Legally Blonde",creator:"dir. Robert Luketic, 2001",appliesToType:"plotType",appliesToId:"polti-rivalry-superior-inferior",bestStructureId:"story-circle",beats:{setup:"Dismissed by her boyfriend as too frivolous for his ambitions, sorority girl Elle Woods gets herself into Harvard Law School to win him back.",rise:"Faculty, classmates, and her ex openly underestimate her, but Elle earns a coveted internship on a real murder trial.",climax:"Using expertise everyone mocked as trivial \u2014 perm chemistry \u2014 Elle exposes the true killer's lie on the witness stand.",fall:'Elle emerges as a top student and rising lawyer, having overturned the assumed hierarchy between the elite and the "inferior" outsider.'},sections:{you:"Elle Woods thrives in her comfortable world of sorority life and fashion, confident and popular at USC.",need:'When her boyfriend Warner dumps her for not being "serious" enough for his Harvard-track ambitions, Elle needs to prove she can be exactly the kind of serious he claims to want.',go:"She throws herself into an unlikely law school application and, against all expectations, gets into Harvard Law.",search:"At Harvard, professors, classmates, and Warner himself openly dismiss her as an intellectual lightweight, and Elle struggles to be taken seriously in a world built to exclude someone like her.",find:"Through dogged effort she earns a coveted internship on a real murder trial, working alongside the very peers who underestimated her.",take:"Cornering a lying witness by using her genuine expertise in perm chemistry \u2014 knowledge everyone mocked as frivolous \u2014 Elle exposes the true killer, but only after enduring betrayal from a mentor who tried to exploit her.",return:"Elle returns to Harvard and her social circle utterly vindicated, no longer needing Warner's approval or anyone else's.",change:'The dismissed "dumb blonde" becomes a top student and rising lawyer, having flipped the assumed hierarchy between the "superior" Harvard elite and the "inferior" sorority girl entirely.'}},{id:"scarlet-letter-adultery",title:"The Scarlet Letter",creator:"Nathaniel Hawthorne, 1850",appliesToType:"plotType",appliesToId:"polti-adultery",bestStructureId:"freytag",beats:{setup:"Hester Prynne is publicly branded for adultery in Puritan Boston, refusing to name her lover, Reverend Dimmesdale, the father of her child.",rise:"Hester's supposedly dead husband returns in secret and torments the guilt-wracked Dimmesdale, who maintains his respected position while suffering in silence.",climax:"Dimmesdale finally confesses publicly on the scaffold, reveals a mark on his chest, and dies in Hester's arms.",fall:"Robbed of his revenge, Hester's husband withers and dies, while Hester lives on, transforming her mark of shame into one of quiet dignity."},sections:{exposition:'In strict Puritan Boston, Hester Prynne is publicly condemned to wear a scarlet letter "A" for adultery after giving birth to a daughter, Pearl, while her husband was long believed dead.',"rising-action":"Hester refuses to reveal the child's father, secretly Reverend Arthur Dimmesdale, who continues in his esteemed position while privately consumed by guilt, even as Hester's supposedly dead husband Roger Chillingworth returns in disguise and insinuates himself into Dimmesdale's life to discover and torment him.",climax:"Chillingworth's psychological torture drives Dimmesdale toward collapse, and on Election Day, in front of the whole town, Dimmesdale finally climbs the scaffold, publicly confesses his sin, and reveals a mark on his own chest before dying in Hester's arms.","falling-action":"Chillingworth, robbed of his revenge by the confession, withers and dies within the year, leaving his fortune to Pearl.",denouement:"Hester remains in the town for the rest of her life, wearing the letter that once shamed her until it becomes a symbol of dignity and quiet service, having outlasted the punishment meant to destroy her."}},{id:"madame-bovary-adultery",title:"Madame Bovary",creator:"Gustave Flaubert, 1856",appliesToType:"plotType",appliesToId:"polti-adultery",bestStructureId:"freytag",beats:{setup:"Bored by provincial marriage to her devoted but dull husband Charles, Emma Bovary seeks the passion of her novels through affairs and lavish, secret spending.",rise:"Her lover Rodolphe abandons her when she asks him to elope, and her mounting debts spiral toward exposure and ruin.",climax:"With no one willing to save her from disgrace, Emma poisons herself with arsenic and dies in agony before her husband.",fall:"Charles discovers her infidelities and debts after her death and is destroyed by the truth, dying himself shortly after."},sections:{exposition:"Emma Bovary marries the plain, devoted country doctor Charles, but finds provincial married life stifling compared to the romantic passion she has absorbed from novels.","rising-action":"Restless and unfulfilled, Emma begins an affair with the landowner Rodolphe and later with the clerk L\xE9on, pursuing the intensity she craves while secretly accumulating crushing debts to fund a lifestyle of luxury and escape.",climax:"Rodolphe abandons Emma when she begs him to run away with her, and soon after the moneylender Lheureux calls in her secret debts, threatening to expose everything and seize the family's property.","falling-action":"With no one willing to save her from ruin and disgrace, Emma swallows arsenic and dies an agonizing death in front of her helpless husband.",denouement:"Charles, discovering Emma's letters and debts after her death, is destroyed by the truth of her betrayals and dies himself shortly after, leaving their daughter an orphan sent to work in a cotton mill."}},{id:"double-indemnity-crimes-of-love",title:"Double Indemnity",creator:"dir. Billy Wilder, 1944",appliesToType:"plotType",appliesToId:"polti-crimes-of-love",bestStructureId:"fichtean",beats:{setup:"Insurance man Walter Neff falls for Phyllis Dietrichson, who draws him into a scheme to murder her husband for an insurance payout.",rise:"The two stage the murder as a train accident, but Neff's colleague Keyes grows suspicious, and Neff discovers Phyllis has been manipulating another man just as coldly.",climax:"Confronting each other, Neff and Phyllis shoot one another in her darkened living room.",fall:"Mortally wounded, Neff makes it back to his office only to collapse, his recorded confession revealing the crime love drove him to commit."},sections:{"crisis-1":"Insurance man Walter Neff, wounded and bleeding, begins recording a late-night confession into his office dictaphone, opening the story already inside the crime he is about to explain.","crisis-2":"Weeks earlier, Neff falls for Phyllis Dietrichson on a routine house call, and she quickly steers him toward a scheme to murder her husband for a lucrative accident policy.","crisis-3":`The two carry out the murder together, staging it as a fall from a train to trigger the policy's double-indemnity clause \u2014 but Neff's colleague, sharp claims investigator Barton Keyes, immediately senses the "accident" is fraudulent.`,"crisis-4":"As Keyes closes in and suspicion mounts, Neff discovers Phyllis has been carrying on with another man and manipulating him just as coldly as she manipulated Neff, shattering any illusion the murder was born of love.",climax:"Confronting Phyllis in her darkened living room, Neff and she shoot each other; mortally wounded, Neff barely manages to leave before collapsing back at his office.",resolution:"Keyes finds Neff dying by the elevator, having heard the whole confession on the dictaphone, and the film closes on the ruin that love turned to murder finally brought down on everyone involved."}},{id:"postman-rings-twice-crimes-of-love",title:"The Postman Always Rings Twice",creator:"James M. Cain, 1934",appliesToType:"plotType",appliesToId:"polti-crimes-of-love",bestStructureId:"fichtean",beats:{setup:"Drifter Frank Chambers falls into a dangerous affair with Cora, the young wife of diner owner Nick, and the two begin plotting his murder.",rise:"A first murder attempt fails and nearly exposes them; a second, staged as a car crash, succeeds but draws a suspicious prosecutor who turns the lovers against each other.",climax:"Legal maneuvering wins their acquittal for Nick's murder, but immediately afterward Cora dies in a genuine car accident.",fall:"Frank is convicted and sentenced to death for Cora's death \u2014 a murder he didn't commit \u2014 in ironic payment for the one he did."},sections:{"crisis-1":"Drifter Frank Chambers arrives at a roadside diner and is instantly drawn into a dangerous, immediate attraction to Cora, the young wife of the older owner Nick.","crisis-2":"Frank and Cora begin a reckless affair right under Nick's roof and quickly start plotting to kill him so they can be together and take over the business.","crisis-3":"Their first murder attempt, staged as a bathtub accident, fails and nearly gets them caught, forcing them into a tense, distrustful standoff
