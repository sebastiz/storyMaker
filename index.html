 Collins, 2008",appliesToType:"structure",appliesToId:"seven-point",beats:{hook:"Katniss Everdeen lives in poverty in District 12, providing for her family by illegally hunting outside the fence.","plot-turn-1":"Katniss volunteers to take her younger sister's place in the deadly Hunger Games, and is taken to the Capitol to train.","pinch-1":"The Games begin, and the Career tributes' brutal alliance shows Katniss exactly how outmatched she is.",midpoint:"Katniss allies with Rue and, after Rue's death, openly defies the Capitol by honoring her \u2014 shifting from survival to resistance.","pinch-2":"The Gamemakers change the rules and then reverse them again, forcing a final, desperate confrontation.","plot-turn-2":"Katniss and Peeta realize the only way to beat the Capitol's game is to threaten to deny it a winner at all.",resolution:"Both are declared victors, but Katniss's act of defiance has marked her as a target of the Capitol's attention."}},{id:"gift-of-magi-kishotenketsu",title:"The Gift of the Magi",creator:"O. Henry, 1905",appliesToType:"structure",appliesToId:"kishotenketsu",beats:{ki:"Della, poor and married to Jim, wants desperately to buy him a worthy Christmas gift.",sho:"She sells her one great beauty \u2014 her long hair \u2014 to buy Jim a chain for his prized pocket watch.",ten:"Jim arrives home having sold his own great possession, the watch, to buy Della the combs she'd always wanted for her hair.",ketsu:"Their gifts are now useless, but the story recasts this loss as proof of a love greater than anything money could buy."}},{id:"alien-fichtean",title:"Alien",creator:"dir. Ridley Scott, 1979",appliesToType:"structure",appliesToId:"fichtean",beats:{"crisis-1":"The crew of the Nostromo investigates a distress signal and brings an unknown lifeform aboard, already deep into danger.","crisis-2":"The creature attacks and kills a crew member, and the crew realizes it's grown far larger and more dangerous than first seen.","crisis-3":"The crew's attempts to trap and kill the alien fail one after another, and it picks them off through the ship's vents.","crisis-4":"Ripley discovers the science officer Ash is an android under orders to protect the alien over the crew's lives.",climax:"Ripley triggers the ship's self-destruct and flees to the escape shuttle, only to find the alien has stowed away with her.",resolution:"Ripley blasts the creature out of the airlock and drifts alone in the shuttle, the sole survivor."}},{id:"finding-nemo-story-circle",title:"Finding Nemo",creator:"Pixar, dir. Andrew Stanton, 2003",appliesToType:"structure",appliesToId:"story-circle",beats:{you:"Marlin, an anxious clownfish, is overly protective of his only son Nemo after losing his wife and other children.",need:"Nemo wants independence and to prove himself, defying Marlin's caution.",go:"Nemo is captured by a diver and taken away, forcing Marlin to leave the reef for the first time to find him.",search:"Marlin, with Dory's help, searches the ocean, facing sharks, jellyfish and the vast unknown.",find:"Marlin locates the fish tank in Sydney where Nemo is being held, having grown along the way.",take:"Marlin nearly loses Dory and himself in the process, and believes at one point that Nemo has died.",return:"Nemo escapes the tank and reunites with his father in the ocean.",change:"Marlin returns home a less fearful, more trusting father, letting Nemo swim off to school on his own."}},{id:"raiders-eight-sequence",title:"Raiders of the Lost Ark",creator:"dir. Steven Spielberg, 1981",appliesToType:"structure",appliesToId:"eight-sequence",beats:{"status-quo":"Indiana Jones, an archaeologist and adventurer, narrowly retrieves a golden idol from a booby-trapped temple, only to lose it to a rival.",predicament:"The U.S. government recruits Indy to find the Ark of the Covenant before the Nazis do.","obstacle-1":"Indy travels to Nepal to recover a medallion needed to locate the Ark, and reunites with his former love, Marion.","stakes-1":"In Cairo, Indy and Marion evade Nazi agents and rival archaeologist Belloq while racing to the Ark's hidden location.",midpoint:"Indy finds the Ark first, but Belloq and the Nazis seize it from him at gunpoint.","stakes-2":"Indy and Marion are captured, and the Nazis begin shipping the Ark toward Germany.",culmination:"Indy stages a daring commando raid on the Nazi convoy to reclaim the Ark before it can be studied.",climax:"The Nazis open the Ark on a remote island, unleashing a wrathful power that destroys everyone who looks upon it except Indy and Marion, who look away."}},{id:"harry-potter-weiland",title:"Harry Potter and the Sorcerer's Stone",creator:"J.K. Rowling, 1997",appliesToType:"structure",appliesToId:"weiland",beats:{hook:"Harry Potter lives a miserable, neglected life with the Dursleys, unaware of his true origins.",inciting:"Letters from Hogwarts start arriving, and Hagrid reveals Harry is a wizard.","plot-point-1":"Harry boards the Hogwarts Express and begins his first year at the School of Witchcraft and Wizardry.","pinch-1":"Harry and his friends discover something dangerous is being guarded on the school's forbidden third floor.",midpoint:"Harry learns the object is the Sorcerer's Stone, and suspects Professor Snape is trying to steal it for Voldemort.","pinch-2":"Hagrid lets slip the secret to controlling the three-headed guard dog, and the trio realizes the theft is imminent.","plot-point-3":"Harry, Ron and Hermione descend through the trapdoor themselves to stop the theft before it's too late.",climax:"Harry confronts Professor Quirrell, who is possessed by Voldemort, and protects the Stone through his mother's protective love.",resolution:"Harry recovers from his injuries, Gryffindor wins the house cup, and he returns to the Dursleys for the summer, now knowing who he really is."}},{id:"godfather-truby-22",title:"The Godfather",creator:"dir. Francis Ford Coppola, 1972",appliesToType:"structure",appliesToId:"truby-22",beats:{"self-rev-preview":"Michael Corleone begins the story insisting he wants nothing to do with the family business.",ghost:"The Corleone family's violent criminal history shapes the world Michael has tried to distance himself from.",weakness:"Michael's need to prove his loyalty and protect his family will pull him back in, despite his own denial.",inciting:"Vito Corleone is shot and nearly killed in an assassination attempt by a rival family.",desire:"Michael wants to protect his father and stabilize the family without becoming the man his father is.",allies:"Michael's brothers Sonny and Fredo, and the family's consigliere Tom Hagen, all play their parts around him.",opponent:"Rival mob boss Sollozzo and the corrupt police captain McCluskey threaten the Corleones directly.","fake-ally":"McCluskey poses as a neutral law-enforcement figure while actually protecting Sollozzo.","first-rev":"Michael realizes no one else can get close enough to kill Sollozzo and McCluskey \u2014 only he can, precisely because he's seen as harmless.",plan:"Michael plans to meet Sollozzo and McCluskey under a truce, with a gun planted in the restaurant bathroom.","opp-plan":"Sollozzo and McCluskey plan the same meeting believing they hold all the power over an unarmed civilian.",drive:"Michael commits fully, murdering both men and fleeing to Sicily to avoid the war that follows.","attack-ally":"Sonny's hot temper gets him killed in an ambush, a catastrophic blow struck through the family's own vulnerabilities.","apparent-defeat":"Michael's Sicilian bride is killed by a car bomb meant for him, and the family's war seems to be spiraling out of control.","second-rev":"Michael returns to America harder and more resolved, taking on real control of the family's operations.","audience-rev":"The audience sees Michael's transformation more clearly than his own family does, as he consolidates power while appearing reasonable.","third-rev":"Michael learns exactly which family heads and traitors \u2014 including his own brother-in-law \u2014 have betrayed the Corleones.",gate:"Michael becomes godfather to his nephew, standing in church even as his final plan is set irrevocably in motion.",battle:"In a single sequence, Michael's men assassinate the heads of the rival Five Families and settle every old score at once.","self-rev":"Michael has fully become the ruthless don he once swore he'd never be.",moral:"He lies to his wife Kay's face about his crimes, choosing the family's code over honesty with her.","new-equilibrium":"The door closes on Kay, now shut out, as Michael takes his place as the new Godfather."}},{id:"lion-king-pixar-spine",title:"The Lion King",creator:"Disney, dir. Roger Allers & Rob Minkoff, 1994",appliesToType:"structure",appliesToId:"pixar-spine",beats:{"once-upon":"Simba is born a lion cub, prince of the Pride Lands, presented to the animal kingdom by his father Mufasa.","every-day":"Simba grows up playful and eager, learning what it means to one day be king.","until-one-day":"Simba's uncle Scar tricks him into a stampede that kills Mufasa, and convinces Simba the death was his fault.","because-1":"Guilt-ridden, Simba flees the Pride Lands and is taken in by Timon and Pumbaa, who teach him to forget his past.","because-2":"Simba grows up in exile until his childhood friend Nala finds him and tells him Scar has ruined the kingdom.","until-finally":"Simba returns, confronts Scar, and reclaims his place as king in a final battle for the Pride Lands.","ever-since":"Simba takes his rightful place as king, and presents his own newborn cub just as his father once presented him."}},{id:"october-sky-virgins-promise",title:"October Sky",creator:"dir. Joe Johnston, 1999 (based on Homer Hickam's memoir)",appliesToType:"structure",appliesToId:"virgins-promise",beats:{"dependent-world":"Homer Hickam lives in a West Virginia coal town where sons are expected to follow their fathers into the mine.",price:"Homer's father expects him to take over as mine superintendent, leaving no room for other ambitions.",opportunity:"Inspired by the launch of Sputnik, Homer decides to build his own rockets.","dresses-part":"Homer and his friends start experimenting with homemade rockets, learning by failure and explosion.","secret-world":"The boys build increasingly sophisticated rockets in secret, teaching themselves calculus and machining along the way.","no-longer-fits":"Homer's growing passion for rocketry puts him increasingly at odds with his father's expectations for his future.","caught-shining":"A rocket is blamed for starting a forest fire, and the town turns against the boys' project.","gives-up":"Facing his father's disapproval and the town's suspicion, Homer nearly abandons rocketry for good.","ally-helps":"A teacher, Miss Riley, and the boys' own evidence prove their rocket didn't start the fire, keeping the dream alive.","kingdom-chaos":"A mine accident injures Homer's father, throwing the family's future and the town's fate into uncertainty.","chooses-journey":"Homer returns to finish his rocket project and enter the National Science Fair, choosing his own path forward.","rages-reveals":"Homer and his friends present their rocketry work at the science fair, openly proving what they can do.",wonder:"They win a national award, and Homer earns a scholarship that leads him, eventually, to a career at NASA."}},{id:"devil-wears-prada-heroines-journey",title:"The Devil Wears Prada",creator:"dir. David Frankel, 2006 (based on Lauren Weisberger's novel)",appliesToType:"structure",appliesToId:"heroines-journey",beats:{separation:"Andy Sachs takes a job at a prestigious fashion magazine, dismissive of the industry's values she doesn't share.",identification:"To succeed, she adopts the demanding, image-driven standards of her boss Miranda Priestly and the magazine's world.","road-of-trials":"Andy proves herself through increasingly difficult, high-pressure tasks that Miranda throws at her.",boon:"Andy becomes genuinely skilled at the job, trusted with real responsibility and access to a glamorous world.",aridity:"Her success costs her relationships with her boyfriend and friends, and she starts to feel like a different, emptier person.",descent:"A crisis \u2014 betraying a colleague under Miranda's orders \u2014 forces Andy to confront what she's become.",yearning:"Andy realizes she misses who she was before the job reshaped her values.","healing-split":"She quits the job outright, rejecting the version of success Miranda represents.","healing-masculine":"Andy carries the discipline and confidence she gained into a new, more honest career path.",integration:"She reconnects with her old friends and relationships as herself, having kept what served her and let go of what didn't."}},{id:"three-little-pigs-todorov",title:"The Three Little Pigs",creator:"traditional folk tale",appliesToType:"structure",appliesToId:"todorov",beats:{equilibrium:"Three little pigs leave home and each build their own house, living peacefully.",disruption:"A wolf arrives and blows down the houses of straw and sticks, eating the first two pigs.",recognition:"The third pig, who built with brick, realizes the wolf is a real and serious threat.",repair:"The wolf tries to get into the brick house through the chimney, and the pig boils a pot of water to stop him.","new-equilibrium":"The wolf is defeated for good, and the surviving pig lives safely in his sturdy house."}},{id:"frankenstein-frame-narrative",title:"Frankenstein",creator:"Mary Shelley, 1818",appliesToType:"structure",appliesToId:"frame-narrative",beats:{"enter-frame":"Arctic explorer Robert Walton writes letters to his sister describing his voyage, when his ship rescues a stranded, desperate man.","frame-setup":"The rescued man, Victor Frankenstein, agrees to tell Walton the story of how he came to be alone on the ice.","inner-begins":"Victor recounts his obsession with creating life, and the moment his creature first opens its eyes.","inner-develops":"Horrified by what he's made, Victor abandons his creation, which learns, suffers, and turns to vengeance against him.","inner-resolves":"The creature kills those Victor loves one by one, and Victor pursues it into the Arctic to destroy it.","return-frame":"Victor finishes his story to Walton, exhausted and near death from his pursuit.","frame-closes":"Victor dies aboard Walton's ship, and the creature appears one last time, mourning its creator before vanishing into the ice."}},{id:"cinderella-propp-31",title:"Cinderella",creator:"traditional folk tale",appliesToType:"structure",appliesToId:"propp-31",beats:{absentation:"Cinderella's father, her last protector, is often absent or ineffective, leaving her at her stepmother's mercy.",interdiction:"The fairy godmother warns Cinderella she must return before midnight, when the magic will end.",violation:"Cinderella, swept up in the ball, loses track of time and almost violates the warning.",reconnaissance:"The stepmother and stepsisters watch Cinderella closely, suspicious of any spark of hope in her.",delivery:"Word arrives of a royal ball where the prince will choose a bride, information the stepfamily hoards for themselves.",trickery:"The stepmother promises Cinderella she may attend if she finishes an impossible list of chores, never intending to let her go.",complicity:"Cinderella, desperate to belong, believes the promise and works herself to exhaustion trying to earn her place.","villainy-lack":"The stepmother and stepsisters destroy Cinderella's makeshift gown, leaving her with nothing to wear and no way to attend.",mediation:"Cinderella's fairy godmother appears, moved by her distress, and resolves to help her get to the ball.",counteraction:"Cinderella accepts the fairy godmother's help and agrees to go, despite everything stacked against her.",departure:"Transformed and dressed for the ball, Cinderella leaves for the palace in her enchanted coach.","donor-first":"The fairy godmother tests nothing of Cinderella directly, but her sudden appearance is itself the classic donor encounter.","hero-reaction":"Cinderella receives the magical help with gratitude, not entitlement, and promises to return by midnight.","magical-agent":"She's given the coach, the footmen, the gown, and the glass slippers \u2014 the tools that make the rest of the story possible.",guidance:"The magic carries her directly to the ball, delivering her into the prince's presence.",struggle:"Cinderella's real struggle is against the clock itself, racing the enchantment's deadline rather than a person.",branding:"In her rush to escape before midnight, she leaves behind a single glass slipper \u2014 a mark that will later identify her.",victory:"She escapes the palace before the spell breaks and her disguise is exposed, her secret still safe.",liquidation:"The immediate crisis \u2014 being unmasked as a servant at a royal ball \u2014 is avoided, at the cost of losing the prince's trail.",return:"Cinderella returns home to her ordinary, mistreated life, the ball already feeling like a dream.",pursuit:"The prince, determined to find the woman who fled, sends his men through the kingdom carrying the glass slipper.",rescue:"The fairy godmother's earlier intervention is what makes any of this possible \u2014 Cinderella's 'rescue' from her drudgery, however brief.",unrecognized:"When the prince's men arrive at her house, Cinderella is treated as just another servant, unrecognized as the woman from the ball.",unfounded:"Her stepsisters try to force their feet into the glass slipper, each falsely claiming they are the one the prince seeks.","difficult-task":"Every woman in the kingdom must try on the glass slipper to prove she's the one who fits it.",solution:"Only Cinderella's foot fits the slipper perfectly, when she's finally given the chance to try.","propp-recognition":"The prince recognizes her as the woman from the ball, slipper and all.",exposure:"The stepsisters' false claims are exposed as the slipper reveals who the real match is.",transfiguration:"Cinderella is dressed properly at last, presented as a bride rather than a servant.",punishment:"The stepmother and stepsisters lose their hold over Cinderella entirely, cast out of her new life.",wedding:"Cinderella marries the prince, and her days of servitude end for good."}},{id:"lotr-the-quest",title:"The Lord of the Rings",creator:"J.R.R. Tolkien, 1954\u201355",appliesToType:"plotType",appliesToId:"the-quest",bestStructureId:"hero-journey",beats:{setup:"Frodo Baggins inherits a Ring of terrible power and learns it must be destroyed to save Middle-earth.",rise:"The Fellowship sets out for Mordor, facing Orcs, betrayal, and the loss of their guide Gandalf along the way.",climax:"Frodo and Sam reach the edge of Mount Doom, exhausted and consumed by the Ring's corrupting will.",fall:"The Ring is destroyed, Sauron's power collapses, and Frodo returns home forever changed by what the journey cost him."},characters:[{category:"protagonist",name:"Frodo Baggins",values:{setup:-1,rise:-1,climax:-3,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"mentor",name:"Gandalf",values:{setup:1,rise:-3,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}},{category:"ally",name:"Sam",values:{setup:0,rise:1,climax:-2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Gollum",values:{setup:0,rise:0,climax:0,fall:-3},interacts:{setup:!1,rise:!1,climax:!0,fall:!0}},{category:"antagonist",name:"Sauron",values:{setup:2,rise:3,climax:-1,fall:-3},interacts:{setup:!1,rise:!1,climax:!1,fall:!1}},{category:"threshold-guardian",name:"the Balrog",values:{setup:0,rise:2,climax:-3,fall:-3},interacts:{setup:!1,rise:!0,climax:!1,fall:!1}}],sections:{"ordinary-world":"Frodo Baggins lives a quiet, unremarkable life in the Shire, having inherited his uncle Bilbo's old ring.",call:"Gandalf reveals that the ring is the One Ring of legend, and that Sauron's forces are already hunting for it.",refusal:"Leaving behind the only home he's ever known, Frodo hesitates at the weight of what he's being asked to carry into a danger he barely understands.",mentor:"Gandalf explains the Ring's history and the danger closing in, arming Frodo with the knowledge he needs before he can leave the Shire.",threshold:"Frodo leaves the Shire with the ring, committing to carry it to the elves at Rivendell.","tests-allies":"A Fellowship forms around him, and together they push toward Mordor, learning the dangers of Orcs, treacherous mountains, and betrayal along the way.",approach:"The Fellowship chooses the perilous mines of Moria as their only way through the mountains, sharpening their plan as Sauron's forces close in.",ordeal:"Gandalf falls fighting the Balrog in the depths of Moria, and the shattered Fellowship is forced to continue the quest without him.",reward:"Having survived Moria, the Fellowship pushes on toward Mordor, holding onto their goal even as they reel from the cost of losing their guide.","road-back":"Frodo and Sam, now alone and exhausted, are betrayed and nearly captured as Sauron's forces close in around Mount Doom.",resurrection:"Frodo reaches the fire at Mount Doom at last, but the Ring's corrupting will overpowers him and he claims it for himself instead of destroying it.",elixir:"Gollum bites the Ring from Frodo's hand and falls into the fire with it, destroying it and ending Sauron's power \u2014 and Frodo returns to the Shire forever changed by what the journey cost him."}},{id:"midsummer-comedy",title:"A Midsummer Night's Dream",creator:"William Shakespeare, c. 1595",appliesToType:"plotType",appliesToId:"comedy",bestStructureId:"kishotenketsu",beats:{setup:"Four young Athenian lovers, mismatched in their affections, flee into an enchanted forest.",rise:"A mischievous fairy's love potion causes chaos, making the wrong lovers fall for each other overnight.",climax:"The confusion peaks in a tangle of jealousy and accusation among the four, none of them understanding why.",fall:"The fairy king sets things right, the correct couples are reunited, and the play ends in a triple wedding."},characters:[{category:"protagonist",name:"Oberon",values:{setup:1,rise:-1,climax:-2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Puck",values:{setup:0,rise:-2,climax:-3,fall:1},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"foil",name:"Titania",values:{setup:1,rise:-2,climax:-3,fall:2},interacts:{setup:!0,rise:!0,climax:!1,fall:!0}},{category:"other",name:"the four lovers",values:{setup:0,rise:-2,climax:-3,fall:3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Bottom",values:{setup:0,rise:2,climax:1,fall:0},interacts:{setup:!1,rise:!0,climax:!1,fall:!1}}],sections:{ki:"Four young Athenian lovers, tangled in mismatched affections with a wedding just days away, flee into an enchanted forest \u2014 two escaping a forced match, the other two in pursuit.",sho:"The fairy king, observing the lovers, orders his servant Puck to use a love potion to sort out their feelings, giving him only vague instructions to go on.",ten:"Puck enchants the wrong young man entirely, and a second dose only doubles the error, leaving both men infatuated with the same woman while chaos and accusations spread among all four.",ketsu:"The fairy king steps in to correct Puck's mistake himself, resetting the enchantment so the correct couples reunite, and the play closes on a triple wedding."}},{id:"christmas-carol-rebirth",title:"A Christmas Carol",creator:"Charles Dickens, 1843",appliesToType:"plotType",appliesToId:"rebirth",bestStructureId:"story-circle",beats:{setup:"Ebenezer Scrooge is a miserly, joyless old man who despises Christmas and everyone who enjoys it.",rise:"Three ghosts show him his past, present, and the bleak future his selfishness is leading toward.",climax:"Scrooge sees his own unmourned death and the destruction his greed has caused those around him.",fall:"Terrified into change, Scrooge wakes transformed \u2014 generous, warm, and eager to make amends."},characters:[{category:"protagonist",name:"Ebenezer Scrooge",values:{setup:-3,rise:-1,climax:-3,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"mentor",name:"Marley's Ghost",values:{setup:-3,rise:-3,climax:-3,fall:-3},interacts:{setup:!0,rise:!1,climax:!1,fall:!1}},{category:"other",name:"Tiny Tim",values:{setup:0,rise:-2,climax:-3,fall:1},interacts:{setup:!1,rise:!1,climax:!1,fall:!1}},{category:"mentor",name:"the Three Spirits",values:{setup:0,rise:2,climax:3,fall:1},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"ally",name:"Bob Cratchit",values:{setup:-1,rise:-1,climax:-2,fall:2},interacts:{setup:!0,rise:!0,climax:!1,fall:!0}},{category:"ally",name:"Fred",values:{setup:1,rise:0,climax:-1,fall:3},interacts:{setup:!0,rise:!1,climax:!1,fall:!0}}],sections:{you:"Ebenezer Scrooge is a miserly, joyless old man, comfortable in his contempt for Christmas and everyone who enjoys it.",need:"The ghost of his late partner Marley arrives to warn him that he must change, announcing that three more spirits will visit him that night.",go:"The Ghost of Christmas Past pulls him out of his familiar bitterness and into an unfamiliar reckoning, forcing him to relive the choices that hardened him into who he is.",search:"The Ghost of Christmas Present carries him further, showing him the warmth of a holiday he's shut himself out of, especially the modest joy of the Cratchit family.",find:"Amid the Cratchits' warmth he learns that his own name is spoken with contempt rather than affection, and comes face to face with what his selfishness has actually cost.",take:"The price comes due as he's shown that Tiny Tim's life hangs in the balance, and then the Ghost of Christmas Yet to Come shows him his own unmourned death and the relief it brings to those around him.",return:"Terrified by the sight of his own neglected grave, Scrooge is returned to his bedroom, begging for a chance to change before it's too late.",change:"He wakes transformed \u2014 generous, warm, and eager to make amends, now capable of the change the whole night's ordeal was built to force."}},{id:"lotr-tobias-quest",title:"The Lord of the Rings",creator:"J.R.R. Tolkien, 1954\u201355",appliesToType:"plotType",appliesToId:"tobias-quest",bestStructureId:"hero-journey",beats:{setup:"Frodo Baggins inherits a Ring of terrible power that must be destroyed to save Middle-earth.",rise:"The Fellowship treks toward Mordor, facing Orcs, betrayal, and the loss of Gandalf along the way.",climax:"Frodo and Sam reach the edge of Mount Doom, exhausted and consumed by the Ring's corrupting will.",fall:"The Ring is destroyed and Sauron's power collapses, though Frodo returns home forever changed."},characters:[{category:"protagonist",name:"Frodo Baggins",values:{setup:-1,rise:-1,climax:-3,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"mentor",name:"Gandalf",values:{setup:1,rise:-3,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}},{category:"ally",name:"Sam",values:{setup:0,rise:1,climax:-2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Gollum",values:{setup:0,rise:0,climax:0,fall:-3},interacts:{setup:!1,rise:!1,climax:!0,fall:!0}},{category:"antagonist",name:"Sauron",values:{setup:2,rise:3,climax:-1,fall:-3},interacts:{setup:!1,rise:!1,climax:!1,fall:!1}},{category:"threshold-guardian",name:"the Balrog",values:{setup:0,rise:2,climax:-3,fall:-3},interacts:{setup:!1,rise:!0,climax:!1,fall:!1}}],sections:{"ordinary-world":"Frodo Baggins lives a quiet life in the Shire, unaware of what his uncle Bilbo's old ring truly is.",call:"Gandalf returns and reveals it as the One Ring, with Sauron's forces already searching for it.",refusal:"Frodo is reluctant to leave the safety of the Shire, needing Gandalf's warning about Sauron's approaching servants to spur him into action.",mentor:"Gandalf guides Frodo, explaining the Ring's history and setting him on the road with Sam, Merry, and Pippin.",threshold:"Frodo leaves the Shire for good, and the Fellowship of the Ring is formed at Rivendell to escort him toward Mordor.","tests-allies":"The Fellowship treks through mountains and wilderness, facing Orcs and testing the loyalty and courage of its members.",approach:"Nearing Moria and the borders of Mordor, the group prepares for the dangers ahead as the road narrows and grows more dangerous.",ordeal:"Gandalf falls in Moria fighting the Balrog, and the Fellowship must go on without its guide, its darkest moment yet.",reward:"Having survived Moria, Frodo chooses to leave the other companions and continue toward Mordor with only Sam, after Boromir's betrayal fractures the Fellowship.","road-back":"Frodo and Sam press on alone toward Mordor, hunted and nearly captured as they near Mount Doom.",resurrection:"At the Cracks of Doom, the Ring's will finally overpowers Frodo and he claims it instead of destroying it \u2014 until Gollum bites it from his hand and falls into the fire with it.",elixir:"Sauron's power collapses instantly, and Frodo returns home to the Shire, having saved Middle-earth but forever changed by what the Ring cost him."}},{id:"raiders-tobias-adventure",title:"Raiders of the Lost Ark",creator:"dir. Steven Spielberg, 1981",appliesToType:"plotType",appliesToId:"tobias-adventure",bestStructureId:"seven-point",beats:{setup:"Indiana Jones is recruited to find the Ark of the Covenant before the Nazis can use its power.",rise:"He travels from Nepal to Cairo, racing rivals and evading danger to trace the Ark's location.",climax:"Indy risks everything in a commando raid to steal the Ark back from a moving Nazi convoy.",fall:"He survives the Ark's terrible power unleashed on his enemies, delivering it \u2014 bruised but victorious \u2014 to safety."},characters:[{category:"protagonist",name:"Indiana Jones",values:{setup:0,rise:1,climax:2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the Nazis",values:{setup:1,rise:2,climax:-1,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"love-interest",name:"Marion Ravenwood",values:{setup:1,rise:0,climax:-2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Belloq",values:{setup:0,rise:1,climax:3,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"ally",name:"Sallah",values:{setup:1,rise:1,climax:0,fall:2},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}}],sections:{hook:"Indiana Jones starts as a professor of archaeology moonlighting as a relic hunter, skilled but chasing artifacts for their own sake rather than any larger cause.","plot-turn-1":"Army intelligence recruits him to find the Ark of the Covenant before the Nazis can use its power, giving his hunt real stakes for the first time.","pinch-1":"Racing rivals and Nazi agents from Nepal to Cairo, Indy sees firsthand how far the Nazis will go, tracing the Ark's location to a hidden dig site.",midpoint:"The Nazis seize the Ark from him at gunpoint and seal it away, forcing Indy to stop searching and start acting.","pinch-2":"With the Ark now in Nazi hands and loaded onto a convoy, the threat of what they'll do with its power becomes immediate and inescapable.","plot-turn-2":"Indy mounts a desperate commando raid on the moving convoy, stealing the Ark back and finding the leverage he needs to finish the job.",resolution:"When the Nazis open the Ark, Indy survives its unleashed power by refusing to look, delivering it \u2014 bruised but victorious \u2014 to safety."}},{id:"fugitive-tobias-pursuit",title:"The Fugitive",creator:"dir. Andrew Davis, 1993",appliesToType:"plotType",appliesToId:"tobias-pursuit",bestStructureId:"fichtean",beats:{setup:"Dr. Richard Kimble is wrongly convicted of murdering his wife and sentenced to death.",rise:"He escapes custody during a prison transport crash and goes on the run, hunted by U.S. Marshal Sam Gerard.",climax:"Kimble and Gerard's cat-and-mouse chase converges as Kimble closes in on the real killer.",fall:"Kimble proves his innocence and exposes the real killer, with Gerard finally on his side."},characters:[{category:"protagonist",name:"Dr. Richard Kimble",values:{setup:-3,rise:-1,climax:1,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Sam Gerard",values:{setup:2,rise:2,climax:1,fall:1},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the one-armed man",values:{setup:1,rise:1,climax:-2,fall:-3},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}},{category:"antagonist",name:"Dr. Charles Nichols",values:{setup:2,rise:2,climax:-1,fall:-3},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}}],sections:{"crisis-1":"Dr. Richard Kimble is wrongly convicted of murdering his wife and sentenced to death \u2014 the story opens already in the wreckage of that injustice.","crisis-2":"During a prison transport crash, Kimble escapes custody and immediately becomes the target of a manhunt led by U.S. Marshal Sam Gerard.","crisis-3":"Going underground in Chicago, Kimble uses his medical skill to survive while secretly hunting for the real killer, always one step ahead of Gerard's search.","crisis-4":"Gerard's manhunt tightens around him again and again, forcing increasingly desperate evasions as the net closes in.",climax:"Kimble finally corners the one-armed man himself, uncovering the conspiracy behind his wife's murder in a final, direct confrontation.",resolution:"He proves his innocence to Gerard, who lets him go \u2014 the hunter finally on the hunted man's side."}},{id:"taken-tobias-rescue",title:"Taken",creator:"dir. Pierre Morel, 2008",appliesToType:"plotType",appliesToId:"tobias-rescue",bestStructureId:"save-the-cat",beats:{setup:"Bryan Mills' daughter Kim is kidnapped by human traffickers while traveling in Paris.",rise:"Bryan uses his covert-operative skills to track the kidnappers through Europe's criminal underworld.",climax:"He infiltrates the trafficking ring's stronghold in a final, violent confrontation to reach his daughter.",fall:"Bryan rescues Kim and brings her home safely, the ordeal reshaping their relationship."},characters:[{category:"protagonist",name:"Bryan Mills",values:{setup:0,rise:1,climax:2,fall:3},interacts:{setup:!0,rise:!1,climax:!0,fall:!0}},{category:"other",name:"Kim Mills",values:{setup:1,rise:-3,climax:-2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the traffickers",values:{setup:2,rise:2,climax:-1,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"threshold-guardian",name:"the guards",values:{setup:1,rise:1,climax:-2,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}}],sections:{"opening-image":"Bryan Mills, a retired covert operative, is introduced trying awkwardly to reconnect with his teenage daughter Kim after years away on assignment.","theme-stated":"Bryan's protectiveness is dismissed by his ex-wife and Kim as overbearing \u2014 the film's argument that his particular skills will matter more than anyone expects.","set-up":"Estranged from his family and unsure of his place in Kim's life, Bryan reluctantly agrees to let her travel to Paris with a friend.",catalyst:"Minutes after landing in Paris, Kim is abducted by human traffickers while on the phone with her father.",debate:"Bryan, still on the line as it happens, has only seconds to decide what to do, and vows to the kidnappers that he will find and kill them.","break-into-two":"He leaves for Paris immediately, stepping back into the covert-operative identity he'd tried to leave behind.","b-story":"His old contacts and network of former colleagues become his lifeline, the only people who can help him navigate the city's criminal underworld.","fun-and-games":"Bryan works his way through the trafficking network with brutal efficiency, interrogating one lead after another for information.",midpoint:"Each interrogation brings him closer to Kim, but reveals the clock is running out before she's sold at auction.","bad-guys-close":"The trafficking ring's reach becomes clear as Bryan discovers how organized and dangerous the operation protecting Kim's buyer really is.","all-is-lost":"He learns Kim may already be gone to a private buyer, seemingly beyond even his reach.","dark-night":"With time nearly out, Bryan has only one lead left and no guarantee it will get him to his daughter in time.","break-into-three":"He infiltrates the ring's stronghold, fighting through layers of guards with the sole aim of reaching the yacht where the auction is being held.",finale:"Bryan storms the buyer's yacht moments before the auction, killing everyone standing between him and Kim.","final-image":"He brings Kim home safely, the ordeal having rebuilt in hours the closeness that years apart had cost them."}},{id:"shawshank-tobias-escape",title:"The Shawshank Redemption",creator:"dir. Frank Darabont, 1994",appliesToType:"plotType",appliesToId:"tobias-escape",bestStructureId:"weiland",beats:{setup:"Andy Dufresne, a banker wrongly convicted of murder, begins a life sentence at Shawshank Prison.",rise:"Over years, he quietly earns trust, launders money for corrupt guards, and tunnels through his cell wall in secret.",climax:"Andy makes his escape through the prison's sewage pipe during a single stormy night.",fall:"He emerges free, exposes the warden's corruption, and starts a new life on a beach in Mexico."},characters:[{category:"protagonist",name:"Andy Dufresne",values:{setup:-3,rise:-1,climax:2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the warden",values:{setup:2,rise:2,climax:1,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Red",values:{setup:-2,rise:0,climax:1,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Captain Hadley",values:{setup:1,rise:2,climax:0,fall:0},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"ally",name:"Tommy Williams",values:{setup:0,rise:1,climax:-3,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"foil",name:"Brooks Hatlen",values:{setup:1,rise:-2,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}}],sections:{hook:"Andy Dufresne, a mild-mannered banker, arrives at Shawshank Prison to begin a life sentence, utterly out of place among its hardened inmates.",inciting:"Convicted of a murder he didn't commit, Andy must find a way to survive a world built to break him.","plot-point-1":"He commits to enduring by making himself quietly useful to the guards, offering his financial expertise in exchange for protection.","pinch-1":"The warden draws Andy into laundering money for his corrupt schemes, a reminder of just how much power the warden holds over his fate.",midpoint:"While pursuing an old conviction, Andy learns of new evidence that could actually clear his name, turning him from passive survivor to active seeker of freedom.","pinch-2":"Rather than risk losing his useful accountant, the warden buries the evidence and threatens Andy directly, showing the true extent of his ruthlessness.","plot-point-3":"With his last hope of legal exoneration destroyed, Andy resolves that his only way out is the tunnel he's been quietly digging behind his cell wall poster for years.",climax:"On a single stormy night, Andy crawls through the prison's sewage pipe and emerges, finally free, in the river beyond the walls.",resolution:"He exposes the warden's corruption from the outside and starts a new life on a beach in Mexico."}},{id:"monte-cristo-tobias-revenge",title:"The Count of Monte Cristo",creator:"Alexandre Dumas, 1844\u201346",appliesToType:"plotType",appliesToId:"tobias-revenge",bestStructureId:"freytag",beats:{setup:"Edmond Dant\xE8s is falsely imprisoned by jealous rivals on the eve of his wedding.",rise:"After years in prison, he escapes with a fortune and reinvents himself as the mysterious Count of Monte Cristo.",climax:"He methodically destroys the men who betrayed him, one by one, using their own weaknesses against them.",fall:"Having taken his revenge, Dant\xE8s must decide whether it has left him anything worth living for."},characters:[{category:"protagonist",name:"Edmond Dant\xE8s",values:{setup:-3,rise:0,climax:2,fall:1},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"his former rivals",values:{setup:2,rise:2,climax:-1,fall:-3},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}},{category:"love-interest",name:"the woman he loves",values:{setup:1,rise:-2,climax:-1,fall:0},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}},{category:"mentor",name:"a fellow prisoner",values:{setup:-3,rise:-1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}}],sections:{exposition:"Edmond Dant\xE8s is a young sailor on the verge of marrying the woman he loves, his future bright until jealous rivals falsely accuse him of treason.","rising-action":"Imprisoned without trial in the Ch\xE2teau d'If, he escapes years later with a hidden fortune and reinvents himself as the mysterious Count of Monte Cristo, quietly infiltrating the lives of the men who ruined him.",climax:"Having learned exactly how each betrayer profited from his downfall, the Count turns their own greed against them, methodically destroying their fortunes and reputations one by one.","falling-action":"The last of his betrayers is exposed and ruined, and Dant\xE8s's long-planned revenge is finally, completely carried out.",denouement:"Alone with what he's done, Dant\xE8s must decide whether revenge has left him anything worth living for."}},{id:"da-vinci-code-tobias-riddle",title:"The Da Vinci Code",creator:"Dan Brown, 2003",appliesToType:"plotType",appliesToId:"tobias-riddle",bestStructureId:"eight-sequence",beats:{setup:"Symbologist Robert Langdon is drawn into a murder investigation built around a trail of hidden codes.",rise:"Langdon and Sophie Neveu follow clues through art, history and secret societies, one step ahead of those hunting them.",climax:"The final clues point to a truth that threatens to upend centuries of religious history.",fall:"The mystery is solved, revealing a secret Langdon must decide what to do with."},characters:[{category:"protagonist",name:"Robert Langdon",values:{setup:0,rise:0,climax:1,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Sophie Neveu",values:{setup:0,rise:1,climax:0,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"their pursuers",values:{setup:2,rise:1,climax:-1,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"Leigh Teabing",values:{setup:0,rise:2,climax:-1,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}}],sections:{"status-quo":"Robert Langdon, a Harvard symbologist lecturing in Paris, is called to the Louvre where a curator has been murdered and left behind a coded message.",predicament:"Suspected of the murder himself, Langdon is locked into solving the code and clearing his name \u2014 he can't simply walk away.","obstacle-1":"He teams up with the curator's granddaughter, Sophie Neveu, to flee the police and begin decoding the first clues left at the crime scene.","stakes-1":"The two follow the trail through the Louvre and into a Paris bank vault, staying one step ahead of both the police and a mysterious pursuer.",midpoint:"A country estate reveals the existence of a secret society that has guarded a hidden truth for centuries, changing what Langdon believes is actually at stake.","stakes-2":"Their pursuers close in as the clues point toward a revelation that could upend centuries of religious history.",culmination:"Cornered and running out of options, Langdon races to piece together the final clues before his enemies can seize the secret first.",climax:"Langdon solves the last riddle, the secret is revealed, and the mystery resolves, leaving him with a truth he alone must decide what to do with."}},{id:"amadeus-tobias-rivalry",title:"Amadeus",creator:"dir. Milo\u0161 Forman, 1984",appliesToType:"plotType",appliesToId:"tobias-rivalry",bestStructureId:"frame-narrative",beats:{setup:"Composer Antonio Salieri is devoted to God and music, until the brilliant, vulgar young Mozart arrives at court.",rise:"Salieri's admiration curdles into obsessive jealousy as Mozart's genius consistently outshines his own hard-won skill.",climax:"Salieri schemes to destroy Mozart, secretly commissioning a requiem meant for Mozart's own funeral.",fall:"Mozart dies in poverty and obscurity while Salieri lives on, tormented by having engineered it."},characters:[{category:"protagonist",name:"Antonio Salieri",values:{setup:2,rise:-1,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"foil",name:"Mozart",values:{setup:1,rise:3,climax:-1,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Constanze Mozart",values:{setup:1,rise:0,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}}],sections:{"enter-frame":"An elderly Antonio Salieri, confined to an asylum after a suicide attempt, begins confessing his life's great sin to a young priest.","frame-setup":"Salieri explains that he must tell the full story of his relationship with Mozart before the priest can understand what he's done.","inner-begins":"He recalls his own devotion to God and music as the Viennese court's celebrated composer, and the day the vulgar, brilliant young Mozart arrived and instantly outshone him.","inner-develops":"Within his memory, Salieri's admiration curdles into obsessive secret jealousy, and he schemes quietly against Mozart's career while publicly maintaining his favor, even as Mozart's fortunes decline through poverty and excess.","inner-resolves":"In disguise, Salieri commissions Mozart to write a requiem secretly intended for Mozart's own funeral, and is at his bedside when Mozart collapses while composing it, finally granted the closeness to genius he always craved.","return-frame":"The confession returns to the asylum, where the priest looks on, shaken by what Salieri has just admitted to orchestrating.","frame-closes":"Salieri, now an old man absolving the asylum's other patients of their own mediocrity, closes the frame \u2014 the only one left who knows he was there when Mozart died in poverty and obscurity."}},{id:"rocky-tobias-underdog",title:"Rocky",creator:"dir. John G. Avildsen, 1976",appliesToType:"plotType",appliesToId:"tobias-underdog",bestStructureId:"story-circle",beats:{setup:"Rocky Balboa is a small-time boxer with no real prospects, scraping by in Philadelphia.",rise:"Given a shot at the heavyweight title, he trains relentlessly against impossible odds.",climax:"Rocky goes the distance against champion Apollo Creed, a fight no one expected him to survive.",fall:"He loses the decision but proves to himself and everyone else that he was never really the underdog he seemed."},characters:[{category:"protagonist",name:"Rocky Balboa",values:{setup:-2,rise:0,climax:1,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Apollo Creed",values:{setup:3,rise:2,climax:0,fall:1},interacts:{setup:!1,rise:!1,climax:!0,fall:!1}},{category:"love-interest",name:"Adrian",values:{setup:-2,rise:1,climax:1,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"mentor",name:"Mickey",values:{setup:-1,rise:2,climax:1,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}}],sections:{you:"Rocky Balboa is a small-time club boxer scraping by as a debt collector in Philadelphia, comfortable in his low expectations of himself.",need:"He wants, more than anything, to prove he isn't just another washed-up nobody \u2014 a need he's buried under years of accepting his limits.",go:"Heavyweight champion Apollo Creed picks him, almost as a publicity stunt, for a title shot, pulling Rocky into a world far beyond his own.",search:"Rocky trains relentlessly, running the city's streets and pushing his body past what anyone, including himself, thought possible.",find:"He finds real confidence for the first time, deciding his goal isn't to win but simply to go the distance with Creed.",take:"Fight night costs him dearly \u2014 he's battered early and absorbs far more punishment than planned, paying for that confidence in blood.",return:"He returns to his corner and his life in Philadelphia after going the full fifteen rounds, the fight over and the decision against him.",change:"Rocky loses the decision but returns changed \u2014 proof to himself and everyone watching that he was never the pushover he seemed."}},{id:"dorian-gray-tobias-temptation",title:"The Picture of Dorian Gray",creator:"Oscar Wilde, 1890",appliesToType:"plotType",appliesToId:"tobias-temptation",bestStructureId:"todorov",beats:{setup:"Dorian Gray, young and beautiful, wishes his portrait would age instead of him.",rise:"Free of consequence, he pursues every pleasure and vice, growing more corrupt while his portrait alone bears the damage.",climax:"The portrait grows monstrous, reflecting the full horror of the life Dorian has actually lived.",fall:"Dorian destroys the painting in a final act, and his own body instantly bears all the years and sins he'd escaped."},characters:[{category:"protagonist",name:"Dorian Gray",values:{setup:2,rise:3,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"mentor",name:"Lord Henry Wotton",values:{setup:2,rise:2,climax:1,fall:1},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Basil Hallward",values:{setup:1,rise:-1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"love-interest",name:"Sibyl Vane",values:{setup:0,rise:-3,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}}],sections:{equilibrium:"Dorian Gray is a beautiful, impressionable young man newly introduced to high society, his beauty and innocence still intact.",disruption:"He wishes aloud that his portrait would age instead of him, and the wish, unnoticed by anyone, comes true.",recognition:"As years of vice leave no mark on his face, only on the portrait hidden away in his attic, Dorian realizes exactly what his wish has bought him, and begins indulging every pleasure without fear of consequence.",repair:"Desperate to keep the truth contained as the portrait grows monstrous and the damage it hides mounts, Dorian murders the one man who threatens to expose it, then finally attempts to destroy the painting itself.","new-equilibrium":"The moment he stabs the portrait, his body instantly bears every year and every sin he'd escaped, and he's found dead \u2014 aged and unrecognizable, order restored at last, terribly."}},{id:"metamorphosis-tobias-metamorphosis",title:"The Metamorphosis",creator:"Franz Kafka, 1915",appliesToType:"plotType",appliesToId:"tobias-metamorphosis",bestStructureId:"todorov",beats:{setup:"Gregor Samsa wakes one morning to find himself transformed into a giant insect.",rise:"His family, horrified and ashamed, isolates him further as he struggles to adapt to his new form.",climax:"Gregor's increasing alienation from his family reaches a breaking point after an incident terrifies them further.",fall:"Gregor dies, unmourned by a family relieved to be free of him, who move on without him."},characters:[{category:"protagonist",name:"Gregor Samsa",values:{setup:-1,rise:-2,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"Gregor's father",values:{setup:1,rise:0,climax:-2,fall:1},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Grete Samsa",values:{setup:1,rise:0,climax:-2,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Gregor's mother",values:{setup:0,rise:-1,climax:-2,fall:1},interacts:{setup:!0,rise:!0,climax:!1,fall:!0}}],sections:{equilibrium:"Gregor Samsa works tirelessly as a traveling salesman to support his family, living an unremarkable but stable life.",disruption:"He wakes one morning transformed into a giant insect, unable to explain it to anyone.",recognition:"His family, horrified, locks him away and begins treating him as a source of shame rather than a son, even as he tries to reassure and still care for them.",repair:"The family's efforts to cope curdle into neglect and cruelty \u2014 his father injures him badly, and an incident at a family gathering finally convinces them he must be gotten rid of.","new-equilibrium":"Gregor dies alone, unmourned by a family visibly relieved to be free of him, who move on into a lighter life without him."}},{id:"beauty-beast-tobias-transformation",title:"Beauty and the Beast",creator:"traditional / Disney, 1991",appliesToType:"plotType",appliesToId:"tobias-transformation",bestStructureId:"story-circle",beats:{setup:"Belle is taken prisoner by a cursed Beast in exchange for her father's freedom.",rise:"Despite her fear, Belle and the Beast slowly grow to understand and care for each other.",climax:"The Beast releases Belle to save her father, risking losing her forever just as he's learned to love.",fall:"Belle returns to save him, and her love breaks the curse, transforming him back into a man."},characters:[{category:"protagonist",name:"Belle",values:{setup:0,rise:-1,climax:-2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"the Beast",values:{setup:-3,rise:0,climax:-3,fall:3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the villagers",values:{setup:1,rise:1,climax:2,fall:-3},interacts:{setup:!1,rise:!1,climax:!0,fall:!1}},{category:"other",name:"Belle's father",values:{setup:0,rise:-3,climax:1,fall:2},interacts:{setup:!0,rise:!1,climax:!0,fall:!0}},{category:"antagonist",name:"Gaston",values:{setup:2,rise:1,climax:3,fall:-3},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}}],sections:{you:"Belle lives contentedly in her village, considered odd for loving books more than suitors.",need:"Her father is imprisoned by a cursed Beast for trespassing in his castle, and Belle needs to free him.",go:"She offers herself in her father's place, entering the Beast's castle as his prisoner instead.",search:"Despite her fear of him, she adapts to castle life, and she and the Beast slowly begin to talk and understand each other.",find:"She discovers the enchanted rose at the heart of his curse, and finds genuine feeling for the Beast beneath it.",take:"The Beast releases Belle to save her dying father, paying the price of likely losing her and his last chance to break the curse.",return:"Belle returns to the castle to defend him against villagers who have come to kill him, declaring her love as he dies in her arms.",change:"Her love breaks the curse, transforming him back into a man, and both are changed by what they've been through."}},{id:"mockingbird-tobias-maturation",title:"To Kill a Mockingbird",creator:"Harper Lee, 1960",appliesToType:"plotType",appliesToId:"tobias-maturation",bestStructureId:"seven-point",beats:{setup:"Scout Finch grows up in a small Alabama town where her father Atticus defends a Black man falsely accused of rape.",rise:"Scout witnesses the town's ugliness and prejudice up close as the trial divides the community.",climax:"Despite Atticus's defense, the all-white jury convicts an innocent man, and violence follows.",fall:"Scout comes away with a harder, truer understanding of justice, courage, and the adult world's failures."},characters:[{category:"protagonist",name:"Scout Finch",values:{setup:0,rise:-1,climax:-2,fall:1},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"mentor",name:"Atticus Finch",values:{setup:1,rise:0,climax:-2,fall:0},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Tom Robinson",values:{setup:-2,rise:-2,climax:-3,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"ally",name:"Boo Radley",values:{setup:0,rise:0,climax:2,fall:1},interacts:{setup:!1,rise:!1,climax:!0,fall:!0}},{category:"antagonist",name:"the jury",values:{setup:1,rise:1,climax:-2,fall:-3},interacts:{setup:!1,rise:!1,climax:!0,fall:!1}},{category:"ally",name:"Jem Finch",values:{setup:0,rise:-1,climax:-3,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}}],sections:{hook:"Scout Finch is a young girl growing up comfortably naive in a small, sleepy Alabama town.","plot-turn-1":"Her father Atticus agrees to defend Tom Robinson, a Black man falsely accused of rape, thrusting the family into controversy.","pinch-1":"Scout and her brother Jem begin facing the town's open hostility and prejudice for their father's decision.",midpoint:"The trial exposes the town's ingrained racism up close, dividing neighbors and classmates, and Scout starts actively questioning what she's been taught.","pinch-2":"Despite Atticus proving Tom's innocence beyond reasonable doubt, the all-white jury convicts him anyway, and violence follows in the town.","plot-turn-2":"Bob Ewell, humiliated by the trial's outcome, attacks Scout and Jem walking home at night.",resolution:"Saved by the reclusive neighbor Boo Radley, Scout comes away with a harder, truer understanding of justice, courage, and the adult world's failures than the child who started the story."}},{id:"pride-prejudice-tobias-love",title:"Pride and Prejudice",creator:"Jane Austen, 1813",appliesToType:"plotType",appliesToId:"tobias-love",bestStructureId:"eight-sequence",beats:{setup:"Elizabeth Bennet and Mr. Darcy take an instant dislike to each other at a country ball.",rise:"Pride, misunderstanding and prejudice on both sides keep pulling them apart even as circumstances draw them together.",climax:"Darcy's quiet intervention to save Elizabeth's sister's reputation forces Elizabeth to see him differently.",fall:"Both having overcome their own flaws, Elizabeth and Darcy finally admit their feelings and marry."},characters:[{category:"protagonist",name:"Elizabeth Bennet",values:{setup:0,rise:-1,climax:1,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Mr. Darcy",values:{setup:-1,rise:-1,climax:2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Mr. Wickham",values:{setup:1,rise:2,climax:-1,fall:-1},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}},{category:"ally",name:"Jane Bennet",values:{setup:1,rise:-2,climax:0,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}}],sections:{"status-quo":"Elizabeth Bennet, one of five sisters under pressure to marry well, meets the wealthy, aloof Mr. Darcy at a country ball and takes an instant dislike to him.",predicament:"Darcy's cold first impression, and Elizabeth's own pride, harden into a settled prejudice against him that she can't easily set aside.","obstacle-1":"Circumstances keep drawing them into each other's company even as misunderstandings pile up between them.","stakes-1":"Their acquaintance deepens even as Elizabeth's conviction that Darcy has wronged people she loves grows firmer.",midpoint:"Darcy proposes, badly, and Elizabeth refuses him outright, furious at what she believes he's done to those she loves.","stakes-2":"A family scandal threatens to ruin the Bennets' reputation and any hope of respectable marriages for the sisters.",culmination:"Elizabeth learns that Darcy has quietly intervened behind the scenes to resolve the scandal and save her family.",climax:"Forced to see him clearly for the first time, Elizabeth realizes she was wrong about him all along, and \u2014 both having overcome their own flaws \u2014 she and Darcy finally admit their feelings and marry."}},{id:"romeo-juliet-tobias-forbidden-love",title:"Romeo and Juliet",creator:"William Shakespeare, c. 1595",appliesToType:"plotType",appliesToId:"tobias-forbidden-love",bestStructureId:"freytag",beats:{setup:"Romeo and Juliet fall in love at first sight, unaware \u2014 then all too aware \u2014 that their families are sworn enemies.",rise:"They marry in secret, but the feud between their families keeps escalating around them.",climax:"A fatal duel forces Romeo into exile just as their secret marriage should have offered them a future.",fall:"A plan to reunite them collapses into tragedy, and both die rather than live without each other."},characters:[{category:"protagonist",name:"Romeo",values:{setup:1,rise:1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Juliet",values:{setup:1,rise:1,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Tybalt",values:{setup:0,rise:2,climax:-3,fall:-3},interacts:{setup:!1,rise:!0,climax:!1,fall:!1}},{category:"mentor",name:"the friar",values:{setup:0,rise:1,climax:-1,fall:-2},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Mercutio",values:{setup:1,rise:2,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}}],sections:{exposition:"The Montagues and Capulets are locked in a bitter feud across Verona; Romeo, a Montague, sneaks into a Capulet party and falls for Juliet, a Capulet, at first sight.","rising-action":"Learning each other's names and families, they choose each other anyway, marrying in secret with a friar's help, hoping their union might one day end the feud.",climax:"Romeo kills Juliet's cousin Tybalt in a duel provoked by the feud and is banished from Verona, just as their secret marriage should have offered them a future.","falling-action":"Juliet's parents, unaware of the marriage, move to force her into marrying another man, so she fakes her own death to escape it \u2014 but the plan to warn Romeo goes wrong.",denouement:"Believing her truly dead, Romeo kills himself beside her, and she wakes only to do the same."}},{id:"tale-two-cities-tobias-sacrifice",title:"A Tale of Two Cities",creator:"Charles Dickens, 1859",appliesToType:"plotType",appliesToId:"tobias-sacrifice",bestStructureId:"weiland",beats:{setup:"Sydney Carton, a dissolute lawyer, loves Lucie Manette, who is married to a man who closely resembles him.",rise:"Revolutionary France condemns Lucie's husband Darnay to the guillotine, and Carton resolves to act.",climax:"Carton switches places with Darnay in prison, sacrificing himself to save the man Lucie loves.",fall:"Carton goes to the guillotine in Darnay's place, finding peace in the meaning of his sacrifice."},characters:[{category:"protagonist",name:"Sydney Carton",values:{setup:-2,rise:-1,climax:2,fall:2},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}},{category:"other",name:"Charles Darnay",values:{setup:0,rise:-2,climax:-3,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Lucie Manette",values:{setup:1,rise:-1,climax:-3,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Madame Defarge",values:{setup:1,rise:2,climax:3,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}}],sections:{hook:"Sydney Carton is a brilliant but dissolute lawyer who believes his life amounts to little.",inciting:"He meets Lucie Manette and falls in love with her, though she loves and marries Charles Darnay instead.","plot-point-1":"Carton vows privately that he'd do anything for Lucie's happiness, even at his own cost \u2014 the resolve that will come to define him.","pinch-1":"Revolutionary France descends into the Terror, a reminder of the danger now closing in on anyone tied to the old aristocracy.",midpoint:"Darnay is lured back to Paris and arrested, pulling Carton from private resolve toward active intervention.","pinch-2":"Darnay is condemned to the guillotine, and Lucie's family faces losing him within days with no legal way to save him.","plot-point-3":"Carton, who closely resembles Darnay, quietly arranges to switch places with him in prison.",climax:"Carton takes Darnay's place at the guillotine, allowing the real man to escape to safety with his family.",resolution:"Carton dies in Darnay's place, finding peace at last in the meaning his sacrifice gives a life he once thought wasted."}},{id:"truman-show-tobias-discovery",title:"The Truman Show",creator:"dir. Peter Weir, 1998",appliesToType:"plotType",appliesToId:"tobias-discovery",bestStructureId:"kishotenketsu",beats:{setup:"Truman Burbank lives an apparently ordinary life, unaware it's all a constructed television set.",rise:"Small inconsistencies \u2014 a falling light, a rerun weatherman \u2014 begin to make Truman suspect something's wrong.",climax:"Truman sails to the edge of his artificial world and finds the literal wall of the dome enclosing it.",fall:"He chooses to walk out the studio door into the real world, leaving his entire manufactured life behind."},characters:[{category:"protagonist",name:"Truman Burbank",values:{setup:1,rise:-1,climax:-2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"the show's producers",values:{setup:2,rise:1,climax:-1,fall:-2},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"Christof",values:{setup:3,rise:2,climax:-1,fall:-2},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"love-interest",name:"Sylvia (Lauren)",values:{setup:1,rise:-1,climax:1,fall:3},interacts:{setup:!0,rise:!1,climax:!1,fall:!1}}],sections:{ki:"Truman Burbank lives an apparently ordinary, cheerful life in the town of Seahaven, unaware it's all a constructed television set.",sho:"Small inconsistencies pile up \u2014 a studio light falling from the sky, a rerun weatherman, the same extras and routes always steering him away from leaving town \u2014 and Truman starts investigating.",ten:"He sails to the literal edge of his artificial world and finds the wall of the dome enclosing it, recontextualizing his entire life as a performance staged for others' entertainment.",ketsu:"He chooses to walk out the studio door into the real world, leaving his entire manufactured life behind for good."}},{id:"gatsby-tobias-wretched-excess",title:"The Great Gatsby",creator:"F. Scott Fitzgerald, 1925",appliesToType:"plotType",appliesToId:"tobias-wretched-excess",bestStructureId:"freytag",beats:{setup:"Jay Gatsby throws lavish, extravagant parties, all in pursuit of winning back his lost love Daisy.",rise:"His obsession with wealth and image grows more consuming as he tries to recreate a past that can't return.",climax:"Gatsby's carefully built world collapses when Daisy chooses not to leave her husband for him after all.",fall:"Gatsby is killed for a crime that wasn't his, his funeral attended by almost no one from the world he built."},characters:[{category:"protagonist",name:"Jay Gatsby",values:{setup:1,rise:0,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"love-interest",name:"Daisy Buchanan",values:{setup:0,rise:0,climax:-1,fall:-1},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"Tom Buchanan",values:{setup:1,rise:1,climax:-1,fall:1},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"ally",name:"Nick",values:{setup:0,rise:0,climax:0,fall:1},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Myrtle Wilson",values:{setup:-1,rise:0,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}}],sections:{exposition:"Jay Gatsby has built himself into a mysterious, fabulously wealthy figure on Long Island, throwing lavish parties purely in hopes his lost love Daisy will one day walk through the door.","rising-action":"He reconnects with Daisy through her cousin Nick and pursues her openly, his obsession with recreating their earlier romance growing more consuming as their affair resumes.",climax:"He confronts Daisy's husband Tom directly, demanding she admit she never loved him at all \u2014 but Daisy hesitates, unable to say it, and Gatsby's carefully built fantasy begins to crack.","falling-action":"Daisy, driving Gatsby's car, kills Tom's mistress in an accident that Gatsby takes the blame for.",denouement:"Gatsby is killed for a crime that wasn't his, his funeral attended by almost no one from the world he built."}},{id:"pursuit-happyness-tobias-ascension",title:"The Pursuit of Happyness",creator:"dir. Gabriele Muccino, 2006",appliesToType:"plotType",appliesToId:"tobias-ascension",bestStructureId:"pixar-spine",beats:{setup:"Chris Gardner is broke and homeless, struggling to care for his young son while chasing a stockbroker internship.",rise:"He works an unpaid internship by day and searches for shelter each night, refusing to give up.",climax:"Chris pushes through his hardest, most exhausting stretch, right before the internship's outcome is decided.",fall:"He's offered a full-time position, the reward for a climb that nearly broke him."},characters:[{category:"protagonist",name:"Chris Gardner",values:{setup:-3,rise:-1,climax:-2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Chris's son",values:{setup:-2,rise:-1,climax:-1,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}}],sections:{"once-upon":"Chris Gardner is a struggling salesman trying to sell bone-density scanners no one wants to buy.","every-day":"He scrapes by day after day, already stretched to his limit just to get by.","until-one-day":"His wife leaves, and Chris is left to raise their young son largely alone and broke.","because-1":"Because of that, he lands an unpaid stockbroker internship, betting everything on a slim chance at a real career.","because-2":"Because of that, he and his son are evicted, forced into subway stations and a homeless facility each night while he still shows up for the internship by day.","until-finally":"Exhausted and nearly out of options, Chris pushes through the hardest, most desperate stretch of the internship's final weeks.","ever-since":"He's offered a full-time position, the reward for a climb that nearly broke him, and their lives are never as precarious again."}},{id:"breaking-bad-tobias-descension",title:"Breaking Bad",creator:"created by Vince Gilligan, 2008\u201313",appliesToType:"plotType",appliesToId:"tobias-descension",bestStructureId:"fichtean",beats:{setup:"Walter White, a mild-mannered chemistry teacher, is diagnosed with terminal cancer and starts making methamphetamine to provide for his family.",rise:"Success in the drug trade feeds Walter's ego, and he makes increasingly ruthless choices to protect and expand it.",climax:"Walter's lies and violence catch up with him, costing him his family, his safety, and nearly everyone he once protected.",fall:"He dies alone, having become the very danger he once told himself he was protecting his family from."},characters:[{category:"protagonist",name:"Walter White",values:{setup:-1,rise:2,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Jesse Pinkman",values:{setup:-1,rise:1,climax:-3,fall:-1},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Skyler White",values:{setup:1,rise:-2,climax:-3,fall:-1},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Hank Schrader",values:{setup:1,rise:1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"Gus Fring",values:{setup:0,rise:3,climax:-3,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}}],sections:{"crisis-1":"Walter White, a mild-mannered high school chemistry teacher, is diagnosed with terminal cancer and, desperate to provide for his family, starts cooking methamphetamine.","crisis-2":"What began as a decision he tells himself is temporary spirals as he takes on dangerous partners and rivals in the drug trade.","crisis-3":"Success in the trade feeds his ego, and he makes increasingly ruthless choices \u2014 lies, manipulation, violence \u2014 to protect and expand what he's built.","crisis-4":"His double life collapses around him, costing him his family's trust and his own safety.",climax:"In a final confrontation, Walter faces the full consequences of the empire and the enemies he's made.",resolution:"He dies alone, having become the very danger he once told himself he was protecting his family from."}},{id:"oliver-twist-polti-supplication",title:"Oliver Twist",creator:"Charles Dickens, 1838",appliesToType:"plotType",appliesToId:"polti-supplication",bestStructureId:"todorov",beats:{setup:"Oliver Twist grows up abused and starving in a workhouse, with no one to appeal to.",rise:"He famously begs for more food and is punished severely for the request.",climax:"Sold into apprenticeship and later drawn into a gang of pickpockets, Oliver has no power to change his circumstances himself.",fall:"Kind strangers eventually intervene on his behalf, rescuing him from the life he was powerless to escape alone."},characters:[{category:"protagonist",name:"Oliver Twist",values:{setup:-3,rise:-2,climax:-2,fall:2},interacts:{setup:!0,rise:!0,climax:!1,fall:!0}},{category:"ally",name:"Mr. Brownlow",values:{setup:0,rise:0,climax:2,fall:3},interacts:{setup:!1,rise:!1,climax:!0,fall:!0}},{category:"antagonist",name:"Fagin's gang",values:{setup:1,rise:1,climax:-1,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}},{category:"ally",name:"Nancy",values:{setup:-1,rise:0,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"Bill Sikes",values:{setup:1,rise:1,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}}],sections:{equilibrium:"Oliver is an orphan living out a harsh but stable existence in a workhouse, kept alive on starvation rations with no one to appeal to.",disruption:"Chosen by the other starving boys, Oliver breaks the workhouse's unspoken rule and asks the master for more food, an act that upends his already precarious position.",recognition:"Punished severely and sold into apprenticeship, Oliver is marked as trouble by everyone around him; he runs away to London and falls in with Fagin's gang of child pickpockets, sliding further from any real recourse.",repair:"When Oliver is wrongly blamed for a theft, the kind stranger Mr. Brownlow steps in, and his continued advocacy works to extract Oliver from the life of crime and abuse he had no power to escape on his own.","new-equilibrium":"With Brownlow's protection, Oliver is finally lifted out of the workhouse-to-underworld cycle and into a stable, cared-for life he never had a voice in choosing before."}},{id:"exodus-polti-deliverance",title:"The Book of Exodus",creator:"Hebrew Bible",appliesToType:"plotType",appliesToId:"polti-deliverance",bestStructureId:"hero-journey",beats:{setup:"The Israelites live enslaved in Egypt under Pharaoh's harsh rule.",rise:"Moses confronts Pharaoh again and again, demanding freedom for his people.",climax:"The ten plagues devastate Egypt until Pharaoh finally, briefly, relents.",fall:"Moses leads the Israelites out of Egypt and through the parted sea to freedom."},characters:[{category:"protagonist",name:"Moses",values:{setup:0,rise:-1,climax:1,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Pharaoh",values:{setup:2,rise:1,climax:-2,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"mentor",name:"God",values:{setup:3,rise:3,climax:3,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Aaron",values:{setup:0,rise:1,climax:1,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}}],sections:{"ordinary-world":"The Israelites live enslaved in Egypt, generations deep into Pharaoh's harsh rule, with Moses himself raised, unaware of his origins, inside Pharaoh's own household.",call:"God calls to Moses from the burning bush, charging him to return to Egypt and demand his people's freedom.",refusal:"Moses protests that he is not fit for the task, unsure he can face Pharaoh or be believed by his own people.",mentor:"God equips Moses with signs and the support of his brother Aaron to speak on his behalf before Pharaoh.",threshold:"Moses leaves his quiet life as a shepherd and returns to Egypt to confront Pharaoh directly for the first time.","tests-allies":"Pharaoh refuses again and again, and Moses learns the rules of this new confrontation as plague after plague strikes Egypt in response.",approach:"Each plague grows worse, and Pharaoh's heart hardens further every time he comes close to relenting, raising the stakes toward a final reckoning.",ordeal:"The final and most terrible plague kills every Egyptian firstborn, a life-or-death horror that finally breaks Pharaoh's resistance.",reward:"Pharaoh releases the Israelites, and Moses leads his people out of Egypt at last \u2014 but freedom comes at the cost of that final plague's devastation.","road-back":"Pharaoh changes his mind and sends his army in pursuit, trapping the fleeing Israelites against the waters of the Red Sea.",resurrection:"The sea parts for Moses, and the Israelites cross safely as the waters close over Pharaoh's pursuing army, the ordeal's true climax.",elixir:"The Israelites walk free on the far shore, carrying their deliverance from slavery into a new, unwritten future."}},{id:"monte-cristo-polti-crime-vengeance",title:"The Count of Monte Cristo",creator:"Alexandre Dumas, 1844\u201346",appliesToType:"plotType",appliesToId:"polti-crime-vengeance",bestStructureId:"seven-point",beats:{setup:"Edmond Dant\xE8s is falsely imprisoned by jealous rivals on the eve of his wedding.",rise:"After years in prison, he escapes with a fortune and reinvents himself as the mysterious Count of Monte Cristo.",climax:"He methodically destroys the men who betrayed him, one by one, using their own weaknesses against them.",fall:"Having taken his revenge, Dant\xE8s must decide whether it has left him anything worth living for."},characters:[{category:"protagonist",name:"Edmond Dant\xE8s",values:{setup:-3,rise:0,climax:2,fall:1},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"his former rivals",values:{setup:2,rise:2,climax:-1,fall:-3},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}},{category:"love-interest",name:"the woman he loves",values:{setup:1,rise:-2,climax:-1,fall:0},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}},{category:"mentor",name:"a fellow prisoner",values:{setup:-3,rise:-1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}}],sections:{hook:"Edmond Dant\xE8s is a young sailor on the verge of marrying the woman he loves \u2014 the picture of an ordinary life about to begin, set against the ruined, vengeful man he'll become.","plot-turn-1":"Jealous rivals falsely accuse him of treason, and he is imprisoned without trial on the eve of his wedding, ripped out of that ordinary life entirely.","pinch-1":"Years pass in the Ch\xE2teau d'If, where a fellow prisoner reveals the location of a vast hidden fortune and confirms exactly who conspired to destroy Dant\xE8s.",midpoint:"Escaping with that fortune, Dant\xE8s reinvents himself as the mysterious Count of Monte Cristo and moves from passive victim to active architect of revenge, infiltrating his betrayers' lives.","pinch-2":"He learns precisely how each man profited from his ruin, and begins turning their own greed and secrets against them, stripping away the safety of their new lives one by one.","plot-turn-2":"Having engineered the fortunes, marriages, and reputations of his enemies into ruin, Dant\xE8s finds the last piece he needs to bring down the final betrayer.",resolution:"With his revenge finally complete, Dant\xE8s \u2014 the count now standing where the sailor from the hook once did \u2014 must decide whether destroying his enemies has left him anything left to live for."}},{id:"godfather-polti-vengeance-kindred",title:"The Godfather",creator:"dir. Francis Ford Coppola, 1972",appliesToType:"plotType",appliesToId:"polti-vengeance-kindred",bestStructureId:"save-the-cat",beats:{setup:"The Corleone family is attacked, and Vito Corleone is nearly killed by a rival family's hitmen.",rise:"Michael Corleone takes vengeance into his own hands, killing the men responsible.",climax:"A war between crime families escalates, with each side's kin becoming targets in turn.",fall:"Michael se
