tle who truly deserves credit, the Tsar has Yelena the Fair recount, in front of the whole court, exactly how she was won \u2014 a test only the real hero's account could pass.",solution:"Yelena tells the true story in full, describing Ivan and the wolf's cunning exactly as it happened, resolving the question of who the real hero is.","propp-recognition":"Ivan is recognized at last, his identity confirmed by Yelena's account and by the Firebird and horse, which respond only to him.",exposure:"The elder brothers' lie unravels completely in front of the Tsar and the assembled court, exposing their theft and murder for everyone to see.",transfiguration:"Ivan appears before the court not as the ragged, half-forgotten youngest son but restored to his full princely bearing, worthy of the throne and the bride he won.",punishment:"Tsar Vyslav banishes his two elder sons from the kingdom in disgrace for their treachery.",wedding:"Ivan marries Princess Yelena the Fair, and in time inherits his father's throne, the Firebird glowing in its cage as a permanent reminder of the quest."}},{id:"marya-morevna-propp-31",title:"Marya Morevna",creator:"traditional Russian folk tale, collected by Alexander Afanasyev, 1855\u20131863",appliesToType:"structure",appliesToId:"propp-31",beats:{absentation:"Ivan Tsarevich's three sisters are married off one by one to mysterious suitors who arrive as storms \u2014 a falcon, an eagle, and a raven in human form \u2014 each carrying his sister far from their childhood home.",interdiction:"Before departing to war, the warrior-queen Marya Morevna, having just married Ivan, hands him the keys to every room of the palace but forbids him to open one particular closet in the dungeon.",violation:"Alone and curious once Marya Morevna rides off to battle, Ivan cannot resist unlocking the forbidden closet.",reconnaissance:"Inside, he finds Koschei the Deathless chained to the wall, who immediately begins questioning and pleading with Ivan, sizing up the young prince's pity.",delivery:"Koschei learns from Ivan's hesitation and kindness exactly how to manipulate him, and Ivan reveals his soft-heartedness by listening at all.",trickery:"Feigning weakness and begging for water, Koschei convinces Ivan that a single dipper of water is a harmless mercy.",complicity:"Ivan, moved to pity, brings Koschei water not once but three times, unwittingly restoring the villain's full strength with each drink.","villainy-lack":"Newly strengthened, Koschei snaps his twelve chains, flies off, and abducts Marya Morevna the moment she returns from war, leaving the palace empty of its queen.",mediation:"Ivan discovers his wife gone and resolves at once that he must find and win her back himself, with no one else to send in his place.",counteraction:"Ivan sets out immediately in pursuit of Koschei, refusing to accept the loss of Marya Morevna.",departure:"On the road, he visits each of his sisters and their bird-husbands in turn, before pressing onward alone toward Koschei's realm.","donor-first":"Each brother-in-law tests Ivan's resolve by urging him to stay and rest, offering silver, gold, and copper feathers as keepsakes only after he insists on continuing.","hero-reaction":"Ivan politely declines their hospitality each time, accepting only the enchanted feathers as a courteous parting gift before continuing his search.","magical-agent":"The eagle-, falcon-, and raven-husbands each give Ivan one of their own feathers, magical tokens he can burn to summon them in a moment of deadly need.",guidance:"Ivan finds Marya Morevna in Koschei's palace, and together they plan his escape using her knowledge of Koschei's one weakness \u2014 his supernaturally swift horse.",struggle:"Twice Ivan flees with Marya Morevna, and twice Koschei's horse outruns Ivan's own mount, letting the villain catch up and, on these first two occasions, spare Ivan with only a warning.",branding:"On the third attempt, an enraged Koschei finally hacks Ivan to pieces and stuffs him into a barrel, which he flings into the sea \u2014 marking Ivan with the 'death' he must now be rescued from.",victory:"The brothers-in-law, alerted by the burning feathers, rescue the barrel from the sea and sprinkle Ivan with the waters of death and life, and Ivan defeats his own death, rising whole again.",liquidation:"Determined not to fail a third time, Ivan seeks out Baba Yaga to obtain a horse that can finally outrun Koschei's own, addressing the true source of his repeated defeats.",return:"Baba Yaga agrees to give Ivan a magic colt if he can herd her wild mares in a meadow for three days and nights without losing a single one.",pursuit:"Each day, the mares scatter across the world the moment Ivan's back is turned, and Baba Yaga's threat hangs over him \u2014 fail once, and she will have his head on a spike like the many failed suitors before him.",rescue:"The very animals Ivan once spared out of kindness \u2014 a bee, a crab, and a lioness \u2014 repay him by rounding up the scattered mares each evening before Baba Yaga can catch him out.",unrecognized:"Having secretly raised a scruffy, overlooked colt among Baba Yaga's herd \u2014 one she never suspects is anything special \u2014 Ivan claims it as his prize, slipping past her more impressive horses unnoticed.",unfounded:"Baba Yaga, furious at having been outwitted, pursues Ivan on her fastest mare to reclaim what she considers rightfully hers, insisting he has cheated her.","difficult-task":"Ivan escapes Baba Yaga only by throwing down a towel that becomes a wide river she cannot cross, resolving her claim over him for good.",solution:"Now mounted on his own fully grown magic colt, Ivan returns to Koschei's palace, and this time his horse is finally the faster of the two.","propp-recognition":"When Koschei's horse warns its master that Ivan's colt could now kick them both to death, Koschei realizes for the first time that he has truly met his match.",exposure:"Ivan's colt kicks Koschei's skull in as the villain hesitates, exposing at last that the seemingly deathless Koschei could be destroyed after all.",transfiguration:"Ivan builds a great pyre and burns Koschei's body completely, scattering the ashes to the winds so that no trace of his power remains.",punishment:"With Koschei destroyed for good, Ivan takes Marya Morevna out of the ruined palace, the villain's death serving as the final reckoning for years of terror.",wedding:"Ivan and Marya Morevna are reunited for good, visiting each triumphant sister and brother-in-law on the journey home before settling back into their own kingdom together."}}],z=(e,i)=>we.filter(t=>t.appliesToType===e&&t.appliesToId===i);var ee=["wants to be famous","wants to be loved","wants to be feared","wants to be forgiven","needs forgiveness","needs to forgive themselves","wants revenge","wants vengeance against a betrayer","needs redemption","needs to atone for a past mistake","wants power","wants control","needs freedom","wants freedom from duty","needs to escape a life chosen for them","wants to belong somewhere","needs a sense of belonging","wants acceptance","needs approval from a parent","needs to be needed","wants to matter","needs safety","wants adventure","needs purpose","wants recognition","needs to prove themselves","wants wealth","needs justice","wants justice for a wrong done to them","wants immortality","needs closure","wants a legacy","needs connection","wants true love","needs to let go of the past","wants status","needs stability","wants transformation","needs healing","wants perfection","needs meaning","wants to escape their past","needs to protect someone they love","needs faith restored","wants independence","needs guidance","wants respect","needs mercy","needs to be understood","wants glory","needs peace","wants knowledge","needs courage","wants a home","needs family","wants to outrun a reputation","needs to keep a promise","wants one last chance","needs to be the hero of their own story","wants to be seen","n :root{ --bg:#120E1C; --panel:#1B1530; --panel2:#241C3D; --ink:#EDE7DA; --dim:#8B8398;
  --gold:#E9C88A; --ember:#D2785A; --border:rgba(237,231,218,0.10); }
*{box-sizing:border-box}
.boot{color:var(--dim);font-family:system-ui;padding:40px;text-align:center}
.app{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;padding:18px 20px 40px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.brand{font-family:'Fraunces',serif;font-weight:650;font-size:20px;color:var(--gold);white-space:nowrap}
.app-version{font-family:'Archivo',sans-serif;font-weight:400;font-size:11px;color:var(--dim);vertical-align:middle}
.title-input{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:9px 12px;font-family:'Fraunces',serif;font-size:16px}
.struct-select{background:var(--panel);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:13px}
.blurb{color:var(--dim);font-size:13px;margin:2px 0 18px}
button{font-family:inherit;cursor:pointer}
.ghost-btn{background:transparent;border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px}
.ghost-btn:hover{border-color:var(--gold);color:var(--gold)}
.primary-btn{background:var(--gold);border:none;color:#241606;font-weight:600;border-radius:8px;padding:9px 14px;font-size:13px}
.primary-btn:hover{filter:brightness(1.08)}
.icon-btn{background:transparent;border:none;color:var(--dim);font-size:14px;padding:4px 6px;border-radius:6px}
.icon-btn:hover{color:var(--ember)}
.layout{display:flex;justify-content:center}
@media (max-width: 480px){ .tl-label{width:44px;font-size:9px} .tl-clip-label{font-size:10px} }
.timeline{width:100%;max-width:960px;margin:0 auto 24px;display:flex;flex-direction:column;gap:2px}
.tl-summary{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.tl-summary-title{font-family:'Fraunces',serif;font-size:16px;color:var(--ink)}
.tl-summary-sub{font-size:11px;color:var(--dim)}
.tl-track{display:flex;align-items:stretch;gap:8px}
.tl-track-thin{height:14px}
.tl-track-thin .tl-lane{height:14px}
.tl-label{width:64px;flex:none;font-size:10px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.04em;display:flex;align-items:center}
.tl-lane{position:relative;flex:1;height:38px;background:var(--panel);border-radius:6px;overflow:hidden;
  border:1px solid var(--border)}
.tl-clip{position:absolute;top:0;bottom:0;cursor:pointer;transition:opacity .15s,filter .15s;
  display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--bg);overflow:hidden}
.tl-clip:hover{opacity:1!important}
.tl-clip.is-sel{filter:drop-shadow(0 0 6px rgba(233,200,138,.65));z-index:1}
.tl-clip-label{font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;color:#120E1C;pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 3px}
.tl-lane-written{background:transparent;border:none}
.tl-clip-filled{opacity:.9}
.tl-clip-empty{background:transparent;border:1px solid var(--border);border-radius:3px}
.tl-lane-acts .tl-clip{background:var(--panel2);border:1px solid var(--border);cursor:default}
.tl-lane-acts .tl-clip-label{color:var(--gold)}
.arcline-empty{color:var(--dim);font-size:12px;margin:0}
.char-lanes-track{align-items:flex-start;margin-top:14px}
.char-lanes-col{flex:1;display:flex;flex-direction:column;min-width:0}
.char-lanes{position:relative;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--border);border-radius:6px;overflow:hidden}
.char-lane{display:flex;flex-direction:column;border-bottom:1px solid var(--border);
  transition:opacity .15s}
.char-lane:last-child{border-bottom:none}
.char-lane.is-off{opacity:.32}
.char-lane-label{display:flex;align-items:center;gap:6px;width:100%;padding:4px 10px 0;
  background:transparent;border:none;color:var(--ink);font-size:11px;
  text-align:left;cursor:pointer;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-lane-label:hover{color:var(--gold)}
.char-lane-label i{width:8px;height:8px;border-radius:3px;flex:none}
.char-lane-label-cat{color:var(--dim);text-transform:uppercase;letter-spacing:.03em;font-size:10px}
.char-lane-chart{flex:none;height:40px;position:relative;min-width:0}
.char-lane-chart svg{width:100%;height:100%;display:block}
.char-lane-band{opacity:.1}
.char-lane-midline{stroke:var(--border);stroke-width:1.5}
.char-lane-path{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.char-lane-path-dashed{stroke-dasharray:6 5;opacity:.6}
.char-lane-point{stroke:var(--panel);stroke-width:1.5}
.char-lanes-connectors{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.char-lane-connector,.char-lane-connector-tick{vector-effect:non-scaling-stroke}
.char-lane-connector{stroke:var(--ember);stroke-width:2;stroke-dasharray:5 4;opacity:.85}
.char-lane-connector-tick{stroke-width:3}
.char-lane-interactions{display:flex;flex-direction:column;gap:2px;margin:6px 0 0;font-size:12px;color:var(--dim)}
.char-lane-interaction-note b{color:var(--ember);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin:4px 0 20px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.legend-item i{width:9px;height:9px;border-radius:3px;display:inline-block}
.legend-swatch-dashed{border:1.5px dashed rgba(0,0,0,.45);box-sizing:border-box}
