directions and her own growing confidence, Alice makes her way toward the Queen of Hearts' garden and croquet ground.",ordeal:`Alice is swept into the Queen of Hearts' court, where the tyrannical Queen shrieks "Off with her head!" at the slightest provocation, culminating in Alice being called as a witness at an absurd trial.`,reward:"Having grown back to her full size, Alice finds her voice in the courtroom and openly contradicts the Queen, no longer intimidated by Wonderland's absurd authority.","road-back":'She declares that the court is "nothing but a pack of cards," and the entire deck rises up and flies at her in a furious swarm.',resurrection:"The cards fall over her in a final rush exactly as she wakes, and Alice finds herself back on the riverbank, brushing away what turn out to be only dry leaves her sister is sweeping off her face.",elixir:'Alice runs to tell her sister about her "curious dream," carrying back into her ordinary afternoon a new sense of wonder and self-possession that Wonderland gave her.'}},{id:"mice-milieu-spirited-away",title:"Spirited Away",creator:"dir. Hayao Miyazaki, 2001",appliesToType:"plotType",appliesToId:"mice-milieu",bestStructureId:"hero-journey",beats:{setup:"Moving to a new town, ten-year-old Chihiro and her parents wander into an abandoned amusement park that turns out to be the entrance to a spirit world, where her parents are transformed into pigs and Chihiro must take a job at Yubaba's bathhouse to survive.",rise:`Renamed "Sen," she learns the bathhouse's rules from Lin and Kamaji, endures Yubaba's cruelty, and proves herself by helping a polluted river spirit release the junk clogging its body.`,climax:"Haku returns near death after crossing Yubaba's twin sister Zeniba, and Chihiro undertakes a journey to make things right, ultimately facing a final test of correctly recognizing her transformed parents.",fall:"Having passed the test and helped Haku remember his true name and identity, Chihiro leaves the bathhouse and walks back through the tunnel with her restored parents, returning to the ordinary world visibly more grounded and brave."},sections:{"ordinary-world":"Chihiro sulks in the back of her parents' car during a move to a new town, introduced as a sullen, timid ten-year-old unhappy about leaving her old friends and school behind.",call:"The family takes a wrong turn and stops at what looks like an abandoned amusement park; her parents wander in and start eating at an empty, unattended food stall.",refusal:"Chihiro is fearful and reluctant from the start, begging her parents to leave before dark because she senses something is wrong with the place.",mentor:"A mysterious boy named Haku finds her and urgently teaches her the rules she needs to survive \u2014 cross the river before sunset, and later, eat spirit food so she doesn't fade away entirely.",threshold:"Night falls and the bathhouse world fully awakens; Chihiro discovers she has begun to turn transparent, having crossed fully into the spirit world with no way back the way she came.","tests-allies":`Taken on by the boiler man Kamaji and the worker Lin, and bound into service by the witch Yubaba under the new name "Sen," Chihiro learns the bathhouse's harsh rules about labor and names the hard way.`,approach:`Chihiro is assigned to attend to a foul-smelling "stink spirit" that no one else wants to handle, steeling herself for what the other workers treat as the bathhouse's worst assignment.`,ordeal:"She discovers the guest is actually a polluted river god, and with the whole bathhouse staff's help pulls a bicycle and a mountain of trash out of its body, saving it through sheer physical effort.",reward:"The grateful river spirit rewards her with a magic emetic dumpling, and Chihiro earns the bathhouse staff's genuine respect for the first time.","road-back":"Haku returns gravely wounded after stealing a golden seal from Yubaba's twin sister Zeniba, and Chihiro resolves to travel to Zeniba herself to return it and save him.",resurrection:"Chihiro must correctly identify her real parents, disguised among a group of identical pigs, without a single mistake \u2014 a final test of clear sight that determines whether she and her family can leave.",elixir:"She passes the test, Haku reveals and reclaims his true name with her help, and Chihiro walks back through the tunnel to the ordinary world with her restored parents, steadier and braver than the girl who first arrived."}},{id:"mice-idea-orient-express",title:"Murder on the Orient Express",creator:"Agatha Christie, 1934",appliesToType:"plotType",appliesToId:"mice-idea",bestStructureId:"todorov",beats:{setup:"Detective Hercule Poirot boards the snowbound Orient Express, where wealthy passenger Ratchett is found murdered in his locked compartment the next morning.",rise:"Poirot interviews the diverse cast of passengers, uncovering inconsistent alibis and a shared, hidden connection to the notorious Armstrong kidnapping case.",climax:"Poirot pieces together that Ratchett was actually the kidnapper Cassetti, and, astonishingly, that all twelve passengers took turns stabbing him in a coordinated act of vengeance.",fall:"Poirot chooses to offer the railway official a false, simpler explanation, letting the passengers' private justice stand rather than exposing the truth."},sections:{equilibrium:"Hercule Poirot boards the Orient Express in Istanbul, an ordinary if crowded luxury train journey among a curious assortment of strangers.",disruption:"Overnight the train is halted by a snowdrift, and wealthy American passenger Samuel Ratchett is found stabbed to death in his locked compartment.",recognition:"Poirot realizes Ratchett was actually Cassetti, the man responsible years earlier for the kidnapping and death of a child, and that nearly every passenger aboard has a plausible motive.",repair:"Poirot painstakingly interviews each of the twelve passengers, cross-checking alibis and timelines until he uncovers that they all share a hidden connection to the Armstrong family tragedy.","new-equilibrium":"Poirot concludes that all twelve passengers conspired to stab Ratchett in turn as an act of collective justice, and chooses to hand the railway official a simpler, false solution, letting their private vengeance stand undisturbed."}},{id:"mice-idea-rear-window",title:"Rear Window",creator:"dir. Alfred Hitchcock, 1954",appliesToType:"plotType",appliesToId:"mice-idea",bestStructureId:"todorov",beats:{setup:"Housebound with a broken leg, photographer Jeff spies on his neighbors and grows suspicious that salesman Lars Thorwald has murdered his wife.",rise:"Jeff convinces Lisa and Stella to help investigate, and the three gather increasingly damning circumstantial evidence despite the skepticism of Jeff's detective friend Doyle.",climax:"Lisa breaks into Thorwald's apartment to find proof, Thorwald catches her, and then confronts Jeff directly at his own window, attacking him before police intervene.",fall:"Thorwald is arrested and confirmed as the killer, and Jeff \u2014 recovering with both legs now broken \u2014 settles into a deepened relationship with Lisa, the mystery resolved."},sections:{equilibrium:"Photographer L.B. Jefferies, laid up in a wheelchair with a broken leg, passes a sweltering summer watching his Greenwich Village neighbors through his rear window.",disruption:"Late one night Jeff hears a scream and breaking glass, and afterward notices salesman Lars Thorwald behaving strangely, making repeated late-night trips out with his sample case while his wife is suddenly nowhere to be seen.",recognition:"Jeff becomes convinced Thorwald has murdered his wife, and slowly persuades his skeptical girlfriend Lisa and his detective friend Doyle to take the suspicion seriously.",repair:"Lisa and Jeff's nurse Stella dig into Thorwald's apartment and belongings, even sneaking inside to search for the missing wife's wedding ring, building the case piece by piece despite Doyle's continued doubts.","new-equilibrium":"Thorwald, confronted, attacks Jeff and is arrested as the confirmed killer, and Jeff recovers with both legs now broken but with the truth vindicated and his relationship with Lisa strengthened."}},{id:"mice-character-pride-prejudice",title:"Pride and Prejudice",creator:"Jane Austen, 1813",appliesToType:"plotType",appliesToId:"mice-character",bestStructureId:"story-circle",beats:{setup:"Elizabeth Bennet, proud of her own judgment, quickly forms a harsh first impression of the reserved, wealthy Mr. Darcy at a local ball.",rise:"Through further encounters and Wickham's flattering lies, her prejudice against Darcy hardens, even as circumstances repeatedly throw them together.",climax:"Darcy's unexpected proposal, her furious refusal, and his subsequent letter force Elizabeth to reexamine everything she believed about him and about herself.",fall:"After Darcy quietly saves her family from disgrace over Lydia's elopement, Elizabeth sees him clearly at last, accepts his renewed proposal, and settles into a marriage built on mutual understanding rather than first impressions."},sections:{you:"Elizabeth Bennet is introduced in her comfortable zone at Longbourn \u2014 witty, self-assured, and quick to judge others by first impressions.",need:"She needs to overcome her own pride and prejudice, and see past Darcy's, if she is ever to find a marriage of real understanding rather than mere convenience.",go:"She travels beyond Longbourn to Netherfield, then to Hunsford and Rosings, entering unfamiliar social terrain where she must deal with Darcy and his circle directly.",search:"She weighs conflicting information \u2014 Wickham's charming account of being wronged by Darcy, then Darcy's own letter after his failed proposal \u2014 trying to reconcile the two opposing pictures of his character.",find:"Touring Pemberley and seeing Darcy on his own ground, generous with his staff and devoted to his sister, Elizabeth finds real evidence that her first judgment of him was wrong.",take:"She pays for this reevaluation through humiliation, as Lydia's scandalous elopement with Wickham threatens to disgrace the whole family, forcing Elizabeth to confront how mistaken and powerless her earlier certainty had been.",return:"She returns home to Longbourn changed, and when Darcy \u2014 having quietly resolved the Lydia crisis behind the scenes \u2014 proposes again, she is finally able to see him and herself clearly.",change:"Elizabeth accepts Darcy, having traded her pride and prejudice for self-knowledge, now capable of a marriage grounded in genuine understanding rather than first impressions."}},{id:"mice-character-groundhog-day",title:"Groundhog Day",creator:"dir. Harold Ramis, 1993",appliesToType:"plotType",appliesToId:"mice-character",bestStructureId:"story-circle",beats:{setup:"Cynical weatherman Phil Connors, stuck covering Punxsutawney's Groundhog Day, finds himself reliving the same February 2nd endlessly after a blizzard strands him there.",rise:"He cycles through hedonism, despair, and repeated suicide attempts before gradually turning the loop toward self-improvement, learning piano and ice sculpture and quietly helping the townspeople.",climax:"Phil spends what seems to be his final looped day doing every possible good deed for the town and finally earning Rita's genuine affection, at peace for the first time.",fall:"He wakes to find it is actually the next day \u2014 the loop has broken \u2014 a changed man now capable of real love and contentment with Rita and the life around him."},sections:{you:"Phil Connors, a cynical, self-satisfied Pittsburgh weatherman, arrives in Punxsutawney to cover the Groundhog Day festival he openly despises.",need:"Phil needs to become a genuinely kind, present person rather than the vain, contemptuous man he is comfortable being.",go:"A blizzard strands him in Punxsutawney overnight, and he wakes to find he is living February 2nd all over again, trapped in an unfamiliar, repeating world.",search:"Phil experiments wildly with the time loop, indulging every whim, seducing, stealing, and even repeatedly dying, searching for a way to escape or exploit his situation.",find:"Exhausted by nihilism, he starts using the loop to actually improve himself, learning piano, ice sculpture, and French poetry, and memorizing the small details of the townspeople's lives.",take:"He pays for this growth in accumulated, unseen effort, years of repeated days spent quietly earning skills and helping strangers with no one else ever remembering or crediting him for it.",return:"Phil returns to living an ordinary Groundhog Day, now genuinely warm and generous toward Rita and the town he once mocked.",change:"The loop finally breaks and Phil wakes to a real new morning, having changed completely from a cynic into a man capable of love and contentment."}},{id:"mice-event-jaws",title:"Jaws",creator:"dir. Steven Spielberg, 1975",appliesToType:"plotType",appliesToId:"mice-event",bestStructureId:"fichtean",beats:{setup:"A great white shark begins killing swimmers off Amity Island, and Police Chief Brody's warnings are overruled by a mayor determined not to close the beaches for the summer season.",rise:"More attacks force the town to confront the danger, a bogus shark is caught and paraded as the culprit, and oceanographer Hooper proves the real killer is still out there.",climax:"Brody, Hooper, and grizzled hunter Quint go after the shark on the Orca, which the shark disables and destroys, killing Quint before Brody is left to face it alone.",fall:"Brody shoots a pressurized tank lodged in the shark's mouth, blowing it apart, and he and Hooper swim back to a shore that is now safe again."},sections:{"crisis-1":"The story opens already in crisis \u2014 a young woman is killed by an unseen shark while swimming off Amity Island at night, with no calm 'before' shown first.","crisis-2":"A second attack, in broad daylight in front of a crowded beach, kills a young boy and forces Chief Brody to confront the scale of the threat despite the mayor's continued resistance to closing the beaches.","crisis-3":"A local bounty hunt reels in the wrong shark and briefly reassures the town, until oceanographer Hooper proves it isn't the culprit and a third attack nearly kills a boater in the estuary.","crisis-4":"Brody, Hooper, and shark hunter Quint set out on the Orca to kill the great white directly, but the shark proves bigger and smarter than expected, disabling their boat and equipment piece by piece.",climax:"The shark destroys the Orca and kills Quint, leaving Brody alone to face it, finally shooting a scuba tank lodged in its jaws and blowing the shark apart.",resolution:"Brody and Hooper swim back to shore together now that the immediate threat is gone, Amity's waters safe again, briefly and without ceremony."}},{id:"mice-event-war-of-the-worlds",title:"The War of the Worlds",creator:"H.G. Wells, 1898",appliesToType:"plotType",appliesToId:"mice-event",bestStructureId:"fichtean",beats:{setup:"Martian cylinders land on Horsell Common and immediately begin destroying everything nearby with their Heat-Ray, giving England no time to prepare.",rise:"The Martian fighting-machines advance across the countryside toward London, causing mass panic, the collapse of order, and the narrator's separation from his wife amid the fleeing crowds.",climax:"Trapped near a Martian machine and surviving by hiding, the narrator eventually reaches an eerily silent, ruined London and discovers the Martians have suddenly gone still.",fall:"The Martians are found dead, killed by ordinary terrestrial bacteria they had no defense against, and humanity slowly rebuilds as the narrator reunites with his wife."},sections:{"crisis-1":"The narrator is already witnessing chaos as the first Martian cylinder lands on Horsell Common and the Martians incinerate a welcoming delegation with their Heat-Ray almost immediately.","crisis-2":"The Martians assemble towering fighting-machines and begin destroying the English countryside, forcing mass panic and flight as the narrator is separated from his wife.","crisis-3":"London itself is evacuated in terrified chaos as the Martians advance, the narrator witnessing the collapse of civil order and the deaths of thousands amid black smoke and Heat-Ray fire.","crisis-4":"The narrator, trapped in a ruined house with a panicking curate, must survive at close quarters to a Martian handling-machine working just outside, in constant danger of discovery.",climax:"Approaching a seemingly triumphant, eerily silent London, the narrator discovers the Martian war-machines have gone dead and the Martians themselves are dying, killed not by any human weapon but by ordinary earthly bacteria.",resolution:"England's shattered society slowly rebuilds, the narrator reunites with his wife, and humanity resumes ordinary life, profoundly humbled by how close it came to annihilation."}},{id:"jaws-three-act-2",title:"Jaws",creator:"directed by Steven Spielberg, screenplay by Peter Benchley & Carl Gottlieb, 1975",appliesToType:"structure",appliesToId:"three-act",beats:{"status-quo":"Amity Island is a quiet summer resort town gearing up for its lucrative Fourth of July tourist weekend, and Chief Martin Brody is settling into small-town life with his family.",inciting:"A young woman is killed by an unseen shark while night-swimming, and her remains wash ashore the next morning, alarming Brody.","plot-point-1":"Mayor Vaughn pressures Brody to keep the beaches open for the holiday, but after the shark kills a young boy in broad daylight, Brody commits fully to hunting it down, hiring shark hunter Quint and enlisting oceanographer Hooper.",rising:"Brody, Hooper, and Quint set out aboard the Orca, learning the shark's unexpected size and cunning as their equipment fails and tensions flare between the three very different men.",midpoint:"After beaches reopen against Brody's wishes, the shark attacks again in the estuary and nearly kills Brody's son, shattering any illusion the danger was contained and forcing full commitment to the hunt at sea.","plot-point-2":"The shark destroys the boat's engine, and after a brutal fight it kills and devours Quint, leaving Brody alone on the rapidly sinking Orca.",climax:"Cornered on the sinking boat with no options left, Brody shoots a scuba tank lodged in the shark's mouth, causing it to explode and destroying the creature at last.",resolution:"Brody and Hooper paddle back toward Amity on floating wreckage, the town's waters safe again and Brody's fear of the water finally overcome."}},{id:"pride-prejudice-three-act-3",title:"Pride and Prejudice",creator:"Jane Austen, 1813",appliesToType:"structure",appliesToId:"three-act",beats:{"status-quo":"The Bennet household in genteel but financially precarious country life features five unmarried daughters and a mother anxious to see them married before the family estate passes to a distant male cousin.",inciting:"The wealthy Mr. Bingley, and his even wealthier friend Mr. Darcy, rent nearby Netherfield Park, bringing eligible bachelors into the neighborhood for the first time.","plot-point-1":"At the local assembly ball, Darcy coldly declares Elizabeth 'not handsome enough to tempt me,' and their mutual dislike hardens into the story's central conflict of pride and prejudice.",rising:"Elizabeth navigates Jane's romance with Bingley, Mr. Collins's absurd marriage proposal, and Wickham's charming slander of Darcy, her prejudice against Darcy deepening even as he secretly falls for her.",midpoint:"Darcy proposes marriage to Elizabeth at Hunsford, expecting acceptance; she furiously refuses and airs every grievance, and his subsequent letter revealing the truth about Wickham upends everything she believed.","plot-point-2":"Lydia elopes scandalously with Wickham, threatening to ruin the entire family's reputation and seemingly destroying any hope of a future between Elizabeth and Darcy.",climax:"Darcy secretly intervenes to force Wickham to marry Lydia, saving the family's honor; learning of his quiet sacrifice, Elizabeth's feelings for him transform, and he proposes to her again.",resolution:"Elizabeth accepts Darcy, and the novel closes with their marriage and Jane's to Bingley, both having shed their pride and prejudice and restored the Bennet family's fortunes."}},{id:"matrix-save-the-cat-2",title:"The Matrix",creator:"written and directed by Lana & Lilly Wachowski, 1999",appliesToType:"structure",appliesToId:"save-the-cat",beats:{"opening-image":"Trinity is chased across rooftops by Agents and police, displaying superhuman abilities in a grim, glitching world, establishing the film's tone before its hero even appears.","theme-stated":"Trinity tells Neo 'I know why you're here... it's the question that drives us,' planting the film's core argument that believing the path exists is different from actually walking it.","set-up":"Thomas Anderson is introduced as a bored, alienated programmer and hacker living a double life, sensing something is wrong with the world but unable to name it.",catalyst:"Neo is contacted by Morpheus's group and, following cryptic instructions, meets Trinity, who confirms his instincts about the Matrix are real.",debate:"Neo meets Morpheus, who offers him the red pill of truth or the blue pill of ignorance, and Neo visibly hesitates before choosing.","break-into-two":"Neo swallows the red pill and is violently unplugged from the Matrix, waking for the first time into the desolate real world.","b-story":"Neo's growing relationship with Trinity develops throughout, carrying the film's theme that belief and love are what ultimately make him 'The One.'","fun-and-games":"Neo trains in the construct program, learning kung fu instantly, dodging bullets, and exploring the exhilarating, rule-bending possibilities of the Matrix.",midpoint:"Neo visits the Oracle, who tells him plainly that he is not the One, a deflating reversal that reframes his mission around saving Morpheus rather than fulfilling a prophecy.","bad-guys-close":"Cypher betrays the crew to Agent Smith, and the group is ambushed while trying to escape, with Agents closing in from every side.","all-is-lost":"Morpheus is captured by the Agents, sacrificing himself so the others can escape, and the mission appears to have failed entirely.","dark-night":"Neo and the crew aboard the Nebuchadnezzar grapple with whether to risk everything by going back into the Matrix to rescue Morpheus, knowing it may be a suicide mission.","break-into-three":"Neo decides to go back for Morpheus himself, combining his growing self-belief with Trinity's faith in him to form a plan.",finale:"Neo and Trinity storm the building to rescue Morpheus, and Neo confronts Agent Smith directly, is killed, then is revived by Trinity's declaration of love, fully awakening as 'The One' and defeating Smith from within the Matrix.","final-image":"Neo, now fully empowered, makes a phone call promising to show humanity a world without rules or control, then flies upward into the sky, a mirror of his earlier helplessness now replaced by total command."}},{id:"finding-nemo-save-the-cat-3",title:"Finding Nemo",creator:"directed by Andrew Stanton, Pixar, 2003",appliesToType:"structure",appliesToId:"save-the-cat",beats:{"opening-image":"Marlin, a timid clownfish, loses his wife and hundreds of eggs to a barracuda attack, left with only one surviving egg, Nemo, establishing the fear that will define him.","theme-stated":"Marlin tells young Nemo, 'I promised I'd never let anything happen to him,' foreshadowing the film's argument that overprotection can be as harmful as danger itself.","set-up":"Nemo, self-conscious about his small 'lucky fin,' chafes against Marlin's anxious rules as he starts school on the reef.",catalyst:"Defying his father to prove himself, Nemo swims out to touch a boat and is captured by a diver.",debate:"Marlin, panicked, must decide whether to face the terrifying open ocean to find his son, despite having never left the safety of the reef.","break-into-two":"Marlin commits to the search and meets Dory, a forgetful blue tang who insists on helping him navigate the ocean.","b-story":"Marlin's reluctant partnership with Dory teaches him to loosen his need for control and trust others, carrying the film's theme.","fun-and-games":"Marlin and Dory encounter sharks trying 'not to eat fish,' ride the East Australian Current with sea turtles, and cross a glowing jellyfish field, the ocean's wonders and dangers on full display.",midpoint:"Marlin and Dory are swallowed by a whale, an apparent disaster that turns into their means of reaching Sydney harbor, flipping despair into progress.","bad-guys-close":"In the dentist's fish tank, Nemo plans an escape with the tank gang while Marlin and Dory near Sydney, but Marlin's growing fear makes him reckless.","all-is-lost":"Believing Nemo has died after Dory misreads a message, Marlin abandons the search and swims away from Dory, devastated and alone.","dark-night":"Marlin drifts in grief and guilt, questioning whether his fear ever protected Nemo at all, while Nemo, having escaped the tank, is lost in the harbor searching for him.","break-into-three":"Nemo and Marlin are reunited by chance near the harbor, and Marlin, now changed, lets Nemo take the lead when Dory is caught in a fishing net.",finale:"Following Nemo's plan, all the trapped fish swim downward together to break the net, saving Dory and the others, proof that Marlin has finally learned to let go.","final-image":"Marlin watches Nemo swim off to school on his own, no longer smothering him, a mirror of the opening's overprotection now replaced by trust."}},{id:"odyssey-hero-journey-2",title:"The Odyssey",creator:"attributed to Homer, ancient Greek epic, c. 8th century BC",appliesToType:"structure",appliesToId:"hero-journey",beats:{"ordinary-world":"Odysseus has been gone from Ithaca for twenty years; his palace is overrun by suitors pursuing his wife Penelope, and his son Telemachus is powerless to stop them.",call:"The gods, moved by Athena's pleas, decide Odysseus must finally be released from Calypso's island and allowed to return home, setting his voyage back to Ithaca in motion.",refusal:"Odysseus lingers on Calypso's island in years of despair before the gods force the issue, and later hesitates before facing new perils, such as the land of the Cyclops.",mentor:"Athena repeatedly appears in disguise to guide Odysseus and Telemachus, advising strategy and protecting them with divine favor throughout their trials.",threshold:"Odysseus sets sail from Calypso's island on a makeshift raft, crossing into the unknown seas that will test him before he can reach home.","tests-allies":"He faces the Lotus-Eaters, the Cyclops Polyphemus, Aeolus's winds, and the cannibal Laestrygonians, losing ships and men while learning which companions can be trusted.",approach:"Odysseus and his surviving crew approach Circe's island, and after his men are turned into swine, he confronts her with Hermes's help and prepares for the harrowing journey to the Underworld.",ordeal:"Odysseus travels to the Underworld to consult the prophet Tiresias, then survives the deadly gauntlet of the Sirens, Scylla, and Charybdis, losing more men in the process.",reward:"Odysseus survives the destruction of his last ship and the death of his remaining crew, punishment for eating the cattle of the sun god Helios, washing ashore alone on Ogygia, bare survival the grim reward that costs him everything else.","road-back":"After years detained by Calypso, Odysseus finally builds a raft and sets out again, only to be shipwrecked by Poseidon's storm and washed up among the Phaeacians, who agree to send him home.",resurrection:"Disguised as a beggar in his own palace, Odysseus endures mockery and abuse from the suitors before revealing himself, winning the contest of the bow and slaughtering all the suitors in a final, decisive battle.",elixir:"Odysseus reunites with Penelope and Telemachus, reclaims his throne, and restores order to Ithaca, bringing home the hard-won wisdom of his twenty-year ordeal."}},{id:"moana-hero-journey-3",title:"Moana",creator:"directed by Ron Clements & John Musker, Disney, 2016",appliesToType:"structure",appliesToId:"hero-journey",beats:{"ordinary-world":"Moana is the chief's daughter on the island of Motunui, groomed to lead her people but drawn irresistibly to the ocean she's forbidden to cross.",call:"A mysterious blight begins killing the island's crops and fish, and Moana's grandmother reveals the ancient legend of Maui stealing the heart of Te Fiti, urging Moana to restore it.",refusal:"Moana's father, Chief Tui, forbids anyone from sailing beyond the reef, and Moana herself tries to obey, attempting to hand the quest off rather than go herself.",mentor:"Moana's grandmother, Gramma Tala, on her deathbed, gives Moana the Heart of Te Fiti and pushes her to sail out and find Maui.",threshold:"Moana sails her canoe past the reef for the first time, entering the open ocean her people have avoided for generations.","tests-allies":"Moana tracks down the demigod Maui, who reluctantly becomes her unwilling ally, and together they survive the Kakamora pirates as Maui recovers his magic fishhook.",approach:"Moana and Maui plan their approach to Tamatoa's lair to retrieve Maui's hook, sharpening their partnership and Moana's resolve before the larger ordeal ahead.",ordeal:"Maui's hook is damaged in a battle with the fiery lava demon Te K\u0101, and a devastated Maui abandons Moana, leaving her to face the mission's failure alone.",reward:"Encouraged by the ocean and a vision of her ancestors, Moana finds her own identity as a wayfinder, deciding to complete the quest even without Maui's help.","road-back":"Maui returns to help Moana one final time, and together they sail toward Te K\u0101 for the final confrontation, knowing the danger they face.",resurrection:"Moana realizes Te K\u0101 is actually Te Fiti, whose heart was stolen, and walks fearlessly toward the lava demon to restore it, resolving the story's central threat through insight rather than combat.",elixir:"The islands are restored to life, Moana's people resume voyaging as their ancestors once did, and Moana returns home as a true wayfinder-chief, having reconnected her people with the ocean."}},{id:"oedipus-rex-freytag-2",title:"Oedipus Rex",creator:"Sophocles, c. 429 BC",appliesToType:"structure",appliesToId:"freytag",beats:{exposition:"Thebes is suffering a plague, and King Oedipus, who years earlier solved the Sphinx's riddle and became king after saving the city, vows to find and punish whoever murdered the previous king, Laius, to lift the curse.","rising-action":"Oedipus's investigation, aided by the blind prophet Tiresias and testimony from Jocasta and a shepherd, gradually and horrifyingly reveals clues suggesting Oedipus himself may be Laius's killer, and more.",climax:"Oedipus learns the full truth: he unknowingly killed his own father Laius and married his own mother Jocasta, fulfilling the very prophecy he spent his life trying to escape.","falling-action":"Jocasta hangs herself upon learning the truth, and the horrified Oedipus blinds himself with her brooches, unable to bear seeing the world he has defiled.",denouement:"Blind and disgraced, Oedipus begs to be exiled from Thebes, leaving his fate and his daughters in Creon's hands as the city absorbs the catastrophe."}},{id:"death-of-a-salesman-freytag-3",title:"Death of a Salesman",creator:"Arthur Miller, 1949",appliesToType:"structure",appliesToId:"freytag",beats:{exposition:"Willy Loman, an aging traveling salesman, returns home exhausted and disoriented; his sons Biff and Happy are visiting, and it's clear his career and grip on reality are both failing.","rising-action":"Willy's memories intrude on the present, flashbacks to Biff's promising youth, his own affair, and his broken dreams, while in the present he's fired from his job and Biff fails to secure a business loan, each scene deepening the family's crisis.",climax:"At a restaurant meant to celebrate good news, Biff finally confronts Willy with the truth that he stole from an old boss and is a failure, and Willy relives, in devastating flashback, Biff catching him in an affair years earlier, the moment their relationship broke.","falling-action":"A raw, painful confrontation at home follows, in which Biff both indicts and embraces his father, telling Willy he loves him despite everything, breaking through Willy's illusions in a way he never expected.",denouement:"Convinced his death will finally provide for his family through life insurance, Willy commits suicide by crashing his car; at his sparsely attended funeral, Linda mourns a man the world, and even himself, never truly understood."}},{id:"harry-potter-seven-point-2",title:"Harry Potter and the Sorcerer's Stone",creator:"J.K. Rowling, 1997",appliesToType:"structure",appliesToId:"seven-point",beats:{hook:"Harry Potter lives as a neglected, unwanted orphan under the stairs at the Dursleys' house, utterly ignorant of his true identity, the opposite of the wizard he'll become.","plot-turn-1":"Hagrid arrives to tell Harry he's a wizard and delivers his letter of acceptance to Hogwarts, pulling him out of his miserable Muggle life and into the magical world.","pinch-1":"At Hogwarts, Harry discovers a three-headed dog guarding a trapdoor and learns of the mysterious, powerful Sorcerer's Stone, while Snape's hostility hints at a threat within the castle itself.",midpoint:"After surviving a troll attack together, Harry, Ron, and Hermione become a real team and begin actively investigating the Stone and the danger surrounding it, shifting from passively attending school to actively pursuing the mystery.","pinch-2":"The trio witnesses evidence that someone is trying to steal the Stone, and Hagrid inadvertently reveals how to get past the three-headed dog, while their safety net of adult protection erodes as they realize the professors may not act in time.","plot-turn-2":"Harry, Ron, and Hermione discover Dumbledore has left the school, realize the theft is imminent, and decide they alone must go through the trapdoor to stop it, gaining the final resolve and knowledge needed for the climax.",resolution:"Harry passes through a gauntlet of trials to confront Professor Quirrell, possessed by Voldemort, and protect the Stone, defeating him and proving himself a true wizard, the mirror of the powerless boy from the hook."}},{id:"silence-of-the-lambs-seven-point-3",title:"The Silence of the Lambs",creator:"Thomas Harris, 1988",appliesToType:"structure",appliesToId:"seven-point",beats:{hook:"FBI trainee Clarice Starling is a determined but inexperienced cadet, defined by her rural poverty and the trauma of her father's death, someone with no standing or power yet.","plot-turn-1":"Jack Crawford sends Clarice to interview the imprisoned Hannibal Lecter for insight into the active 'Buffalo Bill' case, introducing her to both the case and the man whose help she'll depend on.","pinch-1":"Lecter toys with Clarice psychologically, revealing his manipulative power over her, while Buffalo Bill claims another victim, showing the killer's real and growing threat.",midpoint:"After trading personal information with Lecter in a quid pro quo, Clarice gains real insight into the killer's psychology and begins actively directing her own investigation rather than simply following orders.","pinch-2":"Catherine Martin, a senator's daughter, is abducted by Buffalo Bill, raising the stakes to a ticking clock, while Lecter escapes custody in a brutal, shocking act of violence, removing Clarice's most valuable, if dangerous, resource.","plot-turn-2":"Piecing together Lecter's cryptic clues, Clarice deduces Buffalo Bill's true identity and connects him to one of the original victims, giving her the final lead to find his house.",resolution:"Clarice unknowingly finds herself alone in Buffalo Bill's house and survives a terrifying confrontation in the dark, killing him and rescuing Catherine, the frightened cadet from the hook now a capable, self-reliant agent."}},{id:"taketori-kishotenketsu-2",title:"The Tale of the Bamboo Cutter (Taketori Monogatari)",creator:"Anonymous, c. 10th century",appliesToType:"structure",appliesToId:"kishotenketsu",beats:{ki:"A bamboo cutter finds a shining stalk containing a palm-sized girl and takes her home to raise as his own daughter, naming her Kaguya-hime.",sho:"Kaguya-hime grows into a woman of unearthly beauty in just three months; five noble suitors and finally the Emperor himself pursue her, each set an impossible task to prove his devotion, and all fail.",ten:"An unexpected, unrelated element recontextualizes everything that came before: Kaguya-hime confesses she is not human but a being from the Moon, sent to Earth temporarily, and that at the next full moon she must return.",ketsu:"Guards surrounding her home are rendered powerless by the Moon people's light; Kaguya-hime dons a celestial robe that erases her earthly memories and ascends, leaving a farewell letter and the elixir of life, which the heartbroken Emperor orders burned on the peak nearest heaven, Mount Fuji."}},{id:"spirited-away-kishotenketsu-3",title:"Spirited Away",creator:"dir. Hayao Miyazaki, 2001",appliesToType:"structure",appliesToId:"kishotenketsu",beats:{ki:"Chihiro, unhappy about moving to a new town, drives with her parents through a tunnel into what looks like an abandoned theme park as evening falls.",sho:"Her parents gorge on food left at an empty stall and are turned into pigs; trapped in the now-active spirit world, Chihiro takes the name Sen and begins working at Yubaba's bathhouse to survive, slowly learning its rules and befriending Haku, Lin, and the soot sprites.",ten:"An unrelated, unexpected figure \u2014 the masked, silent spirit No-Face \u2014 slips into the bathhouse, begins offering gold, and after being overfed by greedy workers grows into a devouring monster, turning the story in a direction nothing before it suggested.",ketsu:"Sen leads the swollen No-Face away on a train journey that calms him back to his quiet original self, helps Haku recall his true name as the Kohaku River spirit, and correctly identifies her real parents among Yubaba's pigs, earning her family's release and passage back to the human world."}},{id:"old-man-sea-fichtean-2",title:"The Old Man and the Sea",creator:"Ernest Hemingway, 1952",appliesToType:"structure",appliesToId:"fichtean",beats:{"crisis-1":"Santiago, already eighty-four days without catching a fish, rows far out into the Gulf Stream alone and hooks an enormous marlin almost at once \u2014 the story opens already inside the struggle.","crisis-2":"The marlin is too strong to bring in and instead tows Santiago's small skiff out to sea for a full day and night, straining his hands and back with no relief.","crisis-3":"The fight extends into a second and third day; Santiago is cut by the line, exhausted, and nearly dragged overboard as the marlin's desperate resistance keeps escalating.","crisis-4":"Santiago finally kills and lashes the marlin \u2014 larger than his own boat \u2014 to his skiff's side, only for its blood to immediately draw the first sharks, a worse threat than the fight itself.",climax:"Successive waves of sharks tear at the marlin; Santiago fights them off with his harpoon, then a knife lashed to an oar, then a club, until the great fish is reduced to a bare skeleton.",resolution:"Santiago sails home in the dark and collapses into exhausted sleep; in the morning, the other fishermen marvel at the marlin's skeleton tied to his boat, and the boy Manolin, moved, resolves to fish with the old man again."}},{id:"gravity-fichtean-3",title:"Gravity",creator:"dir. Alfonso Cuar\xF3n, 2013",appliesToType:"structure",appliesToId:"fichtean",beats:{"crisis-1":"Mission specialist Dr. Ryan Stone and veteran astronaut Matt Kowalski are already outside their shuttle on a routine repair when debris from a destroyed satellite tears through their equipment without any warning or buildup.","crisis-2":"Stone is torn loose and sent spinning uncontrollably into open space, her radio failing and oxygen dropping, while Kowalski must track her down and physically tether her before she is lost.","crisis-3":"The pair reach the International Space Station only to find it abandoned and on fire; Kowalski deliberately releases his tether so his weight won't pull Stone off as well, leaving her utterly alone in orbit.","crisis-4":"Stone reaches a Chinese Tiangong station whose Shenzhou escape pod has almost no fuel left, just as the deadly debris field is due to complete its orbit and return.",climax:"With the debris storm bearing down again, Stone must fire the pod's landing rockets to reach Tiangong, then pilot its unfamiliar reentry module through flame and wreckage back toward Earth.",resolution:"The capsule crash-lands in a lake; Stone swims free of the sinking pod and drags herself onto the shore, standing on solid ground, breathing and reborn."}},{id:"alice-wonderland-story-circle-2",title:"Alice's Adventures in Wonderland",creator:"Lewis Carroll, 1865",appliesToType:"structure",appliesToId:"story-circle",beats:{you:"Alice sits on a riverbank with her sister on a warm afternoon, comfortable but restless, tired of having nothing to do.",need:"Bored of her picture-less book, she wants some distraction \u2014 and her curiosity fixes on a White Rabbit who hurries past muttering about being late.",go:"She chases the Rabbit and, without thinking twice, follows him down a rabbit hole, tumbling into the unfamiliar world of Wonderland.",search:"She experiments with cakes and potions that change her size, and adapts to Wonderland's rules by meeting the Caterpillar, the grinning Cheshire Cat, and the Mad Hatter's endless tea party.",find:"She gains real fluency in Wonderland's illogical logic, capable enough now to navigate the Queen of Hearts' chaotic croquet match using flamingos and hedgehogs.",take:"The Queen has Alice hauled before her court on trial, and Alice comes within a single shouted verdict of losing her head entirely.",return:'Alice finally stands up to the tyranny around her, declaring the King, Queen, and their court "nothing but a pack of cards," and the whole dream dissolves, returning her to the riverbank.',change:"She wakes beside her sister and eagerly recounts her curious dream, forever marked by the wonder of what her imagination revealed to her."}},{id:"the-matrix-story-circle-3",title:"The Matrix",creator:"dir. Lana and Lilly Wachowski, 1999",appliesToType:"structure",appliesToId:"story-circle",beats:{you:"Thomas Anderson leads a comfortable double life \u2014 ordinary programmer by day, hacker Neo by night \u2014 unsettled by a persistent feeling that something is deeply wrong with the world.",need:"He wants an answer to the question that has haunted him for years: what is the Matrix?",go:"He swallows Morpheus's red pill and is violently ejected from the simulated world into the harsh, unfamiliar reality of the machine war.",search:`Aboard the Nebuchadnezzar, Neo adapts to this new reality through construct-program training in martial arts and the Matrix's rules, though he doubts he is really "The One."`,find:"He begins to genuinely master the Matrix's bent rules, dodging bullets and sensing Agents, getting what Morpheus promised he could become.",take:"Neo is captured by Agent Smith, and returning to rescue Morpheus, he is shot and dies inside the Matrix \u2014 the heaviest possible price.",return:"Trinity's declared love and a kiss revive him; Neo rises as The One, stops bullets in midair, and unmakes Agent Smith from within, returning to the ship victorious.",change:"Fully capable now of bending or breaking the Matrix at will, Neo calls the machines to warn them a world without rules or controls is coming, and flies off transformed."}},{id:"the-godfather-eight-sequence-2",title:"The Godfather",creator:"dir. Francis Ford Coppola, 1972",appliesToType:"structure",appliesToId:"eight-sequence",beats:{"status-quo":"The Corleone family's power and unity are shown at Connie's wedding, then broken when Don Vito refuses to bring the family into narcotics trafficking and is shot by Sollozzo's men.",predicament:"Michael, the decorated war hero who wanted nothing to do with the family business, is locked into it the moment he protects his wounded father and cannot walk away from what follows.","obstacle-1":"Michael's assassination of Sollozzo and the corrupt police captain McCluskey succeeds, but forces him to flee into hiding in Sicily, isolated from the family and marked for retaliation.","stakes-1":"While Michael hides abroad, falls in love with Apollonia, and marries her, the war at home worsens and his volatile brother Sonny is ambushed and killed at a tollbooth.",midpoint:"Apollonia is killed by a car bomb meant for Michael, a turn that reshapes him from reluctant participant into someone hardened and fully committed to his family's methods.","stakes-2":"Michael returns home, marries Kay, and begins consolidating control of the family's operations while the other Five Families watch and wait to see if he can hold power.",culmination:"Michael secretly plans to eliminate the heads of the rival Families and his internal enemies in one coordinated, simultaneous strike timed to his nephew's baptism.",climax:"The murders are carried out with ruthless precision during the baptism ceremony; Michael becomes the new Don Corleone, and the door closes on Kay, shutting her out of the world he now fully inhabits."}},{id:"back-to-the-future-eight-sequence-3",title:"Back to the Future",creator:"dir. Robert Zemeckis, 1985",appliesToType:"structure",appliesToId:"eight-sequence",beats:{"status-quo":"Marty McFly's ordinary 1985 life \u2014 meek father, domineering boss, Doc Brown's experimental time machine \u2014 is broken when Libyan terrorists shoot Doc and Marty accidentally drives the DeLorean back to 1955.",predicament:"Stranded in 1955 with no way home, Marty must find the younger Doc Brown and figure out how to power the DeLorean's return trip, a goal he cannot simply abandon.","obstacle-1":"Marty's accidental interference at the diner causes his teenage mother Lorraine to become infatuated with him instead of his father George, jeopardizing his own future existence.","stakes-1":"As he begins fading from a family photograph, Marty must urgently engineer George and Lorraine's romance while evading the young bully Biff Tannen.",midpoint:"Doc Brown devises a plan to harness an incoming lightning strike to power the time circuits, turning Marty's problem from fixing the past into having a concrete, ticking-clock way home.","stakes-2":"Marty must get the timid George to stand up to Biff at the school dance so his parents fall in love at the right moment, all while racing the oncoming storm.",culmination:"The Enchantment Under the Sea dance reaches its final song as Marty, having fixed his parents' romance, sprints to wire the clock tower before the lightning passes.",climax:"The lightning strikes at the precise moment needed, hurling Marty back to 1985, where he finds his family transformed for the better and Doc alive, having heeded the warning note Marty left him."}},{id:"hunger-games-weiland-2",title:"The Hunger Games",creator:"Suzanne Collins, 2008",appliesToType:"structure",appliesToId:"weiland",beats:{hook:"Katniss Everdeen hunts illegally in the woods outside District 12 to feed her family, shown as capable and protective even as reaping day looms over her.",inciting:"At the reaping ceremony, her young sister Prim's name is drawn for the Hunger Games.","plot-point-1":"Katniss volunteers to take Prim's place, committing herself fully to the Games as she boards the train to the Capitol with no way back.","pinch-1":"Training and interviews reveal the Career tributes' brutal skill and the Capitol's glittering indifference, making clear just how outmatched most tributes are.",midpoint:"A surprise rule change announces that two tributes from the same district can win together, letting Katniss pivot from lone survival to actively partnering with Peeta.","pinch-2":"The Gamemakers unleash genetically engineered tracker jacker wasps and later mutated hounds, sharply escalating the arena's lethality against the tributes who remain.","plot-point-3":"Katniss's young ally Rue is killed, plunging her into grief and rage that marks her lowest point before she resolves to finish the Games on her own terms.",climax:"In the final confrontation with Cato, the Gamemakers revoke the two-victor rule, and Katniss and Peeta stage a joint suicide bluff with poisonous nightlock berries that the Capitol is forced to accept.",resolution:"Katniss and Peeta return to District 12 as celebrated victors, publicly triumphant but privately changed by what the Games forced them to do."}},{id:"the-hobbit-weiland-3",title:"The Hobbit",creator:"J.R.R. Tolkien, 1937",appliesToType:"structure",appliesToId:"weiland",beats:{hook:"Bilbo Baggins enjoys his comfortable hobbit-hole and regular meals, though a hint of his adventurous Took ancestry stirs the moment Gandalf's secret mark appears on his door.",inciting:"Thirteen dwarves led by Thorin Oakenshield arrive uninvited and describe their quest to reclaim the Lonely Mountain and its treasure from the dragon Smaug.","plot-point-1":"Startled into it, Bilbo dashes out his door without even a handkerchief to join the company as their burglar, committing fully to the journey.","pinch-1":"Trolls capture the company and nearly eat them, and goblins later seize them deep in the Misty Mountains, early sharp reminders of the world's danger.",midpoint:"Lost and alone under the mountains, Bilbo finds a strange ring and outwits Gollum in a riddle contest, escaping with new confidence and a secret advantage.","pinch-2":"Giant spiders in Mirkwood nearly kill the dwarves, and the Elvenking's forces then imprison the entire company, a sharper and more dangerous threat than before.","plot-point-3":"Smaug is roused and destroys Lake-town before falling himself, but the company then faces a grim standoff as armies of men, elves, and goblins converge on the Mountain.",climax:"The Battle of the Five Armies erupts; Thorin falls reconciled with Bilbo, and the goblins and wargs are defeated at terrible cost.",resolution:"Bilbo returns to the Shire, materially poorer than promised but inwardly transformed, forever marked as an adventurer by what he saw."}},{id:"gone-girl-truby-22",title:"Gone Girl",creator:"dir. David Fincher, 2014 (based on Gillian Flynn's novel)",appliesToType:"structure",appliesToId:"truby-22",beats:{"self-rev-preview":"Early hints (Nick's own narration admitting he wants to 'crack her head open' to understand her) foreshadow that Nick will eventually have to confront what kind of husband and person he has become.",ghost:"Nick's history of failed writing ambitions, an affair with a student, and his parents' unhappy marriage shape a man who has learned to perform contentment rather than feel it.",weakness:"Nick's passivity, dishonesty, and self-pity keep him from being honest with Amy or himself, masking a deep need to be truly known and loved.",inciting:"On his fifth wedding anniversary, Nick comes home to find the living room in disarray and his wife Amy missing.",desire:"Nick wants to be cleared as a suspect and find out what happened to Amy \u2014 though his real, unspoken desire is to escape the marriage without consequence.",allies:"Nick's twin sister Margo and defense attorney Tanner Bolt help him navigate the investigation and rebuild his public image.",opponent:"Detective Rhonda Boney and the media, convinced Nick murdered his wife, mount growing pressure against him \u2014 though the true opponent is Amy herself, orchestrating everything from hiding.","fake-ally":"Amy's diary, planted as evidence, casts her as a loving, frightened wife and Nick as a menacing husband, turning apparent sympathy for Amy into a devastating false narrative against Nick.","first-rev":"Nick discovers the diary and the planted clues form a treasure-hunt trail Amy designed specifically to frame him, forcing him to realize she staged her own disappearance.",plan:"Nick decides to go on television and publicly declare his love for Amy, hoping to win public sympathy and draw her out.","opp-plan":"Amy, hiding out and robbed by former acquaintances, refines her plan by manipulating her ex-boyfriend Desi Collings into sheltering her as things unravel.",drive:"Nick's media campaign works \u2014 Amy watches his performance and reconsiders disappearing forever, setting her final scheme into motion.","attack-ally":"Nick's own sister Margo grows suspicious of his account, and Nick must manage her doubts even as he leans on her for support.","apparent-defeat":"Amy murders Desi and returns home covered in blood, claiming he kidnapped and abused her, instantly reversing all of Nick's progress in the public eye.","second-rev":"Nick realizes Amy has returned for good, permanently rewriting the story to her advantage, and understands he must publicly play along to survive.","audience-rev":"The audience already knows, through Amy's own direct confession, exactly how she staged the frame-up and killed Desi \u2014 knowledge the police never obtain.","third-rev":"Amy privately reveals to Nick that she is pregnant using his stored sperm, using the child as final leverage to bind him to her permanently.",gate:"Nick must decide whether to expose Amy publicly and destroy their fragile peace, knowing it would cost him his unborn child and any normal life.",battle:"A tense confrontation between Nick and Amy plays out not with violence but with dueling media appearances and psychological warfare over their public image.","self-rev":"Nick recognizes that he is complicit in the marriage's toxicity, and that his own dishonesty helped create the situation he's now trapped in.",moral:"Nick chooses to stay with Amy for the sake of the child, accepting a marriage built on mutual manipulation rather than pursuing his own freedom.","new-equilibrium":"Nick and Amy settle into a chilling status quo, presenting a united, camera-ready front to the world while each remains privately trapped by the other."}},{id:"chinatown-truby-22-2",title:"Chinatown",creator:"dir. Roman Polanski, 1974",appliesToType:"structure",appliesToId:"truby-22",beats:{"self-rev-preview":"Gittes's wisecracking bravado hints at a detective who thinks he can navigate corruption cleanly \u2014 a belief the story will strip away.",ghost:"Gittes's past on the Chinatown police beat, where he failed to prevent a woman's death by trying to help her, haunts his approach to every new case.",weakness:"Gittes's overconfidence and need to be the clever one blind him to how deep the conspiracy around him runs until it's too late.",inciting:"A woman calling herself Evelyn Mulwray hires Gittes to investigate her husband Hollis for infidelity.",desire:"Gittes wants to solve what looks like a simple adultery case and collect his fee, unaware it connects to a citywide water conspiracy.",allies:"Gittes's operatives Walsh and Duffy assist his surveillance and investigation throughout the case.",opponent:"The real Evelyn Mulwray, and behind her, her father Noah Cross, work to keep the truth about the water scheme and Cross's crimes hidden.","fake-ally":"The woman who hired Gittes turns out to be an impostor working for parties who wanted Hollis Mulwray discredited, not the real Evelyn Mulwray.","first-rev":"Gittes learns the real Evelyn Mulwray is suing him for defamation, revealing he was used as a pawn in someone else's scheme against her husband.",plan:"Gittes decides to work with the real Evelyn Mulwray to uncover who set him up and why, digging into the city's water department.","opp-plan":"Noah Cross, secretly diverting the city's water supply for personal profit, has Hollis Mulwray murdered to keep the scheme quiet and sends men to intimidate Gittes.",drive:"Gittes aggressively pursues leads on the water diversion, getting his nose slashed by a hired thug for asking too many questions.","attack-ally":"Evelyn's evasiveness and secrecy about a young woman in her care make Gittes suspect she is hiding something from him even as they grow close.","apparent-defeat":"Gittes discovers Evelyn's terrible secret \u2014 the girl is both her sister and her daughter, product of her father Cross's abuse \u2014 shattering his understanding of the case.","second-rev":"Learning Cross orchestrated everything, Gittes resolves to help Evelyn and her daughter escape Cross's reach entirely, whatever the cost.","audience-rev":"The audience understands, ahead of the final scene, that Cross's incestuous history and his water scheme are one continuous exercise of unchecked power.","third-rev":"Gittes realizes Evelyn plans to flee to Mexico with her daughter, and that Cross is closing in on their location just as they prepare to leave.",gate:"Gittes tries to arrange Evelyn's escape past police and Cross's men in the tense chaos of Chinatown at night.",battle:"In the confrontation on the street, Evelyn is shot and killed by police while trying to flee, and Cross seizes his granddaughter/daughter unopposed.","self-rev":"Gittes recognizes that his cleverness and effort meant nothing against entrenched power \u2014 the same helplessness he felt in Chinatown years before.",moral:"Gittes lets his associates pull him away rather than get himself killed trying to fight Cross's untouchable influence, a bitter, forced acceptance of defeat.","new-equilibrium":"Cross walks free with his daughter/granddaughter as Gittes and his partners retreat into the Chinatown night, the corruption unpunished and unchanged."}},{id:"finding-nemo-pixar-spine",title:"Finding Nemo",creator:"Pixar, dir. Andrew Stanton, 2003",appliesToType:"structure",appliesToId:"pixar-spine",beats:{"once-upon":"Marlin is an anxious clownfish raising his only son, Nemo, alone after a barracuda killed his wife and all their other eggs.","every-day":"Marlin hovers over Nemo constantly, terrified of the ocean's dangers, while Nemo chafes against his father's overprotectiveness.","until-one-day":"Defying his father, Nemo swims out to touch a boat and is captured by a diver, who takes him away to a Sydney dentist's fish tank.","because-1":"Because Nemo is taken, Marlin sets out into the open ocean to find him, teaming up with the forgetful but warm-hearted Dory.","because-2":"Because they need clues, Marlin and Dory brave sharks, jellyfish, and a whale's mouth, while in the tank Nemo plans an escape with his new fish friends.","until-finally":"Marlin and Nemo are finally reunited amid a fishing net crisis, with Nemo proving his courage by helping free a school of trapped fish.","ever-since":"Marlin returns home a changed father, willing to let Nemo swim to school on his own, having learned that protecting his son means trusting him too."}},{id:"up-pixar-spine-2",title:"Up",creator:"Pixar, dir. Pete Docter, 2009",appliesToType:"structure",appliesToId:"pixar-spine",beats:{"once-upon":"Carl Fredricksen is a lifelong daydreamer who falls in love with fellow adventurer Ellie as a child, and the two grow old together sharing a dream of visiting Paradise Falls.","every-day":"Carl and Ellie build a quiet, ordinary married life together, saving spare change for their trip in a jar that adventure keeps interrupting.","until-one-day":"Ellie dies, and Carl, now an elderly widower, is served notice that he must leave his house for a retirement home just as developers close in around his property.","because-1":"Because he refuses to leave, Carl ties thousands of balloons to his house and lifts off for Paradise Falls, only to discover a stowaway, earnest young Wilderness Explorer Russell, aboard.","because-2":"Because they land near Paradise Falls, Carl and Russell encounter a rare bird, Kevin, and a pack of talking dogs serving the disgraced explorer Charles Muntz, who wants Kevin captured at any cost.","until-finally":"Carl finally chooses to let go of his house \u2014 and his grip on the past \u2014 to rescue Russell and Kevin from Muntz in an airborne showdown.","ever-since":"Carl becomes a surrogate grandfather to Russell, finding new purpose and joy in the adventure he never expected, with Ellie's memory honored rather than clung to."}},{id:"billy-elliot-virgins-promise",title:"Billy Elliot",creator:"dir. Stephen Daldry, 2000",appliesToType:"structure",appliesToId:"virgins-promise",beats:{"dependent-world":"In a County Durham mining town gripped by the 1984 miners' strike, Billy is expected to box like his father and brother and stay loyal to the pit community's tough, masculine code.",price:"Conforming to that world means suppressing any softness or self-expression, and Billy's family has no room or money for anything but survival and solidarity with the strike.",opportunity:"When the boxing gym shares space with a girls' ballet class, Billy notices the dancers and, almost by accident, joins in.","dresses-part":"Billy starts secretly attending ballet lessons instead of boxing, using his boxing gloves and kit as a cover story to his father.","secret-world":"Under teacher Mrs. Wilkinson's guidance, Billy practices ballet in the gym after hours, discovering real talent and joy he's never felt in the ring.","no-longer-fits":"Billy's growing passion for dance increasingly conflicts with his father and brother's expectations, and he can no longer pretend boxing means anything to him.","caught-shining":"Billy's father discovers him dancing in the gym, and the secret explodes into the open, humiliating and enraging his family.","gives-up":"Forbidden from dancing and with the family in economic crisis from the strike, Billy is told to abandon ballet entirely and stops attending lessons.","ally-helps":"Mrs. Wilkinson visits Billy's home and pushes his father to let Billy audition for the Royal Ballet School, refusing to let the dream die quietly.","kingdom-chaos":"The miners' strike collapses into violent clashes and eventual defeat, shattering the community's identity and forcing Billy's father to confront how much has already been lost.","chooses-journey":"Moved by watching Billy dance with raw, undeniable talent, his father chooses to back the audition, even breaking the picket line and pawning his wife's jewelry to pay for it.","rages-reveals":"At the Royal Ballet School audition, a nervous Billy is asked what it feels like to dance, and he answers honestly \u2014 that he forgets everything and feels free, like a bird, like electricity.",wonder:"Years later, an adult Billy takes the stage in a professional ballet performance, his father and brother watching proudly from the audience, worlds finally reconciled."}},{id:"whale-rider-virgins-promise-2",title:"Whale Rider",creator:"dir. Niki Caro, 2002 (based on Witi Ihimaera's novel)",appliesToType:"structure",appliesToId:"virgins-promise",beats:{"dependent-world":"In a M\u0101ori coastal community that traces its leadership to a founding ancestor who rode a whale, tradition holds that only a male firstborn can inherit the role of chief, and Pai's grandfather Koro cannot accept a girl in that role.",price:"Conforming means Pai must accept being sidelined from her own heritage and Koro's love conditioned on a leadership destiny she isn't allowed to claim.",opportunity:"Pai shows an instinctive gift for the tribe's traditional chants, challenges, and knowledge that the boys Koro is training don't match.","dresses-part":"Pai secretly enlists her uncle Rawiri to teach her the ceremonial fighting and chanting Koro reserves only for the boys' training school.","secret-world":"In hidden practice sessions, Pai masters the taiaha (fighting staff) and sacred chants, growing into genuine mastery Koro refuses to see.","no-longer-fits":"As Koro's chosen boys fail to master the training, and Pai's ability becomes undeniable to everyone but him, the gap between her true gift and her denied role widens.","caught-shining":"Koro discovers Pai has been secretly training and winning school chanting competitions in his name's honor, and reacts with anger rather than pride.","gives-up":"Devastated by her grandfather's rejection, Pai stops trying to prove herself to him and withdraws from the fight for recognition.","ally-helps":"Pai's grandmother Nanny Flowers and uncle Rawiri continue to believe in her, quietly keeping her connection to her heritage and confidence alive.","kingdom-chaos":"A pod of beached whales strands itself on the shore, an omen of crisis that no one in the community \u2014 least of all Koro \u2014 can resolve using traditional methods.","chooses-journey":"Pai climbs onto the back of the largest beached whale and, in a moment of pure calling, rides it back out to sea, risking her life to save the pod.","rages-reveals":"Pai nearly drowns in the act, and while recovering, Koro finally recognizes in front of the whole community that she is the leader the ancestors chose all along.",wonder:"The tribe launches a newly carved ceremonial canoe with Pai standing at its head as the acknowledged future chief, her gift and her world finally united."}},{id:"mulan-heroines-journey",title:"Mulan",creator:"Disney, dir. Tony Bancroft & Barry Cook, 1998",appliesToType:"structure",appliesToId:"heroines-journey",beats:{separation:"Mulan fails to impress the village matchmaker and feels alienated from the traditional feminine role of dutiful bride that her family and culture expect of her.",identification:"To save her ailing father from conscription, Mulan cuts her hair, steals his armor, and enters the army disguised as a man named 'Ping,' adopting a masculine identity wholesale.","road-of-trials":"Mulan endures brutal military training under Captain Li Shang, struggling at first but pushing herself past every male recruit to prove her worth.",boon:"Mulan single-handedly triggers an avalanche that destroys the Hun army, saving her unit and earning genuine respect and success as a soldier.",aridity:"Wounded in battle, Mulan's true identity is discovered, and the very success she achieved as 'Ping' is instantly stripped of legitimacy the moment her comrades learn she is a woman.",descent:"Exiled from the army and left alone in the snow, Mulan quietly grieves the loss of both her constructed identity and her place in either world, questioning who she really is.",yearning:"Learning the Huns have survived and are heading for the Emperor, Mulan feels a pull to act not as 'Ping' but as herself, choosing to return and warn her former comrades despite having no official standing.","healing-split":"Returning home afterward, Mulan finally presents herself honestly to her father, and their embrace repairs the rift between her true self and the family identity she once felt she was failing to honor.","healing-masculine":"Captain Li Shang, having seen Mulan's competence and courage as both 'Ping' and herself, comes to respect her as an equal partner rather than viewing masculinity and femininity as separate, incompatible roles.",integration:"Mulan stands before the Emperor and her village as herself \u2014 neither purely the dutiful daughter she was expected to be nor the disguised soldier she pretended to be, but a whole person honored for exactly who she is."}},{id:"erin-brockovich-heroines-journey-2",title:"Erin Brockovich",creator:"dir. Steven Soderbergh, 2000",appliesToType:"structure",appliesToId:"heroines-journey",beats:{separation:"As a broke, twice-divorced single mother, Erin feels her traditionally feminine roles \u2014 wife, homemaker \u2014 have failed her and left her with nothing but bills and disrespect.",identification:"Taking a filing job at Ed Masry's law firm, Erin adopts a brash, confrontational, traditionally masculine-coded style to be taken seriously in a world that dismisses her looks and lack of credentials.","road-of-trials":"Erin doggedly investigates water contamination records around Hinkley, California, facing condescension from colleagues and lawyers who underestimate her at every turn.",boon:"Erin's relentless legwork uncovers PG&E's cover-up of toxic chromium contamination, and she wins the trust of hundreds of affected residents, leading toward a historic legal settlement.",aridity:"Erin's professional triumph comes at the cost of her relationship with her boyfriend George and time with her children, leaving her successful but personally isolated and exhausted.",descent:"Confronted by her children's resentment and her own guilt over absence, Erin is forced to sit with the emotional cost of the identity she's built entirely around the case.",yearning:"Erin recommits to being present for her family even as the case demands everything of her, refusing to simply choose the job over her children.","healing-split":"Erin's bond with the Hinkley families \u2014 especially the mothers who trusted her with their children's illnesses \u2014 reconnects her to a nurturing, relational side of herself the case initially seemed to require she suppress.","healing-masculine":"Her boss Ed Masry moves from doubting her to becoming a genuine partner and advocate, and her relationship with George, though strained, reflects a more balanced, mutually respectful partnership than her earlier marriages.",integration:"Erin wins the case and a massive bonus while remaining unapologetically herself \u2014 brash, maternal, and shrewd all at once \u2014 no longer needing to erase one side of herself to succeed at the other."}},{id:"little-red-riding-hood-todorov",title:"Little Red Riding Hood",creator:"traditional folk tale (Charles Perrault / Brothers Grimm)",appliesToType:"structure",appliesToId:"todorov",beats:{equilibrium:"Little Red Riding Hood lives happily with her mother, and is asked to carry a basket of food through the woods to her sick grandmother.",disruption:"A wolf meets Red Riding Hood in the forest, learns where she is headed, and races ahead to devour her grandmother, disguising himself in the grandmother's bed to await the girl.",recognition:"Red Riding Hood arrives and grows increasingly suspicious of her 'grandmother's' strange appearance \u2014 the big eyes, ears, and teeth \u2014 sensing something is deeply wrong just before the wolf attacks and swallows her too.",repair:"A woodsman, hearing the commotion, cuts open the sleeping wolf's belly and frees Red Riding Hood and her grandmother alive and unharmed.","new-equilibrium":"Red Riding Hood and her grandmother are safe, wiser for the encounter, and the wolf's threat to the forest is permanently ended."}},{id:"snow-white-todorov-2",title:"Snow White",creator:"Brothers Grimm, 1812",appliesToType:"structure",appliesToId:"todorov",beats:{equilibrium:"Snow White lives at the castle as a beautiful young princess, initially safe, though her stepmother the Queen secretly resents her growing beauty.",disruption:"The Queen's magic mirror declares Snow White the fairest in the land, and the enraged Queen orders a huntsman to kill her in the forest.",recognition:"The huntsman cannot bring himself to kill Snow White and lets her flee; she takes refuge with seven dwarfs, but the Queen learns she survived and recognizes she must act again, disguising herself to strike directly.",repair:"After the disguised Queen twice fails and finally succeeds in poisoning Snow White with an enchanted apple, a traveling prince arrives, and Snow White is revived when the poisoned piece of apple is dislodged from her throat.","new-equilibrium":"Snow White marries the prince and leaves her stepmother's reach entirely, restored to life and safety, with the wicked Queen's threat ended for good."}},{id:"heart-of-darkness-frame-narrative",title:"Heart of Darkness",creator:"Joseph Conrad, 1899",appliesToType:"structure",appliesToId:"frame-narrative",beats:{"enter-frame":"Aboard the cruising yawl Nellie, anchored on the Thames at dusk, an unnamed narrator introduces the small group of men waiting out the tide together, among them the seaman Charlie Marlow.","frame-setup":"Breaking a long silence, Marlow announces that he too once knew one of the 'dark places of the earth,' giving the frame its reason to fall quiet and listen as he begins to tell of piloting a steamer up the Congo River.","inner-begins":"Marlow's story opens with him securing a post with a Belgian ivory-trading Company and sailing to Africa to take command of a river steamboat.","inner-develops":"As he travels upriver through decaying Company stations, Marlow witnesses the brutal exploitation of the region's people and hears ever more awed, uneasy reports of Kurtz, an agent of extraordinary success and growing menace stationed alone deep in the interior.","inner-resolves":"Reaching Kurtz's Inner Station, Marlow finds him dying and worshipped by his followers; Kurtz's final words, 'The horror! The horror!,' come as Marlow carries him back down the river, and the inner story closes with his death aboard the steamer.","return-frame":"The narration returns to the deck of the Nellie as Marlow finishes by describing his visit, afterward, to Kurtz's grieving Intended in Brussels, and the lie he tells her about her fianc\xE9's last words.","frame-closes":"As Marlow falls silent, the frame narrator looks out at the Thames, now seeming to lead 'into the heart of an immense darkness,' closing the outer story on an image reshaped by everything just told."}},{id:"arabian-nights-frame-narrative",title:"One Thousand and One Nights",creator:"traditional, compiled c. 9th\u201314th century",appliesToType:"structure",appliesToId:"frame-narrative",beats:{"enter-frame":"King Shahryar, devastated after discovering his first wife's betrayal, begins marrying a new bride each night only to have her executed at dawn, ensuring she can never again betray him.","frame-setup":"When eligible brides in the kingdom run out, the vizier's daughter Scheherazade volunteers herself and arranges to bring her younger sister Dunyazad into the chamber, setting up her plan to request one last story before dawn each night.","inner-begins":"On their wedding night, Scheherazade begins her first tale for the king, opening with stories like that of the merchant and the jinni, and deliberately leaves it unfinished as the sun rises.","inner-develops":"Night after night for a thousand and one nights, Scheherazade weaves an ever-branching sequence of interlocking tales \u2014 Sinbad's voyages, Aladdin and the lamp, Ali Baba and the forty thieves \u2014 each one nested inside the last and left incomplete to keep the king listening.","inner-resolves":"After a thousand and one nights, Scheherazade at last brings her final story to a full and complete conclusion, having exhausted her enormous store of tales.","return-frame":"The narrative returns fully to the king's chamber, where Scheherazade presents Shahryar with the three sons she has borne him during those years and asks to be spared for their sake.","frame-closes":"Moved by everything he has heard and by the family they now share, Shahryar pardons Scheherazade permanently, ending his nightly executions and closing the frame with her transformation from condemned bride to enduring queen."}},{id:"firebird-propp-31",title:"The Firebird (Ivan Tsarevich, the Grey Wolf, and the Firebird)",creator:"traditional Russian folk tale, collected by Alexander Afanasyev, 1855\u20131863",appliesToType:"structure",appliesToId:"propp-31",beats:{absentation:"Tsar Vyslav's precious apple tree of golden apples is being raided each night, so his three sons \u2014 Dimitri, Vasili, and Ivan \u2014 take turns leaving the safety of the palace to keep watch in the garden after dark.",interdiction:"The Tsar warns his sons that whoever catches the thief must capture it alive and bring it directly to him, not harm it.",violation:"Standing watch, the two elder sons fall asleep despite their father's orders to stay alert, letting the thief escape yet again.",reconnaissance:"Only Ivan, the youngest, stays awake and creeps close enough to see a glowing Firebird landing in the tree, studying its movements before it can strike.",delivery:"Ivan tears loose one blazing tail feather as the bird flees, giving him \u2014 and now the Tsar's court \u2014 proof of exactly what has been robbing the orchard.",trickery:"Eager to possess the whole Firebird, the Tsar sends his sons out again; on the road, a Grey Wolf devours Ivan's horse, then offers to serve him in its place, luring the grieving prince into a bargain.",complicity:"Ivan, having no other way forward, accepts the wolf's offer and climbs onto its back, unaware how deeply his fate is now tied to the creature's cunning.","villainy-lack":"Carried to King Afron's garden, Ivan is told he must not touch the Firebird's jeweled golden cage \u2014 but the temptation proves too strong, and touching it triggers an alarm that has him seized as a thief.",mediation:"King Afron declares Ivan may go free and keep the Firebird only if he first travels on and fetches the Horse with the Golden Mane from King Kusman as a forfeit for his crime.",counteraction:"Ivan agrees to the harsh bargain rather than face punishment, resolving to complete the task the wolf now guides him toward.",departure:"Ivan sets out with the Grey Wolf once more, leaving King Afron's kingdom behind for King Kusman's stables.","donor-first":"At Kusman's stables, Ivan is again warned not to touch the golden bridle hanging beside the Horse with the Golden Mane, a test the wolf has arranged for him.","hero-reaction":"Just as before, Ivan cannot resist and grasps the bridle, setting off its alarm and proving, to the wolf's mild exasperation, that he has not yet learned caution.","magical-agent":"Captured again, Ivan is set a third task \u2014 to bring back Princess Yelena the Fair \u2014 and it is the Grey Wolf itself that becomes his true magical agent, using cunning and shapeshifting to succeed where Ivan's own hands keep failing.",guidance:"The wolf carries Ivan swiftly across kingdoms to where Princess Yelena is walking in her father's garden with her nursemaids, leading him straight to his goal.",struggle:"The wolf abducts Yelena while Ivan waits, then, when King Kusman's men give chase, the wolf outruns and outwits the pursuing guards to keep her safe.",branding:"To fool King Kusman, the Grey Wolf transforms itself into the very image of Princess Yelena, letting the real princess escape while the wolf-in-disguise is delivered into the king's hands instead.",victory:"The substitution succeeds \u2014 King Kusman is left holding a wolf disguised as his daughter, while the true Yelena rides free, the king outmaneuvered entirely.",liquidation:"With the same trick played again on King Afron, the wolf now taking the shape of the Horse with the Golden Mane, Ivan finally rides off with the true horse, the true Firebird, and the true Yelena the Fair all secured.",return:"Ivan, Yelena, and the wolf turn homeward together, retracing the long road back to Tsar Vyslav's kingdom.",pursuit:"Resting near home, Ivan is discovered asleep by his two elder brothers, who murder him on the spot, cut his body to pieces, and ride off with Yelena, the horse, and the Firebird, swearing her to silence.",rescue:"The Grey Wolf finds Ivan's remains, catches two ravens and forces them to fetch the waters of death and life from afar, using the waters to knit his body whole and breathe him back to life.",unrecognized:"Revived but on foot, Ivan reaches his father's court just as the wedding between the elder brother and Princess Yelena is being prepared, and no one there realizes he has returned from the dead.",unfounded:"The elder brothers have already told Tsar Vyslav that it was they, not Ivan, who won the Firebird, the horse, and Yelena, presenting themselves as the rightful heroes of the whole quest.","difficult-task":"To set
