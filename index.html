.","stakes-2":"Indy and Marion are captured, and the Nazis begin shipping the Ark toward Germany.",culmination:"Indy stages a daring commando raid on the Nazi convoy to reclaim the Ark before it can be studied.",climax:"The Nazis open the Ark on a remote island, unleashing a wrathful power that destroys everyone who looks upon it except Indy and Marion, who look away."}},{id:"harry-potter-weiland",title:"Harry Potter and the Sorcerer's Stone",creator:"J.K. Rowling, 1997",appliesToType:"structure",appliesToId:"weiland",beats:{hook:"Harry Potter lives a miserable, neglected life with the Dursleys, unaware of his true origins.",inciting:"Letters from Hogwarts start arriving, and Hagrid reveals Harry is a wizard.","plot-point-1":"Harry boards the Hogwarts Express and begins his first year at the School of Witchcraft and Wizardry.","pinch-1":"Harry and his friends discover something dangerous is being guarded on the school's forbidden third floor.",midpoint:"Harry learns the object is the Sorcerer's Stone, and suspects Professor Snape is trying to steal it for Voldemort.","pinch-2":"Hagrid lets slip the secret to controlling the three-headed guard dog, and the trio realizes the theft is imminent.","plot-point-3":"Harry, Ron and Hermione descend through the trapdoor themselves to stop the theft before it's too late.",climax:"Harry confronts Professor Quirrell, who is possessed by Voldemort, and protects the Stone through his mother's protective love.",resolution:"Harry recovers from his injuries, Gryffindor wins the house cup, and he returns to the Dursleys for the summer, now knowing who he really is."}},{id:"godfather-truby-22",title:"The Godfather",creator:"dir. Francis Ford Coppola, 1972",appliesToType:"structure",appliesToId:"truby-22",beats:{"self-rev-preview":"Michael Corleone begins the story insisting he wants nothing to do with the family business.",ghost:"The Corleone family's violent criminal history shapes the world Michael has tried to distance himself from.",weakness:"Michael's need to prove his loyalty and protect his family will pull him back in, despite his own denial.",inciting:"Vito Corleone is shot and nearly killed in an assassination attempt by a rival family.",desire:"Michael wants to protect his father and stabilize the family without becoming the man his father is.",allies:"Michael's brothers Sonny and Fredo, and the family's consigliere Tom Hagen, all play their parts around him.",opponent:"Rival mob boss Sollozzo and the corrupt police captain McCluskey threaten the Corleones directly.","fake-ally":"McCluskey poses as a neutral law-enforcement figure while actually protecting Sollozzo.","first-rev":"Michael realizes no one else can get close enough to kill Sollozzo and McCluskey \u2014 only he can, precisely because he's seen as harmless.",plan:"Michael plans to meet Sollozzo and McCluskey under a truce, with a gun planted in the restaurant bathroom.","opp-plan":"Sollozzo and McCluskey plan the same meeting believing they hold all the power over an unarmed civilian.",drive:"Michael commits fully, murdering both men and fleeing to Sicily to avoid the war that follows.","attack-ally":"Sonny's hot temper gets him killed in an ambush, a catastrophic blow struck through the family's own vulnerabilities.","apparent-defeat":"Michael's Sicilian bride is killed by a car bomb meant for him, and the family's war seems to be spiraling out of control.","second-rev":"Michael returns to America harder and more resolved, taking on real control of the family's operations.","audience-rev":"The audience sees Michael's transformation more clearly than his own family does, as he consolidates power while appearing reasonable.","third-rev":"Michael learns exactly which family heads and traitors \u2014 including his own brother-in-law \u2014 have betrayed the Corleones.",gate:"Michael becomes godfather to his nephew, standing in church even as his final plan is set irrevocably in motion.",battle:"In a single sequence, Michael's men assassinate the heads of the rival Five Families and settle every old score at once.","self-rev":"Michael has fully become the ruthless don he once swore he'd never be.",moral:"He lies to his wife Kay's face about his crimes, choosing the family's code over honesty with her.","new-equilibrium":"The door closes on Kay, now shut out, as Michael takes his place as the new Godfather."}},{id:"lion-king-pixar-spine",title:"The Lion King",creator:"Disney, dir. Roger Allers & Rob Minkoff, 1994",appliesToType:"structure",appliesToId:"pixar-spine",beats:{"once-upon":"Simba is born a lion cub, prince of the Pride Lands, presented to the animal kingdom by his father Mufasa.","every-day":"Simba grows up playful and eager, learning what it means to one day be king.","until-one-day":"Simba's uncle Scar tricks him into a stampede that kills Mufasa, and convinces Simba the death was his fault.","because-1":"Guilt-ridden, Simba flees the Pride Lands and is taken in by Timon and Pumbaa, who teach him to forget his past.","because-2":"Simba grows up in exile until his childhood friend Nala finds him and tells him Scar has ruined the kingdom.","until-finally":"Simba returns, confronts Scar, and reclaims his place as king in a final battle for the Pride Lands.","ever-since":"Simba takes his rightful place as king, and presents his own newborn cub just as his father once presented him."}},{id:"october-sky-virgins-promise",title:"October Sky",creator:"dir. Joe Johnston, 1999 (based on Homer Hickam's memoir)",appliesToType:"structure",appliesToId:"virgins-promise",beats:{"dependent-world":"Homer Hickam lives in a West Virginia coal town where sons are expected to follow their fathers into the mine.",price:"Homer's father expects him to take over as mine superintendent, leaving no room for other ambitions.",opportunity:"Inspired by the launch of Sputnik, Homer decides to build his own rockets.","dresses-part":"Homer and his friends start experimenting with homemade rockets, learning by failure and explosion.","secret-world":"The boys build increasingly sophisticated rockets in secret, teaching themselves calculus and machining along the way.","no-longer-fits":"Homer's growing passion for rocketry puts him increasingly at odds with his father's expectations for his future.","caught-shining":"A rocket is blamed for starting a forest fire, and the town turns against the boys' project.","gives-up":"Facing his father's disapproval and the town's suspicion, Homer nearly abandons rocketry for good.","ally-helps":"A teacher, Miss Riley, and the boys' own evidence prove their rocket didn't start the fire, keeping the dream alive.","kingdom-chaos":"A mine accident injures Homer's father, throwing the family's future and the town's fate into uncertainty.","chooses-journey":"Homer returns to finish his rocket project and enter the National Science Fair, choosing his own path forward.","rages-reveals":"Homer and his friends present their rocketry work at the science fair, openly proving what they can do.",wonder:"They win a national award, and Homer earns a scholarship that leads him, eventually, to a career at NASA."}},{id:"devil-wears-prada-heroines-journey",title:"The Devil Wears Prada",creator:"dir. David Frankel, 2006 (based on Lauren Weisberger's novel)",appliesToType:"structure",appliesToId:"heroines-journey",beats:{separation:"Andy Sachs takes a job at a prestigious fashion magazine, dismissive of the industry's values she doesn't share.",identification:"To succeed, she adopts the demanding, image-driven standards of her boss Miranda Priestly and the magazine's world.","road-of-trials":"Andy proves herself through increasingly difficult, high-pressure tasks that Miranda throws at her.",boon:"Andy becomes genuinely skilled at the job, trusted with real responsibility and access to a glamorous world.",aridity:"Her success costs her relationships with her boyfriend and friends, and she starts to feel like a different, emptier person.",descent:"A crisis \u2014 betraying a colleague under Miranda's orders \u2014 forces Andy to confront what she's become.",yearning:"Andy realizes she misses who she was before the job reshaped her values.","healing-split":"She quits the job outright, rejecting the version of success Miranda represents.","healing-masculine":"Andy carries the discipline and confidence she gained into a new, more honest career path.",integration:"She reconnects with her old friends and relationships as herself, having kept what served her and let go of what didn't."}},{id:"three-little-pigs-todorov",title:"The Three Little Pigs",creator:"traditional folk tale",appliesToType:"structure",appliesToId:"todorov",beats:{equilibrium:"Three little pigs leave home and each build their own house, living peacefully.",disruption:"A wolf arrives and blows down the houses of straw and sticks, eating the first two pigs.",recognition:"The third pig, who built with brick, realizes the wolf is a real and serious threat.",repair:"The wolf tries to get into the brick house through the chimney, and the pig boils a pot of water to stop him.","new-equilibrium":"The wolf is defeated for good, and the surviving pig lives safely in his sturdy house."}},{id:"frankenstein-frame-narrative",title:"Frankenstein",creator:"Mary Shelley, 1818",appliesToType:"structure",appliesToId:"frame-narrative",beats:{"enter-frame":"Arctic explorer Robert Walton writes letters to his sister describing his voyage, when his ship rescues a stranded, desperate man.","frame-setup":"The rescued man, Victor Frankenstein, agrees to tell Walton the story of how he came to be alone on the ice.","inner-begins":"Victor recounts his obsession with creating life, and the moment his creature first opens its eyes.","inner-develops":"Horrified by what he's made, Victor abandons his creation, which learns, suffers, and turns to vengeance against him.","inner-resolves":"The creature kills those Victor loves one by one, and Victor pursues it into the Arctic to destroy it.","return-frame":"Victor finishes his story to Walton, exhausted and near death from his pursuit.","frame-closes":"Victor dies aboard Walton's ship, and the creature appears one last time, mourning its creator before vanishing into the ice."}},{id:"cinderella-propp-31",title:"Cinderella",creator:"traditional folk tale",appliesToType:"structure",appliesToId:"propp-31",beats:{absentation:"Cinderella's father, her last protector, is often absent or ineffective, leaving her at her stepmother's mercy.",interdiction:"The fairy godmother warns Cinderella she must return before midnight, when the magic will end.",violation:"Cinderella, swept up in the ball, loses track of time and almost violates the warning.",reconnaissance:"The stepmother and stepsisters watch Cinderella closely, suspicious of any spark of hope in her.",delivery:"Word arrives of a royal ball where the prince will choose a bride, information the stepfamily hoards for themselves.",trickery:"The stepmother promises Cinderella she may attend if she finishes an impossible list of chores, never intending to let her go.",complicity:"Cinderella, desperate to belong, believes the promise and works herself to exhaustion trying to earn her place.","villainy-lack":"The stepmother and stepsisters destroy Cinderella's makeshift gown, leaving her with nothing to wear and no way to attend.",mediation:"Cinderella's fairy godmother appears, moved by her distress, and resolves to help her get to the ball.",counteraction:"Cinderella accepts the fairy godmother's help and agrees to go, despite everything stacked against her.",departure:"Transformed and dressed for the ball, Cinderella leaves for the palace in her enchanted coach.","donor-first":"The fairy godmother tests nothing of Cinderella directly, but her sudden appearance is itself the classic donor encounter.","hero-reaction":"Cinderella receives the magical help with gratitude, not entitlement, and promises to return by midnight.","magical-agent":"She's given the coach, the footmen, the gown, and the glass slippers \u2014 the tools that make the rest of the story possible.",guidance:"The magic carries her directly to the ball, delivering her into the prince's presence.",struggle:"Cinderella's real struggle is against the clock itself, racing the enchantment's deadline rather than a person.",branding:"In her rush to escape before midnight, she leaves behind a single glass slipper \u2014 a mark that will later identify her.",victory:"She escapes the palace before the spell breaks and her disguise is exposed, her secret still safe.",liquidation:"The immediate crisis \u2014 being unmasked as a servant at a royal ball \u2014 is avoided, at the cost of losing the prince's trail.",return:"Cinderella returns home to her ordinary, mistreated life, the ball already feeling like a dream.",pursuit:"The prince, determined to find the woman who fled, sends his men through the kingdom carrying the glass slipper.",rescue:"The fairy godmother's earlier intervention is what makes any of this possible \u2014 Cinderella's 'rescue' from her drudgery, however brief.",unrecognized:"When the prince's men arrive at her house, Cinderella is treated as just another servant, unrecognized as the woman from the ball.",unfounded:"Her stepsisters try to force their feet into the glass slipper, each falsely claiming they are the one the prince seeks.","difficult-task":"Every woman in the kingdom must try on the glass slipper to prove she's the one who fits it.",solution:"Only Cinderella's foot fits the slipper perfectly, when she's finally given the chance to try.","propp-recognition":"The prince recognizes her as the woman from the ball, slipper and all.",exposure:"The stepsisters' false claims are exposed as the slipper reveals who the real match is.",transfiguration:"Cinderella is dressed properly at last, presented as a bride rather than a servant.",punishment:"The stepmother and stepsisters lose their hold over Cinderella entirely, cast out of her new life.",wedding:"Cinderella marries the prince, and her days of servitude end for good."}},{id:"lotr-the-quest",title:"The Lord of the Rings",creator:"J.R.R. Tolkien, 1954\u201355",appliesToType:"plotType",appliesToId:"the-quest",beats:{setup:"Frodo Baggins inherits a Ring of terrible power and learns it must be destroyed to save Middle-earth.",rise:"The Fellowship sets out for Mordor, facing Orcs, betrayal, and the loss of their guide Gandalf along the way.",climax:"Frodo and Sam reach the edge of Mount Doom, exhausted and consumed by the Ring's corrupting will.",fall:"The Ring is destroyed, Sauron's power collapses, and Frodo returns home forever changed by what the journey cost him."},sections:{"status-quo":"Frodo Baggins lives a quiet, unremarkable life in the Shire, having inherited his uncle's old ring.",inciting:"Gandalf reveals the ring is the One Ring, and that Sauron's forces are already hunting for it.","plot-point-1":"Frodo leaves the Shire with the ring, committing to carry it to the elves at Rivendell.",rising:"A Fellowship forms around him, and together they push toward Mordor through Orcs, mountains, and betrayal.",midpoint:"Gandalf falls fighting the Balrog in Moria, and the Fellowship scatters, forced to continue without him.","plot-point-2":"Frodo and Sam, alone and exhausted, are betrayed and nearly captured as Sauron's forces close in around Mount Doom.",climax:"Frodo reaches the fire at last, but the Ring's will overpowers him and he claims it instead of destroying it.",resolution:"Gollum bites the Ring from his hand and falls into the fire with it, destroying it and ending Sauron's power for good."}},{id:"midsummer-comedy",title:"A Midsummer Night's Dream",creator:"William Shakespeare, c. 1595",appliesToType:"plotType",appliesToId:"comedy",beats:{setup:"Four young Athenian lovers, mismatched in their affections, flee into an enchanted forest.",rise:"A mischievous fairy's love potion causes chaos, making the wrong lovers fall for each other overnight.",climax:"The confusion peaks in a tangle of jealousy and accusation among the four, none of them understanding why.",fall:"The fairy king sets things right, the correct couples are reunited, and the play ends in a triple wedding."},sections:{"status-quo":"Four young Athenians are tangled in mismatched affections, with a wedding just days away.",inciting:"Two of the lovers flee into an enchanted forest to escape a forced marriage, pursued by the other two.","plot-point-1":"The fairy king orders his servant Puck to use a love potion to fix the lovers' feelings \u2014 with vague instructions.",rising:"Puck enchants the wrong young man entirely, and chaos spreads as the wrong lovers fall for each other overnight.",midpoint:"A second dose of potion only doubles the confusion, with both young men now infatuated with the same woman.","plot-point-2":"The four lovers accuse and nearly come to blows, none of them understanding why their feelings have flipped.",climax:"The fairy king finally corrects Puck's mistake himself, resetting the enchantment properly.",resolution:"The correct couples reunite, and the play closes on a triple wedding."}},{id:"christmas-carol-rebirth",title:"A Christmas Carol",creator:"Charles Dickens, 1843",appliesToType:"plotType",appliesToId:"rebirth",beats:{setup:"Ebenezer Scrooge is a miserly, joyless old man who despises Christmas and everyone who enjoys it.",rise:"Three ghosts show him his past, present, and the bleak future his selfishness is leading toward.",climax:"Scrooge sees his own unmourned death and the destruction his greed has caused those around him.",fall:"Terrified into change, Scrooge wakes transformed \u2014 generous, warm, and eager to make amends."},sections:{"status-quo":"Ebenezer Scrooge is a miserly, joyless old man who despises Christmas and everyone who enjoys it.",inciting:"The ghost of his late partner Marley appears, warning that three more spirits will visit him that night.","plot-point-1":"The Ghost of Christmas Past forces Scrooge to relive the choices that hardened him into who he is.",rising:"The Ghost of Christmas Present shows him the warmth of a holiday he's shut himself out of, especially at the Cratchits'.",midpoint:"He learns that Tiny Tim's life hangs in the balance, and that his own name is spoken with contempt, not affection.","plot-point-2":"The Ghost of Christmas Yet to Come shows him his own unmourned death and the relief it brings to those around him.",climax:"Terrified by the grave bearing his name, Scrooge begs the spirit for a chance to change.",resolution:"He wakes transformed \u2014 generous, warm, and eager to make amends before it's too late."}},{id:"lotr-tobias-quest",title:"The Lord of the Rings",creator:"J.R.R. Tolkien, 1954\u201355",appliesToType:"plotType",appliesToId:"tobias-quest",beats:{setup:"Frodo Baggins inherits a Ring of terrible power that must be destroyed to save Middle-earth.",rise:"The Fellowship treks toward Mordor, facing Orcs, betrayal, and the loss of Gandalf along the way.",climax:"Frodo and Sam reach the edge of Mount Doom, exhausted and consumed by the Ring's corrupting will.",fall:"The Ring is destroyed and Sauron's power collapses, though Frodo returns home forever changed."},sections:{"status-quo":"Frodo Baggins lives a quiet life in the Shire, unaware of what his uncle's old ring really is.",inciting:"Gandalf returns and reveals it as the One Ring, with Sauron's forces already searching for it.","plot-point-1":"Frodo sets out from the Shire, committing to carry the Ring toward its destruction.",rising:"The Fellowship treks toward Mordor, facing Orcs, mountains, and betrayal along the way.",midpoint:"Gandalf falls in Moria fighting the Balrog, and the Fellowship is forced to continue without him.","plot-point-2":"Frodo and Sam, alone and exhausted, are hunted and nearly captured as they near Mount Doom.",climax:"At the fire's edge, the Ring's will finally overpowers Frodo, and he claims it instead of destroying it.",resolution:"Gollum bites the Ring from his hand and falls into the fire with it, and Sauron's power collapses."}},{id:"raiders-tobias-adventure",title:"Raiders of the Lost Ark",creator:"dir. Steven Spielberg, 1981",appliesToType:"plotType",appliesToId:"tobias-adventure",beats:{setup:"Indiana Jones is recruited to find the Ark of the Covenant before the Nazis can use its power.",rise:"He travels from Nepal to Cairo, racing rivals and evading danger to trace the Ark's location.",climax:"Indy risks everything in a commando raid to steal the Ark back from a moving Nazi convoy.",fall:"He survives the Ark's terrible power unleashed on his enemies, delivering it \u2014 bruised but victorious \u2014 to safety."},sections:{"status-quo":"Indiana Jones is a professor of archaeology moonlighting as a relic hunter.",inciting:"Army intelligence recruits him to find the Ark of the Covenant before the Nazis can use its power.","plot-point-1":"Indy commits to the hunt, tracking the Ark's location from a medallion in Nepal.",rising:"He races rivals and Nazi agents to Cairo, uncovering the Ark's dig site ahead of them.",midpoint:"The Nazis seize the Ark from him at gunpoint, sealing it away before he can stop them.","plot-point-2":"Indy mounts a desperate commando raid on a moving Nazi convoy to steal it back.",climax:"The Nazis open the Ark at last, unleashing a power no one there is prepared to survive.",resolution:"Indy survives by refusing to look, delivering the Ark \u2014 bruised but victorious \u2014 to safety."}},{id:"fugitive-tobias-pursuit",title:"The Fugitive",creator:"dir. Andrew Davis, 1993",appliesToType:"plotType",appliesToId:"tobias-pursuit",beats:{setup:"Dr. Richard Kimble is wrongly convicted of murdering his wife and sentenced to death.",rise:"He escapes custody during a prison transport crash and goes on the run, hunted by U.S. Marshal Sam Gerard.",climax:"Kimble and Gerard's cat-and-mouse chase converges as Kimble closes in on the real killer.",fall:"Kimble proves his innocence and exposes the real killer, with Gerard finally on his side."},sections:{"status-quo":"Dr. Richard Kimble is a respected Chicago surgeon with a happy marriage.",inciting:"His wife is murdered by an intruder, and circumstantial evidence points to Kimble himself.","plot-point-1":"Wrongly convicted and sentenced to death, Kimble escapes during a prison transport crash.",rising:"He goes underground in Chicago, using his medical skill to survive while searching for the real killer.",midpoint:"U.S. Marshal Sam Gerard picks up his trail, turning the search into a citywide manhunt.","plot-point-2":"Gerard closes in on Kimble again and again, forcing increasingly desperate evasions.",climax:"Kimble finally corners the one-armed man himself, uncovering the conspiracy behind his wife's murder.",resolution:"Kimble proves his innocence to Gerard, who lets him go \u2014 the hunter finally on the hunted man's side."}},{id:"taken-tobias-rescue",title:"Taken",creator:"dir. Pierre Morel, 2008",appliesToType:"plotType",appliesToId:"tobias-rescue",beats:{setup:"Bryan Mills' daughter Kim is kidnapped by human traffickers while traveling in Paris.",rise:"Bryan uses his covert-operative skills to track the kidnappers through Europe's criminal underworld.",climax:"He infiltrates the trafficking ring's stronghold in a final, violent confrontation to reach his daughter.",fall:"Bryan rescues Kim and brings her home safely, the ordeal reshaping their relationship."},sections:{"status-quo":"Bryan Mills, a retired covert operative, tries to stay close to his teenage daughter Kim.",inciting:"Kim is kidnapped by human traffickers minutes after arriving in Paris with a friend.","plot-point-1":"Bryan, on the phone as it happens, vows to find and kill the men responsible.",rising:"He flies to Paris and uses his old skills to track the trafficking ring through the city's underworld.",midpoint:"Each interrogation brings him closer, but the clock is running out before Kim is sold.","plot-point-2":"He infiltrates the ring's stronghold, fighting through layers of guards toward a final confrontation.",climax:"Bryan reaches the buyer's yacht moments before the auction, killing everyone standing between him and his daughter.",resolution:"He brings Kim home safely, the ordeal reshaping their relationship for good."}},{id:"shawshank-tobias-escape",title:"The Shawshank Redemption",creator:"dir. Frank Darabont, 1994",appliesToType:"plotType",appliesToId:"tobias-escape",beats:{setup:"Andy Dufresne, a banker wrongly convicted of murder, begins a life sentence at Shawshank Prison.",rise:"Over years, he quietly earns trust, launders money for corrupt guards, and tunnels through his cell wall in secret.",climax:"Andy makes his escape through the prison's sewage pipe during a single stormy night.",fall:"He emerges free, exposes the warden's corruption, and starts a new life on a beach in Mexico."},sections:{"status-quo":"Andy Dufresne, a mild-mannered banker, begins a life sentence at Shawshank for a murder he didn't commit.",inciting:"He survives the prison's brutality by quietly making himself useful to the guards and warden.","plot-point-1":"He starts laundering money for the warden, gaining protection \u2014 and, secretly, a plan.",rising:"Over years, Andy tunnels through his cell wall behind a poster, hidden in plain sight.",midpoint:"He learns of evidence that could clear his name, and the warden buries it rather than lose him.","plot-point-2":"With nothing left to lose, Andy makes his final preparations for a one-chance escape.",climax:"He crawls through the prison's sewage pipe during a single stormy night, emerging in the river beyond the walls.",resolution:"Free, he exposes the warden's corruption and starts a new life on a beach in Mexico."}},{id:"monte-cristo-tobias-revenge",title:"The Count of Monte Cristo",creator:"Alexandre Dumas, 1844\u201346",appliesToType:"plotType",appliesToId:"tobias-revenge",beats:{setup:"Edmond Dant\xE8s is falsely imprisoned by jealous rivals on the eve of his wedding.",rise:"After years in prison, he escapes with a fortune and reinvents himself as the mysterious Count of Monte Cristo.",climax:"He methodically destroys the men who betrayed him, one by one, using their own weaknesses against them.",fall:"Having taken his revenge, Dant\xE8s must decide whether it has left him anything worth living for."},sections:{"status-quo":"Edmond Dant\xE8s is a young sailor about to marry the woman he loves.",inciting:"Jealous rivals falsely accuse him of treason, and he's imprisoned without trial on the eve of his wedding.","plot-point-1":"After years in the Ch\xE2teau d'If, he escapes with a fortune hidden by a fellow prisoner.",rising:"He reinvents himself as the mysterious Count of Monte Cristo, quietly infiltrating the lives of the men who betrayed him.",midpoint:"He learns exactly how each man profited from his ruin, and begins turning their own greed against them.","plot-point-2":"One by one, he destroys their fortunes, marriages, and reputations, engineering each downfall personally.",climax:"The last of his betrayers is exposed and ruined, Dant\xE8s's revenge finally complete.",resolution:"Having taken it all, he must decide whether revenge has left him anything worth living for."}},{id:"da-vinci-code-tobias-riddle",title:"The Da Vinci Code",creator:"Dan Brown, 2003",appliesToType:"plotType",appliesToId:"tobias-riddle",beats:{setup:"Symbologist Robert Langdon is drawn into a murder investigation built around a trail of hidden codes.",rise:"Langdon and Sophie Neveu follow clues through art, history and secret societies, one step ahead of those hunting them.",climax:"The final clues point to a truth that threatens to upend centuries of religious history.",fall:"The mystery is solved, revealing a secret Langdon must decide what to do with."},sections:{"status-quo":"Robert Langdon, a Harvard symbologist, is lecturing in Paris.",inciting:"He's called to the Louvre, where a curator has been murdered and left a coded message.","plot-point-1":"Suspected himself, Langdon flees with the curator's granddaughter Sophie to solve the code before the police catch him.",rising:"The two follow clues through the Louvre, a bank vault, and a country estate, one step ahead of those hunting them.",midpoint:"They uncover a secret society guarding a truth hidden for centuries.","plot-point-2":"Their pursuers close in as the final clues point toward a revelation that could upend religious history.",climax:"Langdon solves the last riddle, and the secret is finally revealed.",resolution:"The mystery is solved, leaving Langdon with a truth he must decide what to do with."}},{id:"amadeus-tobias-rivalry",title:"Amadeus",creator:"dir. Milo\u0161 Forman, 1984",appliesToType:"plotType",appliesToId:"tobias-rivalry",beats:{setup:"Composer Antonio Salieri is devoted to God and music, until the brilliant, vulgar young Mozart arrives at court.",rise:"Salieri's admiration curdles into obsessive jealousy as Mozart's genius consistently outshines his own hard-won skill.",climax:"Salieri schemes to destroy Mozart, secretly commissioning a requiem meant for Mozart's own funeral.",fall:"Mozart dies in poverty and obscurity while Salieri lives on, tormented by having engineered it."},sections:{"status-quo":"Antonio Salieri is the Viennese court's celebrated composer, devoted to God and to music.",inciting:"The young, vulgar, wildly gifted Mozart arrives at court and immediately outshines him.","plot-point-1":"Salieri's admiration for Mozart's genius curdles into obsessive, secret jealousy.",rising:"He schemes quietly against Mozart's career while publicly maintaining his favor.",midpoint:"Mozart's fortunes decline through poverty and excess even as his genius keeps astonishing Salieri.","plot-point-2":"Salieri, in disguise, commissions Mozart to write a requiem \u2014 secretly intended for Mozart's own funeral.",climax:"Mozart collapses while composing it, and Salieri, at his bedside, finally has the closeness to genius he always wanted.",resolution:"Mozart dies in poverty and obscurity while Salieri lives on, tormented by having engineered it."}},{id:"rocky-tobias-underdog",title:"Rocky",creator:"dir. John G. Avildsen, 1976",appliesToType:"plotType",appliesToId:"tobias-underdog",beats:{setup:"Rocky Balboa is a small-time boxer with no real prospects, scraping by in Philadelphia.",rise:"Given a shot at the heavyweight title, he trains relentlessly against impossible odds.",climax:"Rocky goes the distance against champion Apollo Creed, a fight no one expected him to survive.",fall:"He loses the decision but proves to himself and everyone else that he was never really the underdog he seemed."},sections:{"status-quo":"Rocky Balboa is a small-time club boxer scraping by as a debt collector in Philadelphia.",inciting:"Heavyweight champion Apollo Creed picks him, almost as a publicity stunt, for a title shot.","plot-point-1":"Rocky decides to take the fight seriously, not to win, but to simply go the distance.",rising:"He trains relentlessly, running the city's streets and pushing his body past what anyone expects of him.",midpoint:"His confidence grows even as everyone around him still assumes he has no real chance.","plot-point-2":"Fight night arrives, and Rocky is battered early, absorbing far more punishment than planned.",climax:"He goes the full fifteen rounds against Creed, refusing to stay down no matter how hard he's hit.",resolution:"He loses the decision but proves to himself and everyone watching that he was never the pushover he seemed."}},{id:"dorian-gray-tobias-temptation",title:"The Picture of Dorian Gray",creator:"Oscar Wilde, 1890",appliesToType:"plotType",appliesToId:"tobias-temptation",beats:{setup:"Dorian Gray, young and beautiful, wishes his portrait would age instead of him.",rise:"Free of consequence, he pursues every pleasure and vice, growing more corrupt while his portrait alone bears the damage.",climax:"The portrait grows monstrous, reflecting the full horror of the life Dorian has actually lived.",fall:"Dorian destroys the painting in a final act, and his own body instantly bears all the years and sins he'd escaped."},sections:{"status-quo":"Dorian Gray is a beautiful, impressionable young man newly introduced to high society.",inciting:"He wishes aloud that his portrait would age instead of him \u2014 and the wish, unnoticed, comes true.","plot-point-1":"Free of visible consequence, Dorian begins indulging every pleasure society would normally punish.",rising:"Years of vice pass without a mark on his face, only on the portrait hidden away in his attic.",midpoint:"Friends and lovers are ruined or destroyed by his influence, while Dorian himself remains untouched.","plot-point-2":"The portrait grows monstrous, and Dorian, horrified by what it shows, murders the one man who threatens to expose it.",climax:"Unable to live with what the painting has become, Dorian stabs it in a final act of self-destruction.",resolution:"His body instantly bears every year and every sin he'd escaped, and he's found dead, aged and unrecognizable."}},{id:"metamorphosis-tobias-metamorphosis",title:"The Metamorphosis",creator:"Franz Kafka, 1915",appliesToType:"plotType",appliesToId:"tobias-metamorphosis",beats:{setup:"Gregor Samsa wakes one morning to find himself transformed into a giant insect.",rise:"His family, horrified and ashamed, isolates him further as he struggles to adapt to his new form.",climax:"Gregor's increasing alienation from his family reaches a breaking point after an incident terrifies them further.",fall:"Gregor dies, unmourned by a family relieved to be free of him, who move on without him."},sections:{"status-quo":"Gregor Samsa works tirelessly as a traveling salesman to support his family.",inciting:"He wakes one morning transformed into a giant insect, unable to explain it to anyone.","plot-point-1":"His family, horrified, locks him in his room, and Gregor accepts his new isolation.",rising:"He tries, in his new form, to still care for and reassure the family that now fears him.",midpoint:"His father injures him badly after a failed attempt to reach his sister, deepening his isolation.","plot-point-2":"The family, exhausted and ashamed, stops caring for him at all, treating him as a burden to be endured.",climax:"An incident at a family gathering finally convinces them they must be rid of him.",resolution:"Gregor dies alone, unmourned by a family visibly relieved to be free of him."}},{id:"beauty-beast-tobias-transformation",title:"Beauty and the Beast",creator:"traditional / Disney, 1991",appliesToType:"plotType",appliesToId:"tobias-transformation",beats:{setup:"Belle is taken prisoner by a cursed Beast in exchange for her father's freedom.",rise:"Despite her fear, Belle and the Beast slowly grow to understand and care for each other.",climax:"The Beast releases Belle to save her father, risking losing her forever just as he's learned to love.",fall:"Belle returns to save him, and her love breaks the curse, transforming him back into a man."},sections:{"status-quo":"Belle lives contentedly in her village, considered odd for loving books more than suitors.",inciting:"Her father is imprisoned by a cursed Beast for trespassing in his castle.","plot-point-1":"Belle offers herself in her father's place, becoming the Beast's prisoner instead.",rising:"Despite her fear of him, Belle and the Beast slowly begin to talk, and then to understand each other.",midpoint:"She discovers the enchanted rose at the heart of his curse, and how little time he has left to break it.","plot-point-2":"The Beast releases Belle to save her dying father, risking losing her forever just as he's learned to love.",climax:"Belle returns to defend him against villagers who've come to kill him, declaring her love as he dies in her arms.",resolution:"Her love breaks the curse, transforming him back into a man, and the two are finally free to be together."}},{id:"mockingbird-tobias-maturation",title:"To Kill a Mockingbird",creator:"Harper Lee, 1960",appliesToType:"plotType",appliesToId:"tobias-maturation",beats:{setup:"Scout Finch grows up in a small Alabama town where her father Atticus defends a Black man falsely accused of rape.",rise:"Scout witnesses the town's ugliness and prejudice up close as the trial divides the community.",climax:"Despite Atticus's defense, the all-white jury convicts an innocent man, and violence follows.",fall:"Scout comes away with a harder, truer understanding of justice, courage, and the adult world's failures."},sections:{"status-quo":"Scout Finch is a young girl growing up in a small, sleepy Alabama town.",inciting:"Her father Atticus agrees to defend Tom Robinson, a Black man falsely accused of rape.","plot-point-1":"Scout and her brother Jem begin facing the town's hostility for their father's decision.",rising:"The trial exposes the town's prejudice up close, dividing neighbors and classmates alike.",midpoint:"Atticus's defense proves Tom's innocence beyond reasonable doubt, and Scout believes justice will follow.","plot-point-2":"The all-white jury convicts Tom anyway, and violence follows in the town soon after.",climax:"Scout and Jem are attacked walking home at night, saved by the reclusive neighbor Boo Radley.",resolution:"Scout comes away with a harder, truer understanding of justice, courage, and the adult world's failures."}},{id:"pride-prejudice-tobias-love",title:"Pride and Prejudice",creator:"Jane Austen, 1813",appliesToType:"plotType",appliesToId:"tobias-love",beats:{setup:"Elizabeth Bennet and Mr. Darcy take an instant dislike to each other at a country ball.",rise:"Pride, misunderstanding and prejudice on both sides keep pulling them apart even as circumstances draw them together.",climax:"Darcy's quiet intervention to save Elizabeth's sister's reputation forces Elizabeth to see him differently.",fall:"Both having overcome their own flaws, Elizabeth and Darcy finally admit their feelings and marry."},sections:{"status-quo":"Elizabeth Bennet and her four sisters live under pressure to marry well.",inciting:"Elizabeth meets the wealthy, aloof Mr. Darcy at a country ball, and takes an instant dislike to him.","plot-point-1":"Darcy's cold first impression, and Elizabeth's own pride, harden into open prejudice against him.",rising:"Circumstances keep drawing them into each other's company even as misunderstandings pile up between them.",midpoint:"Darcy proposes, badly, and Elizabeth refuses him, furious at what she believes he's done to those she loves.","plot-point-2":"A family scandal threatens to ruin the Bennets, and Elizabeth learns Darcy has quietly intervened to fix it.",climax:"Forced to see him clearly for the first time, Elizabeth recognizes she was wrong about him all along.",resolution:"Both having overcome their own flaws, Elizabeth and Darcy finally admit their feelings and marry."}},{id:"romeo-juliet-tobias-forbidden-love",title:"Romeo and Juliet",creator:"William Shakespeare, c. 1595",appliesToType:"plotType",appliesToId:"tobias-forbidden-love",beats:{setup:"Romeo and Juliet fall in love at first sight, unaware \u2014 then all too aware \u2014 that their families are sworn enemies.",rise:"They marry in secret, but the feud between their families keeps escalating around them.",climax:"A fatal duel forces Romeo into exile just as their secret marriage should have offered them a future.",fall:"A plan to reunite them collapses into tragedy, and both die rather than live without each other."},sections:{"status-quo":"The Montagues and Capulets are locked in a long-running, bitter feud across Verona.",inciting:"Romeo, a Montague, sneaks into a Capulet party and falls for Juliet at first sight.","plot-point-1":"They learn each other's names \u2014 and each other's families \u2014 and choose each other anyway.",rising:"They marry in secret with a friar's help, hoping the marriage might one day end the feud.",midpoint:"Romeo kills Juliet's cousin Tybalt in a duel provoked by the feud, and is banished from Verona.","plot-point-2":"Juliet's parents, unaware of her marriage, arrange to force her into marrying another man.",climax:"Juliet fakes her own death to escape the marriage, but the plan to tell Romeo goes wrong.",resolution:"Believing her truly dead, Romeo kills himself beside her, and she wakes to do the same."}},{id:"tale-two-cities-tobias-sacrifice",title:"A Tale of Two Cities",creator:"Charles Dickens, 1859",appliesToType:"plotType",appliesToId:"tobias-sacrifice",beats:{setup:"Sydney Carton, a dissolute lawyer, loves Lucie Manette, who is married to a man who closely resembles him.",rise:"Revolutionary France condemns Lucie's husband Darnay to the guillotine, and Carton resolves to act.",climax:"Carton switches places with Darnay in prison, sacrificing himself to save the man Lucie loves.",fall:"Carton goes to the guillotine in Darnay's place, finding peace in the meaning of his sacrifice."},sections:{"status-quo":"Sydney Carton is a brilliant but dissolute lawyer who believes his life amounts to little.",inciting:"He meets Lucie Manette and falls in love with her, though she loves and marries Charles Darnay instead.","plot-point-1":"Carton vows privately that he'd do anything for Lucie's happiness, even at his own cost.",rising:"Revolutionary France descends into the Terror, and Darnay is lured back to Paris and arrested.",midpoint:"Darnay is condemned to the guillotine, and Lucie's family faces losing him within days.","plot-point-2":"Carton, who closely resembles Darnay, arranges to switch places with him in prison.",climax:"Carton takes Darnay's place at the guillotine, allowing the real man to escape with his family.",resolution:"Carton dies in Darnay's place, finding peace in the meaning his sacrifice finally gives his life."}},{id:"truman-show-tobias-discovery",title:"The Truman Show",creator:"dir. Peter Weir, 1998",appliesToType:"plotType",appliesToId:"tobias-discovery",beats:{setup:"Truman Burbank lives an apparently ordinary life, unaware it's all a constructed television set.",rise:"Small inconsistencies \u2014 a falling light, a rerun weatherman \u2014 begin to make Truman suspect something's wrong.",climax:"Truman sails to the edge of his artificial world and finds the literal wall of the dome enclosing it.",fall:"He chooses to walk out the studio door into the real world, leaving his entire manufactured life behind."},sections:{"status-quo":"Truman Burbank lives an apparently ordinary, cheerful life in the town of Seahaven.",inciting:"A studio light falls from the sky, unexplained, the first crack in the world he's always trusted.","plot-point-1":"Small inconsistencies keep piling up \u2014 a rerun weatherman, a radio picking up his own movements \u2014 and Truman starts investigating.",rising:"He notices the same extras reappearing, the same routes always steering him away from leaving town.",midpoint:"He realizes the entire town, including his wife and best friend, may be performing for him.","plot-point-2":"The show's producers manufacture crisis after crisis to keep him from discovering the truth or leaving.",climax:"Truman sails to the literal edge of his artificial world and finds the wall of the dome enclosing it.",resolution:"He chooses to walk out the studio door into the real world, leaving his entire manufactured life behind."}},{id:"gatsby-tobias-wretched-excess",title:"The Great Gatsby",creator:"F. Scott Fitzgerald, 1925",appliesToType:"plotType",appliesToId:"tobias-wretched-excess",beats:{setup:"Jay Gatsby throws lavish, extravagant parties, all in pursuit of winning back his lost love Daisy.",rise:"His obsession with wealth and image grows more consuming as he tries to recreate a past that can't return.",climax:"Gatsby's carefully built world collapses when Daisy chooses not to leave her husband for him after all.",fall:"Gatsby is killed for a crime that wasn't his, his funeral attended by almost no one from the world he built."},sections:{"status-quo":"Jay Gatsby has built himself into a mysterious, fabulously wealthy figure on Long Island.",inciting:"He throws lavish, extravagant parties purely in hopes his lost love Daisy will one day walk through the door.","plot-point-1":"He reconnects with Daisy through her cousin Nick, and begins pursuing her openly, certain money can undo the past.",rising:"His obsession with recreating their earlier romance grows more consuming as their affair resumes.",midpoint:"He confronts Daisy's husband Tom directly, demanding she admit she never loved him at all.","plot-point-2":"Daisy hesitates, unable to say it, and Gatsby's carefully built fantasy begins to crack.",climax:"Daisy, driving Gatsby's car, kills Tom's mistress in an accident that Gatsby takes the blame for.",resolution:"Gatsby is killed for a crime that wasn't his, his funeral attended by almost no one from the world he built."}},{id:"pursuit-happyness-tobias-ascension",title:"The Pursuit of Happyness",creator:"dir. Gabriele Muccino, 2006",appliesToType:"plotType",appliesToId:"tobias-ascension",beats:{setup:"Chris Gardner is broke and homeless, struggling to care for his young son while chasing a stockbroker internship.",rise:"He works an unpaid internship by day and searches for shelter each night, refusing to give up.",climax:"Chris pushes through his hardest, most exhausting stretch, right before the internship's outcome is decided.",fall:"He's offered a full-time position, the reward for a climb that nearly broke him."},sections:{"status-quo":"Chris Gardner struggles to sell bone-density scanners no one wants to buy.",inciting:"His wife leaves, and Chris is left to raise their young son largely alone and broke.","plot-point-1":"He lands an unpaid stockbroker internship, betting everything on a slim chance at a real career.",rising:"He works the internship by day and searches for shelter \u2014 subway stations, a homeless facility \u2014 each night.",midpoint:"He and his son are evicted, forcing them into increasingly desperate circumstances just to get by.","plot-point-2":"Exhausted and nearly out of options, Chris pushes through the hardest stretch of the internship's final weeks.",climax:"The internship's outcome comes down to a single decision from his supervisors.",resolution:"He's offered a full-time position, the reward for a climb that nearly broke him."}},{id:"breaking-bad-tobias-descension",title:"Breaking Bad",creator:"created by Vince Gilligan, 2008\u201313",appliesToType:"plotType",appliesToId:"tobias-descension",beats:{setup:"Walter White, a mild-mannered chemistry teacher, is diagnosed with terminal cancer and starts making methamphetamine to provide for his family.",rise:"Success in the drug trade feeds Walter's ego, and he makes increasingly ruthless choices to protect and expand it.",climax:"Walter's lies and violence catch up with him, costing him his family, his safety, and nearly everyone he once protected.",fall:"He dies alone, having become the very danger he once told himself he was protecting his family from."},sections:{"status-quo":"Walter White is a mild-mannered, underpaid high school chemistry teacher.",inciting:"A terminal cancer diagnosis leaves him desperate to provide for his family before he's gone.","plot-point-1":"He starts cooking methamphetamine, telling himself it's a temporary, contained decision.",rising:"Success in the drug trade feeds his ego, and he takes on partners, rivals, and risks he once would have refused.",midpoint:"He begins making ruthless choices \u2014 lies, manipulation, violence \u2014 to protect and expand what he's built.","plot-point-2":"His double life collapses around him, costing him his family's trust, his safety, and nearly everyone he once protected.",climax:"In a final confrontation, Walter faces the full consequences of the empire and the enemies he's made.",resolution:"He dies alone, having become the very danger he once told himself he was protecting his family from."}},{id:"oliver-twist-polti-supplication",title:"Oliver Twist",creator:"Charles Dickens, 1838",appliesToType:"plotType",appliesToId:"polti-supplication",beats:{setup:"Oliver Twist grows up abused and starving in a workhouse, with no one to appeal to.",rise:"He famously begs for more food and is punished severely for the request.",climax:"Sold into apprenticeship and later drawn into a gang of pickpockets, Oliver has no power to change his circumstances himself.",fall:"Kind strangers eventually intervene on his behalf, rescuing him from the life he was powerless to escape alone."},sections:{"status-quo":"Oliver Twist is an orphan raised in a workhouse that barely keeps him alive.",inciting:"Starving, he's chosen by the other boys to ask the master for more food.","plot-point-1":"He asks for more and is punished severely for the request.",rising:"Sold into apprenticeship, he runs away to London and falls in with a gang of child pickpockets.",midpoint:"He's drawn deeper into crime he has no real power to refuse, caught between Fagin's gang and the law.","plot-point-2":"Wrongly blamed for a theft, Oliver has no one with standing to appeal to on his behalf.",climax:"A kind stranger, Mr. Brownlow, finally intervenes, recognizing something in Oliver worth saving.",resolution:"Brownlow's continued advocacy rescues Oliver from the life he was powerless to escape alone."}},{id:"exodus-polti-deliverance",title:"The Book of Exodus",creator:"Hebrew Bible",appliesToType:"plotType",appliesToId:"polti-deliverance",beats:{setup:"The Israelites live enslaved in Egypt under Pharaoh's harsh rule.",rise:"Moses confronts Pharaoh again and again, demanding freedom for his people.",climax:"The ten plagues devastate Egypt until Pharaoh finally, briefly, relents.",fall:"Moses leads the Israelites out of Egypt and through the parted sea to freedom."},sections:{"status-quo":"The Israelites live enslaved in Egypt, generations deep into Pharaoh's harsh rule.",inciting:"Moses, raised in Pharaoh's own household, is called by God to demand their freedom.","plot-point-1":"Moses returns to Egypt and confronts Pharaoh for the first time, demanding their release.",rising:"Pharaoh refuses again and again, and plague after plague strikes Egypt in response.",midpoint:"Each plague grows worse, yet Pharaoh's heart hardens further each time he almost relents.","plot-point-2":"The final plague kills every Egyptian firstborn, and Pharaoh, broken, finally releases the Israelites.",climax:"Pharaoh changes his mind and pursues them to the Red Sea, trapping them against the water.",resolution:"The sea parts for Moses and closes over Pharaoh's army, and the Israelites walk free."}},{id:"monte-cristo-polti-crime-vengeance",title:"The Count of Monte Cristo",creator:"Alexandre Dumas, 1844\u201346",appliesToType:"plotType",appliesToId:"polti-crime-vengeance",beats:{setup:"Edmond Dant\xE8s is falsely imprisoned by jealous rivals on the eve of his wedding.",rise:"After years in prison, he escapes with a fortune and reinvents himself as the mysterious Count of Monte Cristo.",climax:"He methodically destroys the men who betrayed him, one by one, using their own weaknesses against them.",fall:"Having taken his revenge, Dant\xE8s must decide whether it has left him anything worth living for."},sections:{"status-quo":"Edmond Dant\xE8s is a young sailor about to marry the woman he loves.",inciting:"Jealous rivals falsely accuse him of treason, and he's imprisoned without trial on the eve of his wedding.","plot-point-1":"After years in the Ch\xE2teau d'If, he escapes with a fortune hidden by a fellow prisoner.",rising:"He reinvents himself as the mysterious Count of Monte Cristo, quietly infiltrating the lives of the men who betrayed him.",midpoint:"He learns exactly how each man profited from his ruin, and begins turning their own greed against them.","plot-point-2":"One by one, he destroys their fortunes, marriages, and reputations, engineering each downfall personally.",climax:"The last of his betrayers is exposed and ruined, Dant\xE8s's revenge finally complete.",resolution:"Having taken it all, he must decide whether revenge has left him anything worth living for."}},{id:"godfather-polti-vengeance-kindred",title:"The Godfather",creator:"dir. Francis Ford Coppola, 1972",appliesToType:"plotType",appliesToId:"polti-vengeance-kindred",beats:{setup:"The Corleone family is attacked, and Vito Corleone is nearly killed by a rival family's hitmen.",rise:"Michael Corleone takes vengeance into his own hands, killing the men responsible.",climax:"A war between crime families escalates, with each side's kin becoming targets in turn.",fall:"Michael settles every score at once, striking against the heads of the rival families that wronged his own."},sections:{"status-quo":"The Corleone crime family holds an uneasy peace with New York's other families.",inciting:"Vito Corleone is shot and nearly killed by a rival family after refusing to enter the drug trade.","plot-point-1":"Michael, the family's reluctant, \u201Ccivilian\u201D son, decides to kill the men responsible himself.",rising:"His act pulls him fully into the family business, escalating into open war between the five families.",midpoint:"Each side begins targeting the other's kin directly, and Michael's own brother Sonny is ambushed and killed.","plot-point-2":"With his father weakened and the war spiraling, Michael quietly plans to end it once and for all.",climax:"During his own godson's baptism, Michael has the heads of every rival family murdered simultaneously.",resolution:"Michael settles every score at once, emerging as the new, undisputed head of the Corleone family."}},{id:"fugitive-polti-pursuit",title:"The Fugitive",creator:"dir. Andrew Davis, 1993",appliesToType:"plotType",appliesToId:"polti-pursuit",beats:{setup:"Dr. Richard Kimble is wrongly convicted of murdering his wife and sentenced to death.",rise:"He escapes custody during a prison transport crash and goes on the run.",climax:"U.S. Marshal Sam Gerard closes in on Kimble at every turn, forcing increasingly desperate evasions.",fall:"Kimble finally corners the real killer himself, proving his innocence to the marshal who'd hunted him."},sections:{"status-quo":"Dr. Richard Kimble is a respected Chicago surgeon with a happy marriage.",inciting:"His wife is murdered by an intruder, and circumstantial evidence points to Kimble himself.","plot-point-1":"Wrongly convicted and sentenced to death, Kimble escapes during a prison transport crash.",rising:"He goes underground in Chicago, using his medical skill to survive while searching for the real killer.",midpoint:"U.S. Marshal Sam Gerard picks up his trail, turning the search into a citywide manhunt.","plot-point-2":"Gerard closes in on Kimble again and again, forcing increasingly desperate evasions.",climax:"Kimble finally corners the one-armed man himself, uncovering the conspiracy behind his wife's murder.",resolution:"Kimble proves his innocence to Gerard, who lets him go \u2014 the hunter finally on the hunted man's side."}},{id:"titanic-polti-disaster",title:"Titanic",creator:"dir. James Cameron, 1997",appliesToType:"plotType",appliesToId:"polti-disaster",beats:{setup:"The 'unsinkable' RMS Titanic sets sail on its maiden voyage, carrying passengers of every class.",rise:"The ship strikes an iceberg in the night, and water begins flooding in far faster than anyone expects.",climax:"As the ship breaks apart and sinks, passengers scramble for the too-few lifeboats.",fall:"Over 1,500 people die in the freezing water, and the survivors are left to carry what they witnessed."},sections:{"status-quo":"The \u201Cunsinkable\u201D RMS Titanic sets sail on its maiden voyage, carrying passengers of every class.",inciting:"Lookouts spot an iceberg too late, and the ship strikes it in the dark of night.","plot-point-1":"Water begins flooding in far faster than anyone aboard is prepared to believe.",rising:"Crew and passengers realize there aren't enough lifeboats for everyone on board.",midpoint:"Class divisions turn deadly as steerage passengers are held back while the ship tilts further.","plot-point-2":"The ship's structure begins to fail, breaking apart as the last boats pull away.",climax:"Hundreds are thrown into the freezing water as the Titanic sinks beneath them.",resolution:"Over 1,500 people die in the cold, and the survivors are left to carry what they witnessed."}},{id:"job-polti-cruelty-misfortune",title:"The Book of Job",creator:"Hebrew Bible",appliesToType:"plotType",appliesToId:"polti-cruelty-misfortune",beats:{setup:"Job is a righteous, prosperous man with a large family and great wealth.",rise:"He loses his children, his wealth, and his health in a rapid, seemingly unearned series of disasters.",climax:"Job's friends insist he must have sinned to deserve this, while Job insists on his own innocence.",fall:"Job's fortunes are eventually restored, though the suffering itself is never fully explained to him."},sections:{"status-quo":"Job is a righteous, prosperous man with a large family and great wealth.",inciting:"Satan wagers with God that Job's faith depends entirely on his good fortune.","plot-point-1":"In a single day, Job loses his livestock, his servants, and all ten of his children.",rising:"Painful sores cover his body, and his own wife urges him to curse God and die.",midpoint:"Three friends arrive, insisting his suffering must be punishment for some hidden sin.","plot-point-2":"Job insists on his innocence, demanding an answer from God for suffering he doesn't understand.",climax:"God finally answers from a whirlwind, not with explanation but with the sheer scale of creation itself.",resolution:"Job's fortunes are eventually restored, though the suffering itself is never fully explained to him."}},{id:"les-miserables-polti-revolt",title:"Les Mis\xE9rables",creator:"Victor Hugo, 1862",appliesToType:"plotType",appliesToId:"polti-revolt",beats:{setup:"Jean Valjean, an ex-convict, has rebuilt his life, but Inspector Javert is determined to find and punish him.",rise:"Amid growing poverty and injustice in Paris, a group of young revolutionaries plans an uprising.",climax:"The students build a barricade and revolt against the government, most of them dying in the failed uprising.",fall:"Valjean survives, having saved the wounded revolutionary Marius, and finds peace before his death."},sections:{"status-quo":"Jean Valjean, an ex-convict, has rebuilt his life as a respected mayor under a false name.",inciting:"Inspector Javert, obsessed with the law, grows suspicious that the mayor is the convict he's hunted for years.","plot-point-1":"Valjean reveals himself to save an innocent man wrongly arrested in his place, and flees with his ward Cosette.",rising:"Years later, amid growing poverty and injustice in Paris, young revolutionaries plan an uprising.",midpoint:"Cosette falls in love with Marius, one of the young revolutionaries, just as the uprising nears.","plot-point-2":"The students build a barricade and revolt against the government, most of them dying in the failed uprising.",climax:"Valjean, following Marius into the fighting, carries the wounded young man through the sewers to save him.",resolution:"Valjean survives, having saved the man Cosette loves, and finds peace before his own death."}},{id:"apollo-13-polti-daring-enterprise",title:"Apollo 13",creator:"dir. Ron Howard, 1995",appliesToType:"plotType",appliesToId:"polti-daring-enterprise",beats:{setup:"The Apollo 13 crew launches toward the moon on what should be a routine mission.",rise:"An oxygen tank explosion cripples the spacecraft, forcing an improvised, high-risk plan just to survive.",climax:"The crew and mission control attempt a dangerous engine burn to slingshot them back toward Earth.",fall:"Against the odds, all three astronauts make it home safely."},sections:{"status-quo":"The Apollo 13 crew launches toward the moon on what should be a routine mission.",inciting:"An oxygen tank explodes two days in, crippling the spacecraft far from Earth.","plot-point-1":"The crew and mission control abandon the moon landing, focused entirely on getting the astronauts home alive.",rising:"They improvise a plan to use the lunar module as a lifeboat, rationing power, water, and air.",midpoint:"Carbon dioxide levels rise dangerously, forcing an improvised fix built from spare parts and duct tape.","plot-point-2":"The crew must attempt a precise, dangerous engine burn with no computer to guide it, on a ship never built for the job.",climax:"Re-entry brings a communications blackout longer than expected, leaving mission control unsure if they've survived.",resolution:"Against the odds, all three astronauts splash down safely and make it home."}},{id:"taken-polti-abduction",title:"Taken",creator:"dir. Pierre Morel, 2008",appliesToType:"plotType",appliesToId:"polti-abduction",beats:{setup:"Bryan Mills' daughter Kim is kidnapped by human traffickers while traveling in Paris.",rise:"Bryan uses his covert-operative skills to track the kidnappers through Europe's criminal underworld.",climax:"He infiltrates the trafficking ring's stronghold in a final, violent confrontation to reach his daughter.",fall:"Bryan rescues Kim and brings her home safely, the ordeal reshaping their relationship."},sections:{"status-quo":"Bryan Mills, a retired covert operative, tries to stay close to his teenage daughter Kim.",inciting:"Kim is kidnapped by human traffickers minutes after arriving in Paris with a friend.","plot-point-1":"Bryan, on the phone as it happens, vows to find and kill the men responsible.",rising:"He flies to Paris and uses his old skills to track the trafficking ring through the city's underworld.",midpoint:"Each interrogation brings him closer, but the clock is running out before Kim is sold.","plot-point-2":"He infiltrates the ring's stronghold, fighting through layers of guards toward a final confrontation.",climax:"Bryan reaches the buyer's yacht moments before the auction, killing everyone standing between him and his daughter.",resolution:"He brings Kim home safely, the ordeal reshaping their relationship for good."}},{id:"hound-baskervilles-polti-enigma",title:"The Hound of the Baskervilles",creator:"Arthur Conan Doyle, 1902",appliesToType:"plotType",appliesToId:"polti-enigma",beats:{setup:"Sherlock Holmes is asked to investigate the legend of a supernatural hound linked to a family curse and a suspicious death.",rise:"Watson investigates the moor alone, uncovering escaped convicts and suspicious neighbors while a mysterious hound howls in the night.",climax:"Holmes reveals himself to have been secretly investigating all along, just as the real hound attacks.",fall:"The hound is revealed to be a real dog, disguised to exploit the legend, and the culprit behind it is exposed."},sections:{"status-quo":"Sherlock Holmes is consulted about an old family legend of a supernatural hound.",inciting:"Sir Charles Baskerville is found dead on the moor, his face frozen in terror.","plot-point-1":"Holmes sends Watson to guard the new heir, Sir Henry, while secretly investigating from the shadows himself.",rising:"Watson investigates the moor alone, uncovering an escaped convict and suspicious neighbors as a hound howls in the night.",midpoint:"Watson discovers a mysterious figure watching the moor, whose identity remains hidden from him.","plot-point-2":"Sir Henry is lured out onto the moor alone, and the hound is set loose on him in the dark.",climax:"Holmes reveals he's been secretly investigating all along, just as the real hound attacks.",resolution:"The hound is exposed as a real dog, disguised to exploit the legend, and the culprit behind it is caught."}},{id:"raiders-polti-obtaining",title:"Raiders of the Lost Ark",creator:"dir. Steven Spielberg, 1981",appliesToType:"plotType",appliesToId:"polti-obtaining",beats:{setup:"Indiana Jones is recruited to find the Ark of the Covenant before the Nazis do.",rise:"He races rivals and Nazi agents across Nepal and Egypt to trace the Ark's hidden location.",climax:"He finds it first, only to have Belloq and the Nazis seize it from him at gunpoint.",fall:"A daring raid lets Indy reclaim the Ark, delivering it to safety despite everything stacked against him."},sections:{"status-quo":"Indiana Jones is a professor of archaeology moonlighting as a relic hunter.",inciting:"Army intelligence recruits him to find the Ark of the Covenant before the Nazis do.","plot-point-1":"Indy commits to the hunt, tracing a medallion that marks the Ark's hidden location.",rising:"He races rivals and Nazi agents across Nepal and Egypt to reach the dig site first.",midpoint:"He finds the Ark's resting place, only to have Belloq and the Nazis seize it from him at gunpoint.","plot-point-2":"Sealed out and left for dead, Indy must find another way to reach the Ark before it leaves Egypt.",climax:"He mounts a daring raid on the Nazi convoy, reclaiming the Ark despite everything stacked against him.",resolution:"He delivers the Ark to safety, having gotten it back through sheer persistence rather than force alone."}},{id:"hamlet-polti-enmity-kinsmen",title:"Hamlet",creator:"William Shakespeare, c. 1600",appliesToType:"plotType",appliesToId:"polti-enmity-kinsmen",beats:{setup:"Prince Hamlet's father, the king, has died, and his uncle Claudius has swiftly married Hamlet's mother and taken the throne.",rise:"His father's ghost reveals Claudius murdered him, and Hamlet begins plotting revenge while feigning madness.",climax:"Hamlet's staged play provokes Claudius into revealing his guilt, and the plots between them multiply.",fall:"Nearly the entire royal family dies in the final confrontation, kinsman against kinsman."},sections:{"status-quo":"Prince Hamlet mourns his father's sudden death at the Danish court.",inciting:"His father's ghost appears, revealing that his uncle Claudius murdered him to seize the throne.","plot-point-1":"Hamlet vows revenge, and begins feigning madness to investigate without raising suspicion.",rising:"He stages a play mirroring the murder, watching Claudius for any sign of guilt.",midpoint:"Claudius's reaction confirms his guilt, and Hamlet's plotting grows more dangerous and erratic.","plot-point-2":"Hamlet accidentally kills Polonius, setting off a chain of revenge plots between multiple families.",climax:"A poisoned duel, meant to kill Hamlet quietly, spirals into chaos that kills nearly everyone involved.",resolution:"Hamlet, Claudius, the queen, and Laertes all die in the final scene, kinsman against kinsman."}},{id:"king-lear-polti-rivalry-kinsmen",title:"King Lear",creator:"William Shakespeare, c. 1606",appliesToType:"plotType",appliesToId:"polti-rivalry-kinsmen",beats:{setup:"King Lear divides his kingdom among his three daughters based on how well they flatter him.",rise:"His two elder daughters, having secured their inheritance, turn on Lear and each other for full control.",climax:"Betrayal and rivalry among the sisters spirals into open war and murder within the family.",fall:"Nearly the whole family, including Lear and his loyal youngest daughter Cordelia, dies before the kingdom is restored to order."},sections:{"status-quo":"King Lear rules a stable kingdom as an aging monarch with three daughters.",inciting:"He decides to divide his kingdom based on which daughter flatters him most convincingly.","plot-point-1":"He disowns his youngest, most honest daughter Cordelia, and splits the kingdom between the other two.",rising:"Goneril and Regan, having secured their inheritance, quickly turn on Lear, stripping his remaining authority.",midpoint:"Lear, humiliated and powerless, wanders into a storm, his sanity beginning to fracture.","plot-point-2":"Goneril and Regan turn on each other over a shared lover, and their rivalry spirals into open war and murder.",climax:"Cordelia returns with an army to save her father, but is captured and killed regardless.",resolution:"Nearly the whole family, including Lear himself, dies before the kingdom is restored to order."}},{id:"double-indemnity-polti-murderous-adultery",title:"Double Indemnity",creator:"dir. Billy Wilder, 1944",appliesToType:"plotType",appliesToId:"polti-murderous-adultery",beats:{setup:"Insurance salesman Walter Neff is drawn into an affair with Phyllis Dietrichson, an unhappily married woman.",rise:"Together they plot to murder her husband and collect on a life insurance policy, faking an accident.",climax:"Suspicion from Walter's colleague closes in as the two conspirators begin to turn on each other.",fall:"The scheme collapses in mutual betrayal and violence, exposing the murder they thought was perfect."},sections:{"status-quo":"Walter Neff is a confident, successful insurance salesman.",inciting:"He meets Phyllis Dietrichson while renewing her husband's policy, and the two begin an affair.","plot-point-1":"Phyllis proposes they murder her husband and collect on a lucrative accident policy.",rising:"Together they plan and carry out the murder, staging it as a fall from a train.",midpoint:"Walter's colleague Keyes, an expert in fraud, grows suspicious the \u201Caccident\u201D was staged.","plot-point-2":"As Keyes closes in, Walter and Phyllis begin to distrust and turn on each other.",climax:"Walter confronts Phyllis, and the two conspirators shoot each other in the dark.",resolution:"The scheme collapses in mutual betrayal and violence, exposing the murder they thought was perfect."}},{id:"yellow-wallpaper-polti-madness",title:"The Yellow Wallpaper",creator:"Charlotte Perkins Gilman, 1892",appliesToType:"plotType",appliesToId:"polti-madness",beats:{setup:"A woman is confined to a room by her husband for a 'rest cure,' forbidden from working or writing.",rise:"Isolated and unstimulated, she becomes fixated on the room's strange yellow wallpaper.",climax:"She becomes convinced a woman is trapped behind the wallpaper's pattern, trying to break free.",fall:"She descends fully into madness, tearing at the wallpaper convinced she has freed the woman within \u2014 who is herself."},sections:{"status-quo":"A woman is confined by her physician husband to a single room for a \u201Crest cure.\u201D",inciting:"Forbidden from working, writing, or leaving, she becomes fixated on the room's strange yellow wallpaper.","plot-point-1":"She begins secretly writing about the wallpaper, the one act of defiance left to her.",rising:"Isolated and unstimulated, she starts to see a shifting pattern moving within the paper itself.",midpoint:"She becomes convinced a woman is trapped behind the wallpaper's pattern, trying to escape.","plot-point-2":"She spends her days and nights watching the shape, certain it creeps around the room when unseen.",climax:"She begins tearing at the wallpaper, determined to free the woman she believes is trapped inside it.",resolution:"She descends fully into madness, having freed the woman within \u2014 who is, in the end, herself."}},{id:"frankenstein-polti-fatal-imprudence",title:"Frankenstein",creator:"Mary Shelley, 1818",appliesToType:"plotType",appliesToId:"polti-fatal-imprudence",beats:{setup:"Victor Frankenstein becomes obsessed with discovering the secret of creating life.",rise:"He builds a creature from dead tissue without ever considering what he'll do once it's alive.",climax:"Horrified by what he's made, he abandons it \u2014 a careless decision that turns the creature toward vengeance.",fall:"Victor's failure to think through the consequences of his experiment costs him everyone he loves."},sections:{"status-quo":"Victor Frankenstein is a brilliant, driven student of natural philosophy.",inciting:"He becomes obsessed with discovering the secret of animating dead tissue.","plot-point-1":"Working in secret and without oversight, he assembles and brings a creature to life.",rising:"Horrified by what he's made the instant it wakes, he flees, leaving the creature to fend for itself.",midpoint:"The abandoned creature, rejected by everyone it meets, teaches itself language and grows to hate its creator.","plot-point-2":"It begins murdering those closest to Victor, one by one, demanding a companion in exchange for peace.",climax:"Victor destroys the companion he's begun building, and the creature vows revenge on his wedding night.",resolution:"Victor's failure to think through the consequences of his experiment costs him everyone he loves."}},{id:"oedipus-polti-involuntary-crimes-love",title:"Oedipus Rex",creator:"Sophocles, c. 429 BCE",appliesToType:"plotType",appliesToId:"polti-involuntary-crimes-love",beats:{setup:"Oedipus, raised far from his birth parents, is unaware of a prophecy that he will kill his father and marry his mother.",rise:"Fleeing what he believes is his fate, Oedipus unknowingly kills a stranger on the road and later marries the widowed queen.",climax:"A plague on the city drives Oedipus to investigate its cause, uncovering the truth of what he's done.",fall:"Oedipus realizes the stranger was his father and the queen his mother \u2014 the love that undid him was never a knowing crime."},sections:{"status-quo":"Oedipus was raised far from Thebes, believing the king and queen of Corinth were his true parents.",inciting:"An oracle warns him he's fated to kill his father and marry his mother, so he flees Corinth to avoid it.","plot-point-1":"On the road, he kills a stranger in a dispute over right of way, unaware of who the man is.",rising:"He arrives in Thebes, solves the Sphinx's riddle, and is made king, marrying the widowed queen Jocasta.",midpoint:"Years later, a plague strikes Thebes, and an oracle says it will lift only when the old king's murderer is found.","plot-point-2":"Oedipus investigates relentlessly, piecing together the identity of the stranger he once killed.",climax:"He learns the stranger was his true father, King Laius, and that Jocasta is his mother.",resolution:"Jocasta takes her own life, and Oedipus blinds himself, undone by a fate he never knowingly chose."}},{id:"oedipus-polti-slaying-kinsman",title:"Oedipus Rex",creator:"Sophocles, c. 429 BCE",appliesToType:"plotType",appliesToId:"polti-slaying-kinsman-unrecognized",beats:{setup:"Oedipus leaves the only parents he's ever known to escape a prophecy that he'll kill his father.",rise:"On the road, a confrontation with an arrogant stranger turns violent, and Oedipus kills him without knowing who he is.",climax:"Years later, investigating a plague on his city, Oedipus is forced to trace the identity of the man he killed.",fall:"The stranger is revealed to have been his true father, King Laius \u2014 the kinsman Oedipus slew without recognizing him."},sections:{"status-quo":"Oedipus grows up in Corinth, believing himself safely far from a prophecy that he'll kill his father.",inciting:"He learns of the prophecy directly and flees Corinth, determined never to let it come true.","plot-point-1":"On the road to Thebes, an arrogant stranger blocks his path and a confrontation turns violent.",rising:"Oedipus kills the stranger in the fight, not knowing his identity, and continues on to Thebes.",midpoint:"He becomes king of Thebes, the killing behind him and unconnected, as far as he knows, to his own life.","plot-point-2":"Years later, a plague forces Oedipus to investigate the old king's unsolved murder.",climax:"The investigation leads inexorably back to the stranger on the road, and to Oedipus himself.",resolution:"The stranger is revealed to have been his true father, King Laius \u2014 the kinsman Oedipus slew without recognizing him."}},{id:"tale-two-cities-polti-self-sacrifice-ideal",title:"A Tale of Two Cities",creator:"Charles Dickens, 1859",appliesToType:"plotType",appliesToId:"polti-self-sacrifice-ideal",beats:{setup:"Sydney Carton, a dissolute lawyer, believes his life has amounted to little of value.",rise:"He comes to see Lucie Manette's happiness, and the ideal of love itself, as worth more than his own survival.",climax:"When her husband Darnay is condemned to the guillotine, Carton resolves to take his place.",fall:"Carton dies for the ideal he's chosen, finding meaning in the sacrifice his own life never gave him."},sections:{"status-quo":"Sydney Carton is a brilliant but dissolute lawyer who believes his life amounts to little.",inciting:"He meets Lucie Manette and comes to love her, though she chooses to marry Charles Darnay instead.","plot-point-1":"He tells Lucie privately he'd do anything to see her happy, even at his own cost.",rising:"Revolutionary France descends into the Terror, and Darnay is lured back to Paris and arrested.",midpoint:"Darnay is condemned to the guillotine, and Carton begins forming a plan no one else knows about.","plot-point-2":"Carton, who closely resembles Darnay, arranges to take his place in the condemned cell.",climax:"He goes to the guillotine in Darnay's place, allowing the real man to escape with his family.",resolution:"Carton dies for the ideal he's chosen, finding meaning in the sacrifice his own life never gave him."}},{id:"harry-potter-polti-self-sacrifice-kindred",title:"Harry Potter and the Sorcerer's Stone",creator:"J.K. Rowling, 1997",appliesToType:"plotType",appliesToId:"polti-self-sacrifice-kindred",beats:{setup:"Lily Potter stands between her infant son Harry and Voldemort, refusing to step aside.",rise:"Her death, given freely for her son, leaves a magical protection woven into Harry himself.",climax:"Years later, that same protection burns Voldemort's servant when he tries to harm Harry directly.",fall:"Harry survives because of a sacrifice he doesn't even remember, carried by a love more powerful than any spell."},sections:{"status-quo":"Lily and James Potter are in hiding with their infant son Harry, marked for death by Voldemort.",inciting:"Voldemort finds their hiding place and comes to kill the child himself.","plot-point-1":"Lily stands between her son and Voldemort, refusing to step aside even when ordered to.",rising:"Voldemort kills her anyway, but her death leaves an ancient protection woven into Harry himself.",midpoint:"The same curse meant to kill Harry rebounds instead, destroying Voldemort's body.","plot-point-2":"Years later at Hogwarts, that same protection is tested when Voldemort's servant tries to touch Harry directly.",climax:"The protection burns the servant on contact, driving him away before he can harm Harry.",resolution:"Harry survives because of a sacrifice he doesn't even remember, carried by a love more powerful than any spell."}},{id:"wuthering-heights-polti-all-sacrificed-passion",title:"Wuthering Heights",creator:"Emily Bront\xEB, 1847",appliesToType:"plotType",appliesToId:"polti-all-sacrificed-passion",beats:{setup:"Heathcliff and Catherine share an intense, consuming bond from childhood, deeper than either can control.",rise:"Catherine marries another man for status, and Heathcliff's love curdles into obsession and cruelty.",climax:"Heathcliff spends years destroying the lives of everyone connected to Catherine, unable to let go of his passion.",fall:"He dies still consumed by her memory, having sacrificed every relationship and any peace for a love that outlasted her."},sections:{"status-quo":"Heathcliff, a foundling, and Catherine Earnshaw grow up together as inseparable companions.",inciting:"As they grow older, their bond deepens into a consuming, uncontrollable love.","plot-point-1":"Catherine, pressured by status and propriety, marries the wealthy Edgar Linton instead of Heathcliff.",rising:"Heathcliff leaves and returns wealthy and hardened, his love for Catherine curdled into obsession.",midpoint:"He marries Edgar's sister purely to torment the family, deepening the damage around him.","plot-point-2":"Catherine, torn between the two men, falls gravely ill and dies giving birth to her daughter.",climax:"Heathcliff spends years destroying the lives of everyone connected to Catherine, unable to let go of his passion.",resolution:"He dies still consumed by her memory, having sacrificed every relationship and any peace for a love that outlasted her."}},{i
