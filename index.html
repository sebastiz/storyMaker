les every score at once, striking against the heads of the rival families that wronged his own."},characters:[{category:"protagonist",name:"Michael Corleone",values:{setup:0,rise:-1,climax:-1,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Vito Corleone",values:{setup:1,rise:-3,climax:-1,fall:1},interacts:{setup:!0,rise:!0,climax:!1,fall:!0}},{category:"ally",name:"Sonny Corleone",values:{setup:1,rise:1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"the rival family",values:{setup:1,rise:2,climax:-1,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Tom Hagen",values:{setup:1,rise:0,climax:-1,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}}],sections:{"opening-image":"The Corleone family celebrates at a lavish wedding, projecting an image of power and unity even as an uneasy peace holds with New York's other crime families.","theme-stated":"Vito Corleone's insistence that loyalty and reputation matter more than one more dangerous deal quietly states the code Michael will later break, and then come to embody.","set-up":`Michael is introduced as the family's reluctant "civilian" son, deliberately kept apart from the business he wants no part of.`,catalyst:"Vito is shot and nearly killed by a rival family after refusing to enter the drug trade, shattering the uneasy peace.",debate:"Michael visits his wounded father and weighs whether to stay outside the family's world or step in to protect it.","break-into-two":"Michael decides to kill the men responsible himself, crossing fully into the violent world he had always avoided.","b-story":"Michael's bond with his father and his rivalry with his volatile brother Sonny become the emotional core of his transformation.","fun-and-games":"Michael carries out the killing of the rival captain and a corrupt police officer, proving he can operate within the family's own terms.",midpoint:"The act pulls Michael fully into the business, and what began as personal protection escalates into open war between the five families.","bad-guys-close":"Both sides begin targeting each other's kin directly, and the war closes in on everyone the Corleones love.","all-is-lost":"Sonny is ambushed and killed, a devastating loss that leaves Vito weakened and the family's position at its most vulnerable.","dark-night":"With his father diminished and the war spiraling, Michael sits with the full weight of what leading the family will now require of him.","break-into-three":"Michael quietly assembles a plan to end the war in a single, decisive stroke rather than continue trading killings.",finale:"During his own godson's baptism, Michael has the heads of every rival family murdered simultaneously, settling every score at once.","final-image":"Michael stands as the new, undisputed head of the Corleone family, the door closing on him just as it once did on Vito."}},{id:"fugitive-polti-pursuit",title:"The Fugitive",creator:"dir. Andrew Davis, 1993",appliesToType:"plotType",appliesToId:"polti-pursuit",bestStructureId:"fichtean",beats:{setup:"Dr. Richard Kimble is wrongly convicted of murdering his wife and sentenced to death.",rise:"He escapes custody during a prison transport crash and goes on the run.",climax:"U.S. Marshal Sam Gerard closes in on Kimble at every turn, forcing increasingly desperate evasions.",fall:"Kimble finally corners the real killer himself, proving his innocence to the marshal who'd hunted him."},characters:[{category:"protagonist",name:"Dr. Richard Kimble",values:{setup:-3,rise:-1,climax:0,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Sam Gerard",values:{setup:2,rise:2,climax:1,fall:1},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the one-armed man",values:{setup:1,rise:1,climax:-2,fall:-3},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}},{category:"antagonist",name:"Dr. Charles Nichols",values:{setup:2,rise:2,climax:-1,fall:-3},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}}],sections:{"crisis-1":"Dr. Richard Kimble, already wrongly convicted of murdering his wife, seizes a desperate chance to escape when his prison transport crashes.","crisis-2":"On the run as an escaped convict, Kimble goes underground in Chicago, using his medical skill to survive while chasing the one lead he has: the real killer.","crisis-3":"U.S. Marshal Sam Gerard picks up his trail and turns the manhunt citywide, closing the net around Kimble faster than he can build a case.","crisis-4":"Gerard corners Kimble again and again, forcing increasingly desperate evasions that leave him almost no room or time left to prove his innocence.",climax:"Kimble finally corners the one-armed man himself and uncovers the conspiracy behind his wife's murder, just as Gerard closes in on the same spot.",resolution:"Kimble's innocence is proven on the spot, and Gerard, the hunter who nearly caught him a dozen times, lets him go."}},{id:"titanic-polti-disaster",title:"Titanic",creator:"dir. James Cameron, 1997",appliesToType:"plotType",appliesToId:"polti-disaster",bestStructureId:"freytag",beats:{setup:"The 'unsinkable' RMS Titanic sets sail on its maiden voyage, carrying passengers of every class.",rise:"The ship strikes an iceberg in the night, and water begins flooding in far faster than anyone expects.",climax:"As the ship breaks apart and sinks, passengers scramble for the too-few lifeboats.",fall:"Over 1,500 people die in the freezing water, and the survivors are left to carry what they witnessed."},characters:[{category:"protagonist",name:"Jack Dawson",values:{setup:0,rise:-1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Rose DeWitt Bukater",values:{setup:0,rise:-1,climax:-2,fall:1},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the ship's officers",values:{setup:1,rise:1,climax:-2,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"Cal Hockley",values:{setup:3,rise:1,climax:-1,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}}],sections:{exposition:'The "unsinkable" RMS Titanic sets sail on its maiden voyage, carrying passengers of every class into what should be an uneventful Atlantic crossing.',"rising-action":"Lookouts spot an iceberg too late and the ship strikes it in the dark, with water flooding in far faster than anyone aboard is prepared to believe; crew and passengers realize there aren't nearly enough lifeboats for everyone on board.",climax:"As the ship tilts further, class divisions turn deadly \u2014 steerage passengers are held back \u2014 and the Titanic's structure finally begins to fail as the last boats pull away.","falling-action":"The ship breaks apart and sinks, throwing hundreds into the freezing water where most have no way to survive.",denouement:"Over 1,500 people die in the cold Atlantic, and the survivors are left to carry what they witnessed for the rest of their lives."}},{id:"job-polti-cruelty-misfortune",title:"The Book of Job",creator:"Hebrew Bible",appliesToType:"plotType",appliesToId:"polti-cruelty-misfortune",bestStructureId:"kishotenketsu",beats:{setup:"Job is a righteous, prosperous man with a large family and great wealth.",rise:"He loses his children, his wealth, and his health in a rapid, seemingly unearned series of disasters.",climax:"Job's friends insist he must have sinned to deserve this, while Job insists on his own innocence.",fall:"Job's fortunes are eventually restored, though the suffering itself is never fully explained to him."},characters:[{category:"protagonist",name:"Job",values:{setup:3,rise:-3,climax:-2,fall:2},interacts:{setup:!1,rise:!1,climax:!0,fall:!0}},{category:"antagonist",name:"Satan",values:{setup:2,rise:1,climax:-1,fall:-2},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}},{category:"mentor",name:"God",values:{setup:3,rise:1,climax:3,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"foil",name:"Job's friends",values:{setup:2,rise:-1,climax:-3,fall:0},interacts:{setup:!1,rise:!1,climax:!0,fall:!0}}],sections:{ki:"Job is introduced as a righteous, prosperous man, blessed with a large family and great wealth \u2014 an unhurried picture of a stable, faithful life.",sho:"That stability is dismantled in escalating stages: Satan's wager with God is followed by the loss of Job's livestock, servants, and all ten children in a single day, then by painful sores covering his body and his own wife urging him to curse God and die, and finally by friends who arrive insisting his suffering must be punishment for some hidden sin.",ten:"Rather than settling the debate about sin and punishment on its own terms, God speaks from a whirlwind \u2014 not explaining Job's suffering at all, but recontextualizing it entirely against the vast, uncomprehending scale of creation itself.",ketsu:"Job's fortunes are eventually restored, and he is left reconciled not because his suffering was ever explained, but because his sense of his own place in the world has been remade."}},{id:"les-miserables-polti-revolt",title:"Les Mis\xE9rables",creator:"Victor Hugo, 1862",appliesToType:"plotType",appliesToId:"polti-revolt",bestStructureId:"story-circle",beats:{setup:"Jean Valjean, an ex-convict, has rebuilt his life, but Inspector Javert is determined to find and punish him.",rise:"Amid growing poverty and injustice in Paris, a group of young revolutionaries plans an uprising.",climax:"The students build a barricade and revolt against the government, most of them dying in the failed uprising.",fall:"Valjean survives, having saved the wounded revolutionary Marius, and finds peace before his death."},characters:[{category:"protagonist",name:"Jean Valjean",values:{setup:1,rise:-1,climax:1,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Inspector Javert",values:{setup:2,rise:1,climax:0,fall:0},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Cosette",values:{setup:0,rise:1,climax:1,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Marius",values:{setup:0,rise:1,climax:-3,fall:2},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Fantine",values:{setup:-2,rise:-3,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}}],sections:{you:"Jean Valjean, an ex-convict, has rebuilt his life as a respected mayor under a false name, comfortably settled into his adopted identity.",need:"Inspector Javert's obsessive suspicion that the mayor is the convict he's hunted for years forces Valjean to reckon with what he owes to the truth and to his own hidden past.",go:"Valjean reveals his true identity to save an innocent man wrongly arrested in his place, then flees the only stable life he's built, taking his ward Cosette with him.",search:"Years later, raising Cosette amid Paris's poverty and injustice, Valjean adapts to a quieter, hidden existence while young revolutionaries around them plan an uprising.",find:"Cosette falls in love with Marius, one of the revolutionaries, giving Valjean a fragile, new kind of family life just as the uprising nears.",take:"The students' barricade revolt fails, and most die; Valjean pays the price of loving Cosette by following the wounded Marius into the fighting and carrying him through the sewers to save him.",return:"Valjean returns from the fighting and from the underworld beneath Paris, having risked everything for the man Cosette loves rather than for himself.",change:"Having spent his life running and finally choosing to give rather than take, Valjean finds peace before his death, changed by the very sacrifice that could have destroyed him."}},{id:"apollo-13-polti-daring-enterprise",title:"Apollo 13",creator:"dir. Ron Howard, 1995",appliesToType:"plotType",appliesToId:"polti-daring-enterprise",bestStructureId:"eight-sequence",beats:{setup:"The Apollo 13 crew launches toward the moon on what should be a routine mission.",rise:"An oxygen tank explosion cripples the spacecraft, forcing an improvised, high-risk plan just to survive.",climax:"The crew and mission control attempt a dangerous engine burn to slingshot them back toward Earth.",fall:"Against the odds, all three astronauts make it home safely."},characters:[{category:"protagonist",name:"Jim Lovell",values:{setup:1,rise:-2,climax:-2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Mission Control",values:{setup:0,rise:-1,climax:1,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Swigert and Haise",values:{setup:1,rise:-2,climax:-2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}}],sections:{"status-quo":"The Apollo 13 crew launches toward the moon on what should be a routine mission \u2014 until an oxygen tank explodes two days in, crippling the spacecraft far from Earth.",predicament:"The moon landing is abandoned outright; the crew and mission control lock onto a single, inescapable goal \u2014 getting the three astronauts home alive.","obstacle-1":"The crew's first real attempt at survival is to improvise the lunar module as a makeshift lifeboat, rationing power, water, and air far past what it was designed for.","stakes-1":"Complications mount as resources dwindle and the improvised lifeboat proves barely adequate for the journey home.",midpoint:"Carbon dioxide levels rise to dangerous levels, forcing an improvised fix built from spare parts and duct tape \u2014 a turn that reshapes the entire plan.","stakes-2":"With the CO2 crisis barely contained, the crew faces a new and worse problem: a precise, dangerous engine burn with no computer to guide it, on a ship never built for the maneuver.",culmination:"The crew executes the burn manually, tension peaking as the ship's survival hinges on a maneuver it was never engineered to perform.",climax:"Re-entry brings a communications blackout longer than expected, leaving mission control unsure if the crew has survived \u2014 until, against the odds, all three astronauts splash down safely and make it home."}},{id:"taken-polti-abduction",title:"Taken",creator:"dir. Pierre Morel, 2008",appliesToType:"plotType",appliesToId:"polti-abduction",bestStructureId:"weiland",beats:{setup:"Bryan Mills' daughter Kim is kidnapped by human traffickers while traveling in Paris.",rise:"Bryan uses his covert-operative skills to track the kidnappers through Europe's criminal underworld.",climax:"He infiltrates the trafficking ring's stronghold in a final, violent confrontation to reach his daughter.",fall:"Bryan rescues Kim and brings her home safely, the ordeal reshaping their relationship."},characters:[{category:"protagonist",name:"Bryan Mills",values:{setup:0,rise:1,climax:2,fall:3},interacts:{setup:!0,rise:!1,climax:!0,fall:!0}},{category:"other",name:"Kim Mills",values:{setup:1,rise:-3,climax:-2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the traffickers",values:{setup:2,rise:2,climax:-1,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"threshold-guardian",name:"the guards",values:{setup:1,rise:1,climax:-2,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}}],sections:{hook:"Bryan Mills, a retired covert operative, struggles to stay close to his teenage daughter Kim, his old skills now dormant in an otherwise ordinary life.",inciting:"Kim is kidnapped by human traffickers minutes after arriving in Paris with a friend \u2014 an event Bryan hears unfold, helplessly, over the phone.","plot-point-1":"Bryan vows to find and kill the men responsible, and flies to Paris immediately, committing fully to the hunt.","pinch-1":"His early interrogations reveal just how vast and brutal the trafficking ring is, a reminder of the power arrayed against one man searching for one girl.",midpoint:"Each new lead brings Bryan closer to Kim, shifting him from a father reacting to an operative actively closing in on the ring \u2014 but the clock is running out before she's sold.","pinch-2":"The threat sharpens further as Bryan learns Kim will be sold at auction, stripping away any margin for delay or caution.","plot-point-3":"Bryan infiltrates the ring's stronghold, fighting through layer after layer of guards, the cost of each one driving his resolve to reach her.",climax:"He reaches the buyer's yacht moments before the auction, killing everyone standing between him and his daughter.",resolution:"Bryan brings Kim home safely, the ordeal reshaping their relationship for good."}},{id:"hound-baskervilles-polti-enigma",title:"The Hound of the Baskervilles",creator:"Arthur Conan Doyle, 1902",appliesToType:"plotType",appliesToId:"polti-enigma",bestStructureId:"frame-narrative",beats:{setup:"Sherlock Holmes is asked to investigate the legend of a supernatural hound linked to a family curse and a suspicious death.",rise:"Watson investigates the moor alone, uncovering escaped convicts and suspicious neighbors while a mysterious hound howls in the night.",climax:"Holmes reveals himself to have been secretly investigating all along, just as the real hound attacks.",fall:"The hound is revealed to be a real dog, disguised to exploit the legend, and the culprit behind it is exposed."},characters:[{category:"protagonist",name:"Sherlock Holmes",values:{setup:1,rise:1,climax:2,fall:3},interacts:{setup:!0,rise:!1,climax:!0,fall:!0}},{category:"ally",name:"Dr. Watson",values:{setup:0,rise:-1,climax:-2,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Sir Henry",values:{setup:0,rise:0,climax:-3,fall:1},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the culprit",values:{setup:1,rise:1,climax:-2,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}}],sections:{"enter-frame":"At Baker Street, Holmes is consulted about an old family legend of a supernatural hound tied to the Baskerville curse and the suspicious death of Sir Charles Baskerville.","frame-setup":"Dr. Mortimer's account of Sir Charles found dead on the moor, his face frozen in terror, gives Holmes his reason to send the new heir, Sir Henry, into the story that's about to unfold.","inner-begins":"Holmes dispatches Watson to guard Sir Henry at Baskerville Hall, and it is Watson's own investigation \u2014 reported back to Holmes \u2014 that becomes the story proper.","inner-develops":"Watson investigates the moor largely alone, uncovering an escaped convict, suspicious neighbors, and a mysterious hidden figure, all while a hound howls in the night.","inner-resolves":"Sir Henry is lured out onto the moor alone, and the hound is set loose on him in the dark, bringing Watson's investigation to its own crisis point.","return-frame":"Holmes reveals he has been secretly investigating from the shadows all along, stepping directly back into the action just as the real hound attacks.","frame-closes":"The hound is exposed as a real dog disguised to exploit the legend, and with the culprit caught, the case folds back into Holmes and Watson's account of it at Baker Street."}},{id:"raiders-polti-obtaining",title:"Raiders of the Lost Ark",creator:"dir. Steven Spielberg, 1981",appliesToType:"plotType",appliesToId:"polti-obtaining",bestStructureId:"three-act",beats:{setup:"Indiana Jones is recruited to find the Ark of the Covenant before the Nazis do.",rise:"He races rivals and Nazi agents across Nepal and Egypt to trace the Ark's hidden location.",climax:"He finds it first, only to have Belloq and the Nazis seize it from him at gunpoint.",fall:"A daring raid lets Indy reclaim the Ark, delivering it to safety despite everything stacked against him."},characters:[{category:"protagonist",name:"Indiana Jones",values:{setup:0,rise:1,climax:-2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Belloq",values:{setup:0,rise:1,climax:3,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"love-interest",name:"Marion Ravenwood",values:{setup:1,rise:0,climax:-2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Sallah",values:{setup:1,rise:1,climax:0,fall:2},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}}],sections:{"status-quo":"Indiana Jones is an archaeology professor with a secret second life as a relic hunter, already skilled in exactly this kind of pursuit.",inciting:"Army intelligence recruits him to find the Ark of the Covenant before Hitler's agents can seize its power for themselves.","plot-point-1":"Indy commits to the hunt, chasing a medallion that marks the Ark's long-hidden resting place.",rising:"He races rival archaeologist Belloq and Nazi agents across Nepal and Egypt, each obstacle forcing him deeper into the search.",midpoint:"He locates the Ark's chamber first, only to have Belloq and the Nazis seize it from him at gunpoint, turning apparent triumph into defeat.","plot-point-2":"Sealed away and left for dead, Indy must find another way to intercept the Ark before it leaves Egypt for good.",climax:"He mounts a daring raid on the Nazi convoy, reclaiming the Ark against every force stacked against him.",resolution:"Indy delivers the Ark to safety, having won it back through persistence and daring rather than force alone."}},{id:"hamlet-polti-enmity-kinsmen",title:"Hamlet",creator:"William Shakespeare, c. 1600",appliesToType:"plotType",appliesToId:"polti-enmity-kinsmen",bestStructureId:"freytag",beats:{setup:"Prince Hamlet's father, the king, has died, and his uncle Claudius has swiftly married Hamlet's mother and taken the throne.",rise:"His father's ghost reveals Claudius murdered him, and Hamlet begins plotting revenge while feigning madness.",climax:"Hamlet's staged play provokes Claudius into revealing his guilt, and the plots between them multiply.",fall:"Nearly the entire royal family dies in the final confrontation, kinsman against kinsman."},characters:[{category:"protagonist",name:"Hamlet",values:{setup:-2,rise:-1,climax:0,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Claudius",values:{setup:2,rise:1,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Polonius",values:{setup:1,rise:1,climax:-3,fall:-3},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}},{category:"foil",name:"Laertes",values:{setup:0,rise:0,climax:-1,fall:-3},interacts:{setup:!1,rise:!1,climax:!1,fall:!0}},{category:"mentor",name:"his father's ghost",values:{setup:0,rise:1,climax:1,fall:0},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}},{category:"other",name:"Gertrude",values:{setup:1,rise:0,climax:-1,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!0}}],sections:{exposition:"Prince Hamlet mourns his father's death at the Danish court while his uncle Claudius has swiftly married Hamlet's mother and taken the throne.","rising-action":"His father's ghost reveals that Claudius murdered him; Hamlet vows revenge, feigns madness, and stages a play to catch Claudius's guilty reaction, which confirms it.",climax:"Hamlet's plotting turns fatal when he accidentally kills Polonius, igniting a web of revenge plots between multiple families, and a poisoned duel is arranged to kill him quietly.","falling-action":"The duel spirals out of Claudius's control as the poisoned blade and a poisoned cup pass between the combatants, drawing in the queen as well.",denouement:"Hamlet, Claudius, the queen, and Laertes all lie dead, kinsman against kinsman, and the Danish throne passes to a foreign prince."}},{id:"king-lear-polti-rivalry-kinsmen",title:"King Lear",creator:"William Shakespeare, c. 1606",appliesToType:"plotType",appliesToId:"polti-rivalry-kinsmen",bestStructureId:"fichtean",beats:{setup:"King Lear divides his kingdom among his three daughters based on how well they flatter him.",rise:"His two elder daughters, having secured their inheritance, turn on Lear and each other for full control.",climax:"Betrayal and rivalry among the sisters spirals into open war and murder within the family.",fall:"Nearly the whole family, including Lear and his loyal youngest daughter Cordelia, dies before the kingdom is restored to order."},characters:[{category:"protagonist",name:"King Lear",values:{setup:2,rise:-2,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Cordelia",values:{setup:-1,rise:-2,climax:1,fall:-3},interacts:{setup:!0,rise:!1,climax:!0,fall:!0}},{category:"antagonist",name:"Goneril",values:{setup:1,rise:2,climax:-1,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Regan",values:{setup:1,rise:1,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"foil",name:"Edmund",values:{setup:1,rise:2,climax:2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}}],sections:{"crisis-1":"King Lear destabilizes his own reign from the outset, dividing his kingdom among his three daughters based on flattery and disowning his honest youngest, Cordelia, on the spot.","crisis-2":"Having secured their inheritance, Goneril and Regan immediately turn on Lear, stripping away his knights and his remaining authority.","crisis-3":"Cast out and humiliated, Lear wanders into a storm, his sanity beginning to fracture under the strain.","crisis-4":"Goneril and Regan's alliance collapses into rivalry over a shared lover, curdling into open war and murder within the family.",climax:"Cordelia returns with an army to save her father, but she is captured and put to death regardless.",resolution:"Lear dies grieving over Cordelia's body, and with nearly the whole family gone, the kingdom is left to be restored to order by the survivors."}},{id:"double-indemnity-polti-murderous-adultery",title:"Double Indemnity",creator:"dir. Billy Wilder, 1944",appliesToType:"plotType",appliesToId:"polti-murderous-adultery",bestStructureId:"weiland",beats:{setup:"Insurance salesman Walter Neff is drawn into an affair with Phyllis Dietrichson, an unhappily married woman.",rise:"Together they plot to murder her husband and collect on a life insurance policy, faking an accident.",climax:"Suspicion from Walter's colleague closes in as the two conspirators begin to turn on each other.",fall:"The scheme collapses in mutual betrayal and violence, exposing the murder they thought was perfect."},characters:[{category:"protagonist",name:"Walter Neff",values:{setup:1,rise:0,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Phyllis Dietrichson",values:{setup:0,rise:1,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Keyes",values:{setup:0,rise:1,climax:2,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}}],sections:{hook:"Walter Neff is introduced as a confident, successful insurance salesman with an eye for an easy angle.",inciting:"He meets Phyllis Dietrichson while renewing her husband's policy, and the two begin an affair.","plot-point-1":"Phyllis proposes they murder her husband for a lucrative accident payout, and Walter commits, helping plan and carry out a staged fall from a train.","pinch-1":"Walter's colleague Keyes, an expert in fraud, starts picking at small inconsistencies in the claim \u2014 a first taste of how sharp he is.",midpoint:"Keyes grows openly suspicious the 'accident' was staged, forcing Walter to actively manage the investigation instead of just waiting it out.","pinch-2":"As Keyes closes in further, cracks appear between Walter and Phyllis, each starting to see the other as a liability.","plot-point-3":"Their mutual distrust reaches a breaking point, and Walter resolves to confront Phyllis directly rather than wait for Keyes to expose them both.",climax:"Walter confronts Phyllis, and the two conspirators shoot each other in the dark.",resolution:"The scheme collapses in mutual betrayal and violence, exposing the murder they thought was perfect."}},{id:"yellow-wallpaper-polti-madness",title:"The Yellow Wallpaper",creator:"Charlotte Perkins Gilman, 1892",appliesToType:"plotType",appliesToId:"polti-madness",bestStructureId:"kishotenketsu",beats:{setup:"A woman is confined to a room by her husband for a 'rest cure,' forbidden from working or writing.",rise:"Isolated and unstimulated, she becomes fixated on the room's strange yellow wallpaper.",climax:"She becomes convinced a woman is trapped behind the wallpaper's pattern, trying to break free.",fall:"She descends fully into madness, tearing at the wallpaper convinced she has freed the woman within \u2014 who is herself."},characters:[{category:"protagonist",name:"the narrator",values:{setup:-1,rise:-2,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!0}},{category:"antagonist",name:"her husband",values:{setup:1,rise:1,climax:1,fall:0},interacts:{setup:!0,rise:!0,climax:!1,fall:!0}}],sections:{ki:"A woman is confined by her physician husband to a single room for a 'rest cure,' forbidden from working or writing, left largely alone with the room's strange yellow wallpaper.",sho:"Isolated and unstimulated, she becomes increasingly fixated on the paper's pattern, secretly writing about it and starting to see a shifting shape moving within it.",ten:"The shifting shape resolves into a woman she believes is trapped behind the pattern, struggling to escape \u2014 an unexpected figure that recontextualizes everything she's been staring at.",ketsu:"She tears at the wallpaper to free the trapped woman, descending fully into madness as the freed woman is revealed to be herself."}},{id:"frankenstein-polti-fatal-imprudence",title:"Frankenstein",creator:"Mary Shelley, 1818",appliesToType:"plotType",appliesToId:"polti-fatal-imprudence",bestStructureId:"seven-point",beats:{setup:"Victor Frankenstein becomes obsessed with discovering the secret of creating life.",rise:"He builds a creature from dead tissue without ever considering what he'll do once it's alive.",climax:"Horrified by what he's made, he abandons it \u2014 a careless decision that turns the creature toward vengeance.",fall:"Victor's failure to think through the consequences of his experiment costs him everyone he loves."},characters:[{category:"protagonist",name:"Victor Frankenstein",values:{setup:1,rise:0,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"foil",name:"the creature",values:{setup:0,rise:-2,climax:1,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Elizabeth",values:{setup:1,rise:0,climax:-1,fall:-3},interacts:{setup:!0,rise:!1,climax:!0,fall:!0}}],sections:{hook:"Victor Frankenstein is introduced as a brilliant, driven student of natural philosophy \u2014 a sharp contrast to the ruined man his obsession will make of him.","plot-turn-1":"His fixation on discovering the secret of animating dead tissue leads him to secretly assemble a creature and bring it to life.","pinch-1":"Horrified the instant it wakes, Victor abandons it; rejected by everyone it meets, the creature teaches itself language and grows to hate the man who made it.",midpoint:"The creature confronts Victor and demands a companion in exchange for peace, forcing Victor from passive horror into active bargaining with what he's created.","pinch-2":"The creature begins murdering those closest to Victor one by one, and when Victor destroys the female companion he had started building, the creature vows revenge.","plot-turn-2":"The creature swears he'll be with Victor on his wedding night, giving Victor the last, terrible piece of information he needs \u2014 that he must now hunt or be hunted.",resolution:"Victor's failure to think through the consequences of his experiment costs him everyone he loves, and he dies chasing the creature across the Arctic ice."}},{id:"oedipus-polti-involuntary-crimes-love",title:"Oedipus Rex",creator:"Sophocles, c. 429 BCE",appliesToType:"plotType",appliesToId:"polti-involuntary-crimes-love",bestStructureId:"todorov",beats:{setup:"Oedipus, raised far from his birth parents, is unaware of a prophecy that he will kill his father and marry his mother.",rise:"Fleeing what he believes is his fate, Oedipus unknowingly kills a stranger on the road and later marries the widowed queen.",climax:"A plague on the city drives Oedipus to investigate its cause, uncovering the truth of what he's done.",fall:"Oedipus realizes the stranger was his father and the queen his mother \u2014 the love that undid him was never a knowing crime."},characters:[{category:"protagonist",name:"Oedipus",values:{setup:1,rise:1,climax:-1,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Jocasta",values:{setup:0,rise:1,climax:-1,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"other",name:"King Laius",values:{setup:1,rise:-3,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}},{category:"threshold-guardian",name:"the Sphinx",values:{setup:2,rise:-3,climax:0,fall:0},interacts:{setup:!1,rise:!0,climax:!1,fall:!1}}],sections:{equilibrium:"Oedipus rules Thebes as a respected king, married to the widowed queen Jocasta, believing he long ago escaped the prophecy that he'd kill his father and marry his mother.",disruption:"A plague strikes Thebes, and an oracle declares it will lift only once the old king Laius's unpunished murderer is found.",recognition:"Oedipus takes the crisis as his own responsibility as king and vows publicly to uncover and punish the murderer, unaware he is hunting himself.",repair:"He investigates relentlessly, questioning witnesses and piecing together the identity of the stranger he once killed on the road to Thebes.","new-equilibrium":"The truth surfaces \u2014 the stranger was his father and Jocasta his mother \u2014 and Thebes settles into a new, tragic order as Jocasta takes her own life and Oedipus blinds himself."}},{id:"oedipus-polti-slaying-kinsman",title:"Oedipus Rex",creator:"Sophocles, c. 429 BCE",appliesToType:"plotType",appliesToId:"polti-slaying-kinsman-unrecognized",bestStructur e chooses, and a guard tears one child from her arms.",resolution:"She survives the war physically, but the choice she was forced to make haunts and ultimately destroys her."}},{id:"rocky-polti-rivalry-superior-inferior",title:"Rocky",creator:"dir. John G. Avildsen, 1976",appliesToType:"plotType",appliesToId:"polti-rivalry-superior-inferior",bestStructureId:"story-circle",beats:{setup:"Rocky Balboa is a small-time club boxer given a shot at the reigning heavyweight champion, Apollo Creed.",rise:"Vastly outmatched on paper, Rocky trains obsessively to have any chance at all.",climax:"The two finally meet in the ring, Rocky's grit tested against Creed's superior skill.",fall:"Rocky loses the decision but goes the distance \u2014 the assumed hierarchy between them shaken, if not overturned."},characters:[{category:"protagonist",name:"Rocky Balboa",values:{setup:-2,rise:0,climax:1,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Apollo Creed",values:{setup:3,rise:2,climax:0,fall:1},interacts:{setup:!1,rise:!1,climax:!0,fall:!1}},{category:"love-interest",name:"Adrian",values:{setup:-2,rise:1,climax:1,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"mentor",name:"Mickey",values:{setup:-1,rise:2,climax:1,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}}],sections:{you:"Rocky Balboa is a small-time club boxer, unranked and unnoticed outside his own neighborhood.",need:"He needs a real shot to prove he's more than a nobody, something his neighborhood-gym life can't give him.",go:"Heavyweight champion Apollo Creed picks him for a title shot, mostly as a publicity gimmick, thrusting him into a world far above his level.",search:"Vastly outmatched on paper, Rocky trains obsessively, adapting himself to a level of competition he's never faced.",find:"Fight night arrives, and the city and press treat the outcome as a foregone conclusion, Creed's superiority taken for granted.",take:"Rocky pays for his shot in punishment  her completely, while Vronsky faces almost none of the same consequence.","falling-action":"Isolated by scandal and increasingly paranoid that she is losing Vronsky's love, Anna spirals into despair, and a final quarrel between them convinces her she has nothing left to hold onto.",denouement:"Unable to see any way out of her isolation, Anna takes her own life, the only escape she can imagine from a world that has closed every other door."}},{id:"carmen-polti-crimes-of-love",title:"Carmen",creator:"Georges Bizet (opera), 1875",appliesToType:"plotType",appliesToId:"polti-crimes-of-love",bestStructureId:"fichtean",beats:{setup:"Don Jos\xE9, a soldier, becomes infatuated with the free-spirited Carmen and abandons his post for her.",rise:"His obsession leads him to desert the army and turn to smuggling to stay near her.",climax:"Carmen loses interest in Jos\xE9 and turns her attention to a bullfighter, provoking Jos\xE9's jealous rage.",fall:"Jos\xE9 kills Carmen rather than let her go, a crime born entirely from a love he couldn't control."},characters:[{category:"protagonist",name:"Don Jos\xE9",values:{setup:1,rise:-1,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Carmen",values:{setup:1,rise:0,climax:1,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"foil",name:"the bullfighter",values:{setup:1,rise:2,climax:3,fall:3},interacts:{setup:!1,rise:!1,climax:!0,fall:!1}}],sections:{"crisis-1":"Don Jos\xE9, a disciplined soldier, is thrown into crisis the moment the free-spirited Carmen deliberately draws his attention and provokes him into letting her escape arrest \u2014 an act that gets him jailed.","crisis-2":"Released from jail, he abandons his post and his fianc\xE9e entirely to stay near Carmen, drifting into smuggling just to remain part of her world.","crisis-3":"Carmen's affections begin to cool as Jos\xE9's devotion curdles into jealous possessiveness, straining the relationship he has already sacrificed everything for.","crisis-4":"Carmen turns her attention openly to a celebrated bullfighter, flaunting the new romance and provoking Jos\xE9's jealous rage to its breaking point.",climax:"Outside the bullring, Jos\xE9 begs her one last time to give up the bullfighter and return to him, and Carmen flatly refuses, choosing her freedom over his claim on her.",resolution:"Rather than let her go, Jos\xE9 kills Carmen on the spot \u2014 a crime born entirely from a love he could never control."}},{id:"othello-polti-discovery-dishonor",title:"Othello",creator:"William Shakespeare, c. 1603",appliesToType:"plotType",appliesToId:"polti-discovery-dishonor-loved-one",bestStructureId:"weiland",beats:{setup:"Othello, a respected general, marries Desdemona, whom he loves deeply and trusts completely.",rise:"His ensign Iago plants seeds of doubt, fabricating evidence that Desdemona has been unfaithful.",climax:"Othello becomes convinced of Desdemona's betrayal, his trust in her collapsing entirely.",fall:"Othello kills Desdemona, only to learn moments later that Iago's evidence was a complete fabrication."},characters:[{category:"protagonist",name:"Othello",values:{setup:2,rise:-1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Desdemona",values:{setup:2,rise:-1,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Iago",values:{setup:0,rise:2,climax:3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Cassio",values:{setup:0,rise:1,climax:-2,fall:1},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"other",name:"Emilia",values:{setup:0,rise:0,climax:-1,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!0}}],sections:{hook:"Othello, a respected general, marries Desdemona in secret, and their story opens on a marriage built on complete mutual trust.",inciting:"His ensign Iago, resentful over a denied promotion, resolves in private to destroy that marriage entirely.","plot-point-1":"Othello commits fully to trusting his household and his new wife, unaware that Iago has already begun plotting against him from the inside.","pinch-1":"Iago plants the first seeds of doubt, hinting that Desdemona has been unfaithful with the officer Cassio \u2014 a quiet demonstration of how much damage he can do.",midpoint:"Othello's trust visibly cracks as Iago fabricates hard evidence, a misplaced handkerchief, turning suspicion from a whisper into something Othello believes he can act on.","pinch-2":"Iago tightens the trap further, staging scenes and half-overheard conversations that let Othello's jealousy fill in the worst possible conclusions himself.","plot-point-3":"Convinced entirely by Iago's lies, Othello reaches his lowest point and resolves that Desdemona must die for her supposed dishonor.",climax:"He confronts her in their bedchamber and smothers her, refusing to believe her desperate denials.",resolution:"Moments later Othello learns that Iago's evidence was a complete fabrication, and, undone by grief and horror, takes his own life."}},{id:"romeo-juliet-polti-obstacles-love",title:"Romeo and Juliet",creator:"William Shakespeare, c. 1595",appliesToType:"plotType",appliesToId:"polti-obstacles-love",bestStructureId:"seven-point",beats:{setup:"Romeo and Juliet fall in love, only to learn their families are bitter, sworn enemies.",rise:"They marry in secret, but the feud keeps finding new ways to force them apart.",climax:"Romeo's exile after a fatal duel puts the final, seemingly insurmountable obstacle between them.",fall:"A plan to reunite them fails to reach Romeo in time, and the obstacle proves fatal to them both."},characters:[{category:"protagonist",name:"Romeo",values:{setup:1,rise:1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Juliet",values:{setup:1,rise:1,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Mercutio",values:{setup:1,rise:2,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}},{category:"antagonist",name:"Tybalt",values:{setup:0,rise:1,climax:-3,fall:-3},interacts:{setup:!1,rise:!0,climax:!1,fall:!1}},{category:"mentor",name:"the friar",values:{setup:0,rise:1,climax:-1,fall:-2},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}}],sections:{hook:"Verona is split by a bitter, generations-old feud between the Montagues and Capulets \u2014 the very opposite of the reconciliation the story will eventually cost two lives to reach.","plot-turn-1":"Romeo and Juliet fall for each other at a masked party, only to learn afterward which warring family the other belongs to.","pinch-1":"The feud's danger is made real when a street brawl turns fatal, with Tybalt killing Romeo's friend Mercutio in front of him.",midpoint:"Rather than stay passive, Romeo kills Tybalt in retaliation, moving the lovers from secret happiness into active, irreversible danger.","pinch-2":"Romeo is banished from Verona for the killing, and the secret marriage he shares with Juliet becomes nearly impossible to sustain or protect.","plot-turn-2":"Friar Laurence devises a desperate plan \u2014 faking Juliet's death \u2014 to reunite the couple and finally end the feud's hold over them.",resolution:"The message meant to warn Romeo of the plan never reaches him in time, and the obstacle that has hounded the lovers throughout proves fatal to them both."}},{id:"romeo-juliet-polti-enemy-loved",title:"Romeo and Juliet",creator:"William Shakespeare, c. 1595",appliesToType:"plotType",appliesToId:"polti-enemy-loved",bestStructureId:"todorov",beats:{setup:"Juliet discovers at the ball that the boy she's fallen for, Romeo, is a Montague \u2014 her family's sworn enemy.",rise:"She chooses him anyway, secretly marrying him despite everything her family stands against.",climax:"Romeo's killing of her cousin Tybalt forces Juliet to choose openly between her family's hatred and her love.",fall:"She stays loyal to Romeo to the end, her love for the 'enemy' outlasting even her own life."},characters:[{category:"protagonist",name:"Juliet",values:{setup:0,rise:1,climax:-1,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Romeo",values:{setup:1,rise:1,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Tybalt",values:{setup:0,rise:1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}},{category:"mentor",name:"the friar",values:{setup:0,rise:1,climax:-1,fall:-2},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}}],sections:{equilibrium:"Juliet lives as a dutiful Capulet daughter, expected to marry well and uphold her family's standing and its long enmity with the Montagues.",disruption:"At a party she falls for a masked stranger, only to discover afterward that he is Romeo \u2014 a Montague, her family's sworn enemy.",recognition:"Rather than reject him, Juliet recognizes what she wants and chooses him anyway, marrying him in secret while her family's hatred of the Montagues continues undimmed around her.",repair:"She tries to hold both worlds together \u2014 hiding the marriage, staying loyal even after Romeo kills her cousin Tybalt, and resisting her parents' attempt to force her into marrying someone else entirely.","new-equilibrium":'Juliet stays loyal to Romeo to the very end, her love for the "enemy" outlasting even her own life and reshaping, in death, the equilibrium her family once demanded of her.'}},{id:"macbeth-polti-ambition",title:"Macbeth",creator:"William Shakespeare, c. 1606",appliesToType:"plotType",appliesToId:"polti-ambition",bestStructureId:"eight-sequence",beats:{setup:"Macbeth, a loyal general, is told by three witches that he is destined to become king.",rise:"Ambition, fed by his wife, pushes him to murder King Duncan and seize the throne.",climax:"He murders more and more to protect his stolen crown, his ambition consuming everyone around him.",fall:"His ambition finally collapses under rebellion, and he is killed by the men he wronged to get there."},characters:[{category:"protagonist",name:"Macbeth",values:{setup:1,rise:1,climax:-1,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Lady Macbeth",values:{setup:1,rise:2,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}},{category:"ally",name:"Banquo",values:{setup:1,rise:1,climax:-3,fall:-3},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}},{category:"antagonist",name:"Macduff",values:{setup:0,rise:-1,climax:1,fall:3},interacts:{setup:!1,rise:!1,climax:!1,fall:!0}},{category:"other",name:"the witches",values:{setup:2,rise:1,climax:1,fall:-1},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}},{category:"other",name:"King Duncan",values:{setup:2,rise:-3,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}}],sections:{"status-quo":"Macbeth is a loyal general, celebrated for his courage on the battlefield \u2014 until three witches greet him with a prophecy that he is destined to become king.",predicament:"The prophecy locks a seed of ambition into him that he can no longer walk away from, especially once his wife seizes on it as a plan of action.","obstacle-1":"Fed by his wife's ambition as much as his own, Macbeth murders King Duncan in his sleep to seize the throne the prophecy promised him.","stakes-1":"He takes the crown, but guilt and suspicion begin closing in on him almost immediately, and the prophecy's other promises \u2014 made to Banquo's line \u2014 now threaten him.",midpoint:"Macbeth has his friend Banquo murdered, convinced that holding the crown now demands more blood rather than less.","stakes-2":"Increasingly paranoid, he escalates further still, ordering the slaughter of Macduff's entire family to eliminate any remaining threat to his rule.",culmination:"His butchery turns the nobles of Scotland against him, and rebellion gathers at his gates, converging on his castle for a final reckoning.",climax:"Macduff kills him in single combat, exempt from the old prophecy's protection, and Macbeth's ambition collapses under the rebellion it provoked."}},{id:"prometheus-polti-conflict-with-god",title:"Prometheus (Greek myth)",creator:"traditional myth",appliesToType:"plotType",appliesToId:"polti-conflict-with-god",bestStructureId:"todorov",beats:{setup:"Prometheus, a Titan, sees humanity struggling in cold darkness without fire.",rise:"Defying Zeus's explicit will, he steals fire from the gods and gives it to humankind.",climax:"Zeus punishes Prometheus by chaining him to a rock, where an eagle eats his regenerating liver each day.",fall:"Prometheus endures his eternal punishment, humanity's gift of fire an irreversible act of defiance against the gods."},characters:[{category:"protagonist",name:"Prometheus",values:{setup:0,rise:1,climax:-3,fall:-2},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"Zeus",values:{setup:2,rise:-1,climax:3,fall:3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}}],sections:{equilibrium:"Prometheus, a Titan, watches humanity struggle in cold darkness, living without fire or craft under the settled order of Zeus's rule.",disruption:"Defying Zeus's explicit command that mortals be kept fireless and weak, Prometheus steals fire from Olympus and gives it to humankind.",recognition:"Zeus discovers the theft and, with fire already spreading tools, warmth and civilization among mortals, recognizes that Prometheus's defiance cannot be undone.",repair:"Zeus's response to the breach is not mercy but punishment \u2014 he has Prometheus chained to a remote rock in a judgment meant to last forever.","new-equilibrium":"An eagle arrives each day to devour Prometheus's regenerating liver, and he endures this eternal torment as the permanent, unchangeable price of humanity's irreversible gift."}},{id:"othello-polti-mistaken-jealousy",title:"Othello",creator:"William Shakespeare, c. 1603",appliesToType:"plotType",appliesToId:"polti-mistaken-jealousy",bestStructureId:"freytag",beats:{setup:"Othello trusts his wife Desdemona completely as their marriage begins.",rise:"Iago manufactures false evidence \u2014 a misplaced handkerchief \u2014 to convince Othello of an affair that never happened.",climax:"Othello's jealousy, entirely built on lies, drives him to violence against the wife he loves.",fall:"Only after killing Desdemona does Othello learn the truth, and take his own life in grief and horror."},characters:[{category:"protagonist",name:"Othello",values:{setup:2,rise:-1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Desdemona",values:{setup:2,rise:-1,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Iago",values:{setup:0,rise:2,climax:3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Cassio",values:{setup:0,rise:1,climax:-2,fall:1},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"other",name:"Emilia",values:{setup:0,rise:0,climax:-1,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!0}}],sections:{exposition:"Othello and Desdemona begin their marriage in complete mutual trust, while Iago, resentful over a denied promotion, quietly resolves to destroy that trust.","rising-action":"Iago manufactures a single piece of false evidence \u2014 a handkerchief planted in Cassio's room \u2014 and stages a conversation for Othello to half-overhear, letting his jealousy grow despite there being no real proof at all.",climax:"Othello's jealousy, entirely built on lies he was never meant to fully understand, hardens into a resolve to kill the wife he loves, and he smothers Desdemona in their bed despite her desperate denials.","falling-action":"Only after her death does the truth surface \u2014 Iago's evidence was a complete fabrication from the start, and everything Othello believed collapses at once.",denouement:"Undone by grief and horror at what his mistaken jealousy drove him to do, Othello takes his own life beside her."}},{id:"crucible-polti-erroneous-judgment",title:"The Crucible",creator:"Arthur Miller, 1953",appliesToType:"plotType",appliesToId:"polti-erroneous-judgment",bestStructureId:"fichtean",beats:{setup:"A group of girls in Salem, caught dancing in the woods, accuse others of witchcraft to protect themselves.",rise:"The town's courts, eager to believe the accusations, condemn more and more innocent people based on false testimony.",climax:"John Proctor, trying to expose the girls' lies, is himself accused and arrested.",fall:"Proctor is executed rather than falsely confess, a victim of a judgment built entirely on deception."},characters:[{category:"protagonist",name:"John Proctor",values:{setup:0,rise:-1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the girls",values:{setup:1,rise:2,climax:1,fall:-1},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"Abigail Williams",values:{setup:1,rise:2,climax:1,fall:-1},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"other",name:"Elizabeth Proctor",values:{setup:0,rise:-1,climax:-2,fall:1},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}}],sections:{"crisis-1":"The story opens already in crisis: a group of girls in Salem, caught dancing in the woods, save themselves by claiming they were compelled by witchcraft and begin naming names.","crisis-2":"The town's courts, eager to believe them, open formal proceedings, and testimony and coerced confessions rapidly condemn more and more innocent people.","crisis-3":"John Proctor, aware the girls are lying, faces a crisis of his own \u2014 he cannot expose them without revealing the affair that would destroy his marriage and reputation.","crisis-4":"He finally accuses the girls publicly, only for the court's suspicion to turn on him instead, and he finds himself arrested alongside the people he was trying to save.",climax:"Proctor is offered his life on the condition that he falsely confess to witchcraft himself.",resolution:"He refuses to lie even to save himself, and is executed \u2014 a victim of a judgment built entirely on deception."}},{id:"crime-punishment-polti-remorse",title:"Crime and Punishment",creator:"Fyodor Dostoevsky, 1866",appliesToType:"plotType",appliesToId:"polti-remorse",bestStructureId:"story-circle",beats:{setup:"Raskolnikov, a poor former student, murders a pawnbroker, convincing himself he's above ordinary morality.",rise:"Guilt and paranoia consume him even as the police fail to connect him to the crime.",climax:"His remorse grows unbearable, driving him toward confession despite having nearly gotten away with it.",fall:"Raskolnikov confesses and accepts his punishment, finding a path toward redemption through suffering."},characters:[{category:"protagonist",name:"Raskolnikov",values:{setup:-1,rise:-2,climax:-1,fall:1},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Sonya",values:{setup:0,rise:0,climax:2,fall:1},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the police investigator",values:{setup:1,rise:1,climax:2,fall:2},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}}],sections:{you:"Raskolnikov, a poor former student, lives in isolation in St. Petersburg, nursing a theory that some extraordinary people stand above ordinary morality.",need:"He needs to prove that theory true of himself \u2014 to know whether he is one of history's great men or an ordinary one bound by common rules.",go:"He crosses into that unfamiliar territory by murdering an elderly pawnbroker to test the theory, killing her sister as well when she stumbles onto the scene.",search:"He escapes undetected and searches for a way to live with what he's done, even as guilt and paranoia consume him and a police investigator begins circling him without proof.",find:"For a time he finds exactly what he sought \u2014 he gets away with the crime, technically proving his theory whether or not he can bear it.",take:"The price is unbearable: his remorse grows past what he can carry, and it drives him inexorably toward confession despite having nearly escaped entirely.",return:"He returns to the human world he had tried to place himself above, confessing first to Sonya, the one person who has shown him unconditional compassion, and then to the police.",change:"Now capable of real change, Raskolnikov accepts his punishment, finding in the suffering he once thought himself exempt from an actual path toward redemption."}},{id:"odyssey-polti-recovery-lost-one",title:"The Odyssey",creator:"Homer, c. 8th century BCE",appliesToType:"plotType",appliesToId:"polti-recovery-lost-one",bestStructureId:"hero-journey",beats:{setup:"Odysseus has been gone from home for twenty years, presumed dead by most who knew him.",rise:"His wife Penelope fends off suitors while his son Telemachus searches for news of his father.",climax:"Odysseus finally reaches Ithaca in disguise, testing who around him has stayed loyal.",fall:"He reveals himself to Penelope and Telemachus, reunited with the family he never stopped trying to reach."},characters:[{category:"protagonist",name:"Odysseus",values:{setup:-1,rise:0,climax:1,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Penelope",values:{setup:-1,rise:-1,climax:0,fall:3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Telemachus",values:{setup:0,rise:-1,climax:1,fall:3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the suitors",values:{setup:2,rise:2,climax:-1,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}},{category:"mentor",name:"Athena",values:{setup:2,rise:2,climax:3,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}}],sections:{"ordinary-world":"Twenty years earlier, Odysseus's home in Ithaca was a stable household with him as its king \u2014 the world Penelope and Telemachus have been left to hold together in his long absence, presumed by most to be permanent.",call:"The gods finally grant Odysseus permission to leave Calypso's island and resume the long journey home he has been kept from for years.",refusal:"He has already spent years detained along the way, drawn to stay on Calypso's island rather than press onward, delaying the return he still hasn't completed.",mentor:"Divine favor continues to guide and protect him from afar, just as it guides Telemachus's own search for news of his father back in Ithaca.",threshold:"Odysseus finally sets out from Calypso's island on a makeshift raft, committing fully to the sea crossing that will bring him home.","tests-allies":"At home, Penelope fends off a household of aggressive suitors while Telemachus travels abroad seeking any word of his father \u2014 both tested in their loyalty to a man who might never return.",approach:"Odysseus reaches the shores of Ithaca at last, disguising himself as a beggar so he can approach his own home without being killed on sight by the suitors occupying it.",ordeal:"In disguise, he endures insult and abuse in his own hall, gathering the nerve and information he needs before revealing himself to anyone.",reward:"He reveals himself first to his son Telemachus, and together they begin plotting how to reclaim the household \u2014 a reunion earned only after enduring the disguise.","road-back":"Father and son test which of the household's servants and suitors have stayed loyal, preparing the final confrontation Odysseus has been building toward since he landed.",resurrection:"Stringing his old bow, a feat none of the suitors can manage, Odysseus casts off his disguise and slaughters the suitors who have occupied his home for years.",elixir:"He reveals himself fully to Penelope and Telemachus, reunited at last with the family he never stopped trying to reach \u2014 bringing home, after twenty years, proof that he survived."}},{id:"bambi-polti-loss-loved-ones",title:"Bambi",creator:"Disney, dir. David Hand, 1942",appliesToType:"plotType",appliesToId:"polti-loss-loved-ones",bestStructureId:"pixar-spine",beats:{setup:"Bambi, a young deer, grows up under his mother's protection in the forest.",rise:"Hunters begin appearing in the forest, and the animals live under constant threat.",climax:"Bambi's mother is killed by a hunter while fleeing with him across a meadow.",fall:"Bambi grows up without her, eventually becoming a father himself, carrying her loss into his own life."},characters:[{category:"protagonist",name:"Bambi",values:{setup:1,rise:0,climax:-3,fall:1},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Bambi's mother",values:{setup:1,rise:1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"the hunters",values:{setup:1,rise:2,climax:3,fall:1},interacts:{setup:!1,rise:!1,climax:!0,fall:!1}},{category:"mentor",name:"Bambi's father",values:{setup:0,rise:0,climax:-1,fall:1},interacts:{setup:!1,rise:!1,climax:!0,fall:!0}},{category:"ally",name:"Thumper",values:{setup:1,rise:1,climax:0,fall:2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Faline",values:{setup:0,rise:1,climax:-1,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}}],sections:{"once-upon":"Bambi is a young deer growing up under his mother's watchful protection in the forest.","every-day":"Life follows the rhythm of the seasons \u2014 his mother teaching him to freeze and flee at the first sign of danger, the forest gradually widening into his whole world.","until-one-day":"Hunters begin appearing in the forest, and the animals start living under a constant, quiet threat that changes everything about how they move through their home.","because-1":"Because the danger keeps growing, a hunt eventually drives the animals into open panic, scattering the herd across an exposed meadow.","because-2":"Because of that panic, Bambi's mother is shot while fleeing across the meadow at his side, and he is left alone in the chaos.","until-finally":"Bambi searches for her afterward, until his father finally tells him the truth \u2014 that she won't be coming back.","ever-since":"Bambi grows up without her, eventually becoming a father himself, carrying her loss forward into the world he now protects in turn."}},{id:"wizard-of-oz-vonnegut-man-in-hole",title:"The Wizard of Oz",creator:"dir. Victor Fleming, 1939",appliesToType:"plotType",appliesToId:"vonnegut-man-in-hole",bestStructureId:"todorov",beats:{setup:"Dorothy lives an ordinary life on a Kansas farm.",rise:"A tornado sweeps her into the strange, dangerous land of Oz, far from home and everyone she knows.",climax:"She and her friends face the Wicked Witch at her most dangerous, deep into unfamiliar territory.",fall:"Dorothy defeats the witch, gets her wish granted, and returns home valuing it more than she ever did before."},characters:[{category:"protagonist",name:"Dorothy",values:{setup:0,rise:-2,climax:-3,fall:3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the Wicked Witch of the West",values:{setup:0,rise:1,climax:3,fall:-3},interacts:{setup:!1,rise:!1,climax:!0,fall:!1}},{category:"ally",name:"the Scarecrow",values:{setup:0,rise:1,climax:-1,fall:2},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"the Tin Man",values:{setup:0,rise:1,climax:-2,fall:2},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"the Lion",values:{setup:-1,rise:0,climax:-2,fall:3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"mentor",name:"the Wizard",values:{setup:1,rise:1,climax:-1,fall:1},interacts:{setup:!1,rise:!0,climax:!1,fall:!0}}],sections:{equilibrium:"Dorothy lives an ordinary, restless life on a Kansas farm.",disruption:"A tornado sweeps her and her house into the strange, unfamiliar land of Oz, and a falling house kills the Wicked Witch of the East.",recognition:"Realizing she must find a way home, Dorothy sets off down the yellow brick road, gathering companions \u2014 a Scarecrow, Tin Man, and Lion \u2014 each searching for something they believe they lack.",repair:"They reach the Emerald City and undertake a dangerous errand for the Wizard, which leads to the Wicked Witch of the West capturing Dorothy before she and her friends finally defeat the witch with a bucket of water.","new-equilibrium":"Dorothy gets her wish granted and returns home to Kansas, valuing it more than she ever did before."}},{id:"when-harry-met-sally-vonnegut-boy-meets-girl",title:"When Harry Met Sally...",creator:"dir. Rob Reiner, 1989",appliesToType:"plotType",appliesToId:"vonnegut-boy-meets-girl",bestStructureId:"story-circle",beats:{setup:"Harry and Sally meet and instantly clash over whether men and women can ever just be friends.",rise:"Over years of crossing paths, their friendship deepens even as romantic complications keep them apart.",climax:"A moment of vulnerability threatens to end their friendship entirely just as feelings become undeniable.",fall:"They finally admit they're in love and end up together, closer than they'd have been without the wait."},characters:[{category:"protagonist",name:"Harry",values:{setup:0,rise:1,climax:-2,fall:3},interacts:{setup:!0,rise:!0,climax:!1,fall:!0}},{category:"love-interest",name:"Sally",values:{setup:0,rise:1,climax:-1,fall:3},interacts:{setup:!0,rise:!0,climax:!1,fall:!0}}],sections:{you:"Harry and Sally share a long car ride from Chicago to New York as near-strangers, each set in their own view of men and women.",need:"They clash the entire drive over whether men and women can ever really just be friends, revealing what each secretly wants from the other.",go:"They part on bad terms certain they'll never cross paths again, but chance keeps throwing them back together over the years.",search:"An unlikely friendship slowly takes root as they adapt to each other's lives, becoming each other's confidants through the ordinary business of being single in New York.",find:"That friendship deepens further after they each go through painful breakups and lean on each other for comfort.",take:"A night of vulnerability leads them to sleep together, and the price is steep \u2014 the friendship nearly collapses under the weight of it.",return:"Sally, hurt and confused, pushes Harry away and they retreat to careful distance, just as his own feelings finally become undeniable to him.",change:"He races to tell her he loves her, and they end up together, closer than they'd ever have been without the wait."}},{id:"cinderella-vonnegut-cinderella",title:"Cinderella",creator:"traditional folk tale",appliesToType:"plotType",appliesToId:"vonnegut-cinderella",bestStructureId:"propp-31",beats:{setup:"Cinderella is overworked and mistreated by her stepmother and stepsisters, denied any life of her own.",rise:"With her fairy godmother's help, she attends the royal ball and catches the Prince's attention \u2014 then flees at midnight, losing a glass slipper.",climax:"The Prince's search for the slipper's owner puts Cinderella's fate in the hands of a single, decisive test.",fall:"The slipper fits; Cinderella marries the Prince, her worth finally recognized beyond her circumstances."},characters:[{category:"protagonist",name:"Cinderella",values:{setup:-3,rise:1,climax:-1,fall:3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"the Prince",values:{setup:0,rise:2,climax:0,fall:3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"mentor",name:"the fairy godmother",values:{setup:0,rise:3,climax:0,fall:0},interacts:{setup:!1,rise:!0,climax:!1,fall:!1}},{category:"antagonist",name:"the stepmother",values:{setup:2,rise:1,climax:1,fall:-3},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}},{category:"foil",name:"the stepsisters",values:{setup:1,rise:0,climax:-1,fall:-2},interacts:{setup:!0,rise:!1,climax:!0,fall:!1}}],sections:{absentation:"With her mother gone and her father absent or indifferent, Cinderella is left unprotected in her own home.",interdiction:"An invitation arrives to a royal ball, and her stepmother and stepsisters forbid her from going.",violation:"Cinderella still means to find a way to attend despite the forbidding, refusing to simply give up her hope of going.",reconnaissance:"Her stepmother watches her wistful hopes for the ball, sizing up exactly what it would take to keep her home.",delivery:"Seeing how badly Cinderella wants to go, the stepmother learns precisely what to withhold to keep control over her.",trickery:"The stepfamily piles on impossible chores and empty promises, dangling the ball as a reward Cinderella can never actually earn.",complicity:"Worn down and out of options, Cinderella accepts their terms and resigns herself to staying behind in tears.","villainy-lack":"The real harm lands: with no dress, no coach, and no permission, she is left with nothing but the ashes of her hope of attending.",mediation:"Her fairy godmother appears, having sensed her despair, and resolves to act on her behalf.",counteraction:"Cinderella agrees to her godmother's help, deciding after all to try for the ball.",departure:"Transformed and gowned, she departs the house in a coach conjured from a pumpkin, bound for the palace.","donor-first":"The fairy godmother tests what's on hand \u2014 a pumpkin, mice, a lizard \u2014 weighing what she can transform for the girl in front of her.","hero-reaction":"Cinderella marvels at the transformation and accepts her godmother's one condition: she must return before the stroke of midnight.","magical-agent":"She receives her enchanted gown, glass slippers, and a coach and footmen conjured from the pumpkin and mice.",guidance:"The coach carries her straight to the palace, where the ball \u2014 and the Prince \u2014 are waiting.",struggle:"At the ball she draws the Prince's full attention all night, quietly outshining the very stepsisters who hoped to claim it.",branding:"She flees at the stroke of midnight, leaving behind a single glass slipper as the mark by which she'll later be known.",victory:"She has already won the night that mattered most: the Prince was drawn to her, not to anyone her stepfamily put forward.",liquidation:"The lack that defined her \u2014 invisible, unworthy, overlooked \u2014 is undone the moment she is truly seen and wanted for herself.",return:"As the spell breaks, Cinderella dashes from the palace and hurries home before midnight fully arrives.",pursuit:"The Prince's men give chase down the palace steps, trying to catch the girl who vanished so suddenly.",rescue:"She slips away in the confusion as the coach and gown revert to pumpkin and rags just in time.",unrecognized:"Cinderella returns to the house unnoticed, mistaken again for nothing more than the household's overworked servant.",unfounded:"Her stepsisters each insist the mysterious girl from the ball was practically theirs, certain the Prince's attention belongs to one of them.","difficult-task":"The Prince declares that every maiden in the kingdom must try on the glass slipper left behind, until its true owner is found.",solution:"The search reaches Cinderella's house, where her stepsisters try and fail to force their feet into the slipper.","propp-recognition":"Cinderella is finally allowed to try the slipper herself, and it fits her perfectly.",exposure:"Her stepfamily's claims collapse in that instant, exposed as false in front of the Prince's search party.",transfiguration:"Seen at last as the girl from the ball rather than the servant she was made to seem, Cinderella is restored to her true standing.",punishment:"Her stepmother and stepsisters lose whatever power they once held over her the moment the slipper fits.",wedding:"Cinderella marries the Prince, her worth finally recognized beyond the circumstances that tried to hide it."}},{id:"of-mice-and-men-vonnegut-bad-to-worse",title:"Of Mice and Men",creator:"John Steinbeck, 1937",appliesToType:"plotType",appliesToId:"vonnegut-bad-to-worse",bestStructureId:"fichtean",beats:{setup:"George and Lennie, migrant workers, dream of one day owning a small farm of their own.",rise:"Lennie's immense strength and limited understanding keep causing accidental trouble wherever they go.",climax:"Lennie accidentally kills a woman, and a mob forms to hunt him down.",fall:"George is forced to kill Lennie himself to spare him a worse death, and the dream of the farm dies with him."},characters:[{category:"protagonist",name:"George",values:{setup:0,rise:-1,climax:-3,fall:-2},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"Lennie",values:{setup:0,rise:-1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"other",name:"Curley's wife",values:{setup:0,rise:0,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"antagonist",name:"the mob",values:{setup:0,rise:0,climax:2,fall:1},interacts:{setup:!1,rise:!1,climax:!0,fall:!0}},{category:"antagonist",name:"Curley",values:{setup:1,rise:1,climax:2,fall:0},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"ally",name:"Candy",values:{setup:0,rise:2,climax:-2,fall:-3},interacts:{setup:!1,rise:!0,climax:!0,fall:!1}}],sections:{"crisis-1":"George and Lennie arrive at a new ranch already dogged by trouble, Lennie's immense strength and limited understanding causing small, worrying incidents from the start.","crisis-2":"Lennie accidentally kills his own puppy through careless affection, foreshadowing worse harm to come.","crisis-3":"Curley's wife, lonely and reckless, keeps seeking Lennie out despite the danger everyone around them senses in it.","crisis-4":"She lets Lennie stroke her hair in the barn, flattered by his gentleness, and the danger tightens further.",climax:"Lennie panics when she struggles to pull away and accidentally breaks her neck; a mob forms to hunt him down, and George finds him first, hiding by the river they'd once dreamed by.",resolution:"George is forced to kill Lennie himself to spare him a worse death, and the dream of the farm dies with him."}},{id:"hamlet-vonnegut-which-way-up",title:"Hamlet",creator:"William Shakespeare, c. 1600",appliesToType:"plotType",appliesToId:"vonnegut-which-way-up",bestStructureId:"freytag",beats:{setup:"Hamlet is charged with avenging his father's murder, a task that seems clearly righteous.",rise:"His delays, feigned madness, and moral hesitation make it unclear whether his path is heroic or self-destructive.",climax:"By the final act, nearly everyone around him is dead or doomed, the 'rightness' of his cause deeply muddied.",fall:"Hamlet dies having gotten his revenge, but whether the ending is a triumph or a tragedy is left genuinely ambiguous."},characters:[{category:"protagonist",name:"Hamlet",values:{setup:-1,rise:-1,climax:-2,fall:0},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"Claudius",values:{setup:2,rise:1,climax:-2,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!0}},{category:"love-interest",name:"Ophelia",values:{setup:0,rise:-1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}},{category:"other",name:"Polonius",values:{setup:1,rise:1,climax:-3,fall:-3},interacts:{setup:!0,rise:!0,climax:!0,fall:!1}},{category:"mentor",name:"his father's ghost",values:{setup:0,rise:1,climax:1,fall:0},interacts:{setup:!0,rise:!0,climax:!1,fall:!1}},{category:"other",name:"Gertrude",values:{setup:1,rise:0,climax:-1,fall:-3},interacts:{setup:!0,rise:!0,climax:!1,fall:!0}}],sections:{exposition:"Hamlet mourns his father's death and recoils from his mother's swift remarriage to his uncle Claudius.","rising-action":"His father's ghost reveals that Claudius murdered him and charges Hamlet with revenge; Hamlet accepts the task but stalls, feigning madness, until he finally secures proof of Claudius's guilt yet still can't bring himself to act.",climax:"His hesitation curdles into catastrophe \u2014 Polonius is killed and Ophelia is driven to madness and death, muddying whatever rightness his cause once had.","falling-action":"By the final act nearly everyone around him is dead or doomed, the consequences of his delay spreading past anyone's control.",denouement:"Hamlet dies having finally gotten his revenge, leaving it genuinely ambiguous whether the ending is triumph or tragedy."}},{id:"genesis-vonnegut-creation-story",title:"The Book of Genesis",creator:"Hebrew Bible",appliesToType:"plotType",appliesToId:"vonnegut-creation-story",bestStructureId:"pixar-spine",beats:{setup:"In the beginning, there is nothing \u2014 formless void and darkness.",rise:"Over six days, light, land, sea, plants, stars, and animals are brought into being in sequence.",climax:"Humanity is created last, formed in the divine image, and placed in the Garden of Eden.",fall:"Creation is complete and declared very good, the ascent from nothing to everything finished in a single arc."},characters:[{category:"protagonist",name:"God",values:{setup:0,rise:2,climax:3,fall:3},interacts:{setup:!1,rise:!1,climax:!0,fall:!0}},{category:"other",name:"Humanity",values:{setup:0,rise:0,climax:3,fall:3},interacts:{setup:!1,rise:!1,climax:!0,fall:!0}}],sections:{"once-upon":"In the beginning, there is nothing \u2014 formless void and darkness over the deep.","every-day":"Formless and empty, the deep sits in unbroken darkness, with no light, no separation, and nothing yet living \u2014 this is the only state there has ever been.","until-one-day":"God speaks, and light appears, the first act separating something from nothing.","because-1":"Because light and dark are now divided, sky and sea can be divided too, and dry land emerges from the waters.","because-2":"Because the land is dry, plants take root; then stars and seasons are set; then creatures of sea and sky and land are brought into being, each stage building visibly on the last.","until-finally":"Humanity is created last of all, formed in the divine image and given dominion over everything before it, and placed in the Garden of Eden.","ever-since":"Creation is complete and declared very good, the ascent from nothing to everything finished in a single arc."}},{id:"wizard-of-oz-mice-milieu",title:"The Wizard of Oz",creator:"dir. Victor Fleming, 1939",appliesToType:"plotType",appliesToId:"mice-milieu",bestStructureId:"hero-journey",beats:{setup:"The story opens as Dorothy is swept from Kansas into the wholly unfamiliar land of Oz.",rise:"She travels the yellow brick road, encountering the strange rules and dangers of this new world.",climax:"Oz itself reaches its turning point as the Wicked Witch is defeated and the Wizard exposed as a fraud.",fall:"The story closes as Dorothy leaves Oz behind and returns to Kansas."},characters:[{category:"protagonist",name:"Dorothy",values:{setup:0,rise:-1,climax:1,fall:3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"antagonist",name:"the Wicked Witch of the West",values:{setup:0,rise:1,climax:-3,fall:-3},interacts:{setup:!1,rise:!1,climax:!0,fall:!1}},{category:"other",name:"the Wizard",values:{setup:0,rise:1,climax:-2,fall:0},interacts:{setup:!1,rise:!0,climax:!1,fall:!0}},{category:"ally",name:"the Scarecrow",values:{setup:0,rise:1,climax:-1,fall:2},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"the Tin Man",values:{setup:0,rise:1,climax:-2,fall:2},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}},{category:"ally",name:"the Lion",values:{setup:-1,rise:0,climax:-2,fall:3},interacts:{setup:!1,rise:!0,climax:!0,fall:!0}}],sections:{"ordinary-world":"Dorothy lives an ordinary life on a Kansas farm, restless within its familiar limits.",call:"A tornado tears her out of that world and drops her into the wholly unfamiliar land of Oz.",refusal:"Bewildered and frightened by Oz's strangeness, Dorothy's only wish at first is to get back home to Kansas rather than explore this new world.",mentor:"Glinda points her toward the Emerald City, setting her on the yellow brick road to seek the Wizard, who might be able to send her home.",
