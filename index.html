over whether to try again.","crisis-4":"They succeed on a second attempt, staging Nick's death as a car crash, but a suspicious district attorney turns the two lovers against each other in interrogation, each fearing the other will confess first.",climax:"Through a lawyer's manipulation of the case, Frank and Cora are acquitted of Nick's murder \u2014 but immediately afterward, Cora is killed in a genuine, accidental car crash while Frank is driving.",resolution:"Frank is convicted and sentenced to death for Cora's death, a murder he didn't commit, in bitter payment for the one he did \u2014 love having led them both, in the end, to ruin."}},{id:"hamlet-discovery-dishonor",title:"Hamlet",creator:"William Shakespeare, c. 1600",appliesToType:"plotType",appliesToId:"polti-discovery-dishonor-loved-one",bestStructureId:"weiland",beats:{setup:"Prince Hamlet, grieving his father and disturbed by his mother's hasty remarriage to his uncle Claudius, learns from his father's ghost that Claudius murdered him.",rise:"Hamlet feigns madness to investigate, stages a play that confirms Claudius's guilt, accidentally kills Polonius, and survives an assassination plot in England.",climax:"In a final duel with poisoned blades, Hamlet, Laertes, and Gertrude are all fatally poisoned before Hamlet finally kills Claudius.",fall:"Hamlet dies naming a successor to the throne, the dishonor of his mother's marriage and uncle's crime avenged at the cost of nearly the entire royal house."},sections:{hook:"Prince Hamlet broods in the Danish court, grieving his father's recent death and disturbed by his mother Gertrude's swift remarriage to his uncle Claudius, now king.",inciting:"The ghost of Hamlet's father appears on the castle battlements and reveals to Hamlet that Claudius murdered him to seize the throne and Gertrude, demanding revenge.","plot-point-1":"Hamlet swears to avenge his father but resolves to feign madness while he verifies the ghost's claim, committing himself to a fraught, secretive campaign against the new king.","pinch-1":"Claudius, sensing something is wrong with Hamlet, sets spies \u2014 including Hamlet's own former friends and Polonius using his daughter Ophelia \u2014 to watch and probe him, showing the reach of royal power against him.",midpoint:"Hamlet stages a play mirroring his father's murder before the court; Claudius's visible horror confirms his guilt, and Hamlet moves from suspicion into active pursuit of revenge.","pinch-2":"Hamlet impulsively kills Polonius, hidden behind a tapestry, mistaking him for Claudius \u2014 and Claudius uses the killing as pretext to ship Hamlet off to England with a sealed order for his execution.","plot-point-3":"Hamlet escapes the assassination plot and returns to Denmark only to find Ophelia has drowned herself in grief and madness, and her brother Laertes, also seeking revenge for his father and sister, is primed by Claudius to duel Hamlet with a poisoned blade.",climax:"In the final fencing match, Hamlet and Laertes are both cut by the poisoned sword, Gertrude drinks from a cup Claudius poisoned for Hamlet and dies, and the dying Hamlet finally kills Claudius outright, the dishonor of his mother's marriage and uncle's crime avenged at the cost of nearly everyone's life.",resolution:"As Hamlet dies, he names Fortinbras of Norway to take the Danish throne, and the court is left to reckon with a royal house destroyed by the dishonor and murder at its foundation."}},{id:"rebecca-discovery-dishonor",title:"Rebecca",creator:"Daphne du Maurier, 1938",appliesToType:"plotType",appliesToId:"polti-discovery-dishonor-loved-one",bestStructureId:"weiland",beats:{setup:"A shy young bride marries widower Maxim de Winter and moves to his estate, Manderley, living in the shadow of his glamorous first wife Rebecca, who drowned.",rise:"Housekeeper Mrs. Danvers keeps Rebecca's memory alive to torment the new bride, until Rebecca's body is found and an inquest threatens to expose Maxim.",climax:"Maxim confesses that Rebecca was cruel and unfaithful and that he killed her after she taunted him, but records reveal she was dying and had provoked her own death.",fall:"Cleared of premeditated murder, Maxim and his wife escape as Mrs. Danvers, shattered by the truth, burns Manderley to the ground."},sections:{hook:"The shy, unnamed narrator marries the wealthy widower Maxim de Winter and arrives at his grand estate, Manderley, overwhelmed by the lingering, idealized memory of his first wife, Rebecca, who drowned a year earlier.",inciting:"The housekeeper Mrs. Danvers, fiercely devoted to Rebecca's memory, subtly undermines the new Mrs. de Winter at every turn, keeping Rebecca's room and belongings as a shrine.","plot-point-1":"The narrator becomes consumed with living up to Rebecca's supposed perfection, committing herself to trying to fill a role she increasingly believes she can never match.","pinch-1":"Mrs. Danvers nearly convinces the narrator to jump from a window during a moment of despair, showing just how dangerous Rebecca's shadow \u2014 and Danvers's devotion to it \u2014 really is.",midpoint:"Rebecca's boat is found with her body inside, contradicting the official story that a different body had been misidentified as hers months earlier, forcing a reopened investigation into her death.","pinch-2":"At the inquest, evidence suggests Rebecca did not drown accidentally, and suspicion of foul play closes dangerously in on Maxim.","plot-point-3":"Maxim finally confesses to his new wife the truth: Rebecca was cruel and unfaithful, taunted him with a claim she was pregnant by another man, and in the ensuing confrontation he shot her and staged her death by sinking her boat.",climax:"A doctor's records reveal Rebecca was actually dying of cancer and had likely provoked Maxim into killing her as a final act of cruelty and control, clearing Maxim of premeditated murder just as Mrs. Danvers, learning the truth about her idol, sets Manderley ablaze in despair.",resolution:"Maxim and his wife escape the burning of Manderley together, finally free of Rebecca's dishonor and the secrets it hid, though the estate \u2014 and the illusion of Rebecca's perfection \u2014 lies in ashes behind them."}},{id:"pride-prejudice-obstacles-love-2",title:"Pride and Prejudice",creator:"Jane Austen, 1813",appliesToType:"plotType",appliesToId:"polti-obstacles-love",bestStructureId:"seven-point",beats:{setup:"Elizabeth Bennet and Mr. Darcy meet and clash over pride and class at a country ball, while circumstances draw their families together despite mutual scorn.",rise:"Darcy's botched, arrogant proposal and Elizabeth's discovery of his true character through his letter slowly dismantle both of their misjudgments.",climax:"Lydia's scandalous elopement threatens to destroy the Bennets' reputation and any hope of a match, until Elizabeth learns Darcy secretly intervened to save her family.",fall:"Chastened by what he's learned about himself, Darcy proposes again; Elizabeth, her prejudice gone, accepts him."},sections:{hook:"Elizabeth Bennet, sharp-tongued and unimpressed by rank, meets the proud, wealthy Mr. Darcy at a country ball where he snubs her, establishing exactly the mutual prejudice the story must undo.","plot-turn-1":"Darcy's friend Bingley courts Elizabeth's sister Jane, drawing the Bennets and Darcy's circle together, while Elizabeth's dislike of Darcy hardens and Wickham's flattering lies about him take root.","pinch-1":"Darcy separates Bingley from Jane and, believing himself doing Elizabeth a favor by rank, delivers a prideful proposal that insults her family; she refuses him in fury, certain he's a villain.",midpoint:"Darcy's letter explaining the truth about Wickham and his reasons for parting Bingley and Jane forces Elizabeth to actively reexamine her judgment rather than simply react to him.","pinch-2":"Elizabeth's sister Lydia elopes scandalously with Wickham, threatening to ruin the whole family's reputation and seemingly placing Elizabeth forever out of reach of a match with Darcy.","plot-turn-2":"Elizabeth learns, almost by accident, that Darcy secretly paid off Wickham and arranged the marriage to save her family's name, the missing proof that he has truly changed.",resolution:"Darcy proposes again, humbled, and Elizabeth accepts; the mirror of the hook, prejudice on both sides replaced by hard-won understanding and love."}},{id:"titanic-obstacles-love-3",title:"Titanic",creator:"James Cameron, 1997",appliesToType:"plotType",appliesToId:"polti-obstacles-love",bestStructureId:"seven-point",beats:{setup:"Rose, engaged against her will to the wealthy Cal, meets penniless artist Jack Dawson aboard the Titanic and is drawn to the freedom he represents.",rise:"Their romance deepens despite Cal's jealous interference and the rigid class divisions of the ship, culminating in Rose choosing Jack over her arranged life.",climax:"The Titanic strikes an iceberg and sinks, trapping steerage passengers below while Jack and Rose fight to survive together in the wreck and freezing water.",fall:"Jack sacrifices himself so Rose can survive on the floating door, and she lives out the rest of her life carrying his memory and the freedom he gave her."},sections:{hook:"Rose DeWitt Bukater, trapped in a loveless engagement to the wealthy Cal Hockley, stands at the rail of the Titanic contemplating suicide, the story's opening image of a life without freedom or love.","plot-turn-1":"Steerage passenger Jack Dawson talks her down from the rail, and the two begin a forbidden friendship across the ship's rigid class lines that Cal and Rose's mother immediately move to stop.","pinch-1":"Cal has Jack falsely accused of theft and has him handcuffed below decks, showing exactly how much power and cruelty stand between Jack and Rose.",midpoint:"Rose chooses Jack over her engagement and her family's expectations, actively defying Cal and running to free Jack herself rather than passively accepting her fate.","pinch-2":"The Titanic strikes an iceberg and begins to sink, and the class barriers that kept Jack and Rose apart now literally trap steerage passengers below decks as the ship goes down.","plot-turn-2":"In the freezing water, Jack gets Rose onto a floating door large enough for only one, giving her the means to survive when he cannot.",resolution:"Rose survives, having taken Jack's name and lived the free, adventurous life he urged her toward, the mirror of their first meeting, love outlasting the class and death that tried to keep them apart."}},{id:"tristan-isolde-enemy-loved-2",title:"Tristan and Isolde",creator:"traditional medieval legend",appliesToType:"plotType",appliesToId:"polti-enemy-loved",bestStructureId:"todorov",beats:{setup:"Tristan, a knight of Cornwall, is sent to fetch the Irish princess Isolde as bride for his king, though Cornwall and Ireland are enemies.",rise:"A love potion drunk by accident binds Tristan and Isolde together, and they conduct a secret, treasonous affair even after her marriage to King Mark.",climax:"Their affair is discovered and Tristan is banished; wounded and dying, he sends for Isolde, the only one who can heal him.",fall:"Isolde arrives too late; Tristan dies believing she has abandoned him, and she dies of grief beside his body, their love finally united only in death."},sections:{equilibrium:"Cornwall and Ireland are bitter enemies, and King Mark's knight Tristan has slain Ireland's champion, the political order resting on that hostility.",disruption:"Sent to Ireland to escort the Irish princess Isolde home as Mark's bride, Tristan and Isolde unknowingly drink a love potion meant for Isolde and Mark, and fall helplessly in love.",recognition:"Both recognize the impossible position they're in: Isolde is bound to marry the king of the very enemy nation Tristan serves, and their love is treasonous on every side.",repair:"They carry on a secret affair even after Isolde's marriage to Mark, evading discovery again and again, until Mark finally learns the truth and Tristan is banished.","new-equilibrium":"Tristan dies of a wound waiting for Isolde to come heal him, and she dies of grief at his side, their love resolved only in death, uniting what politics and enmity could never allow in life."}},{id:"pocahontas-enemy-loved-3",title:"Pocahontas",creator:"Disney, dir. Mike Gabriel and Eric Goldberg, 1995",appliesToType:"plotType",appliesToId:"polti-enemy-loved",bestStructureId:"todorov",beats:{setup:"Pocahontas lives contentedly among the Powhatan as English settlers, hungry for gold, arrive and prepare for conflict with her people.",rise:"She falls for settler John Smith despite the mounting hostility between their peoples, and the two secretly meet even as war looms on both sides.",climax:"Pocahontas throws herself between her father and the wounded John Smith to stop his execution, exposing Governor Ratcliffe's greed to his own men.",fall:"Peace is narrowly won between the two peoples, John Smith sails home wounded, and Pocahontas remains, forever changed by having loved across the enemy line."},sections:{equilibrium:"Pocahontas lives among the Powhatan people in Virginia, her world stable and whole, while English settlers led by Governor Ratcliffe arrive seeking gold on land the Powhatan consider theirs.",disruption:"Pocahontas meets and is drawn to John Smith, one of the colonizing settlers her people are preparing to fight, an attraction that crosses the exact line of conflict dividing the two peoples.",recognition:"Both sides recognize the danger of the attraction; Pocahontas's father Powhatan and the settlers alike see the relationship as a betrayal of their own side.",repair:"Pocahontas works to prevent war between the two peoples, ultimately intervening to save John Smith's life when Ratcliffe's men would have him executed, exposing the settlers' true, ruinous motives.","new-equilibrium":"John Smith is wounded and returns to England, Ratcliffe is exposed and arrested by his own men, and an uneasy peace settles between the Powhatan and the remaining settlers, forever changed by Pocahontas's choice to love across the divide."}},{id:"there-will-be-blood-ambition-2",title:"There Will Be Blood",creator:"dir. Paul Thomas Anderson, 2007",appliesToType:"plotType",appliesToId:"polti-ambition",bestStructureId:"eight-sequence",beats:{setup:"Daniel Plainview claws his way up from a lone silver prospector to an oil baron, buying up land in Little Boston through calculated deception.",rise:"His ambition costs him his son's hearing and any real human connection, while rival preacher Eli Sunday needles him for status and money at every turn.",climax:"Isolated by wealth and suspicion, Daniel murders a man claiming false kinship and later beats Eli Sunday to death in his own bowling alley.",fall:"Daniel is left utterly alone with his oil fortune, having sacrificed every relationship and shred of decency to the ambition that consumed him."},sections:{"status-quo":"Daniel Plainview, a solitary silver prospector, strikes oil and begins building a fortune from nothing, driven by a naked hunger to dominate and possess.",predicament:"Buying up land in the town of Little Boston under the guise of family values, Daniel commits himself entirely to controlling the region's oil, unable to walk away from the wealth and power now within reach.","obstacle-1":"Local preacher Eli Sunday challenges Daniel for standing and money, humiliating him publicly during a baptism Daniel is forced to undergo to secure a pipeline route.","stakes-1":"Daniel's adopted son H.W. is deafened in a derrick explosion, and Daniel, unable to cope with the boy's need for him, begins to isolate himself further into work and suspicion.",midpoint:"A man claiming to be Daniel's long-lost half-brother arrives, and Daniel briefly opens himself to companionship, only to discover the man is an impostor after money.","stakes-2":"Daniel murders the impostor in cold blood, and his ambition curdles fully into paranoia, cutting him off from H.W. and everyone else who might have once tempered him.",culmination:"Wealthy beyond measure but utterly alone, Daniel humiliates Eli Sunday one final time, forcing the desperate preacher to renounce his faith for oil money.",climax:`In his private bowling alley, Daniel beats Eli to death in a final eruption of the greed and contempt that built his empire, ending with his declaration, "I'm finished."`}},{id:"godfather-ambition-3",title:"The Godfather",creator:"dir. Francis Ford Coppola, 1972",appliesToType:"plotType",appliesToId:"polti-ambition",bestStructureId:"eight-sequence",beats:{setup:"Michael Corleone stands outside his family's criminal empire until an attempt on his father Vito's life pulls him in for good.",rise:"Michael marries in Sicily, loses his wife to an assassination attempt, and returns home to consolidate power as his father steps back and rivals circle.",climax:"After Vito's death, Michael orders a sweeping wave of assassinations against every rival family, cementing himself as the new, absolute Don.",fall:'Michael lies to his wife Kay about the murders and is crowned "Don Corleone," his ambition complete but his soul and marriage hollowed out.'},sections:{"status-quo":`Michael Corleone, a decorated war veteran, stands apart from his family's crime business at his sister's wedding, insisting, "That's my family, Michael, not me."`,predicament:"After his father Vito is nearly assassinated, Michael commits himself to the family by killing the men responsible, crossing irrevocably into the world he swore to avoid.","obstacle-1":"Hiding in Sicily after the killings, Michael marries Apollonia, only to have her killed by a car bomb meant for him, deepening his resolve toward ruthlessness.","stakes-1":"Michael returns to New York, marries Kay, and begins consolidating control as his father steps back, while rival families and internal betrayal threaten the Corleones' position.",midpoint:"Vito dies of a heart attack, and Michael, now fully head of the family, learns his own brother Fredo has betrayed him to a rival, forcing Michael from grieving son to calculating boss.","stakes-2":"Michael systematically eliminates every rival and threat to his power, including ordering the murder of Moe Greene and the heads of the other Five Families.",culmination:"In a baptism intercut with a wave of coordinated assassinations, Michael becomes godfather to his nephew while his men murder every enemy who could challenge him.",climax:`Michael consolidates absolute power, has Carlo killed for betraying Sonny, and lies to Kay's face about it as the office door closes on her, Michael addressed at last as "Don Corleone."`}},{id:"paradise-lost-conflict-with-god-2",title:"Paradise Lost",creator:"John Milton, 1667",appliesToType:"plotType",appliesToId:"polti-conflict-with-god",bestStructureId:"todorov",beats:{setup:"Satan and the angels live under God's rule in Heaven until Satan's pride refuses to bow to the Son's exaltation.",rise:"Satan leads a rebellion of angels against God, is defeated in the war in Heaven, and is cast down into Hell with his followers.",climax:"Vowing eternal defiance, Satan travels to Eden and tempts Eve, and then Adam, into eating the forbidden fruit against God's explicit command.",fall:"Adam and Eve are cast out of Paradise into a mortal world of suffering, while Satan returns to Hell to find his triumph turned to mockery, his followers transformed into serpents."},sections:{equilibrium:"Satan and his fellow angels once dwelt in Heaven under God's rule, a stable, glorious order.",disruption:"Satan's pride refuses to accept the elevation of the Son above the angels, and he leads a rebellion against God's authority.",recognition:'Defeated and cast down into Hell after a war in Heaven, Satan and his fallen legions recognize their new state and resolve never to submit, declaring it "better to reign in Hell than serve in Heaven."',repair:"Unable to defeat God directly, Satan schemes an indirect revenge, traveling to Eden to corrupt God's newest creation, tempting Eve to eat the forbidden fruit and Adam to follow her.","new-equilibrium":"Adam and Eve are expelled from Paradise into a fallen world of toil and death, while Satan returns to Hell to find himself and his followers transformed into serpents, a new, diminished order stamped by their shared defiance of God."}},{id:"arachne-conflict-with-god-3",title:"Arachne",creator:"Greek myth, as told in Ovid's Metamorphoses, c. 8 CE",appliesToType:"plotType",appliesToId:"polti-conflict-with-god",bestStructureId:"todorov",beats:{setup:"Arachne, a mortal weaver of unmatched skill, is celebrated across Lydia for tapestries so fine people credit the gods with teaching her.",rise:"She boasts that her weaving surpasses the goddess Athena's own, ignoring a divine warning to show humility, and challenges Athena to a contest.",climax:"Arachne weaves a tapestry mocking the gods' misdeeds; enraged at both its insolence and its perfection, Athena destroys it and strikes her down.",fall:"Arachne attempts to hang herself in despair, and Athena transforms her into a spider, doomed to weave webs forever as punishment for defying a god."},sections:{equilibrium:"Arachne, a mortal weaver of extraordinary skill, is celebrated throughout Lydia, her looms producing tapestries so fine that people say even the gods must have taught her.",disruption:"Arachne boasts that her weaving surpasses that of Athena herself, the goddess of crafts, and refuses to credit the goddess for her gift.",recognition:"Athena, disguised as an old woman, warns Arachne to ask forgiveness for her arrogance, but Arachne stands by her boast and challenges the goddess to a weaving contest outright.",repair:"In the contest, Arachne weaves a tapestry depicting the gods' crimes and infidelities, technically flawless but so insolent that Athena, unable to find fault in the craftsmanship, destroys it in fury and strikes Arachne.","new-equilibrium":"In despair, Arachne tries to hang herself, but Athena transforms her into a spider instead, cursed to weave beautiful webs forever as a lesser creature, a permanent new order that punishes mortal defiance of the divine."}},{id:"winters-tale-mistaken-jealousy-2",title:"The Winter's Tale",creator:"William Shakespeare, c. 1611",appliesToType:"plotType",appliesToId:"polti-mistaken-jealousy",bestStructureId:"freytag",beats:{setup:"King Leontes hosts his old friend Polixenes at his Sicilian court alongside his pregnant wife Hermione, in a scene of warm friendship.",rise:"Leontes convinces himself without evidence that Hermione and Polixenes are lovers, imprisoning her and driving Polixenes away.",climax:"At Hermione's trial, an oracle proclaims her innocence just as Leontes' son dies of grief and Hermione herself collapses, apparently dead.",fall:"After sixteen years of remorse, Leontes is reunited with his lost daughter Perdita and, astonishingly, with Hermione herself, restored to life."},sections:{exposition:"King Leontes of Sicilia hosts his old friend King Polixenes of Bohemia, alongside Leontes' pregnant wife Hermione, in an atmosphere of warmth and old friendship.","rising-action":"Leontes suddenly convinces himself, with no real evidence, that Hermione and Polixenes are having an affair and that her unborn child is not his; he orders Polixenes killed and has Hermione imprisoned.",climax:"At Hermione's public trial, an oracle from Delphi declares her innocent and warns Leontes he will have no heir until what was lost is found, and in that instant, news arrives that his young son Mamillius has died of grief, and Hermione collapses, seemingly dead.","falling-action":"Leontes, devastated and repentant, spends sixteen years in guilt and mourning, while his infant daughter Perdita, whom he had ordered abandoned, is secretly raised by shepherds in Bohemia.",denouement:"Perdita is reunited with Leontes as a grown woman, and a statue of Hermione is revealed to be the queen herself, alive all along, reconciliation restoring the family that jealousy nearly destroyed."}},{id:"much-ado-mistaken-jealousy-3",title:"Much Ado About Nothing",creator:"William Shakespeare, c. 1598",appliesToType:"plotType",appliesToId:"polti-mistaken-jealousy",bestStructureId:"freytag",beats:{setup:"In Messina, soldier Claudio quickly falls for and becomes engaged to the gentle Hero after the wars end.",rise:"The villain Don John tricks Claudio into believing he's witnessed Hero being unfaithful the night before their wedding.",climax:"Claudio publicly shames Hero as unfaithful at their wedding, and she collapses, apparently dead from the shock.",fall:"Bumbling watchmen uncover the truth of the deception, and a repentant Claudio is reunited with Hero, revealed to have survived."},sections:{exposition:"In Messina, the soldier Claudio falls for the gentle Hero, and their marriage is quickly arranged amid the town's festive mood after the wars.","rising-action":"The villainous Don John engineers a deception, having his man Borachio woo Hero's maid at her window at night so that Claudio, watching from a distance, is tricked into believing he's seeing Hero being unfaithful.",climax:"At the wedding altar, Claudio publicly denounces and humiliates Hero as a whore based on what he wrongly believes he saw, and Hero collapses, seemingly dead of the shock and shame.","falling-action":"Hero's family, with Friar Francis's help, pretends she has actually died to let Claudio's guilt take hold, while the bumbling watchman Dogberry's men uncover Borachio's confession of the trick.",denouement:"The truth exposed, a remorseful Claudio agrees to marry a cousin of Hero's as penance, only to have Hero herself unveiled alive, jealousy's damage undone and the marriage restored."}},{id:"twelve-angry-men-erroneous-judgment-2",title:"12 Angry Men",creator:"Reginald Rose, dir. Sidney Lumet, 1957",appliesToType:"plotType",appliesToId:"polti-erroneous-judgment",bestStructureId:"fichtean",beats:{setup:"Twelve jurors begin deliberations already leaning toward convicting a teenage boy of murder, with eleven votes cast for guilty almost immediately.",rise:"One juror's insistence on examining the evidence exposes shaky testimony and personal prejudices, slowly turning votes toward acquittal.",climax:"The last holdout, driven by his own unresolved anger, is finally confronted with his bias and breaks down, changing his vote.",fall:"The jury delivers a unanimous not-guilty verdict, having narrowly corrected what nearly became a wrongful conviction."},sections:{"crisis-1":"Twelve jurors enter deliberation on a murder trial already leaning toward a guilty verdict for a teenage boy accused of killing his father, with an initial vote of eleven to one for conviction.","crisis-2":"Juror 8 alone insists on discussing the evidence rather than rushing to judgment, and his skepticism about the murder weapon and witness testimony begins to fracture the room's assumed consensus.","crisis-3":"As jurors re-examine the switchblade, the elderly witness's ability to see and hear, and the woman across the street's eyewitness account, tempers flare and old prejudices about the boy's background surface openly.","crisis-4":"Juror 3, driven by his own unresolved anger at his estranged son, becomes the last holdout for guilty, and the room's tension peaks as his personal bias is exposed to everyone including himself.",climax:"Confronted with the full weight of reasonable doubt and his own projected rage, Juror 3 breaks down and finally changes his vote to not guilty, delivering a unanimous acquittal.",resolution:"The jurors file out into the rain having overturned what nearly became a fatal miscarriage of justice, their brief, anonymous encounter over."}},{id:"mockingbird-erroneous-judgment-3",title:"To Kill a Mockingbird",creator:"Harper Lee, 1960",appliesToType:"plotType",appliesToId:"polti-erroneous-judgment",bestStructureId:"fichtean",beats:{setup:"Atticus Finch agrees to defend Tom Robinson, a Black man falsely accused of rape, drawing hostility onto his family in Depression-era Alabama.",rise:"At trial, Atticus proves Tom's innocence beyond reasonable doubt, but the all-white jury's prejudice overrides the evidence.",climax:"Tom is wrongfully convicted and later killed trying to escape, while the vengeful Bob Ewell attacks Atticus's children.",fall:"The reclusive Boo Radley saves the children and kills Ewell, and the sheriff quietly protects him, closing the story on judgment both erroneous and merciful."},sections:{"crisis-1":"In Depression-era Alabama, lawyer Atticus Finch agrees to defend Tom Robinson, a Black man falsely accused of raping a white woman, Mayella Ewell, immediately drawing the town's hostility onto his family.","crisis-2":"As the trial approaches, Atticus's children Scout and Jem face threats and scorn from neighbors convinced of Tom's guilt before any evidence is heard.","crisis-3":"At trial, Atticus proves Tom could not have caused Mayella's injuries with his crippled left arm, and that her father Bob Ewell likely beat her himself, yet the all-white jury's prejudice remains unmoved.","crisis-4":"Despite the clear evidence of his innocence, the jury convicts Tom Robinson, and shortly after, Tom is shot dead attempting to escape prison, an erroneous judgment now irreversible.",climax:"Bob Ewell, humiliated by the trial, attacks Scout and Jem in the dark, only for the reclusive neighbor Boo Radley to intervene and kill Ewell in their defense.",resolution:"Sheriff Heck Tate quietly rules Ewell's death an accident to protect Boo Radley from unwanted attention, and Scout walks him home, having learned how easily judgment can go wrong and how mercy can follow it."}},{id:"christmas-carol-remorse-2",title:"A Christmas Carol",creator:"Charles Dickens, 1843",appliesToType:"plotType",appliesToId:"polti-remorse",bestStructureId:"story-circle",beats:{setup:"Miserly Ebenezer Scrooge lives in cold isolation, indifferent to the suffering of those around him, until his dead partner Marley's ghost warns of three spirits to come.",rise:"The ghosts of Christmas Past and Present force Scrooge to confront the choices that hardened him and the warmth and poverty he has ignored in others.",climax:"The Ghost of Christmas Yet to Come shows Scrooge his own unmourned death and the death of Tiny Tim if nothing changes.",fall:"Overwhelmed with remorse, Scrooge wakes transformed, becoming generous and warm, saving Tiny Tim and redeeming his wasted years."},sections:{you:"Ebenezer Scrooge is a miserly, isolated moneylender content in his cold, comfortable indifference to everyone around him, including his dying clerk's family.",need:"Though he doesn't yet know it, Scrooge needs to reconnect with his own buried humanity before it's too late, a need voiced by his nephew Fred and the ghost of his old partner Marley.",go:"Marley's ghost warns Scrooge that three spirits will visit him, dragging him out of his comfortable isolation and into a night he cannot refuse.",search:"The Ghost of Christmas Past shows Scrooge scenes of his own youth, lost love, and the choices that hardened him, forcing him to search his memory for where he went wrong.",find:"The Ghost of Christmas Present shows him the genuine warmth of Christmas he's been missing, including the Cratchit family's love despite their poverty and Tiny Tim's fragile life.",take:"The Ghost of Christmas Yet to Come shows Scrooge his own unmourned death and Tiny Tim's, the heavy price of the path he's on if he doesn't change.",return:"Scrooge wakes in his own bed on Christmas morning, returned to his familiar life but no longer the same man who fell asleep in it.",change:"Transformed by remorse for his wasted years, Scrooge raises Bob Cratchit's wages, saves Tiny Tim, and becomes as generous and warm as he once was cold, remorse turned into redemption."}},{id:"atonement-remorse-3",title:"Atonement",creator:"Ian McEwan, 2001",appliesToType:"plotType",appliesToId:"polti-remorse",bestStructureId:"story-circle",beats:{setup:"Thirteen-year-old Briony misinterprets a moment between her sister Cecilia and Robbie, the housekeeper's son, at their family estate in 1935.",rise:"After witnessing an assault on her cousin, Briony falsely accuses Robbie, who is imprisoned and later sent to fight in World War II.",climax:"Briony becomes a wartime nurse as penance, while Robbie and Cecilia are kept apart by prison and war, their love unresolved by her lie.",fall:"Robbie and Cecilia both die before Briony can make amends, and as an old woman, she confesses in her final novel that their happy reunion was only fiction, her guilt unresolved."},sections:{you:"Thirteen-year-old Briony Tallis is an imaginative, precocious girl living comfortably at her family's English country estate in 1935.",need:"She craves to understand the adult world of love and desire she glimpses between her sister Cecilia and the housekeeper's son Robbie, and to matter within it.",go:"Misreading what she witnesses between Cecilia and Robbie, and then finding her cousin Lola assaulted in the dark, Briony leaves the safety of childish misunderstanding and makes an accusation that will change everything.",search:"She insists, against her own uncertainty, that Robbie was the attacker, searching her own imagination for confidence rather than facts.",find:"Robbie is arrested and imprisoned on Briony's false testimony, and Cecilia's love for him is confirmed too late to save him from prison and then the war.",take:"Briony pays the price of her lie for the rest of her life, forgoing her own comfortable path to become a nurse during World War II, tending wounded soldiers as penance.",return:"Older, Briony attempts to return to her sister and Robbie to confess and seek forgiveness, but the war has already taken Robbie's life at Dunkirk and Cecilia's in the Blitz.",change:"As an elderly, dying novelist, Briony admits in her final book that she gave Cecilia and Robbie a happy ending they never actually got, her lifelong remorse resolving into one last, imperfect act of atonement through fiction."}},{id:"finding-nemo-recovery-lost-one-2",title:"Finding Nemo",creator:"Pixar, dir. Andrew Stanton, 2003",appliesToType:"plotType",appliesToId:"polti-recovery-lost-one",bestStructureId:"hero-journey",beats:{setup:"Overprotective clownfish Marlin, having already lost his wife, is left alone raising his son Nemo until Nemo is captured by a diver.",rise:"Marlin crosses into the ocean he fears, gaining the forgetful but loyal Dory as a companion, surviving sharks and jellyfish on the way to Sydney.",climax:"Believing Nemo dead, Marlin nearly gives up, while Nemo escapes the fish tank and the two are reunited, only to face a fishing net threatening Dory and an entire school of fish.",fall:"Nemo leads the trapped fish to freedom, and Marlin returns home having learned to trust his son with the independence he once denied him."},sections:{"ordinary-world":"Marlin, an anxious clownfish who lost his wife and almost all his eggs to a barracuda attack, is left overprotective of his one surviving son, Nemo.",call:"Nemo is captured by a scuba diver and taken away to a dentist's fish tank in Sydney, shattering Marlin's careful, fearful world.",refusal:"Marlin is paralyzed by fear of the open ocean and his own inadequacy, reluctant to believe he can possibly find his son in the vast sea.",mentor:"He meets Dory, a forgetful blue tang who, despite her limitations, pushes him forward with unshakeable optimism and becomes his indispensable companion.",threshold:"Marlin commits to leaving the reef entirely, crossing into the open ocean he has always feared, following the only clue he has, a diver's mask with an address on it.","tests-allies":"Marlin and Dory survive sharks, a deep-sea anglerfish, a field of stinging jellyfish, and a pod of sea turtles who help carry them along the East Australian Current.",approach:"Nearing Sydney Harbour, Marlin and Dory prepare to infiltrate the dentist's office, learning what they can about Nemo's location from a pelican named Nigel.",ordeal:"Marlin believes Nemo has died after seeing a boat with what he thinks is his son's body, and in his grief, nearly abandons the quest entirely.",reward:"Nemo, alive in the fish tank, orchestrates an escape with his tank friends, timing his own capture and release perfectly to finally find his way back to open water.","road-back":"Marlin and Nemo are reunited amid the ocean's dangers, and must still find their way home together, now as father and son who trust each other differently.",resurrection:"Dory gets caught in a fishing net along with an entire school of fish, and Nemo, once helpless, leads the trapped fish in a coordinated effort to swim downward and break the net, saving them all.",elixir:"Marlin returns home having learned to let go of his fear, allowing Nemo the independence he once denied him, the real prize brought back from the journey."}},{id:"ramayana-recovery-lost-one-3",title:"Ramayana",creator:"traditional Indian epic, attributed to Valmiki, c. 5th century BCE",appliesToType:"plotType",appliesToId:"polti-recovery-lost-one",bestStructureId:"hero-journey",beats:{setup:"Exiled prince Rama lives peacefully in the forest with his wife Sita until the demon king Ravana abducts her and carries her to Lanka.",rise:"Grief-stricken, Rama allies with Hanuman and the monkey king Sugriva, builds a causeway to Lanka, and gathers a great army to win Sita back.",climax:"In the war against Ravana, Lakshmana is nearly killed and saved only by Hanuman's feat of carrying an entire mountain, before Rama finally slays Ravana.",fall:"Sita proves her purity through a trial by fire, and the reunited family returns to Ayodhya, where Rama is crowned king over a restored and just kingdom."},sections:{"ordinary-world":"Prince Rama lives in exile in the forest with his wife Sita and brother Lakshmana, having given up his rightful throne in Ayodhya to honor his father's promise.",call:"The demon king Ravana, enraged by an insult to his sister, abducts Sita and carries her off to his kingdom of Lanka, tearing Rama's family apart.",refusal:"Rama is overwhelmed with grief and despair at Sita's loss, momentarily unable to see a path to getting her back against so powerful an enemy.",mentor:"Rama allies with Hanuman, the devoted monkey general, and the monkey king Sugriva, who offer their loyalty, wisdom and army in the search for Sita.",threshold:"Hanuman leaps across the ocean to Lanka, crossing into Ravana's territory to find Sita and confirm she is alive and imprisoned in the Ashoka grove.","tests-allies":"Rama assembles a great army of monkeys and bears and builds a causeway across the sea to Lanka, testing alliances and logistics on an epic scale.",approach:"The armies of Rama and Ravana gather for war, with Ravana's brother Vibhishana defecting to Rama's side, warning him of Lanka's defenses.",ordeal:"In the climactic battle, Rama's brother Lakshmana is gravely wounded, and only a rare herb from a distant mountain, fetched by Hanuman carrying the entire mountain itself, can save him.",reward:"Rama finally kills Ravana in single combat, ending the demon king's tyranny and winning back Sita.","road-back":"Sita must undergo a trial by fire, Agni Pariksha, to prove her purity after her captivity, before Rama will accept her return, a painful condition of the journey home.",resurrection:"Vindicated by the fire trial, Sita is reunited with Rama, and the exiled family finally begins the journey back to Ayodhya to reclaim the throne.",elixir:"Rama is crowned king in Ayodhya, ushering in Ram Rajya, an age of justice and prosperity, the ordered kingdom restored because Rama recovered what was lost."}},{id:"up-loss-loved-ones-2",title:"Up",creator:"Pixar, dir. Pete Docter, 2009",appliesToType:"plotType",appliesToId:"polti-loss-loved-ones",bestStructureId:"pixar-spine",beats:{setup:"Carl and Ellie share a lifelong dream of traveling to Paradise Falls, but life's routines delay the trip until Ellie dies, leaving Carl alone.",rise:"Grieving and facing eviction, Carl flies his house away by balloon, gains an accidental companion in young Russell, and confronts his corrupted childhood hero Muntz.",climax:"Carl must choose between preserving Ellie's house as a shrine to his grief or letting it go to save Russell and a rare bird from Muntz.",fall:"Carl releases the house and his grief, embracing Russell as new family and finally living the adventurous life Ellie always wanted for him."},sections:{"once-upon":"Carl Fredricksen is a shy boy who idolizes explorer Charles Muntz and meets Ellie, an adventurous girl who shares his dream of one day traveling to Paradise Falls.","every-day":"Carl and Ellie marry and build a quiet, happy life together, saving coins in a jar for their someday trip to South America, letting life's routines get in the way for decades.","until-one-day":"Ellie grows old and dies before they ever make the trip, leaving Carl a grieving widower alone in the house they built their life in together.","because-1":"Facing eviction and forced into a retirement home, Carl ties thousands of balloons to the house and flies it away, determined to finally deliver Ellie's house to Paradise Falls as he'd promised.","because-2":"An accidental stowaway, a young Wilderness Explorer named Russell, joins Carl on the journey, and together they encounter a rare bird and Carl's now-villainous childhood hero, Charles Muntz.","until-finally":"Carl must choose between saving Russell and the bird from Muntz or clinging to Ellie's house and his fixation on the past, ultimately letting go of the house, and his grief, to save his new friend.","ever-since":"Carl embraces a new adopted family in Russell, having honored Ellie's memory not by reaching Paradise Falls itself but by living fully again, just as her final message in their adventure book urged him to."}},{id:"grave-fireflies-loss-loved-ones-3",title:"Grave of the Fireflies",creator:"dir. Isao Takahata, 1988",appliesToType:"plotType",appliesToId:"polti-loss-loved-ones",bestStructureId:"pixar-spine",beats:{setup:"Teenage Seita and his young sister Setsuko live with their mother in wartime Kobe as American air raids threaten the city.",rise:"Their mother dies in a firebombing raid, and the siblings, rejected by relatives, move alone into an abandoned bomb shelter with dwindling food.",climax:"Setsuko slowly starves despite Seita's desperate efforts to feed her, and she dies in the shelter as the war nears its end.",fall:"Seita cremates his sister and later dies of starvation himself, their spirits left together watching over the ruined city they lost everyone to."},sections:{"once-upon":"Seita, a teenage boy, and his little sister Setsuko live with their mother in Kobe, Japan, during the final months of World War II, their father away serving in the Imperial Navy.","every-day":"The siblings endure the daily rhythms of wartime life, air raid drills, food shortages, and their mother's care, an uneasy normal under constant threat of bombing.","until-one-day":"An American firebombing raid devastates Kobe, and their mother is fatally burned, dying alone in a hospital while Seita and Setsuko survive in the wreckage of their city.","because-1":"With their mother dead and their aunt's house growing hostile and resentful of two more mouths to feed, Seita takes Setsuko to live alone in an abandoned bomb shelter by a pond.","because-2":"As food grows scarcer and Seita's efforts to provide for his sister fail, reduced to stealing crops and looting during air raids, Setsuko grows sicker with malnutrition.","until-finally":"Setsuko dies of starvation in the shelter, and Seita, following the customs he learned from his mother's death, cremates her small body along with the fireflies she loved.","ever-since":"Seita himself dies of starvation shortly after the war ends, and the film closes on the siblings' spirits watching over the fireflies and the city they lost everything to, together in death as they could not remain in life."}},{id:"odyssey-tobias-quest-2",title:"The Odyssey",creator:"Homer, c. 725 BCE",appliesToType:"plotType",appliesToId:"tobias-quest",bestStructureId:"hero-journey",beats:{setup:"Odysseus, king of Ithaca, is drawn away from his family after the Trojan War and begins the long, gods-thwarted voyage home.",rise:"Across a decade he battles monsters, temptations, and divine anger, losing his entire crew along the way.",climax:"Arriving home in disguise, he reveals himself only at the critical moment, slaughtering the suitors who have besieged his household.",fall:"Restored to his throne and his family, Odysseus reclaims Ithaca and closes the cycle of exile with a hard-won homecoming."},sections:{"ordinary-world":"Odysseus was king of Ithaca, husband to Penelope and father to infant Telemachus, before leaving to fight in the Trojan War.",call:"With Troy fallen, Odysseus's call is the pull of home \u2014 the ten-year journey back to Ithaca begins.",refusal:"Lingering entanglements \u2014 a year with Circe, seven years captive with Calypso \u2014 repeatedly delay his return, more circumstance than a formal refusal but functioning as one.",mentor:"Athena guides him throughout, appearing in disguise to advise him and later steering Telemachus to seek news of his father.",threshold:"Leaving Calypso's island on a raft, released by the gods, Odysseus commits fully to the sea voyage home.","tests-allies":"He survives the Cyclops Polyphemus, the Laestrygonians, Circe's island, and the Sirens' song, gathering hard lessons and losing men and ships along the way.",approach:"He descends to the Underworld to consult the prophet Tiresias, then must pass between Scylla and Charybdis before nearing home.",ordeal:"Shipwrecked and stripped of all his men, Odysseus washes up alone on Phaeacia, at his lowest and most vulnerable point.",reward:"The Phaeacians, moved by his story, give him passage home and rich gifts, and he finally reaches Ithaca's shore.","road-back":"Disguised as a beggar by Athena, Odysseus scouts his own household, where suitors have overrun his hall and courted his wife.",resurrection:"In the great archery contest, Odysseus strings his own bow and slaughters the suitors in his hall, the story's true climactic test.",elixir:"Reunited with Penelope and his father Laertes, Odysseus returns as rightful king, bringing peace back to Ithaca after twenty years away."}},{id:"star-wars-tobias-quest-3",title:"Star Wars: A New Hope",creator:"dir. George Lucas, 1977",appliesToType:"plotType",appliesToId:"tobias-quest",bestStructureId:"hero-journey",beats:{setup:"Luke Skywalker, a bored farm boy on Tatooine, receives a hidden distress call that pulls him toward a galaxy-spanning rebellion.",rise:"Guided by Obi-Wan Kenobi and joined by Han Solo, Luke escapes Tatooine, rescues Princess Leia, and narrowly survives the Death Star.",climax:"Flying for the Rebellion in the climactic trench run, Luke trusts the Force over his instruments to destroy the Death Star.",fall:"Hailed as a hero of the Rebellion, Luke emerges from farm boy to legend, having taken his first true step toward becoming a Jedi."},sections:{"ordinary-world":"Luke Skywalker lives a restless life as a moisture farmer on Tatooine, dreaming of leaving for the Academy.",call:"Hidden in the droid R2-D2 is Princess Leia's plea for help, which Luke discovers and which draws him toward Obi-Wan Kenobi.",refusal:"Luke initially tells Obi-Wan he can't leave the farm to help \u2014 he has responsibilities to his uncle and aunt.",mentor:"Obi-Wan Kenobi trains Luke in the ways of the Force, gives him his father's lightsaber, and urges him to go to Alderaan.",threshold:"Finding his aunt and uncle murdered by Imperial stormtroopers, Luke has nothing left to return to and commits to leaving Tatooine with Obi-Wan.","tests-allies":"Luke recruits Han Solo and Chewbacca, journeys through Mos Eisley, and is thrust into the Death Star's array of dangers.",approach:"Aboard the Death Star, the group plans the rescue of Princess Leia and their escape, sharpening the stakes as Imperial forces close in.",ordeal:"Obi-Wan sacrifices himself in a duel with Darth Vader so the others can escape, a devastating loss at the mission's core.",reward:"The group escapes the Death Star with the stolen plans, delivering vital intelligence to the Rebel Alliance.","road-back":"Pursued by the Death Star itself, which is now bearing down on the Rebel base at Yavin 4, Luke commits to flying in the climactic assault.",resurrection:"In the trench run, Luke shuts off his targeting computer and uses the Force, as Obi-Wan's voice guides him, to fire the shot that destroys the Death Star.",elixir:"Luke returns a hero, decorated by Princess Leia before the assembled Rebellion, now a true Jedi-in-training carrying the Force's wisdom forward."}},{id:"jurassic-park-tobias-adventure-2",title:"Jurassic Park",creator:"dir. Steven Spielberg, 1993",appliesToType:"plotType",appliesToId:"tobias-adventure",bestStructureId:"seven-point",beats:{setup:"Skeptical scientists Alan Grant and Ellie Sattler are brought to a secret island where dinosaurs have been cloned back to life for a theme park.",rise:"A storm knocks out the park's systems, and a T-Rex escapes containment, scattering the visitors as danger mounts.",climax:"Stalked through darkened buildings by intelligent, cooperative velociraptors, the survivors must restore power to have any hope of escape.",fall:"The park is evacuated in ruins, and the survivors leave the island changed, having learned nature cannot be so easily controlled."},sections:{hook:"Paleontologists Alan Grant and Ellie Sattler are living modestly on dig-site funding, skeptical of any shortcut to understanding the past.","plot-turn-1":"John Hammond invites them to endorse his new island park, and they discover it's populated with cloned, living dinosaurs.","pinch-1":"A Tyrannosaurus rex breaks containment during a tour, in the middle of a violent tropical storm, showing how quickly the park's control can fail.",midpoint:"With systems down and the group split up, Grant, Sattler and the children shift from awed tourists to active survivors trying to reach safety.","pinch-2":"Velociraptors \u2014 smarter and more coordinated than any dinosaur before them \u2014 begin hunting the survivors through the visitor center's kitchens and corridors.","plot-turn-2":"Sattler and Hammond's rival programmer Arnold work out how to restore power and reset the park's security systems, giving the group a real chance to escape.",resolution:"The survivors escape the island as it's evacuated, Hammond humbled by the disaster, and Grant returning to a newly earned respect for nature's unpredictability."}},{id:"king-solomons-mines-tobias-adventure-3",title:"King Solomon's Mines",creator:"H. Rider Haggard, 1885",appliesToType:"plotType",appliesToId:"tobias-adventure",bestStructureId:"seven-point",beats:{setup:"Adventurer Allan Quatermain agrees to guide a party into unmapped African interior to find a lost brother and the mythical mines of King Solomon.",rise:"The party survives desert crossings and is drawn into a Kukuana civil war on the way to the fabled treasure.",climax:"Sealed inside the mine's treasure chamber by the sorceress Gagool, the party must find a way out before their air and light run out.",fall:"Escaping with diamonds and the lost brother found, Quatermain returns home wealthy, his adventuring life given one last triumphant chapter."},sections:{hook:"Hunter and adventurer Allan Quatermain lives a weathered, itinerant life in colonial Africa, uncertain of his purpose beyond the next expedition.","plot-turn-1":"Sir Henry Curtis hires Quatermain to help find his lost brother, last seen searching for the legendary diamond mines of King Solomon.","pinch-1":"Crossing a waterless desert, the party nearly dies of thirst, an early brush with the unforgiving land that guards the mines.",midpoint:"Reaching the kingdom of Kukuanaland, the party involves itself directly in a political struggle for the throne, sealing their commitment to the country's fate.","pinch-2":"Trapped inside the sealed treasure chamber of the mines by the treacherous witch-finder Gagool, the party faces death by suffocation among Solomon's ancient riches.","plot-turn-2":"A secret mechanism in the chamber, discovered just in time, allows the party to escape the sealed vault with what treasure they can carry.",resolution:"The party returns from Kukuanaland with diamonds and Sir Henry's rescued brother, Quatermain settling into a comfortable retirement funded by his adventure."}},{id:"no-country-tobias-pursuit-2",title:"No Country for Old Men",creator:"dir. Joel & Ethan Coen, 2007",appliesToType:"plotType",appliesToId:"tobias-pursuit",bestStructureId:"fichtean",beats:{setup:"Llewelyn Moss finds two million dollars at a desert drug-deal massacre and unwisely decides to keep it.",rise:"The implacable hitman Anton Chigurh hunts Moss across Texas using a tracker hidden in the cash, killing everyone between them.",climax:"Moss is killed by a third party before Chigurh can catch him, denying both hunter and audience the confrontation they expected.",fall:"Chigurh escapes consequence entirely, and Sheriff Bell, worn down by the senselessness of it all, quietly retires."},sections:{"crisis-1":"Llewelyn Moss stumbles on the aftermath of a drug deal gone wrong in the desert and takes the two million dollars in cash he finds there.","crisis-2":"Moss makes the fatal mistake of returning to the site at night with water for a dying man, and is spotted, drawing the hunters' attention directly to him.","crisis-3":"The relentless hitman Anton Chigurh begins tracking Moss across Texas motels, using a tracking device hidden in the money and killing anyone in his way.","crisis-4":"Chigurh corners and kills Moss's associates one by one, closing the net as Sheriff Bell trails behind, always a step late.",climax:"Moss is killed offscreen by a rival cartel crew before Chigurh even reaches him, an anticlimax that upends the expected final showdown.",resolution:"Chigurh survives a car accident and walks away, unpunished and unresolved, while Sheriff Bell retires, unsettled by a violence he can no longer make sense of."}},{id:"les-miserables-tobias-pursuit-3",title:"Les Mis\xE9rables",creator:"Victor Hugo, 1862",appliesToType:"plotType",appliesToId:"tobias-pursuit",bestStructureId:"fichtean",beats:{setup:"Jean Valjean breaks his parole to start a new life, drawing the lifelong attention of the unbending police inspector Javert.",rise:"Javert pursues Valjean across decades and cities, forcing him into hiding, disguise, and flight with his adopted daughter Cosette.",climax:"Captured at the barricades, Javert is spared by Valjean's mercy instead of being killed in revenge.",fall:"Unable to live with a debt of mercy from a man he's hunted his whole life, Javert takes his own life, ending the pursuit."},sections:{"crisis-1":"Ex-convict Jean Valjean breaks parole to build a new, respectable life, immediately putting him at odds with the law he's fleeing.","crisis-2":"Inspector Javert recognizes Valjean years later as Mayor Madeleine, forcing Valjean to reveal himself to save an innocent man wrongly arrested in his place.","crisis-3":"Valjean flees Javert through the streets and sewers of Paris with the orphaned Cosette, evading capture again and again over years of pursuit.","crisis-4":"Javert infiltrates the student barricades during the June Rebellion as a spy, only to be captured and left to Valjean's mercy.",climax:"Valjean, instead of killing Javert, lets him go free \u2014 an act of grace that shatters Javert's rigid worldview of law and justice.",resolution:"Unable to reconcile mercy with his lifelong devotion to the law, Javert drowns himself in the Seine, ending the chase forever."}},{id:"finding-nemo-tobias-rescue-2",title:"Finding Nemo",creator:"dir. Andrew Stanton, 2003",appliesToType:"plotType",appliesToId:"tobias-rescue",bestStructureId:"save-the-cat",beats:{setup:"An overprotective clownfish father, Marlin, loses his son Nemo to a diver who takes him from the reef.",rise:"Marlin crosses the ocean with the forgetful Dory, facing sharks, jellyfish, and false leads to find where Nemo has been taken.",climax:"Believing Nemo dead, Marlin nearly gives up, until Dory's insistence and a scrap of hope send him onward to the dentist's tank.",fall:"Nemo escapes the tank as Marlin arrives, and the reunited pair return home with Marlin finally able to let his son swim free."},sections:{"opening-image":"A clownfish nursery is destroyed by a barracuda attack, leaving Marlin a single father, overly protective of his one surviving egg, Nemo.","theme-stated":"Marlin tells young Nemo the ocean is too dangerous to explore, setting up the film's argument between protection and letting go.","set-up":"Nemo, self-conscious about his small fin, chafes against Marlin's constant fear and overprotection on his first day of school.",catalyst:"Defying his father, Nemo swims out to touch a boat and is captured by a diver, taken away from the reef entirely.",debate:"Marlin must decide whether to give up hope or set out into the vast, terrifying ocean he has always avoided.","break-into-two":"Marlin commits to the open ocean, leaving the reef behind to search for his son, with only fragments of information to go on.","b-story":"Marlin is joined by Dory, a forgetful blue tang whose optimism and short-term memory loss both help and hinder the journey, and who teaches him to keep swimming.","fun-and-games":"Marlin and Dory encounter sharks trying to reform their diets, a field of stinging jellyfish, and a sea turtle highway riding the East Australian Current.",midpoint:"Marlin and Dory learn Nemo is in a fish tank in a Sydney dentist's office, giving the search a concrete destination for the first time.","bad-guys-close":"Meanwhile Nemo, inside the tank, plans an escape with the tank's other fish, while the dentist prepares to give him to his niece Darla, notorious for killing fish.","all-is-lost":"Marlin, believing Nemo has died after a devastating encounter with an anglerfish, loses hope and starts to turn back.","dark-night":"Marlin swims away in despair, convinced his son is gone and that his fear was justified all along.","break-into-three":"Dory, aided by the momentary return of a friendly whale and her own fleeting memory, convinces Marlin that Nemo might still be alive.",finale:"Nemo escapes the tank into the harbor just as Marlin and Dory arrive, and father and son are reunited amid a fishing net crisis that Nemo helps solve.","final-image":"Nemo swims off to school on his own for the first time, with Marlin \u2014 visibly changed \u2014 letting him go."}},{id:"saving-private-ryan-tobias-rescue-3",title:"Saving Private Ryan",creator:"dir. Steven Spielberg, 1998",appliesToType:"plotType",appliesToId:"tobias-rescue",bestStructureId:"save-the-cat",beats:{setup:"After the brutal D-Day landings, Captain Miller's company is ordered to find and bring home Private Ryan, the last surviving brother of four.",rise:"The squad crosses dangerous territory, questioning the mission's cost, until they find Ryan defending a strategic bridge with his unit.",climax:"A massive German counterattack nearly overwhelms the small American force, and Miller is mortally wounded holding the position.",fall:"Air support saves the day and Ryan survives, living the rest of his life trying to be worthy of the sacrifice made to save him."},sections:{"opening-image":"The Normandy invasion opens in visceral chaos, soldiers slaughtered in the surf of Omaha Beach as they land.","theme-stated":"Captain Miller reflects that every man he loses under his command is a trade against getting closer home, foreshadowing the film's cost-benefit of one life for many.","set-up":"Miller's depleted company survives the landing, exhausted and hardened, unaware of the strange mission about to be handed to them.",catalyst:"Army command learns that three of the four Ryan brothers have died in combat and orders the surviving brother, Private James Ryan, found and sent home.",debate:"Miller and his men question the wisdom and morality of risking eight lives for one, resentful of a mission that feels arbitrary.","break-into-two":"The squad sets out across the Norman countryside into contested territory to search for Ryan, fully committed despite their doubts.","b-story":"Miller's growing bond with translator Corporal Upham, an inexperienced soldier who represents the war's moral confusion, carries the film's ethical questions.","fun-and-games":"The squad clears a radar station, argues over whether to risk their lives for strangers, and loses one of their own, showing the mounting cost of the mission.",midpoint:"The squad finally finds Private Ryan, who refuses to leave his remaining unit at a critical bridge they've been ordered to hold.","bad-guys-close":"A German counterattack builds against the small American position at the bridge in Ramelle, vastly outnumbering the defenders.","all-is-lost":"Miller is fatally wounded defending the bridge, and the American position seems on the verge of being overrun.","dark-night":"With Miller dying and ammunition nearly spent, the surviving soldiers face the real possibility that the mission \u2014 and their lives \u2014 end in failure.","break-into-three":"Air support arrives at the last possible moment, turning the tide of the battle at the bridge.",finale:`The German assault is broken, the bridge held, and Ryan survives \u2014 Miller's dying words urging him to "earn this" sacrifice.`,"final-image":"An elderly Ryan visits Miller's grave decades later, asking his wife to confirm he has lived a life worthy of what was given for him."}},{id:"great-escape-tobias-escape-2",title:"The Great Escape",creator:"dir. John Sturges, 1963",appliesToType:"plotType",appliesToId:"tobias-escape",bestStructureId:"weiland",beats:{setup:"Allied POWs in a high-security camp plan an audacious mass escape through three simultaneous tunnels.",rise:"German guards nearly discover the tunnels repeatedly, and one tunnel is destroyed, forcing everything onto the single remaining tunnel, Harry.",climax:"Seventy-six men escape through the short tunnel, triggering a massive German manhunt across occupied Europe.",fall:"Most escapees are recaptured and fifty executed, with only three reaching freedom \u2014 a costly but defiant blow against the captors."},sections:{hook:"Allied POWs are transferred to a supposedly escape-proof German camp, hardened escape artists among them, chafing at total confinement.",inciting:"The camp's senior officers decide on a mass escape of 250 men, an audacious plan meant to tie up German resources far beyond a simple breakout.","plot-point-1":"The prisoners commit to the plan, dividing labor to dig three tunnels \u2014 Tom, Dick, and Harry \u2014 simultaneously to guard against discovery.","pinch-1":'German guards ("ferrets") repeatedly search the huts and nearly discover the tunnels, forcing the prisoners to hide their work and improvise new methods.',midpoint:'Tunnel "Tom" is discovered and destroyed by the Germans, forcing the prisoners to gamble everything on finishing "Harry" alone.',"pinch-2":"Tunnel Harry comes up short of the tree line on the night of the escape, exposing the escapees to discovery in the open the moment they emerge.","plot-point-3":"Seventy-six men escape through Harry before the alarm is raised, scattering across occupied Europe by train, bicycle, and foot toward neutral countries.",climax:"The Germans mount a massive manhunt, and most escapees are recaptured; fifty are executed on Hitler's orders in reprisal.",resolution:"Only three men reach freedom, and the survivors are returned to a rebuilt camp, having proven the cost \u2014 and the defiance \u2014 of the escape."}},{id:"papillon-tobias-escape-3",title:"Papillon",creator:"Henri Charri\xE8re, 1969",appliesToType:"plotType",appliesToId:"tobias-escape",bestStructureId:"weiland",beats:{setup:"Wrongly convicted, Papillon arrives at a brutal penal colony determined to escape by any means, befriending a wealthy fellow convict.",rise:"Repeated escape attempts end in recapture and years of solitary confinement, each failure hardening his resolve rather than breaking it.",climax:"Exiled to the supposedly inescapable Devil's Island, Papillon studies the currents and leaps into the sea on a raft of coconuts.",fall:"He survives the crossing and reaches Venezuela, finally free after decades of unbroken determination."},sections:{hook:'Henri "Papillon" Charri\xE8re, wrongly convicted of murder, arrives at a brutal French penal colony in French Guiana, determined not to accept his sentence.',inciting:"Papillon befriends the wealthy counterfeiter Louis Dega, whose money can fund an escape neither man could manage alone.","plot-point-1":"Papillon commits to escape almost immediately, staging his first attempt not long after arrival, despite the near-impossible odds.","pinch-1":"Recaptured after his first escape, Papillon is sentenced to years in solitary confinement, brutal punishment meant to break his will entirely.",midpoint:"Surviving solitary confinement through sheer will, Papillon emerges more determined than ever, using a coconut-smuggling scheme to keep himself resourceful.","pinch-2":"A second escape attempt with fellow prisoners nearly fails when he's betrayed and recaptured yet again, landing him back in isolation for years.","plot-point-3":"Aged and worn down by repeated failure, Papillon is finally transferred to Devil's Island, seemingly inescapable due to its shark-infested waters.",climax:"Studying the ocean currents for months, Papillon builds a makeshift raft of coconuts and throws himself into the sea, trusting the waves to carry him to freedom.",resolution:"Papillon survives the crossing and reaches Venezuela, living out his life a free man, his decades of relentless attempts finally rewarded."}},{id:"hamlet-tobias-revenge-2",title:"Hamlet",creator:"William Shakespeare, c. 1600",appliesToType:"plotType",appliesToId:"tobias-revenge",bestStructureId:"freytag",beats:{setup:"Prince Hamlet learns from his father's ghost that his uncle Claudius murdered the king to seize the throne and queen.",rise:"Hamlet feigns madness and stages a play to confirm Claudius's guilt, while his own hesitation and rash acts spiral the court toward disaster.",climax:"A poisoned duel arranged by Claudius becomes the site of the story's reckoning, as betrayals compound in real time.",fall:"Hamlet, Laertes, Gertrude, and Claudius all die in the duel's aftermath, revenge achieved only at the cost of everyone involved."},sections:{exposition:"Prince Hamlet of Denmark mourns his father's death and is troubled by his mother's hasty remarriage to his uncle Claudius, the new king.","rising-action":"The ghost of Hamlet's father reveals that Claudius murdered him, and Hamlet feigns madness while devising a plan \u2014 a staged play \u2014 to confirm Claudius's guilt.",climax:"Hamlet's confrontation with his mother and his accidental killing of Polonius spirals events out of control, as Claudius moves to have Hamlet killed in England.","falling-action":"Ophelia's madness and drowning, Laertes's fury for his father and sister, and a poisoned duel arranged by Claudius all converge toward catastrophe.",denouement:"In the final duel, Hamlet, Laertes, Gertrude, and Claudius all die, with Hamlet finally exacting his revenge in the same stroke that ends his own life."}},{id:"kill-bill-tobias-revenge-3",title:"Kill Bill",creator:"dir. Quentin Tarantino, 2003\u201304",appliesToType:"plotType",appliesToId:"tobias-revenge",bestStructureId:"freytag",beats:{setup:"Left for dead at her own wedding by her former assassin crew, the Bride wakes from a coma determined to kill everyone responsible, starting with their leader, Bill.",rise:"She hunts down and kills her former colleagues one by one, working her way up the list toward Bill himself.",climax:"Arriving at Bill's compound, the Bride discovers her daughter is alive, complicating the vengeance she has planned for years.",fall:"She kills Bill with a secret technique, completing her revenge and reclaiming her daughter, though the cost of her mission lingers."},sections:{exposition:"The Bride, a former assassin, wakes from a four-year coma after being shot and left for dead at her own wedding by her old crew and their leader, Bill.","rising-action":'The Bride compiles a "Death List Five" and methodically tracks down and confronts each member of her former squad who betrayed her, including O-Ren Ishii and Vernita Green.',climax:"Working through Budd and Elle Driver with escalating brutality, the Bride closes in on Bill himself, the architect of her betrayal and the father of the child she believed lost.","falling-action":"Reaching Bill's compound, the Bride learns her daughter, B.B., is alive and has been raised by Bill, complicating the revenge she's spent years pursuing.",denouement:'The Bride kills Bill using the deadly "Five Point Palm Exploding Heart Technique" and leaves with her daughter, her revenge complete but her future uncertain.'}},{id:"name-of-the-rose-tobias-riddle-2",title:"The Name of the Rose",creator:"Umberto Eco, 1980",appliesToType:"plotType",appliesToId:"tobias-riddle",bestStructureId:"eight-sequence",beats:{setup:"A Franciscan friar investigates a suspicious death at a medieval abbey, drawn into a mystery tied to its vast, forbidden library.",rise:"More monks die in seemingly apocalyptic fashion as the friar narrows his search to a single dangerous, hidden book.",climax:"He confronts the librarian guarding the book, a poisoned copy of a lost Aristotle text, as fire engulfs the library.",fall:"The murderer dies by his own poison and the library burns, the mystery's answer arriving just as it becomes unrecoverable."},sections:{"status-quo":"Franciscan friar William of Baskerville arrives at a wealthy Italian abbey in 1327 just as a monk is found dead under mysterious circumstances.",predicament:"The abbot asks William to investigate discreetly before a delegation on Church business arrives, locking William into solving the murder under a deadline.","obstacle-1":"William and his novice Adso question the monks and discover the abbey's labyrinthine library holds forbidden and closely guarded books.","stakes-1":"More monks die in bizarre ways, seemingly tied to an old prophecy about the apocalypse, raising fears of a supernatural cause among the brothers.",midpoint:"William deduces the deaths are connected to a single forbidden book in the library, shifting his investigation from broad suspicion to a specific, hidden text.","stakes-2":"The blind librarian Jorge is revealed as guarding an ancient, poisoned copy of Aristotle's lost treatise on comedy, believed by him to be dangerous to faith itself.",culmination:"A fire breaks out in the library as William confronts Jorge, threatening to destroy the abbey's entire irreplaceable collection.",climax:"William survives the confrontation and Jorge's suicide by poison, but the library and its secrets burn beyond saving, the riddle solved too late to prevent catastrophe."}},{id:"knives-out-tobias-riddle-3",title:"Knives Out",creator:"dir. Rian Johnson, 2019",appliesToType:"plotType",appliesToId:"tobias-riddle",bestStructureId:"eight-sequence",beats:{setup:"Detective Benoit Blanc investigates the apparent suicide of a wealthy novelist, suspecting the death was actually murder.",rise:"He uncovers each family member's motive while his unlikely ally, nurse Marta, tries to hide her own accidental role in the death.",climax:"Blanc reconstructs the true sequence of events, revealing that a scheming grandson framed Marta to secure the inheritance.",fall:"Marta turns the truth back on the real culprit, who is arrested, while she rightfully inherits the estate."},sections:{"status-quo":"Wealthy crime novelist Harlan Thrombey is found dead the morning after his 85th birthday party, an apparent suicide.",predicament:"Private detective Benoit Blanc, anonymously hired, arrives to investigate what he suspects is actually murder, locking the entire extended Thrombey family into his inquiry.","obstacle-1":"Blanc interviews each family member, uncovering a web of financial motives and lies, while nurse Marta Cabrera \u2014 who can't lie without vomiting \u2014 becomes his unlikely partner.","stakes-1":"Marta reveals she accidentally gave Harlan a fatal overdose, and the two work together to cover it up, raising the personal stakes of the investigation.",midpoint:`Blanc reveals he's suspected Marta's involvement all along, shifting the mystery from "who did it" to whether she'll be exposed and what really happened that night.`,"stakes-2":"A rival investigator's blackmail scheme and Ransom Drysdale's manipulations threaten to expose Marta and derail the inheritance entirely.",culmination:"Blanc reconstructs the full sequence of events, revealing that Ransom orchestrated the death to frame Marta and secure the inheritance himself.",climax:"Marta confronts Ransom with the truth, using his own scheme's holes against him, and he's arrested as the true culprit."}},{id:"wuthering-heights-tobias-rivalry-2",title:"Wuthering Heights",creator:"Emily Bront\xEB, 1847",appliesToType:"plotType",appliesToId:"tobias-rivalry",bestStructureId:"frame-narrative",beats:{setup:"A tenant hears the tangled history of Wuthering Heights from housekeeper Nelly Dean after an unsettling encounter with its reclusive owner.",rise:"The story reveals young Heathcliff's love for Catherine Earnshaw, his rejection for a wealthier suitor, and the rivalry-driven revenge he wages on both families afterward.",climax:"Heathcliff's manipulations destroy a second generation, ensnaring Hindley's son and Catherine's daughter in his campaign of retribution.",fall:"The tenant learns Heathcliff has died, his obsessive rivalry finally spent, and leaves the moors having heard the full, bitter history."},sections:{"enter-frame":"Mr. Lockwood, a new tenant at Thrushcross Grange, visits his reclusive landlord Heathcliff at Wuthering Heights and experiences a strange, unsettling night there.","frame-setup":"Unsettled by a ghostly vision of Catherine at the window, Lockwood asks his housekeeper, Nelly Dean, to explain the history of the strange household.","inner-begins":"Nelly recounts how orphan Heathcliff was brought to Wuthering Heights and formed an intense bond with Catherine Earnshaw, resented by her jealous brother Hindley.","inner-develops":"Catherine, pressured by class expectations, marries the genteel Edgar Linton instead of Heathcliff, who leaves and returns wealthy, seeking a rivalry-fueled revenge on both families.","inner-resolves":"Heathcliff's campaign of manipulation ruins Hindley, traps young Cathy in a punishing marriage, and consumes a second generation before his own obsession finally exhausts him.","return-frame":"Nelly's story catches up to the present, explaining to Lockwood the ghostly presence and the tangled, embittered relationships he's witnessed at the Heights.","frame-closes":"Lockwood leaves the moors having heard the whole tragic history, and learns that Heathcliff has since died, finally reunited with Catherine's memory at last."}},{id:"princess-bride-tobias-rivalry-3",title:"The Princess Bride",creator:"William Goldman, 1973",appliesToType:"plotType",appliesToId:"tobias-rivalry",bestStructureId:"frame-narrative",beats:{setup:"A grandfather reads his reluctant grandson a fairy tale about farm girl Buttercup and her lost love Westley.",rise:"Buttercup, now engaged to the villainous Prince Humperdinck, is rescued by a mysterious masked swordsman who turns out to be Westley returned.",climax:"Westley confronts Humperdinck directly, surviving torture and toxin to win the final duel for Buttercup.",fall:"The grandfather closes the book on the lovers' escape, and his once-skeptical grandson asks to hear it again."},sections:{"enter-frame":"A grandfather visits his sick grandson and offers to read him a book his own father once read to him, over the boy's initial reluctance.","frame-setup":"The grandson, skeptical of a story with kissing in it, agrees to listen, setting the stage for the fairy-tale rivalry to unfold.","inner-begins":"Farm girl Buttercup falls in love with farmhand Westley, who leaves to seek his fortune and is reportedly killed by the pirate Roberts.","inner-develops":"Buttercup, now engaged to the cruel Prince Humperdinck, is kidnapped, and a mysterious masked man \u2014 revealed as Westley \u2014 battles Humperdinck's men and allies to reach her.","inner-resolves":"Westley confronts Humperdinck directly, surviving torture and near-death to defeat his rival for Buttercup's hand once and for all.","return-frame":"The grandfather pauses the story at its tense moments, and the grandson, now hooked, begs to know what happens next.","frame-closes":"The grandfather finishes the tale of Westley and Buttercup's escape and asks to come back tomorrow to read it again, the grandson happily agreeing."}},{id:"karate-kid-tobias-underdog-2",title:"The Karate Kid",creator:"dir. John G. Avildsen, 1984",appliesToType:"plotType",appliesToId:"tobias-underdog",bestStructureId:"story-circle",beats:{setup:"New kid Daniel LaRusso, bullied by the Cobra Kai dojo, is taken under the wing of the mysterious handyman Mr. Miyagi.",rise:"Miyagi's strange chore-based training secretly builds Daniel's karate skills, preparing him without his even realizing it.",climax:"Daniel enters the All Valley Tournament against his tormentors, absorbing brutal treatment on the way to the final match.",fall:"Using the crane kick Miyagi taught him, Daniel wins the tournament, transformed from bullied outsider to confident champion."},sections:{you:"Daniel LaRusso is a scrawny new kid in a Los Angeles neighborhood, out of place and quickly targeted by the aggressive Cobra Kai dojo bullies.",need:"Daniel needs to learn to defend himself, both physically and to reclaim his sense of dignity and belonging in his new home.",go:"Rescued from a beating by the building handyman, Mr. Miyagi, Daniel enters a world of karate training he doesn't yet understand.",search:"Daniel struggles through Miyagi's unconventional training \u2014 waxing cars, painting fences, sanding floors \u2014 frustrated that it doesn't look like karate at all.",find:"Daniel discovers that Miyagi's chores have secretly trained his muscle memory into real karate technique, and his skills finally click into place.",take:"Daniel must enter the All Valley Karate Tournament against Cobra Kai's best fighters, absorbing brutal hits along the way, including an illegal blow to his injured knee.",return:"Battered but undeterred, Daniel returns to the mat for the final match against his chief tormentor, Johnny.",change:'Using the unorthodox "crane kick" Miyagi taught him, Daniel wins the tournament, having transformed from victim into a confident, capable young man.'}},{id:"hoosiers-tobias-underdog-3",title:"Hoosiers",creator:"dir. David Anspaugh, 1986",appliesToType:"plotType",appliesToId:"tobias-underdog",bestStructureId:"story-circle",beats:{setup:"Outsider coach Norman Dale takes over a tiny high school basketball team in rural Indiana, met with skepticism from the town.",rise:"His strict, fundamentals-based coaching alienates fans at first, but slowly unites the team into a competitive unit.",climax:"Hickory advances improbably through the state tournament, culminating in a championship game against a far larger school.",fall:"Using the exact fundamentals and measurements Dale trained them on, tiny Hickory wins the state title, vindicating the coach and the town."},sections:{you:"Coach Norman Dale arrives to lead the tiny Hickory High basketball team in rural Indiana, a town skeptical of his outsider past and unconventional methods.",n
