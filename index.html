(()=>{var k={setup:{label:"Setup",color:"#5FA8A0"},rise:{label:"Rising Action",color:"#E9C88A"},climax:{label:"Confrontation",color:"#D2785A"},fall:{label:"Resolution",color:"#8E7CC3"}},N=[{id:"three-act",name:"Three-Act Structure",blurb:"The workhorse: setup, confrontation, resolution. Good default for almost any story.",beats:[{id:"status-quo",name:"Opening Image",pct:5,act:"setup",threeAct:1,guide:"The world before the story disturbs it. What's the ordinary, in one image or scene?",ex:"Quiet village morning"},{id:"inciting",name:"Inciting Incident",pct:7,act:"setup",threeAct:1,guide:"The event that makes the story start. What breaks the ordinary world open?",ex:"Dragon attacks village"},{id:"plot-point-1",name:"Reaction to Incident",pct:8,act:"setup",threeAct:1,guide:"The point of no return \u2014 the protagonist commits to the journey.",ex:"Hero grabs sword"},{id:"rising",name:"Getting Friends",pct:20,act:"rise",threeAct:2,guide:"Obstacles escalate, stakes climb, the protagonist learns the rules of the new world.",ex:"Gathers allies, trains"},{id:"midpoint",name:"Extent of the Evil",pct:8,act:"rise",threeAct:2,guide:"A false victory or false defeat that shifts the story's direction and raises the stakes.",ex:"Discovers evil's scale"},{id:"plot-point-2",name:"Almost Failure",pct:12,act:"climax",threeAct:2,guide:"Everything falls apart. The lowest point, right before the final push.",ex:"Ally betrays hero"},{id:"climax",name:"Final Fight",pct:15,act:"climax",threeAct:3,guide:"The final confrontation. The protagonist's central struggle is decided here.",ex:"Duels dragon alone"},{id:"resolution",name:"Resolution",pct:25,act:"fall",threeAct:3,guide:"The new normal. Loose threads tie off and the story's change is shown, not told.",ex:"Village rebuilds, thrives"}]},{id:"save-the-cat",name:"Save the Cat! (15 beats)",blurb:"Blake Snyder's screenwriting beat sheet \u2014 precise, percentage-mapped, plot-heavy.",beats:[{id:"opening-image",name:"Opening Image",pct:1,act:"setup",threeAct:1,guide:"A snapshot of the 'before' \u2014 tone, mood, the problem the protagonist doesn't see yet.",ex:"Quiet village morning"},{id:"theme-stated",name:"Theme Stated",pct:4,act:"setup",threeAct:1,guide:"Someone (usually not the hero) says the story's real argument out loud, in passing.",ex:"Courage over fear"},{id:"set-up",name:"Set-Up",pct:5,act:"setup",threeAct:1,guide:"Introduce the hero's flaws, world, and stakes \u2014 everything the story is about to upend.",ex:"Farmer fears dragons"},{id:"catalyst",name:"Catalyst",pct:1,act:"setup",threeAct:1,guide:"The telegram, the firing, the knock at the door \u2014 the moment life changes.",ex:"Dragon burns barn"},{id:"debate",name:"Debate",pct:9,act:"setup",threeAct:1,guide:"Should the hero go? The last chance to say no before the story truly begins.",ex:"Should I go?"},{id:"break-into-two",name:"Break Into Two",pct:2,act:"rise",threeAct:2,guide:"The hero chooses (or is forced) to leave the old world and enter the new one.",ex:"Leaves the farm"},{id:"b-story",name:"B Story",pct:4,act:"rise",threeAct:2,guide:"A new relationship enters, usually carrying the story's theme.",ex:"Meets fellow warrior"},{id:"fun-and-games",name:"Fun and Games",pct:19,act:"rise",threeAct:2,guide:"The 'promise of the premise' \u2014 the trailer moments, playing in the new world.",ex:"Trains, tracks, jokes"},{id:"midpoint",name:"Midpoint",pct:1,act:"rise",threeAct:2,guide:"A false victory or false defeat. Stakes rise from personal to life-and-death.",ex:"Finds dragon's lair"},{id:"bad-guys-close",name:"Bad Guys Close In",pct:11,act:"climax",threeAct:2,guide:"Internal doubts and external pressure both close in on the hero.",ex:"Elders lose hope"},{id:"all-is-lost",name:"All Is Lost",pct:1,act:"climax",threeAct:2,guide:"The opposite of the midpoint's win \u2014 often a 'whiff of death', literal or symbolic.",ex:"Warrior friend dies"},{id:"dark-night",name:"Dark Night of the Soul",pct:4,act:"climax",threeAct:2,guide:"The hero sits in the wreckage before finding the way forward.",ex:"Grieves, nearly quits"},{id:"break-into-three",name:"Break Into Three",pct:2,act:"fall",threeAct:3,guide:"The A and B stories combine to hand the hero the solution.",ex:"Remembers warrior's lesson"},{id:"finale",name:"Finale",pct:15,act:"fall",threeAct:3,guide:"The hero applies what they learned to defeat the antagonist and fix the world.",ex:"Defeats the dragon"},{id:"final-image",name:"Final Image",pct:1,act:"fall",threeAct:3,guide:"A mirror of the opening image, showing exactly how much has changed.",ex:"Village rebuilds, thrives"}]},{id:"hero-journey",name:"The Hero's Journey",blurb:"Campbell / Vogler's 12-stage monomyth \u2014 myth, fantasy and quest stories.",beats:[{id:"ordinary-world",name:"Ordinary World",pct:8,act:"setup",threeAct:1,guide:"The hero's normal life, and what's missing or unresolved in it.",ex:"Quiet village morning"},{id:"call",name:"Call to Adventure",pct:6,act:"setup",threeAct:1,guide:"A problem or challenge is presented \u2014 the story's invitation.",ex:"Dragon attacks village"},{id:"refusal",name:"Refusal of the Call",pct:5,act:"setup",threeAct:1,guide:"Fear or doubt makes the hero hesitate, reluctant to change.",ex:"Hero refuses, afraid"},{id:"mentor",name:"Meeting the Mentor",pct:6,act:"setup",threeAct:1,guide:"A guide offers wisdom, training, or an item that prepares the hero.",ex:"Old warrior teaches"},{id:"threshold",name:"Crossing the Threshold",pct:5,act:"rise",threeAct:1,guide:"The hero commits and leaves the ordinary world behind for good.",ex:"Leaves the village"},{id:"tests-allies",name:"Tests, Allies, Enemies",pct:14,act:"rise",threeAct:2,guide:"The new world is explored \u2014 friends, rivals and the rules are learned the hard way.",ex:"Makes allies, enemies"},{id:"approach",name:"Approach to the Inmost Cave",pct:8,act:"rise",threeAct:2,guide:"Preparation for the central ordeal; the plan is made and the stakes sharpen.",ex:"Plans the assault"},{id:"ordeal",name:"Ordeal",pct:10,act:"climax",threeAct:2,guide:"The hero's greatest fear or crisis \u2014 a life-or-death, all-or-nothing moment.",ex:"Faces the dragon"},{id:"reward",name:"Reward",pct:8,act:"climax",threeAct:2,guide:"Having survived, the hero seizes what they came for \u2014 but it comes at a cost.",ex:"Claims dragon's treasure"},{id:"road-back",name:"The Road Back",pct:8,act:"climax",threeAct:2,guide:"The hero commits to finishing the journey; the consequences of the ordeal chase them.",ex:"Danger follows home"},{id:"resurrection",name:"Resurrection",pct:12,act:"fall",threeAct:3,guide:"A final, larger test where everything learned is proven \u2014 a true climax.",ex:"Final desperate stand"},{id:"elixir",name:"Return with the Elixir",pct:10,act:"fall",threeAct:3,guide:"The hero returns changed, bringing something of value back to the ordinary world.",ex:"Brings peace home"}]},{id:"freytag",name:"Freytag's Pyramid",blurb:"The classic five-part dramatic arc \u2014 simple, stage-friendly, tragedy's native shape.",beats:[{id:"exposition",name:"Exposition",pct:15,act:"setup",threeAct:1,guide:"Establish characters, setting and the world's status quo.",ex:"Quiet village morning"},{id:"rising-action",name:"Rising Action",pct:30,act:"rise",threeAct:2,guide:"A series of complicating events builds tension toward the climax.",ex:"Dragon threat grows"},{id:"climax",name:"Climax",pct:15,act:"climax",threeAct:2,guide:"The turning point \u2014 the moment of highest tension, where fortune reverses.",ex:"Hero fights dragon"},{id:"falling-action",name:"Falling Action",pct:25,act:"climax",threeAct:3,guide:"Consequences of the climax play out; tension unwinds toward the ending.",ex:"Dragon's power fades"},{id:"denouement",name:"Denouement",pct:15,act:"fall",threeAct:3,guide:"Loose ends resolve and the story's new equilibrium is shown.",ex:"Peace returns finally"}]},{id:"seven-point",name:"Seven-Point Story Structure",blurb:"Dan Wells' structure, built backward from the ending \u2014 good for tight plotting.",beats:[{id:"hook",name:"Hook",pct:8,act:"setup",threeAct:1,guide:"The opposite of the resolution \u2014 establish where the character starts, in contrast to where they'll end.",ex:"Hero fears dragons"},{id:"plot-turn-1",name:"Plot Turn 1",pct:12,act:"setup",threeAct:1,guide:"An event introduces the main conflict and moves the character out of the hook state.",ex:"Dragon attacks village"},{id:"pinch-1",name:"Pinch Point 1",pct:15,act:"rise",threeAct:2,guide:"Pressure is applied \u2014 often the antagonist's power is shown, forcing the character to act.",ex:"Dragon burns fields"},{id:"midpoint",name:"Midpoint",pct:12,act:"rise",threeAct:2,guide:"The character moves from reaction to action \u2014 passive to proactive.",ex:"Hero chooses action"},{id:"pinch-2",name:"Pinch Point 2",pct:15,act:"climax",threeAct:2,guide:"More pressure, often a major loss, that removes the character's safety net entirely.",ex:"Mentor is killed"},{id:"plot-turn-2",name:"Plot Turn 2",pct:13,act:"climax",threeAct:3,guide:"The final piece the character needs to resolve the conflict is found.",ex:"Finds dragon's weakness"},{id:"resolution",name:"Resolution",pct:25,act:"fall",threeAct:3,guide:"The character, now changed, resolves the conflict \u2014 the mirror of the hook.",ex:"Hero defeats dragon"}]},{id:"kishotenketsu",name:"Kish\u014Dtenketsu",blurb:"A four-act East Asian narrative structure driven by contrast, not conflict.",beats:[{id:"ki",name:"Ki (Introduction)",pct:25,act:"setup",threeAct:1,guide:"Introduce the characters and situation, unhurried \u2014 no problem needs to appear yet.",ex:"Village bakes bread"},{id:"sho",name:"Sh\u014D (Development)",pct:30,act:"rise",threeAct:2,guide:"Develop what was introduced; deepen the reader's understanding of the situation.",ex:"Baker befriends traveler"},{id:"ten",name:"Ten (Twist)",pct:25,act:"climax",threeAct:3,guide:"An unexpected, often unrelated element recontextualises everything that came before.",ex:"Traveler is dragon"},{id:"ketsu",name:"Ketsu (Conclusion)",pct:20,act:"fall",threeAct:3,guide:"Reconcile the twist with the rest of the story into a single, resolved whole.",ex:"Village welcomes dragon"}]},{id:"fichtean",name:"Fichtean Curve",blurb:"No slow build \u2014 opens already in conflict, then a rising series of crises to the climax.",beats:[{id:"crisis-1",name:"Opening Crisis",pct:10,act:"setup",threeAct:1,guide:"Skip the calm-before \u2014 open already inside a conflict; the 'before' comes out sideways, later, if at all.",ex:"Dragon burns village"},{id:"crisis-2",name:"Crisis Two",pct:15,act:"rise",threeAct:1,guide:"A second crisis, arriving fast, reveals the shape of the larger problem.",ex:"Second attack strikes"},{id:"crisis-3",name:"Crisis Three",pct:18,act:"rise",threeAct:2,guide:"Each crisis raises the stakes higher than the last \u2014 no plateau, no breathing room.",ex:"Allies start dying"},{id:"crisis-4",name:"Crisis Four",pct:20,act:"climax",threeAct:2,guide:"The pressure peaks just short of the climax \u2014 the worst point before the final crisis.",ex:"Village nearly falls"},{id:"climax",name:"Climax",pct:20,act:"climax",threeAct:3,guide:"The largest crisis of all, where the central conflict is finally decided.",ex:"Hero faces dragon"},{id:"resolution",name:"Resolution",pct:17,act:"fall",threeAct:3,guide:"A brief denouement \u2014 the Fichtean curve spends almost no time here.",ex:"Peace, briefly restored"}]},{id:"story-circle",name:"Dan Harmon's Story Circle",blurb:"Campbell's monomyth compressed to 8 equal steps, built explicitly as a circle.",beats:[{id:"you",name:"You",pct:12,act:"setup",threeAct:1,guide:"A character in their zone of comfort.",ex:"Farmer tends fields"},{id:"need",name:"Need",pct:13,act:"setup",threeAct:1,guide:"They want something.",ex:"Wants safety, purpose"},{id:"go",name:"Go",pct:13,act:"rise",threeAct:1,guide:"They enter an unfamiliar situation.",ex:"Leaves the farm"},{id:"search",name:"Search",pct:12,act:"rise",threeAct:2,guide:"They adapt to it.",ex:"Learns to fight"},{id:"find",name:"Find",pct:12,act:"rise",threeAct:2,guide:"They get what they wanted.",ex:"Finds dragon's lair"},{id:"take",name:"Take",pct:12,act:"climax",threeAct:2,guide:"They pay a heavy price for it.",ex:"Loses a friend"},{id:"return",name:"Return",pct:13,act:"climax",threeAct:3,guide:"They return to the familiar situation.",ex:"Returns to village"},{id:"change",name:"Change",pct:13,act:"fall",threeAct:3,guide:"Now capable of change, having changed.",ex:"Villagers see change"}]},{id:"eight-sequence",name:"Eight-Sequence Structure",blurb:"Frank Daniel's film-school standard: eight roughly equal mini-movies, each with its own turn.",beats:[{id:"status-quo",name:"Status Quo & Inciting Incident",pct:12,act:"setup",threeAct:1,guide:"Establish the world, then break it.",ex:"Dragon attacks village"},{id:"predicament",name:"Predicament",pct:12,act:"setup",threeAct:1,guide:"Lock the protagonist into a goal they can't walk away from.",ex:"Vows to fight"},{id:"obstacle-1",name:"First Obstacle",pct:13,act:"rise",threeAct:1,guide:"The first real attempt runs into trouble.",ex:"First attack fails"},{id:"stakes-1",name:"Raising the Stakes",pct:13,act:"rise",threeAct:2,guide:"Complications mount on the way to the midpoint.",ex:"Village losses mount"},{id:"midpoint",name:"Midpoint Reversal",pct:12,act:"rise",threeAct:2,guide:"A turn that changes the direction of the plan.",ex:"Learns dragon's weakness"},{id:"stakes-2",name:"Raising the Stakes Further",pct:13,act:"climax",threeAct:2,guide:"Pressure builds again, worse than before.",ex:"Dragon hunts hero"},{id:"culmination",name:"Main Culmination",pct:12,act:"climax",threeAct:3,guide:"The crisis point just before the climax.",ex:"Final plan forms"},{id:"climax",name:"Climax & Resolution",pct:13,act:"fall",threeAct:3,guide:"The conflict is decided, and the new world is shown.",ex:"Dragon defeated finally"}]},{id:"weiland",name:"Weiland's Structure",blurb:"A novelist's refinement of the three-act paradigm, with 'pinch points' keeping the antagonist's threat visible throughout.",beats:[{id:"hook",name:"Hook",pct:3,act:"setup",threeAct:1,guide:"A small opening scene that shows the protagonist's normal world and a hint of their flaw.",ex:"Farmer avoids conflict"},{id:"inciting",name:"Inciting Event",pct:9,act:"setup",threeAct:1,guide:"The event that sets the story in motion, though the protagonist doesn't yet fully engage.",ex:"Dragon attacks village"},{id:"plot-point-1",name:"First Plot Point",pct:13,act:"setup",threeAct:1,guide:"The protagonist commits, crossing into the main conflict for good.",ex:"Hero grabs sword"},{id:"pinch-1",name:"First Pinch Point",pct:12,act:"rise",threeAct:2,guide:"A reminder of the antagonist's power \u2014 no direct confrontation yet, just a taste of the threat.",ex:"Dragon's shadow passes"},{id:"midpoint",name:"Midpoint",pct:13,act:"rise",threeAct:2,guide:"The protagonist moves from reacting to acting, often via a piece of new information.",ex:"Learns dragon's weakness"},{id:"pinch-2",name:"Second Pinch Point",pct:12,act:"climax",threeAct:2,guide:"Another reminder of the antagonist's power, now sharper \u2014 things are worse than the first pinch point.",ex:"Dragon burns fields"},{id:"plot-point-3",name:"Third Plot Point",pct:13,act:"climax",threeAct:3,guide:"A low point \u2014 often a false defeat \u2014 that forces the protagonist's final resolve.",ex:"Ally is lost"},{id:"climax",name:"Climax",pct:15,act:"climax",threeAct:3,guide:"The final confrontation, where the protagonist's arc and the plot's conflict resolve together.",ex:"Duels dragon alone"},{id:"resolution",name:"Resolution",pct:10,act:"fall",threeAct:3,guide:"The new normal, shown rather than explained.",ex:"Village rebuilds anew"}]},{id:"truby-22",name:"Truby's 22 Steps",blurb:"John Truby's granular structure, built around a moral argument the protagonist is forced to test.",beats:[{id:"self-rev-preview",name:"Self-Revelation, Need, Desire",pct:4,act:"setup",threeAct:1,guide:"A glimpse of the change to come \u2014 often not shown to the audience directly, but present as the story's underlying shape.",ex:"Hero fears failure"},{id:"ghost",name:"Ghost and Story World",pct:4,act:"setup",threeAct:1,guide:"The wound in the protagonist's past, and the ordinary world shaped around it.",ex:"Village fears dragons"},{id:"weakness",name:"Weakness and Need",pct:4,act:"setup",threeAct:1,guide:"The flaw the protagonist must overcome, and the deeper psychological need beneath their surface want.",ex:"Hero avoids conflict"},{id:"inciting",name:"Inciting Event",pct:6,act:"setup",threeAct:1,guide:"The event that starts the story's action.",ex:"Dragon attacks village"},{id:"desire",name:"Desire",pct:4,act:"setup",threeAct:1,guide:"The concrete goal the protagonist consciously pursues.",ex:"Vows to fight"},{id:"allies",name:"Ally or Allies",pct:4,act:"rise",threeAct:1,guide:"Characters who help the protagonist pursue their desire.",ex:"Gathers loyal friends"},{id:"opponent",name:"Opponent and/or Mystery",pct:4,act:"rise",threeAct:1,guide:"The person or force blocking the protagonist, or the puzzle they must solve.",ex:"Dragon's lair hidden"},{id:"fake-ally",name:"Fake-Ally Opponent",pct:4,act:"rise",threeAct:2,guide:"An apparent ally who is secretly working against the protagonist.",ex:"Trusted friend betrays"},{id:"first-rev",name:"First Revelation and Decision",pct:4,act:"rise",threeAct:2,guide:"New information forces the protagonist to change their desire or approach.",ex:"Learns the truth"},{id:"plan",name:"Plan",pct:6,act:"rise",threeAct:2,guide:"How the protagonist intends to get what they want.",ex:"Devises a strategy"},{id:"opp-plan",name:"Opponent's Plan and Main Counterattack",pct:4,act:"rise",threeAct:2,guide:"The opposition's own plan, and its first real counterattack.",ex:"Dragon strikes back"},{id:"drive",name:"Drive",pct:6,act:"climax",threeAct:2,guide:"A concentrated string of actions as the protagonist pursues the plan.",ex:"Pushes toward goal"},{id:"attack-ally",name:"Attack by Ally",pct:4,act:"climax",threeAct:2,guide:"Pressure or betrayal from within the protagonist's own camp.",ex:"Ally turns against"},{id:"apparent-defeat",name:"Apparent Defeat",pct:6,act:"climax",threeAct:2,guide:"The protagonist appears to have lost completely.",ex:"All seems lost"},{id:"second-rev",name:"Second Revelation and Decision",pct:4,act:"climax",threeAct:2,guide:"Another revelation drives an even more determined, sometimes obsessive, pursuit.",ex:"Renews desperate resolve"},{id:"audience-rev",name:"Audience Revelation",pct:4,act:"climax",threeAct:3,guide:"Information revealed to the audience that the characters don't yet know.",ex:"Reader learns truth"},{id:"third-rev",name:"Third Revelation and Decision",pct:4,act:"climax",threeAct:3,guide:"A final piece of information sets up the last decision before the climax.",ex:"Finds hidden weakness"},{id:"gate",name:"Gate, Gauntlet, Visit to Death",pct:6,act:"climax",threeAct:3,guide:"The last, hardest obstacles standing between the protagonist and the final battle.",ex:"Faces near-certain death"},{id:"battle",name:"Battle",pct:6,act:"climax",threeAct:3,guide:"The final confrontation between protagonist and opponent.",ex:"Duels dragon alone"},{id:"self-rev",name:"Self-Revelation",pct:4,act:"fall",threeAct:3,guide:"The protagonist finally understands their own weakness and need.",ex:"Sees his flaw"},{id:"moral",name:"Moral Decision",pct:4,act:"fall",threeAct:3,guide:"A final choice that proves the protagonist's change is real.",ex:"Chooses to forgive"},{id:"new-equilibrium",name:"New Equilibrium",pct:4,act:"fall",threeAct:3,guide:"The world settles into its new, changed state.",ex:"Village rebuilds, thrives"}]},{id:"pixar-spine",name:"Pixar Story Spine",blurb:"The short-pitch template behind most Pixar shorts \u2014 status quo through consequence to a new normal.",beats:[{id:"once-upon",name:"Once Upon a Time",pct:8,act:"setup",threeAct:1,guide:"Establish who the protagonist is and the world they live in.",ex:"Farmer tends fields"},{id:"every-day",name:"Every Day",pct:12,act:"setup",threeAct:1,guide:"Show their routine \u2014 what 'normal' looks like before the story disturbs it.",ex:"Same chores, daily"},{id:"until-one-day",name:"Until One Day",pct:10,act:"setup",threeAct:1,guide:"The event that breaks the routine and starts the story.",ex:"Dragon attacks village"},{id:"because-1",name:"Because of That",pct:20,act:"rise",threeAct:2,guide:"The first consequence of that event, and what the protagonist does about it.",ex:"Hero seeks help"},{id:"because-2",name:"Because of That",pct:20,act:"rise",threeAct:2,guide:"A second consequence, escalating further \u2014 the chain of cause and effect keeps building.",ex:"Gathers allies, trains"},{id:"until-finally",name:"Until Finally",pct:15,act:"climax",threeAct:3,guide:"The climax \u2014 the final action that resolves the chain of consequences.",ex:"Duels dragon alone"},{id:"ever-since",name:"Ever Since Then",pct:15,act:"fall",threeAct:3,guide:"The new normal, and how it differs from the routine at the start.",ex:"Village lives free"}]},{id:"virgins-promise",name:"The Virgin's Promise",blurb:"Kim Hudson's structure for stories of creative or personal awakening against social conformity \u2014 a counterpart to the Hero's Journey.",beats:[{id:"dependent-world",name:"Dependent World",pct:8,act:"setup",threeAct:1,guide:"The protagonist's world defines her value through duty and conformity \u2014 introduce that world and her place in it.",ex:"Bakery awaits inheritance"},{id:"price",name:"Price of Conformity",pct:7,act:"setup",threeAct:1,guide:"What she gives up, unconsciously, by staying safely inside the expected role.",ex:"Dreams quietly deferred"},{id:"opportunity",name:"Opportunity to Shine",pct:8,act:"setup",threeAct:1,guide:"A chance appears to show a talent or truth the dependent world doesn't value.",ex:"Sees painting contest"},{id:"dresses-part",name:"Dresses the Part",pct:6,act:"rise",threeAct:1,guide:"She takes on a disguise or role that lets her explore the opportunity without fully committing.",ex:"Borrows a name"},{id:"secret-world",name:"Secret World",pct:9,act:"rise",threeAct:2,guide:"A hidden space where she can practice and grow without her dependent world watching.",ex:"Paints before dawn"},{id:"no-longer-fits",name:"No Longer Fits Her World",pct:8,act:"rise",threeAct:2,guide:"The gap between her secret self and her dependent-world self grows too wide to ignore.",ex:"Bakery feels smaller"},{id:"caught-shining",name:"Caught Shining",pct:9,act:"rise",threeAct:2,guide:"Her secret talent is discovered \u2014 or she's stopped just before it can be seen.",ex:"Father finds paintings"},{id:"gives-up",name:"Gives Up Her Dream",pct:8,act:"climax",threeAct:2,guide:"Under pressure, she abandons the dream and returns fully to the dependent world.",ex:"Burns her canvases"},{id:"ally-helps",name:"Ally Helps Keep Dream Alive",pct:8,act:"climax",threeAct:2,guide:"Someone who believes in her keeps a door open, even after she's closed it herself.",ex:"Friend hides painting"},{id:"kingdom-chaos",name:"Kingdom in Chaos",pct:9,act:"climax",threeAct:3,guide:"The dependent world itself destabilizes, proving it was never as safe as it promised.",ex:"Bakery nearly fails"},{id:"chooses-journey",name:"Chooses Her Journey",pct:8,act:"climax",threeAct:3,guide:"She actively chooses her own path, rather than drifting into it.",ex:"Reclaims her craft"},{id:"rages-reveals",name:"Rages or Reveals",pct:7,act:"fall",threeAct:3,guide:"She confronts the dependent world openly, on her own terms.",ex:"Shows work publicly"},{id:"wonder",name:"Wonder",pct:5,act:"fall",threeAct:3,guide:"A new equilibrium \u2014 her gift and her world coexist, changed for the better.",ex:"Bakery sells art"}]},{id:"heroines-journey",name:"The Heroine's Journey",blurb:"Maureen Murdock's 10-stage arc away from and back toward the feminine \u2014 an inward counterpart to Campbell's outward quest.",beats:[{id:"se :root{ --bg:#120E1C; --panel:#1B1530; --panel2:#241C3D; --ink:#EDE7DA; --dim:#8B8398;
  --gold:#E9C88A; --ember:#D2785A; --border:rgba(237,231,218,0.10); }
*{box-sizing:border-box}
.boot{color:var(--dim);font-family:system-ui;padding:40px;text-align:center}
.app{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;padding:18px 20px 40px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.brand{font-family:'Fraunces',serif;font-weight:650;font-size:20px;color:var(--gold);white-space:nowrap}
.title-input{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--border);color:var(--ink);
  border-radius:8px;padding:9px 12px;font-family:'Fraunces',serif;font-size:16px}
.struct-select{background:var(--panel);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:13px}
.blurb{color:var(--dim);font-size:13px;margin:2px 0 18px}
button{font-family:inherit;cursor:pointer}
.ghost-btn{background:transparent;border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px}
.ghost-btn:hover{border-color:var(--gold);color:var(--gold)}
.primary-btn{background:var(--gold);border:none;color:#241606;font-weight:600;border-radius:8px;padding:9px 14px;font-size:13px}
.primary-btn:hover{filter:brightness(1.08)}
.icon-btn{background:transparent;border:none;color:var(--dim);font-size:14px;padding:4px 6px;border-radius:6px}
.icon-btn:hover{color:var(--ember)}
.layout{display:grid;grid-template-columns:minmax(320px,460px) 1fr;gap:24px;align-items:start}

.char-row input,.char-row select{background:var(--bg);border:1px solid var(--border);color:var(--ink);
  border-radius:7px;padding:8px 10px;font-size:13px}
.empty{color:var(--dim);font-size:13px}

.act-breakdown-label{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.act-breakdown-beats{font-size:13px;line-height:1.5}
